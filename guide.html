戦闘力の上げ方(Fubgun 10/21)\n| 源 | 中身 | 優先 |\n|---|---|---|\n| **スティグマのかけら** | **アビスが一番**(4段階×50=200個)。シューゴフェスタと悪夢は35個ずつ。Lv20 のスティグマ1つで戦闘力約1.3万 | 高 |\n| **ディーヴァニオン結晶** | 上限 416 点。悪夢(先に結晶を買う)、シューゴフェスタ(1・2段目を先に → かけら → 結晶)、**封印ダンジョン(1つで2個)**、**地域クエスト(1つで1個)**、アリエルの欠片(30個まで) | 高 |\n| ペット・種族理解度 | 知性ペット Lv3 で威力1・クリティカル2、自然ペットで正確1。種族理解度を全部 Lv10 で称号(PvE ダメージ +4.5%、所持で +1%) | 高 |\n| アルカナ | IL2500 から本格的に | 中 |\n| 万神殿 | 絵画(遠征・征服のボス、シューゴフェスタ)と、**悪夢の像**(各ボス10回+ジケル作戦1回で購入。能力値 45 が3つ)。絵画は取引所で安い物から買える。**(10/29)** 征服の普通を10回クリアで像(クリティカルと**命中**。報酬を開けずに9回+開けて1回。Infinitea) | 中 |\n| 称号・クローゼット | 外見を合成すると増える。**(10/29)** 自分の武器の外見で攻撃力。外見700個で称号(戦闘速度 3.5%・再使用待機時間 3.5%。Infinitea) | 低 |\n| 翼 | 森の精霊の翼(PvE ダメージ +3.5%)、ダークヴェールの翼(所持で +1%)、シーズンの翼 | 低(ギーナで買える) |\n\n**アビス回廊**: 自陣営が攻城でボスを倒すと開く。2分の PvE で最大約3万アビスポイント。攻城の後(水・土・月)にリセット。メインキャラのアビスの時間は、オード集めよりアビスポイント(かけら)に使う(Fubgun)。アビスポイントの稼ぎ方は 5-6\n\n---\n\n## 4. 日課・週課(リセットは日次・週次とも 16:00。週は水曜)\n### 毎日\n| やること | 回数 |\n|---|---|\n| 使命 | 1日5回(サーバー共有、1キャラで) |\n| 悪夢 | 毎日2回分たまる(最大14) |\n| オードエネルギー | 3時間ごとに15回復。上限を超える前に使う |\n| 次元侵略の鍵・シューゴフェスタの鍵 | 上限前に使う |\n| 超越・征服の報酬回数 | 超越は12時間ごと+1(最大14)、征服は8時間ごと+1(最大21) |\n\n### 毎週\n| やること | 回数 |\n|---|---|\n| 覚醒戦 | **キャラごと3回**(週の終わり、装備が一番強いときに) |\n| デイリーダンジョン | 14回(入場時に消費) |\n| 遠征 | ダンジョンごとに7回 |\n| 戦場・指令・アビス指令 | 勝利3回・12回・20回 |\n| **物質変換のオードエネルギー** | **キャラごと20回**(10/14 のパッチで変更。以前は「キャラ4回+サーバー16回」) |\n| アビスの滞在時間 | 7時間(メンバーシップで延長) |\n| 週ミッション・シーズンミッション | 超越・悪夢・アビスの項目は日課と一緒に |\n| 復活石(イベント) | 2.5万ギーナで30個(12/16 まで) |\n\n**注意: 報酬を開けずに出るのが週10回を超えると、水曜まで征服と超越に入れなくなる**(Leonis が確認。ドラウプニル像のために「9回で止めて、10回目は必ず開ける」)\n\n### サブキャラ(Moxsy 10/19)\n- 詳しい稼ぎ方は 5-4(10/26)\n- サブキャラを Lv22 にしておくと、遊ばない間もオードエネルギーがたまる\n- 低い遠征(クラオ洞窟・ドラウプニル。IL700)は怒りの思念が出やすい。サブキャラで回してメインに渡す(素材は拘束なし)\n- サブキャラごとにバトルパス(オードが多い)とオードの買い足しができる。ギーナをキューナに換えて買えば現金は要らない\n- 種族理解度とペットは全キャラ共通\n\n### ショップの買う順(Madsin 10/25)(10/29)\n| ショップ | メイン | サブ |\n|---|---|---|\n| シューゴフェスタ(回数はサーバー共通) | ディーヴァニオン結晶 → スティグマのかけら → 絵画(能力値の良い2枚から。全部そろえると称号)→ 外見の装飾品(クローゼットで全キャラに攻撃力)→ 翼 | メインが買い切った後、結晶とかけらを集める。オード(Regna Odyl)はキャラごとに出てサーバー倉庫に入れられる |\n| 悪夢(キャラごと) | 結晶50個 → かけら20〜25個 → **悪夢の像**(14,000。ジケル作戦1回目+ボス1体分)→ かけらの残り → 悪夢の翼、またはクラスルーンの挑戦(+3 から PvE ダメージが付く。+3〜+5 まで) | 同じ順で、最後は外見(装飾品から) |\n| アビス(キャラごと) | **スティグマのかけら200個**(約350万アビスポイント)を買い切るまで他は買わない。勲章は買わない。PvP をするなら PvP のアミュレットの巻物を10枚(青まで) | 外見(全キャラに PvP 攻撃力。サブで分けて買う)→ 魔石(週50個。PvP の魔石にして売るとお金になる)、神石の箱(拘束だがメインに付けられる) |\n| シーズン(キャラごと) | 神秘的な結晶 → シーズンの翼(21万。ソーサラー・スピリットマスター・アサシン・クレリックは急ぐ。シーズンで約60万たまるので焦らない)→ 製作の素材 → 余ればキューブの鍵・突破石のかけら | 外見(装飾品から)。**煌めくオードはサーバー倉庫に入る**ので、サブのコインで5個もらえる |\n\n- 賢者の石はシーズンの店では買わない(1枠 6万コインと高く、継承で消える。遠征「難しい」とルドラで出る)\n\n---\n\n## 5. 稼ぎ方(ギーナ・アビスポイント)(10/26)\n今週の動画7本から。出典は10章。\n\n### 5-1. ギーナは2種類\n| 種類 | 使える所 |\n|---|---|\n| 通常のギーナ | 取引所での買い物、倉庫で別のキャラへ移せる。**買い物用にとっておく** |\n| 拘束ギーナ | そのキャラだけ。強化・NPC の店・使命の引き直し・種族理解度の分析などに使える。両方使える所では**拘束ギーナが先に減る**。強化用のお金と考える |\n- 取引所で**買う**にはメンバーシップが要る(30日、買ったサーバーだけ)。**売る**のは無料のアカウントでもできる(CrusherX)\n- 取引所で売ると**10%の手数料**+出品料(拘束ギーナ)。10万で売ると手元に来るのは9万。値下げで競う前に手数料を考える\n\n### 5-2. メインキャラだけで稼ぐ(CrusherX 10/23 ほか)\n| 稼ぎ方 | 1日の目安 | 出るギーナ | こつ |\n|---|---|---|---|\n| **遠征**(オードエネルギーで最後の箱を開ける) | エネルギーは1日120回復 = 40の箱3つ。ウルググ峡谷の征服で約90万、炎の神殿で約120万(装備・素材は別) | **征服=通常**、探険=拘束 | ギーナはボスではなく最後の箱から出る。**稼ぎはクリアの速さではなくエネルギーの量で決まる**。上限までためると回復が止まるので、ためない |\n| 使命 | 5回×5万 = 25万以上 | 拘束 | 引き直しはだんだん高くなる。1〜2回で止める |\n| 雑魚狩り | 通常ギーナは**1キャラ1日100万まで** | 通常 | 落とし物(精霊石・皮)とペットの魂も同時に入る。アビスは通常ギーナが多めに出るが、相手陣営に狩られる |\n| 採集 | 売り値しだい(5-3) | 売れば通常 | オードは NPC の買い取りでも他の素材の4倍、等級が1つ上がると価値が3倍。木材は売れやすい。ベルテロン・アルトガルドは採集場所がアルトミン・モルヘイムの約2倍。クエストやダンジョンへの道で拾う |\n| 1回だけの物 | 封印ダンジョン1か所 1.5万(陣営ごと81か所で約120万)、地域クエスト最大14万、業績・出席・パス | 拘束 | 収入ではなく強化の元手 |\n\n遠征の箱1つのギーナ(40エネルギー。CrusherX)\n| ダンジョン | 征服(通常ギーナ) | 探険(拘束ギーナ) |\n|---|---|---|\n| クラオ洞窟・ドラウプニル | 約20万 | クラオ洞窟は20エネルギーで7.5万。**週7回目から60%、21回目からギーナなし** |\n| ウルググ峡谷・バクロンの空中島 | 約30万 | バクロンの空中島 15万 |\n| 炎の神殿・獰猛な角岩窟 | 約40万 | |\n| 遠征「難しい」(10/21〜) | 48万(1章) | |\n- メンバーシップ: エネルギーの上限 840。箱に2回注ぐと報酬2倍・消費2倍(得は増えないが回数が減る)。**そよ風商会でオードエネルギーをギーナで買える**。40エネルギーが10万で、30万の箱を開けられるなら得\n- 売れやすい物: 高い等級の採集素材、精霊石、皮、料理、**怒りの素材**(毎週欲しい人が出る)。近いうちに自分で使う物は売らない(売って買い戻すのが一番の損)。**売る予定の装備は装備しない**(装備すると取引できなくなる)\n- 30分なら: 使命 → 遠征でエネルギーを使い切る → 道中で採集。1時間なら: その後に同じ場所で雑魚狩り、最後の10分で出品\n- テンプラーは狩りの型(破滅のシールド Lv15+審判 Lv16+殲滅)でアビスを回ると、1時間に生のギーナ約100万+精錬石・唯一の装備などで約400万分(Leonis。テンプラーのまとめ 9章)\n\n### 5-3. 空から採集する(まろフル 10/19。日本の配信者、ハダル鯖)\n- アビスの外でオード・オリハルコンを空から集める。翼の残りを節約する飛び方: ダッシュしてすぐ解除を繰り返す(W を押したまま飛行を入り切り)\n- 翼が切れたら、Esc → アビス → F でアビスに入ってすぐ出る。約20秒で翼が満タンになる(地面で待つと2〜3分)\n- 1時間で手数料を引いて約1,000万(オード276個・オリハルコン61個ほど。煌めく(金)はそれぞれ1個・3個)。**稼ぎは煌めく素材の値段しだい**で、アリエルでは 10/25 に他鯖並みまで下がった(相場と製作のまとめ)\n- 10/14 から採集素材は出品が制限されることがある(ボット対策)。まず少しだけ出品して試す(CrusherX)\n\n### 5-4. サブキャラで稼ぐ(Soulgrot 10/20・aLuckyRO 10/25・Moxsy 10/19)\n| 項目 | 中身 |\n|---|---|\n| 何人 | 普通は1人、時間があれば2人。1サーバーに4人まで(Soulgrot) |\n| 職業 | **チャンター**(一番。序盤の火力が高くパーティーにも喜ばれる)。IL2100 以上まで上げるならクレリック。**テンプラーは次点**(盾役は低い戦闘力でも入れてもらえる)。ほかの火力職はスティグマのかけらが多く要るので向かない(Soulgrot) |\n| 上げ方 | Lv45 まで本筋のクエスト。経験値が足りなければ封印ダンジョン(結晶・知恵の石も出る)。Lv46 まで進めると武器・ガーダー・腕輪。職業のルーン2つで IL+80 |\n| 回す所 | **クラオ洞窟**(IL700。一番速くて簡単)。1時間に確実に約300万、平均400〜500万。中身: 怒りの思念(箱1つで6%、2つ開ければ12%。約200万)、絵画、精錬石、唯一の装備(振り直しの材料に1つ約100万)、箱ごとに7万。ドラウプニルは遅いか同じくらい |\n| 炎の神殿まで上げれば | 怒りの自我(約400万)が出て、1回の稼ぎが約2倍。ただし上げるのに時間がかかる |\n| オードを増やす | 物質変換・店の「キャラごと」の分だけ使う(サーバーごとの分を使うとメインの分が減る)。ディーヴァパスもサブごとに買える。ギーナ → キューナで買えば現金は要らない(取引所の「交換」で。大口のほうが高く売れる) |\n| サブでやらない(サーバー共有) | **デイリーダンジョン**、シューゴフェスタ、次元侵略、シーズンショップ。出席・郵便・イベントの品もサーバー共有 |\n| サブでもやる(キャラごと) | 遠征・悪夢・覚醒戦、闘技場、戦場、万神殿、アビス回廊 |\n| 時間 | 週2〜3時間。メインで遊ぶ日にサブでクラオ洞窟とドラウプニルを1回ずつ(1回10〜15分)、回廊は1回2分(aLuckyRO) |\n\nサブキャラでメインを強くする方法(aLuckyRO・Moxsy)\n| 方法 | やり方 |\n|---|---|\n| 強化 | メインの装備をサーバー倉庫に入れ、サブの**拘束ギーナと強化石**で強化してメインに戻す。強化して分解すれば、強化石がメインに移る |\n| 外見の図鑑 | サブで拾った白・緑・青の装備を分解すると外見が増える(図鑑は全キャラ共通)。重複は合成で上の等級へ。合成のギーナはサブの拘束ギーナで払う。**外見700個で称号「Empty Closet」**(戦闘速度+3.5%・待ち時間短縮+3.5%。一番良い称号) |\n| 種族理解度 | 全キャラ共通。分析をサブの拘束ギーナで回す |\n| アビスポイント | サブでアビス回廊(1回 約1〜1.5万)→ アビスの店で魔石を買い、倉庫でメインへ。アビスの外見もアカウント共通なのでサブで買う(Sen) |\n\n### 5-5. 作っては消すキャラで拘束ギーナと結晶(Fubgun 10/22)\n- 新しいキャラを作って Lv10 まで上げ(業績とペットが開く)、業績の報酬を受け取る。約15分で**拘束ギーナ約80万と分析用の結晶 600〜800個**。キャラの空き枠ごとに24時間に1回\n- 量はアカウント全体の業績しだい(ペットを多く最大にしている人ほど結晶が多い)\n- 拘束ギーナはそのキャラでしか使えないので、そのキャラで種族理解度を回す(全キャラ共通)\n- 仕様のすき間を使う方法なので、修正される可能性がある\n\n### 5-6. アビスポイント(Ashura 10/24・Sen 10/24)\nAshura は約190万でアビスポイント1位(課金なしと本人)。週の上限はシーズンを通して毎週上がるので、**毎週やれば後からでも追いつける**。\n\n| 順 | 稼ぎ方 | 中身 | 週の上限 |\n|---|---|---|---|\n| 1 | **指令**(週12回)とアビス指令 | 町とアビスにいる指令の NPC から。白〜金まで全部やる。引き直しは悪夢の券・オードエネルギー・覚醒戦が出るまで。人の少ない時間(早朝)か、ギルドで | 入る |\n| 2 | 攻城・フィールドボス | 唯一の装備と「英雄の証(Proof of Hero。日本語名は未確認)」が出る。物質変換で箱にするとアビスポイント(週に作れる数に限り) | |\n| 3 | **補給依頼** | 毎日、持っている物を納める。ボスの落とす装備を納めると多い(大きいボスなら2つで6.7万) | **別枠**(取りこぼさない) |\n| 4 | 時空の亀裂 | プレイヤーを倒すとアビスの**2倍**。出る時刻は questlog.gg の上部か NotMeter の通知(設定の通知で「時空の亀裂」「戦場」を ON) | 入る |\n| 5 | 相手陣営の封印ダンジョン・拠点 | ポイントが入る。グループで行く | |\n| 6 | アビスの雑魚狩り | PvE の人の一番の方法。狩られにくい場所が一番効率が良い | 入る |\n| 別 | **アビス回廊** | 自陣営が攻城で取った回廊に入り、時間内に雑魚を倒す。1回 約2〜3万。**キャラごと48時間に1回**(Sen)。設定「スキル使用時の自動ターゲット」ON、飛び込み技に「撃破で待ち時間リセット」の特化を付け、マクロを押し続けて回る。テンプラーは狩りの型(破滅のシールド Lv15)がそのまま使える | |\n- 回廊の制限時間は 2分(Fubgun・aLuckyRO)と 5分(Sen)で食い違う\n- 使い道(Ashura): スティグマのかけらを毎週店で買い切る → PvP の魔石 → 勲章で上位の装備。外見はサブで買う(Sen)\n- ひとりは厳しい。ギルド(レギオン)に入る(Ashura)\n\n\n### 5-7. サブキャラ以外の方法(10/26)\n| 方法 | やり方 | 稼ぎの目安 | 注意 |\n|---|---|---|---|\n| **錬金で魔石・霊石** | 中級の魔石・霊石を作ると **20% で上級**ができる(コンボ)。材料の下級・中級は覚醒戦の箱(難しいほど多い)と超越の報酬から。上級は小分けにして出品すると売れやすい | 上級の魔石 約70万・霊石 約57万(Savvvo の鯖)。2時間で約400万(JPVariety) | 上級をさらに上の物にすると売れ残った(JPVariety)。Ariel の値段は相場ボードに入っていないので取引所で確かめる |\n| 錬金で巻物・料理 | よく使われる巻物(1つ約1万)や料理を作って売る。材料(肉・油など)が安い時にまとめて買い、寝ている間に大量に作る | 巻物100個で100万以上(JPVariety)。料理は利益 約3〜7割(GAC) | 先に材料費と売値を比べる(成功率・コンボ込み。GAC は表計算で管理)。手数料10%を引いて考える |\n| 装飾品を作って売る | 真龍王のリングなどは全職業が使うので売りやすい。武器より材料が少なく、失敗の痛手も小さい | 他の鯖の例: 材料1,400〜3,000万で 2,800〜5,000万で売れた(Screamheart・JPVariety。10月上旬) | **Ariel では差が小さい**(下の計算) |\n| 唯一の装備を拾って売る | 最高レベルの敵はどこでも唯一の装備を落とす。テンプラーはアビスで破滅のシールドを使って雑魚を回る | 20分に1つくらい、1つ約100〜130万(JPVariety・Screamheart) | 自分の振り直し・継承石の材料にも使える |\n| 採集と取引所 | 宝石(サファイア・ルビー・ダイヤ)は細工のレベル上げで欲しい人が多い。採集の技能は「宝石を探す」系を取り、ミニマップに場所を出す。朝は安く夜に高い | 鯖と時間しだい | 自動で採集し続けると確認の画面が出て、失敗すると処分される(Aragon) |\n| **サーバー移動で転売** | 移る前に今の鯖で安い物を買い込み、移った先で高く売る。持ち物と個人の倉庫・取引所で買った物は一緒に移る(サーバー倉庫は移らない) | 物によって5割〜2倍(Infinitea) | 手数料と出品料で約15%引かれる前提で計算する。ほかの物から作れる素材(純粋なオードなど)は罠。満員の鯖は1時間ごとに受け付けが変わる |\n\n**Ariel で真龍王のリングを作って売ると得か(10/26 の値段)**\n- 作る費用 約1,960万(10/24 の計算)。売値: 真龍王のリング 2,100万、光る真龍王のリング 3,800万(25% で光る)\n- 手数料10%を引くと、1回あたりの期待値は 約2,270万 → **約310万の得**。ただし製作の失敗(約1割と Screamheart)で材料を失う分を入れると **ほぼ±0〜+100万**。光らなかった回は損に近い\n- → 自分で使うなら作る価値があるが、売るための製作は今の Ariel では割に合いにくい。相場ボードの「作るか買うか」で毎回確かめる\n\n**取引所の使い方のこつ**(Infinitea・Savvvo)\n- 1人が出品できるのは10枠。まとめて1枠に出すより、**小分けにする**ほうが売れやすい(買う人は束を分けられない)\n- 本当の相場は「出品から時間がたっていない物の値段」。1日以上残っている出品の値段では売れていない\n- 大きなパッチやボットの一斉処分のあとは、ボットが集めていた素材が上がりやすい(Infinitea)\n\n### 5-8. 時空の亀裂での PvP(10/26)\n| 項目 | 中身 |\n|---|---|\n| 何か | 相手陣営の世界(天族なら魔族側)へ行ける入口。**Lv45 から** |\n| いつ | **3時間ごと**に出て、入ってから約1時間で追い出される。**(10/29)** questlog.gg のタイマーでは 20:00(日本時間)に開いた → **2・5・8・11・14・17・20・23時**(欧米の鯖の動画からは 0・3・6…21時と読めたが、こちらが新しい)。地図(M)に出る。questlog.gg の上部のタイマー、NotMeter の通知でも分かる |\n| PvP のしかた | 亀裂に入り、画面右下で **PvP モードを ON** にすると相手陣営のプレイヤーと戦える。倒すとアビスポイントが**アビスの2倍**(Ashura)。OFF のままなら雑魚狩りや相手側の封印ダンジョン・拠点(アビスポイントが入る。グループで)だけをする(ZYASO) |\n| なぜ亀裂か | アビスにいられるのは週7時間だけなので、PvP を多くしたい人は亀裂に通う(notXeon) |\n| 死なないために | 相手の町・拠点の**衛兵の近くは一撃で倒される**。倒されると亀裂から追い出される(復活石を使えばその場で戻れるが、また倒されることがある)(Absconder) |\n| 人数 | ひとりは不利(1対2はよくある)。ギルドで行く。夜は大人数のギルド同士の戦いになる(Ashura・Chef_Zhab・StingKnight) |\n\n戦い方のこつ(notXeon=チャンター、StingKnight=テンプラー)\n- マクロは左右クリックの通常攻撃だけ。**気絶・転倒などの拘束技、バフ、防御技は手で**、使う時を自分で決める(テンプラーのまとめ 11章と同じ)\n- 囲まれたら数秒間守れる防御技が強い。テンプラーはガードが多いので 1対2 でも粘れる(StingKnight の 1対2 で勝った場面)\n- 移動速度を上げる手段があると、追う・逃げるが楽になる\n- 準備(ZYASO): アビスの店の巻物で **PvP のアミュレットを強化**(PvP ダメージ +10%)、魔石・霊石に PvP の能力値、アビスの外見(武器・装飾品は PvP ダメージ、防具は PvP 被ダメージ減)、装備のプリセットに PvP 用を1組、アビスのモノリスの羽根を集める\n- テンプラーの PvP のスティグマ・特化・1対1 の流れは `1_テンプラー/テンプラー_まとめ.md` の 11章\n\n---\n\n## 6. 悪夢\n| 項目 | 内容 |\n|---|---|\n| 回数 | 毎日2回分(最大14)。倒したことのある段は即時クリア券で済ませられる |\n| ボス | 7体。左から順に解放: 門番ピノピ・怒れるフェルク → 要塞守護者ノトゥン/ファフニル・ジゼル → ジェロッド → ジケル |\n| 解放 | 前のボスを難易度10まで倒すと次が出る |\n| 報酬 | 夢幻の破片。**初めて倒した段の報酬がずっと多い**(難易度9: 初回840個、2回目以降200個) |\n| 一番の目的 | ジケルを倒すと**ジケルの像**(万神殿)。破片約14,000個 |\n| 交換所 | 突破石、魂の書とその初期化の書、ペットの結晶、**ディーヴァニオン結晶(最大50個)**、知恵の石、クラスルーン、**スティグマのかけら**、翼、衣装 |\n\n- ボスは「1,1,1 → 2,2,2」と均等に上げて初回報酬を取る(Moxsy)\n- ディーヴァニオン結晶を先に買い、そのあとかけら(Moxsy・Soulgrot・Fubgun)\n- ジケル対策: 地面割りは詠唱が残り1秒でジャンプして滞空、斬撃(出血)は背後に立って浄化(BoredAF)\n\n## 7. 覚醒戦\n| 項目 | 内容 |\n|---|---|\n| 回数 | キャラごと週3回 |\n| 難易度 | 7段階。ハードは IL2000、エクストリームは IL2500 |\n| 報酬 | 魔石・霊石の箱、**成長のペット箱(スコア7,000以上で20個、6,000で17個)**、突破石 |\n| スコア | ほぼタイムで決まる。**ハードは「完璧クリア2,100点+残り1秒につき3点」**(韓国版のコメント)。4,000点には約3分26秒以内のクリア |\n| 結晶 | 1,000点・3,000点・4,000点・5,000点で神秘的な結晶(アルカナ用) |\n\n- テンプラーは破滅のシールド Lv15 で回ると速い(Aragon はハード約2分40秒で4,000点)\n- 未確認: 「完璧」の条件、空虚の螺旋体を壊すと点が増えるか、死ぬと回数が減るか\n\n---\n\n## 8. 装備の強化・刻印・継承(仕組み)\n部位ごとに狙う能力値は `1_テンプラー/テンプラー_まとめ.md` の5章。\n\n### 強化\n| 段階 | 内容 |\n|---|---|\n| +10 まで | 100% 成功 |\n| +11〜+15 | 失敗すると材料だけなくなる(装備は残る)。費用は1回30万〜150万と急に上がる。IL86 の装備は IL36 の装備の約2倍 |\n| +16 以上(突破) | 突破石と強化石を使う。星1つで IL+5。**(10/29)** +0→+1 は成功66%・突破石6個・約60万、+1→+2 は9個・約90万(Fubgun)。ロングソード・ガーダー → アクセサリー → 防具の順 |\n| クラスルーン | **失敗すると壊れる唯一の装備**。+1 が安全(Ulfhednar)。壊れたら悪夢の交換所で買い直す |\n\n- IL2500 までは+10 で十分。+15 以上は長く使う装備(製作装備)だけ(Duky・Strylander)\n- **安く上げる方法**: IL の低い同じ部位を +15 にして、刻印も良い物にしてから、本命に継承する(Grobs 10/19)\n- サブキャラのギーナ(シーレンティウムを売った拘束ギーナ)と強化石で、メインの装備をサーバー倉庫経由で強化できる(Moxsy)\n\n### 刻印と継承\n| 操作 | 中身 | 要る物 |\n|---|---|---|\n| シンク | 選んだ1行を振り直す(壊す装備が要る) | 唯一の装備1つ |\n| 魂刻印(数値上げ) | 能力値の数値を上げる | 魂の書(使うたびに必要数が増える。50 → 最大540) |\n| リセット | 全部の行を振り直す | 初期化の書(貴重。製作装備用にとっておく) |\n| 追加の行 | 刻印率100%で6枠目 | 賢者の石(遠征「難しい」で1%、シーズンショップ) |\n| 継承 | 古い装備の強化値と刻印を、IL が1以上高い同じ部位に移す(移す元で上書き) | 継承用の石(物質変換で唯一の装備1つから) |\n\n- 追加の行にはスキルを狙う(スキルの行は最初から100%なので数値上げが要らない)\n- 刻印率を100%にすると行を変えられなくなる。変えたい行は先に振り直す\n- 唯一の装備は振り直しの材料としてずっと要る。今は武器70万・防具55万ほどで安い(Soulgrot、10/18)。遠征「難しい」で出やすくなれば下がる見込み(NoBS)\n- 魔石は長く使う装備(IL86 のダンジョン装備、製作装備)にだけ良い物を\n- **(10/28)** 継承で移るのは 強化値・刻印(・突破。Grobs)。魔石・霊石は移らず、移す先の物が残る(Fubgun)。くわしい手順はテンプラー_まとめ 5-5\n- **(10/28 Grobs)** 製作装備の良い所は「刻印が5行(ダンジョン装備は4行)」と「IL102 まで上げられる」こと。ただし IL を上げないうちはダンジョンの IL86 のほうが強い。製作の費用は1〜2か月で半分ほどに下がる見込みなので、急がない人は今は素材を売り、ダンジョン装備を +15・突破・良い刻印にしておき、安くなってから製作して継承する手もある\n- 突破石は取引所で売れる(10/24 ごろ 1個約5万ギーナ。Aragon)\n\n---\n\n## 9. 未確認・意見が割れていること\n| 点 | 内容 |\n|---|---|\n| 覚醒戦で死ぬと回数が減るか | 減る(Kanon・MR4KTV)/減らない(JPVariety) |\n| 聖域の時期と条件 | グローバル版は未実装。台湾版は IL2700 |\n| オードエネルギーの上限 | 560(メンバーシップ840)か一律840か |\n| デイリーダンジョンの回数 | 週14回が多数。「無料は週7回」の記述もある |\n\n## 10. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| Fubgun「IL2800 への道、ルドラ発表」(fQvu09hy3Kg、6万回) | 10/25 | 0-1、ルドラ 11/4、突破の費用 |\n| Spid「ルドラまでに IL3000」(9ji2Z353kXQ、3万回) | 10/26 | 0-1 の IL を上げる順(アリエル・アスフェルのボード、突破、上級の魔石) |\n| Soulgrot「IL の上げ方、間違ってない？」(-48L04-Otk0、4.6万回) | 10/28 | 0-1(突破石のかけらが足りなくなる) |\n| Ashura「究極の装備強化ガイド」(ZMA43c_WJdA、テンプラー) | 10/30 | 0-1(突破の順、審判・懲罰 Lv20)、テンプラー 5-4 |\n| EUTOPIA「11月アップデート」(TxYBaL7OJsM、1.7万回) | 10/25 | 0-1(ルドラ前の配布) |\n| Madsin「ショップの買う順」(gRoOyAKNYXo、10万回) | 10/25 | 4章のショップの買う順 |\n| Spid「大型パッチ」(oHI0hbdysyc、9.4万回)、Grobs「新パッチ」(-YZtszb3jQs、1.4万回) | 10/28 | 1-1 の補足 |\n| Infinitea「装備を強化せずに能力値」(uSKpSmC5-BQ、6.3万回) | 10/25 | 3章(万神殿・称号・クローゼット) |\n| Soulgrot「AION 2の新パッチ」(i7DWoxD2nN4)、Aragon「新パッチ」(-jSOz3vGnS8) | 10/22 | 10/21 パッチ |\n| NoBS「シーズン1で来るもの」(ngtpCqSJGM0) | 10/18 | 今後の予想 |\n| Fubgun「戦闘力19万への道」(E4ESn8KWNgo) | 10/21 | 戦闘力の源 |\n| 公式「Patch Notes Oct. 27 (PDT) / Oct. 28 (CET)」(Steam) | 10/28 | 10/28 のパッチ |\n| Grobs「装備は製作すべき?」(J0Ioh9cjVeM)、Fubgun「装備強化の正しい手順」(HGPVCjjhAjs)、Aragon「上級者向けのコツ23」(OysQs7W6-cE) | 10/23〜10/24 | 製作と継承、突破石 |\n| Moxsy「週5,000万ギーナの金策」(_sBsJSA9z9E) | 10/19 | サブキャラ |\n| Ashura「アビスポイント190万の稼ぎ方(AP ランク1位)」(cLnZqkfHoNI) | 10/24 | アビスポイント。4.1万回 |\n| Sen「最高効率のアビスポイント稼ぎ: 回廊」(dD_5nm19I4M) | 10/24 | アビス回廊。1.2万回 |\n| Soulgrot「毎週1.5億ギーナ稼ぐ方法(サブキャラ)」(A3LSBPBJURU) | 10/20 | サブキャラの職業・回す所・共有される物。7.4万回 |\n| CrusherX「ギーナの稼ぎ方(サブキャラなし)」(dbg8jKrV9DI) | 10/23 | ギーナの種類、遠征の箱、使命・狩り・採集。2.7万回 |\n| Fubgun「戦闘力と毎日100万ギーナ: ペット・種族理解度」(o5iPYdMbpxo) | 10/22 | 作っては消すキャラ。6万回 |\n| aLuckyRO「サブ1人で毎週稼ぐ・節約する」(HkN9z8lCkDk) | 10/25 | サブでメインを強化、外見の図鑑。1.3万回 |\n| まろフル「時給1,000万ギーナの採集」(sDdAXMqCZSA) | 10/19 | 空から採集(日本の配信者)。2.5万回 |\n| JPVariety「サブキャラなしで数百万」(HA5VMwvQCzI) | 10/26 | 錬金(巻物・上級魔石)、アビスの狩り、リング |\n| Savvvo「錬金でギーナを稼ぐ」(vFdecYAWD8s) | 10/23 | 中級→上級の魔石・霊石(20%)。1.2万回 |\n| Infinitea「サーバー移動で数百万」(Kj3fY3kJfgk) | 10/22 | 鯖の値段の差、取引所のこつ |\n| Screamheart「数百万稼いで最強装備」(qe0zeldnX9I) | 10/12ごろ | 拾った唯一の装備、リングの製作。37万回(1か月以内) |\n| Aragon「エネルギーなしで数百万(採集と製作)」(C70IXgdByFM) | 10/5ごろ | 宝石の採集。17万回(1か月以内・パッチ前) |\n| GAC Film Room「放置の製作で9,200万」(lK1DNHJe23A) | 10/12ごろ | 料理を安い材料で大量に作る(1か月以内) |\n| Absconder「時空の亀裂ガイド」(0ZefBeef8So) | 10/19 | 出る時刻、衛兵、中でできること。7千回 |\n| ResGG「時空の亀裂ガイド」(Wzw0t8kvJNQ、独) | 10/20 | 3時間ごと、地図とタイマー |\n| ZYASO「アビスポイントの稼ぎ方(PvE と PvP)」(7r0VTZvv2EU、独) | 10/20 | PvP モード、PvP の準備。1.2万回 |\n| notXeon「今 PvP するなら亀裂しかない」(zqCxGmT0uX4) | 10/12ごろ | 亀裂で PvP する理由、マクロ(1か月以内) |\n| StingKnight「時空の亀裂侵入 テンプラー視点(1対2)」(-q8li6XESeY) | 10/5ごろ | テンプラーの 1対2(1か月以内) |\n| Grobs「安価な強化術」(2vDVa75Y3XA)、Soulgrot「装備を正しく強化」(jI9i3ChAAQc) | 10/18〜19 | 強化と継承 |\n| Duky、Aragon、Soulgrot、Moxsy、Strylander、SywoGG、Leonis、BoredAF、MR4KTV、Kanon ほか | 10/7〜10/14 | 以前の出典(`_古い版/`) |\n| Metabot、mein-mmo、K1Persia ほか(日課・週課) | 10/5〜 | 回数の確度は `_古い版/AION2 日課週課まとめ.md` |\n| 펭귄몬스터、전하TV、동화의 게임 ほか(韓国版) | 10/5〜10/14 | 韓国版の今 |\n| cost「How to be Ludra ready as a sub only player」(KW9JxHJ0GAQ) | 10/28、3.1万回 | 戦闘力の中身、錬金 |\n| Drunge「Ludra officialisé et gros changements en Abysse」(NtL1-YtlyNM、フランス語) | 10/25、2.7万回 | アビスの相手の組み直し |\n"},{"id":"arcana","tab":"アルカナ","title":"アルカナ まとめ","file":"アルカナのまとめ.md","md":"# アルカナ まとめ(2026-10-24 最新)\n\n「悪夢・覚醒戦・アルカナ・装備厳選・クラフト」の3章と「アルカナ_強化か抽出か」をまとめた。古い版は `_古い版/` にある。\nテンプラーで狙うスキルは `1_テンプラー/テンプラー_まとめ.md` の6章。\n\n## 0. 結論\n| 項目 | 結論 |\n|---|---|\n| 集め始める時期 | **IL2500(超越の4段階目)から本格的に**。4段階目は金が約60%で出る。3段階目(IL2200)は金が約12%なので、深追いしない(XifanGG・Fubgun・Leonis) |\n| 1枚目の金 | 覚醒戦4,000点などでためた神秘的な結晶5個で、**聖杯**を作る。一番大事なスキルを指定 |\n| いらないカード | 残すカードを **+2〜+3 まで強化**するのに使い、残りは**抽出**して結晶をためる |\n| +4・+5 | 「最後まで使うカード」だけ。1段に金カード12〜24枚分かかる |\n| 青・緑 | 大事なスキルが付いていれば、金より良いこともある。金に替えて大事なスキルの Lv16・20 が外れるなら替えない |\n\n---\n\n## 1. 仕組み\n| 項目 | 内容 |\n|---|---|\n| 効果 | カードを付けると、スキルのレベルと「神の能力値」が上がる |\n| 出る場所 | 超越ダンジョン(IL1600〜)。**砕けたアルカニス=羊皮紙・鏡、デウス研究基地=コンパス・鐘、両方=聖杯** |\n| 段階と出るカード | 1段階目は灰・緑、2段階目で青、3段階目(IL2200)で金が約12%、**4段階目(IL2500)で金が約60%** |\n| 付くスキル | 聖杯=どのスキルでも(だから狙ったスキルが付きにくい。1/18 など)。羊皮紙とコンパス=攻撃スキルを半分ずつ。鐘と鏡=パッシブを半分ずつ |\n| 確かめ方 | 「変換」タブ → カードを選ぶ → 追加効果、で自分のスキルがどのカードに付くか見られる |\n| セット | 活力(HP70%以上で PvE 攻撃 +60/4枚で +150)と魔力(MP 回復)。セットよりカードの神の能力値を優先してよい(Xia・XifanGG) |\n\n### レア度と強化\n| レア度 | 最初のスキル数 | 強化の上限 | IL |\n|---|---|---|---|\n| 灰 | 1 | +2 | 20 |\n| 緑 | 2 | +3 | 40 |\n| 青 | 3 | +4 | 60 |\n| 金 | 4 | +5 | 80 |\n\n- 1枚に付くスキルは最大4つ。4つ埋まった後は、強化するたびに**付いているスキルのどれか1つ**が+1。だから「4つとも良いスキルの金カード」を探す\n- 強化1段ごとに、神の能力値+1・IL+1(questlog.gg のデータ)\n- 強化は失敗しない\n\n### 神の能力値\n| 能力値 | 中身 |\n|---|---|\n| 時間 | 戦闘速度(評価が一番高い) |\n| 幻想 | 待ち時間短縮 |\n| 知恵 | 強打 |\n| 破壊 | 攻撃力増加 |\n| 死 / 自由 | クリティカル / 命中 |\n| 生命・運命・正義・空間 | PvE ではほぼ関係ない |\n\n---\n\n## 2. 強化に必要な経験値(金カード。metabot.gg のゲームデータ)\n| 段階 | 必要な経験値 | 金カード(+0)に換算 | 合計 |\n|---|---|---|---|\n| +0 → +1 | 3,000 | 1.5枚 | 1.5枚 |\n| +1 → +2 | 6,000 | 3枚 | 4.5枚 |\n| +2 → +3 | 12,000 | 6枚 | 10.5枚 |\n| +3 → +4 | 24,000 | 12枚 | 22.5枚 |\n| +4 → +5 | 48,000 | 24枚 | **46.5枚** |\n\n- 金カード(+0)を材料にすると 2,000。+4 まで上げたカードを材料にすると 47,000(注いだ分がほぼ戻る)。なので途中まで強化しても無駄になりにくい\n- 経験値用のカード(訓練のアルカナ)は最下級200〜最上級5,000。バトルパス・ショップ・出席報酬でもらえる。**強化にはまずこれ**\n- ほかのレア度の必要量: 灰 300/600、緑 600/1,200/2,400、青 1,200/2,400/4,800/9,600\n\n## 3. 神秘的な結晶\n| 項目 | 内容 |\n|---|---|\n| 使い道 | 金カードを作る(変換)。**スキル1つ指定で結晶5個+200万ギーナ**、2つ指定で結晶15個 |\n| 集め方 | ① 覚醒戦のスコア(シーズンミッション →「挑戦」→「シーズン」): 1,000点で1個、3,000点で1個、4,000点で1個、5,000点(エクストリーム)でもう1個 ② シーズンショップ(コイン25,000で1個。2個目以降は高いので1個だけにする人が多い) ③ いらないカードの抽出 |\n| 抽出の割合 | 1枚あたり 灰2%・緑4%・青6%(100%で1個)。**金は未確認**(notXeon の推測で8〜10%) |\n\n- 韓国版の항밍짱(10か月前): 聖杯は1つだけ指定すると残り3つがはずれになりやすく「結晶5個と200万を捨てるのと同じ」。**2つ指定して作る**のがよい\n- 金の聖杯は作ると7日間は次を作れない(韓国版。グローバル版は未確認)\n- 結晶の作り方の仕組みは、シーズンが変わると変わるかもしれない(metabot.gg)\n\n## 4. いらないカードは強化か抽出か\n| 手順 | やること |\n|---|---|\n| 1 | 良いスキルが2つ以上付いた金カードは**ロック**する |\n| 2 | 残すカードは、経験値用のカードといらないカードで **+2〜+3** まで上げる(金カード約10枚で届く) |\n| 3 | **+4・+5 は最後まで使うカードだけ**(1段に12〜24枚。結晶1〜2個分に当たる) |\n| 4 | 残りは抽出し、2つ指定した金の聖杯を作る分の結晶をためる |\n\n## 5. 進め方の例\n1. IL2000 で覚醒戦ハードを3分26秒以内にクリア(4,000点)→ 結晶3個。シーズンショップで1個、抽出で1個 → 金の聖杯\n2. IL2200〜2500 は、羊皮紙(作りやすい・付くスキルが少ない)で足りないスキルを埋める\n3. IL2500 から4段階目を回し、良い金カードを強化\n\n## 出典\n| 出典 | 中身 |\n|---|---|\n| metabot.gg「AION 2 Arcana Guide」 | 強化の経験値の表、材料の値、作る費用 |\n| XifanGG(約10/18)、Fubgun(10/21)、Leonis(10/21) | 集める時期、4段階目で金約60% |\n| notXeon、Kanon、Grobs、Society of Gaming(10/7〜10/16) | 仕組み、結晶の集め方、2つ指定で15個 |\n| 항밍짱、오지조(韓国版、10か月前) | 2つ指定して作る、強化は控えめに |\n| Antochi(10/21) | カードの出る場所 |\n"},{"id":"market","tab":"相場と製作","title":"相場と製作 まとめ","file":"相場と製作のまとめ.md","md":"# 相場と製作 まとめ(アリエル鯖・2026-10-30 最新)\n\n「市場の読み_アリエル鯖」「取引所の相場と買い時」「製作のおすすめと効率」「製作の最終段階までの素材」を1本にし、10/24 夜(19時)の相場で計算し直した。その後 10/25・10/27・**10/30** に 0章・1章を更新した。古い版は `_古い版/` にある。\n- 相場: 相場ボード https://tamanegin.github.io/aion2-market/ のデータ(Aion2Market の最安出品価格、10/30 10:09。他鯖は 10:13)。毎日の判断はボードを見る\n- 「対アジア」= アジアの他6鯖の中央値と比べた差。名前は questlog.gg の日本語版の正式名\n\n## 0. 今の判断(10/30)\n10/28 のパッチ(成長とシステムのまとめ 1-1)のあと2日。**聖域ルドラ(11/4)の前で、煌めく素材と怒りの意志が上がり始めた**(Grobs の「ルドラ前に装備の材料が上がる」どおり)。\n\n| 区分 | 品物 | 判断 |\n|---|---|---|\n| **使う分は早めに買う**(10/30) | 煌めく素材(オリハルコン鉱石・オード・原石・ユグドラシルの木) | 10/27→10/30 で 62万前後 → **79〜89万**(3日で +20〜+40%)。先行鯖も3日で +23〜+61%、アジア全体も +20〜+42% と全部の鯖で上がっている。それでもアリエルは他鯖より **オリハルコン鉱石・オードで −17%** 安い。ルドラまで上がりそうなので、使う分は今のうちに。ダイヤモンドの原石だけは他鯖より高い(+5%)ので売り時 |\n| **買うのは待つ** | 怒りの思念・自我 | 思念 190万(他鯖より **+96%**。先行鯖は3日で −15%)、自我 240万(3日で −8%、先行鯖 −12%)。どちらも下がる方向。**思念は持っていれば売り時** |\n| 上がっている | 怒りの意志 | 83万(3日 +11%、7日 +54%)。先行鯖 +26%・アジア +33% なので、まだ上がりそう。要るなら早めに |\n| **買い時** | 精錬石(377。3日で −45%)、職人の精錬石(3.9万、−27%。他鯖より −40%) | 使う分は今買ってよい |\n| 下がっている | 達人の精錬石(20万、7日で −33%)、達人の最上級精錬石(12.4万) | 使う直前に買う |\n| **作るほうが得**(10/30) | **達人の光るリング** | 作ると約611万、取引所 900万(10/27 は 700万で買うほうが安かった)。**作って売っても利益が出る**(手数料の前で約290万) |\n| 作るか買うかほぼ同じ | 達人の光るロングソード(作る 1,531万 / 取引所 1,490万)、ネックレス(1,042万 / 1,000万) | 安いほうで |\n| 買う | 達人の光るガーダー(作る 1,518万 / 取引所 1,298万) | |\n| 作るしかない | 真龍王のネックレス(IL62)、IL70 以上の全部 | 出品がない、または継承製作の物は売れない |\n\n---\n\n## 1. 品目ごとの今(10/30 10時。かっこ内は 10/27 15時。純粋な素材は 10/25 のまま)\n\n### 怒りの素材(製作の上の段で使う)\n| 品物 | 今 | 3日 | 7日 | 対アジア | 先行鯖の3日 | 出品 |\n|---|---|---|---|---|---|---|\n| 怒りの思念 | 190万(198万) | +3% | −5% | **+96%** | −15% | 43 |\n| 怒りの意志 | 83万(74万) | +11% | +54% | +6% | +26% | 65 |\n| 怒りの自我 | 240万(278万) | −8% | +31% | +17% | −12% | 126 |\n- 10/14 は 思念210万・意志22万・自我210万。意志は10日で約4倍になり、その後は70〜90万で上下している\n- 思念は他鯖の約2倍。先行鯖では下がっているので、アリエルもいずれ下がると見られる(10/30)\n- 10/28 のパッチで遠征の難しいが2つ増えた(怒りの素材が出る量が増える)。自我と思念はその影響で下がり始めたと見られる。意志はルドラ前の需要で上がっている\n\n### 煌めく・純粋な採集素材\n| 品物 | 今 | 3日 | 対アジア | 先行鯖の3日 |\n|---|---|---|---|---|\n| 煌めくオリハルコン鉱石 | 80万(62万) | +29% | **−17%** | +61% |\n| 煌めくオード | 79万(62万) | +23% | **−17%** | +36% |\n| 煌めくサファイアの原石 | 85万(68万) | +27% | −6% | +34% |\n| 煌めくルビーの原石 | 89万(63万) | +40% | −4% | +32% |\n| 煌めくダイヤモンドの原石 | 84万(58万) | +72% | +5% | +23% |\n| 煌めくユグドラシルの木 | 84万(68万) | +20% | +9% | +35% |\n| 純粋なオリハルコン鉱石 / オード | 16.7万 / 14.5万(10/25) | | | |\n| 純粋な原石(サファイア/ルビー/ダイヤ) | 26.7万 / 20万 / 10万(10/25) | | | |\n- 10/30: 10/27 に下がった分を全部戻し、10/25 の 79万前後を超えた。先行鯖・アジア全体でも上がっているので、アリエルだけの動きではない\n- 10/12 の煌めくオリハルコン鉱石は約10万。10/14 のパッチ(オードエネルギーの週の上限変更、採集素材の出品制限)から急騰した\n- 10/28 のパッチで採集が1サーバー1日1,000回までになった(上がる方向)\n\n### 精錬石・龍族の素材\n| 品物 | 今 | 3日 | 対アジア |\n|---|---|---|---|\n| 精錬石 | 377(1,800) | −45% | −38% |\n| 職人の精錬石 | 3.9万(5.2万) | −27% | −40% |\n| 達人の精錬石 | 20万(23万) | −5% | −21% |\n| 達人の最上級精錬石 | 12.4万(15万) | −5% | −11% |\n| 龍族の精髄 | 2.2万(2万) | +13% | +29% |\n| 精錬された 分厚い/硬い/堅固な 龍族の角 | 3万 / 4.3万 / 5万 | −9% / −19% / −6% | −20% / −28% / 0% |\n| 強化された 分厚い/硬い/堅固な 龍族の鱗 | 4.6万 / 6.1万 / 6.8万 | +32% / +3% / +26% | −6% / −3% / +24% |\n| なめした 分厚い/硬い/堅固な 龍族の皮 | 4万 / 6万 / 6万 | −15% / −33% / −33% | −11% / +50% / +50% |\n\n### 製作の装備(取引所。10/30)\n| 品物 | 今(10/27) | 出品 |\n|---|---|---|\n| 達人の光るオリハルコンのロングソード | 1,490万(1,550万) | 6 |\n| 達人の光るオリハルコンのガーダー | 1,298万(1,690万) | 8 |\n| 達人の光るサファイアのリング | **900万**(700万) | 21 |\n| 達人の光るルビーのネックレス | 1,000万(1,400万) | 5 |\n| 真龍王のリング / 光る真龍王のリング | 2,100万 / 3,300万(10/25) | |\n| 真龍王のイヤリング / 光る | 3,700万 / 4,450万(10/25) | |\n\n---\n\n## 2. 作るか買うか(金の材料。相場ボードの計算。10/30)\n| 品物 | 作る(一番安い作り方) | 取引所 | 判断 |\n|---|---|---|---|\n| 達人の光るロングソード | 1,531万 | 1,490万 | ほぼ同じ(10/27 は買う) |\n| 達人の光るガーダー | 1,518万 | 1,298万 | **買う** |\n| 達人の光るリング | **611万** | 900万 | **作る**(10/27 は買う) |\n| 達人の光るネックレス | 1,042万 | 1,000万 | ほぼ同じ |\n| 達人の光るイヤリング | 1,199万(10/27) | 1,100万(10/27) | 買う(10/30 はボードに出ていない) |\n- 光る装備は25%なので「各段階を4回作って光る物を1つ作り、次の段階へ」で計算。成功率(約94%)と外れの売値は入れていない\n\n---\n\n## 3. ロングソード・ガーダーを IL102 まで作る\n\n### 3-1. 段階\n| 段階 | IL | 天族の名前 | 作り方 |\n|---|---|---|---|\n| ① 金の材料 | 44 | 達人の光るオリハルコンのロングソード | 通常製作(白→緑→青→金、各25%で光る) |\n| ② | 62 | 真龍王 | 通常製作(**失敗あり**)。25%で③に直接 |\n| ③ | 70 | 光る真龍王 | 継承製作(必ず成功) |\n| ④ | 78 | 白龍王 | 継承製作。①がもう1本要る。25%で⑤に直接 |\n| ⑤ | 86 | 光る白龍王 | 継承製作 |\n| ⑥ | 94 | 冥龍王 | 継承製作。①がもう1本要る。25%で⑦に直接 |\n| ⑦ | 102 | 光る冥龍王 | 継承製作 |\n- 継承製作の物は拘束されて売れない。強化値と刻印は引き継がれる(賢者の石の枠と魔石は消える)\n- ロングソードとガーダーは素材も個数も同じ(AION2 Hub)\n\n### 3-2. 素材と費用(1本分。10/24 のアリエルの値段で計算)\n| 段階 | 素材 | 費用 |\n|---|---|---|\n| ② IL62 | ①、達人の最上級精錬石4、精錬された分厚い龍族の角22、**怒りの思念10**、煌めくオリハルコン鉱石9、煌めくオード5 | 約4,860万(10/14 は約2,670万) |\n| ③ IL70 に上げる | 分厚い角11、怒りの思念4 | 約830万 |\n| ④ IL78 | ①、精錬石5、硬い角29、思念3、**怒りの意志15**、鉱石12、オード7 | 約4,900万 |\n| ⑤ IL86 に上げる | 硬い角15、意志5、鉱石1、オード2 | 約640万 |\n| ⑥ IL94 | ①、精錬石6、堅固な角41、思念3、意志3、**怒りの自我20**、鉱石15、オード9 | **約9,130万**(うち自我が 4,400万) |\n| ⑦ IL102 に上げる | 精錬石2、堅固な角21、自我7、鉱石2、オード3 | 約2,130万 |\n| **合計** | | **コンボなし 約2.25億 / 全部コンボ 約1.9億**(10/14 は 2.1億 / 1.7億) |\n\n- ①は取引所の 1,550万で計算。ガーダーは①が 1,690万なので、1段ごとに約140万高い\n- 角は 精髄2個+ハンマー(NPC)でも作れる(堅固な角なら約7万)\n- **⑤(光る白龍王 IL86)から次の⑥へは約9,130万**。⑥で光らなければ⑦にさらに約2,130万\n- 10/25 の値段で⑥を概算し直すと **約9,800万**(自我20個が 4,400万→5,080万、意志3個 +100万、煌めくオリハルコン鉱石15個 −120万、角 −30万)。煌めく素材は下がったが、自我の値上がりのほうが大きい\n- 10/27 の値段で⑥を概算し直すと **約9,700万**(自我20個 +480万、煌めくオリハルコン鉱石15個 −255万、オード9個 −153万、堅固な角41個 −86万、意志3個 −60万)。煌めく素材の値下がりと自我の値上がりがほぼ打ち消し合った\n- **10/30 の値段で⑥を概算し直すと 約9,300万**(自我20個 −760万、煌めくオリハルコン鉱石15個 +270万、オード9個 +153万、①の値下がり −60万、意志・思念・角 ±数十万)。自我の値下がりが煌めく素材の値上がりより大きかった\n- 費用の中心は怒りの自我(20〜27個)と煌めく素材。どちらも今は高いので、**⑥は急がず、怒りの素材と煌めく素材が下がってから**が安い\n- 参考: Soulgrot のサーバーでは IL86 のロングソードが合計 6,000万〜7,000万、リングは 3,000万〜4,000万(10/18)\n\n### 3-3. リング・ネックレス(IL62 の真龍王)\n| 品物 | 素材(①以外) | 作る | 取引所 | 判断 |\n|---|---|---|---|---|\n| リング | 達人の最上級精錬石2、強化された分厚い龍族の鱗8、**怒りの思念4**、煌めくサファイアの原石3、煌めくオード2 | 約1,960万 | 2,100万 | **作るほうが少し安い**。25%で光る(3,300万相当) |\n| ネックレス | 精錬石3、分厚い鱗14、**怒りの思念6**、煌めくルビーの原石6、煌めくオード2 | 約3,320万 | 出品なし | 作るしかない |\n- どちらも費用の半分以上が怒りの思念。思念が下がるのを待つと安くなる\n- 10/27 の概算: 煌めく素材が下がった分で リング 約1,880万(サファイア3個 −42万、オード2個 −36万)、ネックレス 約3,190万(ルビー6個 −90万、オード2個 −36万)\n- **10/30 の概算**: リング 約1,850万(煌めく素材 +85万、思念 −32万、①を作って 611万にすると −89万)、ネックレス 約2,950万(ルビー +156万・オード +34万、思念 −48万、①の値下がり −400万)。煌めく素材はルドラ前に上がっているので、素材を先に揃えるなら早めに\n\n---\n\n## 4. 何を作るか・作り方のコツ\n| 項目 | 内容 |\n|---|---|\n| 作る順 | **ロングソード → ガーダー → リング**(Soulgrot・JOHNPAL)。ロングソードは刻印5行で戦闘速度が付き、一番強い。防具はダンジョン装備で十分 |\n| 安く済ませる | 細工(リング)が一番安い |\n| 成功率 | 熟練度で上がり、約94.6% で止まる。**高い製作は熟練度50まで上げてから**。熟練度は一番安い物(オリハルコンのインゴットなど)で上げる。「10個まとめて作る」は経験値が少ない |\n| 絞る | 製作は1種類に絞る。テンプラーのロングソードとガーダーは鍛冶 |\n| 素材 | オードは物質変換でほかの採集素材に替えられる(ただし変換した物は拘束されて売れない) |\n| 失敗作 | 捨てずに補給依頼へ(アビスポイントと強化石) |\n| 上位素材 | 怒りの素材は遠征で出る。グローバル版は拘束なしなので、サブキャラで集めてメインへ |\n\n---\n\n## 5. 売り買いのコツ\n| コツ | 内容 |\n|---|---|\n| 小分けに売る | 高い物は小分けに、少し高めで待つ。出品が急に増えた物は値下げ競争になりやすい |\n| まとめ買い・1個売り | まとめ売りを買って1個ずつ出すと高く売れる(急ぐ人は1個で買う) |\n| 合計金額の並び | 一覧は合計金額順。大量に買う人は1個の値段を見ていないことがある |\n| 手数料 | 売れたら10%。出品の登録手数料は付け直すと戻らない |\n| 時間帯 | アリエルでは「朝は安い・夕方に売れる」ははっきりしなかった(10/14 に検証) |\n| 出品枠 | 10個まで |\n\n### 取引所の仕組み\n- 取引所とギーナ・キューナの交換所は**メンバーシップ会員だけ**\n- ギーナ → キューナ: 物質変換で「ギーナの箱」(10%余計にかかる)を作り、交換所に出す\n- 現金で買ったキューナは72時間たつまで交換所で使えない\n- 拘束のギーナは取引所で使えない(登録手数料には使える)\n- 取引所はサーバーごと。ほかのサーバーからは買えない\n\n### 先行鯖(シエル・ネザカン・バイゼル)との関係(10/14 に検証)\n- 全部の品物が数日遅れで同じ動きをするわけではない。パッチで動く物は全サーバーが同じ日に動く\n- 「進むほど欲しくなる素材」(怒りの自我・意志)は、先行鯖が数日先に動く傾向。相場ボードの「数日の予想」はこれを使っている\n\n---\n\n## 6. 注意\n- 最安出品価格なので、実際に売れた値段とは違うことがある。アリエル鯖は売れた数のデータがない\n- 出品が数件しかない品物は、1人が出すだけで大きく動く\n- パッチで価値が急に変わることがある(韓国版で何度も起きた)\n- 相場ボードの「予想の当たり外れ」は、10/24 時点でまだ判定できた件数が0件\n- IL62 のリング・ネックレスのレシピは 10/14 に AION2 Hub で見た物。ロングソードのレシピは 10/14 にグローバル版のデータで確かめ直した\n\n## 7. 出典\n| 出典 | 中身 |\n|---|---|\n| 相場ボード(Aion2Market のデータ) | 10/24 19:09 の値段、3日・7日の変化、他鯖との差、作るか買うか |\n| AION2 Hub https://aion2hub.com/tools/crafting-calculator | 製作のレシピ |\n| Soulgrot(10/18)、JOHNPAL(10/17)、Moxsy(10/19) | 作る順、費用の目安、サブキャラ |\n| Aragon・Soulgrot(10/22) | 10/21 パッチの報酬 |\n| 以前の出典(Screamheart、Sen Evades、GAC Film Room、StingKnight、MrRosaPony、Nellan97、Duxar ほか) | `_古い版/` の各まとめ |\n"},{"id":"terms","tab":"用語","title":"用語対応表","file":"用語対応表.md","md":"# 用語対応表(英語 → アジアサーバーの日本語名)\n\n- 作成: 2026-10-14。reports/ のまとめは、この表で日本語名に置き換えた\n- スキル名は Game8(https://game8.jp/aion2/822198)の表記。対応表は [テンプラー海外動画まとめ.md](テンプラー海外動画まとめ.md) の14章\n- 出典の略称:\n  - wikiA = VIPでAion2 Wiki(https://wikiwiki.jp/vipdeaion2/)\n  - wikiB = AION2攻略wiki(https://wikiwiki.jp/gget/AION2%E6%94%BB%E7%95%A5wiki)\n  - 動画 = 日本の投稿者の YouTube(NAHAKU、selegames など)。字幕は自動文字起こしなので、聞き間違いの可能性がある\n\n## 1. 確認できた名前\n\n### 通貨・課金\n| 英語 | 日本語 | 出典 |\n|---|---|---|\n| Kinah | ギーナ | wikiA、動画 |\n| Quna | キューナ | wikiA |\n| Membership | クァイリン特級メンバーシップ(メンバーシップ) | wikiA |\n| Wind Breeze Merchant | そよ風商会 | wikiA |\n| Quna Exchange | キューナ交換所 | wikiA |\n| Battle Pass / Daeva Pass | ディーヴァパス | wikiA |\n| Call of the World(英語圏では Planet\u0027s Call とも) | 世界の呼びかけ | wikiA |\n| Mercenaries of Ischalgen | イスハルゲンの傭兵 | wikiA |\n| Resurrection Spirit Stone | 復活の精霊石 | wikiA |\n\n### ダンジョン・コンテンツ\n| 英語 | 日本語 | 出典 |\n|---|---|---|\n| Expedition / Exploration / Conquest | 遠征 / 探険 / 征服 | wikiA |\n| Kraocave | クラオ洞窟 | wikiA |\n| Dropnir | ドラウプニル | wikiA |\n| Uruguru Canyon | ウルググ峡谷 | wikiA |\n| Vakron Sky Island | バクロンの空中島 | wikiA |\n| Fire Temple | 炎の神殿 | wikiA |\n| Ferocious Horn Den | 獰猛な角岩窟 | wikiA |\n| Transcendence | 超越(ステージ → 「〇段階目」) | wikiA、動画 |\n| Shattered Arkanis / Deus Research Base | 砕けたアルカニス / デウス研究基地 | w roficient Handling / Delicate Touch / Lady Luck | 卓越した手技 / 繊細な手 / 幸運の女神 | wikiA |\n| Seeker / Plentiful Harvest / Appraiser | 探索 / 豊かな収穫 / 鑑定士 | wikiA |\n\n### 能力値\n| 英語 | 日本語 | 出典 |\n|---|---|---|\n| Combat Speed / Damage Boost / Might / Precision | 戦闘速度 / ダメージ増幅 / 威力 / 正確 | wikiB |\n\n## 2. 日本語名を確認できなかったもの(まとめでは仮の名前のまま)\n| 英語 | まとめでの書き方 |\n|---|---|\n| Wrathful Will / Wrathful Ego | 怒りの意志 / 怒りの自我(英語からの直訳。未確認) |\n| Star / Dark Dragon Lord(中間の段) | 真龍王 / 黒龍王。英語版の段の名前と日本語版の対応がはっきりしない |\n| Sync(1行の振り直し) | シンク |\n| Philosopher\u0027s Stone / Soul Fusion Stone(追加の行) | 賢者の石 |\n| Transfer Stone | 継承用の石 |\n| Balaur\u0027s Essence ほか竜族の素材 | 龍族の精髄(10/21 確認)、龍族の素材 |\n| Fine Thick / Hard / Durable Balaur Horn | 精錬された分厚い / 硬い / 堅固な龍族の角(10/21 確認) |\n| Artisan\u0027s Ultimate Refining Stone | 達人の最上級精錬石(2026-10-21 questlog.gg の日本語版データで確認) |\n| Radiant Orichalcum Ore(Pure / Fine は純粋な / 高純度の) | 煌めくオリハルコン鉱石(純粋な / 高純度の も 10/21 確認) |\n| Dragon Lord の段の名前 | True=真龍王、White=白龍王、Star=乾龍王、Dark=黒龍王、Wise=冥龍王、Ebony=闇龍王(10/21 questlog.gg で英日を番号で突き合わせ) |\n| Expert\u0027s / Artisan\u0027s Refining Stone の色との対応 | 青の精錬石、達人の精錬石(職人の精錬石・達人の精錬石という名前はある) |\n| Stigma Shard | スティグマのかけら |\n| Black Cloud Merchant | 黒雲商人 |\n| 悪夢のボス名(ジケル以外) | ピノピ、フェルク、ノトゥン、ジゼル、ジェロッドなど(カタカナ読み) |\n| Perfect / Double Chance | 完璧 / **強打**(2026-10-23 questlog.gg の英日のスキル特化文で確認。以前の「二重攻撃」は誤り) |\n| Longsword / Ring(装備の部位名) | **ロングソード / リング**(「長剣」「指輪」ではない。ガーダー・ネックレス・イヤリングはそのまま。10/21 questlog.gg と GameWith で確認) |\n| Greatsword / Dagger / Bow / Orb / Spellbook / Staff / Mace | グレートソード / ダガー / ボウ / オーブ / マジックブック / ワンド / メイス |\n| Gemstone(Fine / Pure / Radiant) | ルビーの原石、高純度の / 純粋な / 煌めくルビーの原石(サファイア・ダイヤモンドも同じ形) |\n| Aria / Azpha / Calendula / Targena(採集の草) | アンゼリカ / アンヌス / カレンドラ / タラゴン |\n| Enhanced Balaur Scale / Tanned Balaur Leather | 強化された分厚い・硬い・堅固な龍族の鱗 / なめした分厚い・硬い・堅固な龍族の皮 |\n| 名前の確かめ方 | questlog.gg の API `database.getItem`(id=Aion2Market の item_key、language=ja)で正式名が取れる |"}]};
const DOCS = GUIDE.docs;
const $ = s => document.querySelector(s);
const tabsEl = $('.tabs'), docEl = $('.doc'), tocEl = $('.toc'), sideEl = $('.side'), resEl = $('.results'), qEl = $('#q');
const newNav = $('.newnav'), wide = matchMedia('(min-width: 980px)');
let current = null;

$('#built').textContent = GUIDE.built ? '(更新: ' + GUIDE.built + ')' : '';

// Map a markdown link target or code span (a local .md/.html path) to one of the tabs.
function docForPath(p) {
  if (!p) return null;
  let s = p.replace(/^<|>$/g, '');
  try { s = decodeURIComponent(s); } catch (e) {}
  const base = s.split(/[\\/]/).pop();
  if (/\.html$/.test(base)) return DOCS.find(d => d.id === 'pet') || null;
  return DOCS.find(d => d.file === base) || null;
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(md) {
  if (window.marked) return marked.parse(md, { gfm: true });
  return '<pre style="white-space:pre-wrap">' + esc(md) + '</pre>';
}

function show(id, headingIndex) {
  const d = DOCS.find(x => x.id === id) || DOCS[0];
  current = d.id;
  for (const b of tabsEl.children) b.setAttribute('aria-selected', b.dataset.id === d.id ? 'true' : 'false');
  resEl.hidden = true; docEl.hidden = false; sideEl.hidden = false;
  docEl.innerHTML = render(d.md);

  // Headings get stable ids in document order; the search uses the same order.
  const hs = docEl.querySelectorAll('h1, h2, h3, h4');
  hs.forEach((h, i) => { h.id = d.id + '-' + i; if (h.tagName === 'H2' && /結論|今の|まず/.test(h.textContent)) h.classList.add('key'); });
  tocEl.innerHTML = '';
  docEl.querySelectorAll('h2, h3').forEach(h => {
    const a = document.createElement('a'); a.href = '#' + d.id + '/' + h.id.split('-').pop();
    if (h.tagName === 'H3') a.className = 'sub';
    a.dataset.target = h.id;
    a.textContent = h.textContent.replace(/[((].*?[))]/g, '').trim(); tocEl.appendChild(a);
  });
  $('.tocbox').open = wide.matches;

  // Source lists are long and rarely read: fold everything under a 出典 heading.
  docEl.querySelectorAll('h2').forEach(h => {
    if (!/出典/.test(h.textContent)) return;
    const box = document.createElement('details'); box.className = 'fold';
    box.innerHTML = '<summary>出典の表を開く</summary>';
    while (h.nextElementSibling && h.nextElementSibling.tagName !== 'H2') box.appendChild(h.nextElementSibling);
    h.after(box);
  });

  // Wide tables scroll inside their own box instead of widening the page.
  docEl.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.appendChild(t); });

  // Links and code spans that point at another note become tab switches.
  docEl.querySelectorAll('a[href]').forEach(a => {
    const target = docForPath(a.getAttribute('href'));
    if (target && !/^https?:/.test(a.getAttribute('href'))) { a.href = '#' + target.id; a.classList.add('tab-link'); }
    else if (/^https?:/.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  docEl.querySelectorAll('code').forEach(c => {
    const target = /\.(md|html)$/.test(c.textContent) ? docForPath(c.textContent) : null;
    if (target) { const a = document.createElement('a'); a.href = '#' + target.id; a.className = 'tab-link'; a.textContent = target.title; c.replaceWith(a); }
  });

  const nNew = markNew(docEl);
  newNav.hidden = !nNew; $('.newcount').textContent = nNew;
  try { localStorage.setItem('guide-tab', d.id); } catch (e) {}

  if (headingIndex != null) {
    const h = document.getElementById(d.id + '-' + headingIndex);
    if (h) {
      const fold = h.closest('details.fold'); if (fold) fold.open = true;
      h.scrollIntoView({ block: 'start' }); h.classList.add('flash'); spy(); return;
    }
  }
  window.scrollTo({ top: 0 });
  spy();
}

// Highlight the chapter being read in the side list.
function spy() {
  if (docEl.hidden) return;
  let here = null;
  for (const a of tocEl.children) {
    const h = document.getElementById(a.dataset.target);
    if (h && h.getBoundingClientRect().top < 140) here = a;
  }
  for (const a of tocEl.children) a.classList.toggle('here', a === here);
  if (here && wide.matches) {
    const r = here.getBoundingClientRect(), s = sideEl.getBoundingClientRect();
    if (r.top < s.top || r.bottom > s.bottom) here.scrollIntoView({ block: 'nearest' });
  }
}

// Jump to the next "new" mark below the current position, wrapping to the first one.
$('.newnext').addEventListener('click', () => {
  const marks = [...docEl.querySelectorAll('.new')];
  if (!marks.length) return;
  const next = marks.find(m => m.getBoundingClientRect().top > 150) || marks[0];
  const fold = next.closest('details.fold'); if (fold) fold.open = true;
  next.scrollIntoView({ block: 'center' });
  next.classList.remove('flash'); void next.offsetWidth; next.classList.add('flash');
});

// Text size, remembered per browser.
function setFs(v) {
  document.documentElement.style.setProperty('--fs', v);
  for (const b of document.querySelectorAll('.fs button')) b.setAttribute('aria-pressed', b.dataset.fs === v ? 'true' : 'false');
}
document.querySelectorAll('.fs button').forEach(b => b.addEventListener('click', () => {
  setFs(b.dataset.fs); try { localStorage.setItem('guide-fs', b.dataset.fs); } catch (e) {}
}));
let savedFs = null; try { savedFs = localStorage.getItem('guide-fs'); } catch (e) {}
setFs(savedFs || '16px');

// On narrow screens the chapter list folds away after a pick.
tocEl.addEventListener('click', () => { if (!wide.matches) $('.tocbox').open = false; });
wide.addEventListener('change', () => { $('.tocbox').open = wide.matches; });

// Wrap dates like "(10/25" or "10/25 追加" written on the build day or the day before.
// Returns how many were marked.
function markNew(root) {
  const bm = (GUIDE.built || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!bm) return 0;
  const built = Date.UTC(+bm[1], +bm[2] - 1, +bm[3]);
  const isNew = (mo, da) => { const t = Date.UTC(+bm[1], mo - 1, da); return t <= built && built - t <= 864e5; };
  const re = /(\d{1,2})\/(\d{1,2})(?: ?追加)?/g;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; for (let n; (n = walker.nextNode());) { re.lastIndex = 0; if (re.test(n.nodeValue)) nodes.push(n); }
  let count = 0;
  for (const n of nodes) {
    re.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while ((m = re.exec(n.nodeValue))) {
      if (!isNew(+m[1], +m[2])) continue;
      frag.append(n.nodeValue.slice(last, m.index));
      const s = document.createElement('span'); s.className = 'new'; s.textContent = m[0]; frag.append(s);
      last = m.index + m[0].length; count++;
    }
    if (last) { frag.append(n.nodeValue.slice(last)); n.replaceWith(frag); }
  }
  return count;
}

function route() {
  const m = location.hash.slice(1).split('/');
  if (qEl.value.trim()) { qEl.value = ''; }
  // Without a link to a tab, reopen the tab read last time.
  let last = null; if (!m[0]) { try { last = localStorage.getItem('guide-tab'); } catch (e) {} }
  show(m[0] || last || DOCS[0].id, m[1] != null ? Number(m[1]) : null);
}

const topBtn = $('.totop');
topBtn.addEventListener('click', () => window.scrollTo({ top: 0 }));
let spyFrame = 0;
window.addEventListener('scroll', () => {
  topBtn.hidden = window.scrollY < 800;
  if (!spyFrame) spyFrame = requestAnimationFrame(() => { spyFrame = 0; spy(); });
}, { passive: true });

// Search: every line of every note, grouped under the heading it belongs to.
function search(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) { show(current || DOCS[0].id); return; }
  docEl.hidden = true; sideEl.hidden = true; newNav.hidden = true; resEl.hidden = false;
  const hits = [];
  for (const d of DOCS) {
    let hIndex = -1, hText = d.title;
    for (const line of d.md.split('\n')) {
      const hm = line.match(/^(#{1,4})\s+(.*)/);
      if (hm) { hIndex++; hText = hm[2]; }
      const low = line.toLowerCase();
      if (words.every(w => low.includes(w))) hits.push({ d, hIndex, hText, line });
      if (hits.length > 200) break;
    }
  }
  if (!hits.length) { resEl.innerHTML = '<p class="none">見つかりませんでした</p>'; return; }
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  resEl.innerHTML = '<p class="none">' + hits.length + '件</p>' + hits.slice(0, 120).map(h => {
    const plain = h.line.replace(/<!--.*?-->/g, '').replace(/[*`#>|]/g, ' ').replace(/\s+/g, ' ').trim();
    const snip = esc(plain.length > 160 ? plain.slice(0, 160) + '…' : plain).replace(re, '<mark>$1</mark>');
    const where = esc(h.d.title + (h.hIndex >= 0 ? ' › ' + h.hText.replace(/[*`]/g, '') : ''));
    return '<a class="hit" href="#' + h.d.id + (h.hIndex >= 0 ? '/' + h.hIndex : '') + '"><div class="where">' + where + '</div><div class="snip">' + snip + '</div></a>';
  }).join('');
}

for (const d of DOCS) {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.id = d.id; b.textContent = d.tab;
  b.addEventListener('click', () => { if (location.hash === '#' + d.id) route(); else location.hash = d.id; });
  tabsEl.appendChild(b);
}
let timer;
qEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(qEl.value.trim()), 150); });
window.addEventListener('hashchange', route);
route();
</script>
