00、難しいは IL3000(10/23 に公式発表。Fubgun・海外の記事で確認 10/29)。難しいの初討伐の称号は 11/25 まで(公式。アップデート情報 11/4)。オードエネルギーの毎日の配布は 11/11 まで(公式。終わった) | 次のシーズン |\n\n### 0-1. IL2800 への近道(Fubgun 10/25)(10/29)\n| 段階 | やること |\n|---|---|\n| 土台 | アビスのモノリスの羽根を全部(IL +36)、ディーヴァニオンの基本 416 点(シューゴフェスタの店・悪夢の店・封印ダンジョン・地域クエスト) |\n| 〜2100 | 主な14部位のうち 12 部位を IL70 に。下級の魔石で緑の行を1〜2本(白 = IL+1、緑 +2、青 +3)。IL70 の装備は +10 まで(すぐ替えるので) |\n| 2100〜2500 | 獰猛な角岩窟・炎の神殿で全部位 IL86。武器だけ製作するなら炎の神殿の武器は取らない(製作は刻印が2行多い)。ガーダーは2番目に大事 |\n| 2500〜 | **超越4段階目で金カードを5枚**(1枚 IL+80 → 合計 +400)。主力スキル Lv20 のアルカナで火力も伸びる |\n| 2600〜 | 遠征「難しい」はディーヴァニオンの新しい 60 点(IL+60)だけ(10/25 時点。11/4 JPVariety は天井を全部で IL+100〜120、11/11 で難しいが増えたので今の上限は要確認)。戦闘力はほとんど増えないので、IL が足りないときだけ |\n| 仕上げ | IL86 の全部位に**中級の魔石**(15% で青い行 = IL+3。1個 約3.5万)。**上級の魔石は IL102 の装備まで取っておく**(約100万)。ただし IL が少し足りない人は上級で埋める手もある(Spid 10/26。10/30) |\n| 突破 | **突破1段 = IL+5**。費用は 8章の「強化」の表を参照。+15 を何本も作るより、1本を突破するほうが安い |\n\n- ルドラに向けた目安: **ロングソードとガーダーを +15・突破 +2 以上**。突破1段ごとに武器・ガーダーはダメージ増幅 +1%・攻撃力 +16、アクセサリーは +0.5%・攻撃力 +18。防具の突破は火力にならないので最後\n- IL3000 は「突破を2〜3段の部位を増やす」だけで、やることは同じ。ギーナがかかる\n\n**IL を上げる順(Spid 10/26・Soulgrot 10/28・Ashura 10/30。どれも IL2800〜3000 を目指す人向け)(10/30)**\n| 順 | やること | IL | メモ |\n|---|---|---|---|\n| 1 | シューゴフェスタの店でディーヴァニオン結晶、悪夢の店を買い切る | | まだなら先に。ここが済んでいないと 2800 は苦しい(Spid) |\n| 2 | **アリエルのボード**: 遠征「難しい」のアリエルの欠片 → 物質変換でディーヴァニオン結晶 | **結晶1個 = IL+1** | Spid によると、10/28 の新しい遠征で **30個の枠がもう1つ**増えた(30+30。前は「キャラごと30個まで」)。Spid は 30 を埋め、残り9。**11/11 の公式では欠片はダンジョンごとに別の種類で、結晶は1キャラ30回まで**(種類ごとに30か、全部で30かは要確認。アップデート情報 11/11) |\n| 3 | **アスフェルのボード**: アビスポイントでディーヴァニオン結晶を買う | 30〜80 | 火力は増えず PvP の能力値と IL だけ。アビスを1週間回して 100万〜150万ポイント(Spid) |\n| 4 | **+15 → 突破**。突破石は物質変換で作れる(強化石+突破石のかけら) | 星1つ = +5 | かけらが足りなくなる(Soulgrot)。突破石はルドラ前に値上がりしそう。突破は**ロングソード → ネックレス → イヤリング → リング → トップス・ボトムス**の順(基本の攻撃力・防御力が大きい順。Ashura) |\n| 5 | **上級の魔石**(空いた枠や弱い行に) | 1つで +4 ほど(Spid の実演) | 足りない人が週末に買うので、100万〜120万に上がる見込み(Spid)。買うなら早めに |\n- 火力を上げるには、IL より スティグマ・アルカナ・刻印 にお金を使うほうがよい。IL だけを上げるのは「ルドラに初週から入りたい」人向け(Spid)\n- Ashura(テンプラー)は審判・懲罰を Lv20 にするため、ガーダーやリングの刻印のスキル行を振り直して集めた。武器に審判が付いたときも「Lv20 にしたいので残す」\n- ルドラで出る物: ブレスレット(Spid)、ロングソードなどのメインの武器(Ashura は「射程が長いルドラのメイン武器」を狙う)\n- ルドラの前の配布(EUTOPIA 10/25): 10/28 のメンテから 11/10〜11 まで、キャラごとに毎日オードエネルギー2個を郵便で(受け取りは7日以内)。(11/4 の公式ノートでは**毎日4個・11/11 まで**。どちらももう終わった。ルドラの出席7日の中身もアップデート情報 11/4 を参照)\n- **(10/31 cost、課金は月額だけの人)** 装備とアルカナを全部外しても IL 448 残り、うち 410 はディーヴァニオンの結晶(アリエル・アスフェルのボード)。**スティグマのかけらだけで戦闘力 約4万**(全部外すと 173K → 135K)。戦闘力だけを上げたいなら、全部のスティグマをまず Lv10 にそろえる。生活の製作は**錬金が一番大事**(上級の巻物・薬・魔石を作れる)。取引所の売り買いで7,000万稼いで装備に回した\n- **(10/31 Drunge)** 10/28 からアビスの相手のサーバーが組み直された。韓国・台湾と同じく、**天族どうし・魔族どうしで当たることもある**。組み合わせは装備の強さ、回廊やワールドボスの勝ち具合、そこでの火力などから決まる(ネットの情報)。負け続けていたサーバーは、同じくらい弱いサーバーと当たりやすくなる\n\n### 0-2. ルドラの準備と中身(11/1。Madsin 10/31・Xia 10/31・MrRosaPony 10/28・Savvvo 10/31・Mobalytics 10/25)\n| 項目 | 内容 | 出典 |\n|---|---|---|\n| 開始 | **11/4**。普通(IL2800)と難しい(IL3000)が最初から両方開く。グローバル版では**仕掛けが新しくなる**(先行で早く倒されすぎたため外されていた) | Mobalytics |\n| 初クリアの賞 | アップデート情報 11/4 の「イベント」を参照 | Mobalytics |\n| 戦闘力の目安(予想) | 普通: 倒せるのは 14〜15万、野良の募集は 17万ほど。難しい: 倒せるのは 18〜19万、野良は 21〜22万(**予想は外れた。実際は下の 11/8 Spid**) | Madsin |\n| **命中・クリティカルの目安(予想)** | 普通: **命中 約900・クリティカル 約800**。難しい: **命中 約1,200・クリティカル 約1,100**。韓国・台湾の元の版(IL2700)は命中 1,400・クリティカル 1,200 だったが、グローバル版は能力値が全体に下がっている。今の遠征「難しい」(★2)のボスはガード約800 | Madsin(予想) |\n| 後ろから殴ればよい? | **第2段階のルドラは壁に張り付いていて正面しか殴れない**(戦いの約3分の2)。命中が足りないと火力が出ない | Madsin |\n| 命中の数え方 | 能力値の命中と **PvE 命中を足した数**。さらに料理(+100)・パーティーのバフ(チャンターのマントラ +100 など)が乗る。**テンプラーは懲罰でほぼずっと命中 +200** | Madsin(テンプラー) |\n| 正確の効き方 | 正確の値 ÷10 = 命中とクリティカルが上がる割合(%)。例: 正確 32 → +3.2%。**能力値の画面の命中・クリティカルにだけ効き**、PvE 命中には効かない | Madsin |\n| 命中を集める所 | 種族理解度の 3・6・9番(と7番)で命中・クリティカル。武器の正確。料理 | Madsin |\n| 復活 | 1体につき**2回まで**。復活の石を用意(ショップで 2.5万・5万)。11/18 の「簡単」は個人の復活が無制限(公式) | Madsin |\n| 持っていく物 | 料理(攻撃・命中・スタミナ)、青い巻物、戦闘の巻物(ダメージと耐性) | Madsin |\n| 報酬 | **ブレスレット**(強化でき、能力値も多い)が目当て。武器はめったに出ない。週1回だけ箱(月額で2回)。天井(必ずもらえる仕組み)は難しいで2〜3週、普通で4〜6週。難しいならシーズン2(**12/16**)までにブレスレット2つ。(公式 11/4 では**武器・ガーダーも出る**。11/18 から装備の合計の獲得率が 5% → 15%。アップデート情報 11/4・11/18) | Madsin(台湾の例から予想) |\n- **(11/1 Xia、テンプラー)** IL を上げるなら遠征「難しい」を回すのが一番。アリエルの欠片・ギーナ・**賢者の石**が出る。各ダンジョンの天井を1回ずつ終えて賢者の石を取り、残りのエネルギーでアリエルの欠片を集める(天井1回ずつでも IL +80)。ほかに: 武器・ガーダーに緑の神石(1つ IL+3)、魔石の弱い行を中級・上級で振り直し(能力値の中身より等級が IL を決める)、アルカナを全部金(1段で IL +20。レア度1段 = 緑40→青60→金80 の意味と見られる。強化1段は IL+1。アルカナのまとめ 1章)、アスフェルのボード\n- **(11/4 JPVariety 11/3、IL3,022・戦闘力 20.5万)** IL3000 の上げ方:\n  | 項目 | 内容 |\n  |---|---|\n  | +15 の先 | **イヤリングから**上げる(攻撃力が付くので、IL と戦闘力が一緒に伸びる)。次にリング |\n  | 安く +15 | 低い IL の装備を +15 にしてから継承する。直接上げるより安い(本人の見積もりで 1,200万〜1,500万 → 約700万) |\n  | 武器は作らなくてよい | 怒りのクロメデの武器のままでも IL2,900 台だった。**もう一度やるならガーダーを作る**(ルドラで同じ IL の武器が出るので。11/3 の意見。11/4 の公式ではルドラで**ガーダーも出る**) |\n  | アリエルのボード | 遠征「難しい」の天井を全部終えると **IL +100〜120**。角から取り、次にボスへのダメージ増幅。クリティカル抵抗は後回し |\n  | スティグマ | 1つを 0 → 20 にすると戦闘力が約1万上がる |\n- **(11/4 JPVariety 11/2)** 最上位の製作武器の費用: 材料の1つ(3.6% でしか出ない)が1個 約300万で10個要る。組み合わせの判定に2回失敗して約6,000万を失った。**怒りのクロメデの武器 → 製作の武器へ継承できた**(新しいパッチで。強化費が浮いた)\n- **(11/8 Spid 11/5)ルドラが始まってからの実際**: 普通は**パーティー全員 約21万以上**、難しいは**火力職 24.5万以上**(テンプラー・クレリックは 21〜22万)。上の Madsin の予想(普通 14〜15万)よりずっと高かった。詳しくは `アップデート情報.md` の 11/4\n- **(11/8 Aragon 11/3、8万回)製作なし・課金なし(月額だけ)で IL3,000**:\n  | 段階 | やること |\n  |---|---|\n  | IL の内訳 | ディーヴァニオンだけで **IL576**(普通の4枚 414・PvP の盤 46・アリエルの盤)。残りは装備の基本 IL+強化+突破+魔石。Aragon の例: 突破 100・強化 230・魔石 165 |\n  | ディーヴァニオン | 地域のクエストを全部(時空の亀裂で相手側の地図へ行く物も。紫の門は3時間ごと)、封印ダンジョン全部、悪夢とシューゴフェスタの店の結晶を全部。PvP の盤はアビスの羽根をモノリスで交換。アリエルの盤は遠征「難しい」の欠片を変換(1ダンジョン30まで) |\n  | IL1,400 → 1,900 | 青い装備を +5〜10、下級の魔石(上級は最後の装備まで取っておく)。バクロン・ウルググを回す |\n  | IL1,900 → 2,100 | 「砕けたアルカニス」(超越ダンジョン)の2段階を何回か回し、アルカナの緑・青を5枚はめる → **IL +200**。そこから炎の神殿・獰猛な角岩窟 |\n  | 天井の報酬 | **最後の1部位でない限り「交換券」を選ぶ**(あとで物質変換で欲しい部位・武器・ガーダーに替えられる)。獰猛な角岩窟の探索の天井の箱も、ほぼそろってから開ける |\n  | 強化の前に | **良い魂刻印の行が付くまで +10〜11 より上にしない**。付いていなければ振り直しの書(少ないので武器に)か、良い行の付いた装備から継承 |\n  | 継承のこつ | 低い IL の装備を先に +15 にしてから継承すると安い(IL86 のクロメデのロングソード +15 は平均 1,260万、低い物なら約600万)。ただし戦闘速度など大事な行が高い IL の側にあるなら、そちらを直接上げる |\n  | 突破 | **1段で IL +5**(強化は1段 +1)。突破石は欠片から物質変換で作れる(取引所なら 5万までが目安)。武器・ガーダー → アクセサリー → 防具の順(防具は HP・ダメージ耐性だけなので +1 まで) |\n  | アルカナ | 超越4で金。聖杯・羊皮紙・コンパスを +5、鏡と鐘は後 |\n  | 激突のルーン | 予備でない限り +1 より上げない(失敗で消える) |\n  | ギーナ | オードエネルギーを毎週 4,000〜5,000 使って箱を開けると、週 6,000万以上 |\n- **(11/1 MrRosaPony、クレリック)** 安く IL2800 にする形: 武器・ガーダー・リング・ネックレスは**製作**(光る真龍王 IL70 で十分)、イヤリングは怒りのクロメデ2つ、防具はヌアクムを全部(+10 でよい)、アミュレット・ベルトは +4、リングとネックレスを +15 から突破。ダンジョンの装備に深く投資しない\n\n- 戦闘力の大半は装備以外(スティグマ・ディーヴァニオン・ペット・アルカナなど)から来る。装備を全部外しても約10.7万残る(Fubgun、19.5万の人)\n- 野良パーティーは戦闘力で選ばれる。IL2100 で9.5万〜10万、炎の神殿は10〜12万が目安(10/14 時点)\n\n---\n\n## 1. 最近のパッチ(グローバル版)\n\nパッチの話(10/21〜11/18 と今後の予定、韓国版の改編)は **`アップデート情報.md`**(攻略ブックの「アップデート」タブ)へ移した(11/4)。\n\n## 2. 韓国版の今(グローバル版への影響)\n10/14 ごろの話。韓国版の 11/11 の大改編とその手直しは `アップデート情報.md` の「韓国版」の節(11/20)。\n| 韓国で起きたこと | グローバル版で考えること |\n|---|---|\n| ゲーム内通貨の現金相場が約3か月で65%下がった | 今の高い相場は下がっていく可能性が高い |\n| パッチで装備や素材の価値が急に下がった(射程の付いた製作武器、精錬石の緩和、PvP 装備) | 調整されそうな物に一度に大きく投資しない |\n| 人が離れている(9月ごろから) | 強くなるのを急ぎすぎない |\n| ハロウィンイベント(遠征・超越の強化石1.5倍、キャンディの鍵でオードエネルギーなどを選べる) | グローバル版に来れば、強化石・オード・オリハルコンは下がりやすい |\n- グローバル版は韓国版の失敗を直して始まった(製作装備は継承製作でしか上げられず売れない、割合の能力値を下げた、クリティカルの上限50%など)\n\n---\n\n## 3. 戦闘力の上げ方(Fubgun 10/21)\n| 源 | 中身 | 優先 |\n|---|---|---|\n| **スティグマのかけら** | **アビスが一番**(4段階×50=200個)。シューゴフェスタと悪夢は35個ずつ。Lv20 のスティグマ1つで戦闘力約1.3万 | 高 |\n| **ディーヴァニオン結晶** | 上限 416 点。悪夢(先に結晶を買う)、シューゴフェスタ(1・2段目を先に → かけら → 結晶)、**封印ダンジョン(1つで2個)**、**地域クエスト(1つで1個)**、アリエルの欠片(10/21 時点は30個まで。今の枠は 0-1 の表の 2 を参照) | 高 |\n| ペット・種族理解度 | 知性ペット Lv3 で威力1・クリティカル2、自然ペットで正確1。種族理解度を全部 Lv10 で称号(PvE ダメージ +4.5%、所持で +1%) | 高 |\n| アルカナ | IL2500 から本格的に | 中 |\n| 万神殿 | 名画(遠征・征服のボス、シューゴフェスタ)と、**悪夢の像**(各ボス10回+ジケル作戦1回で購入。能力値 45 が3つ。4章・6章と条件の書き方が違う。要確認)。名画は取引所で安い物から買える。**(10/29)** 征服の普通を10回クリアで像(クリティカルと**命中**。報酬を開けずに9回+開けて1回。Infinitea) | 中 |\n| 称号・クローゼット | 外見を合成すると増える。**(10/29)** 自分の武器の外見で攻撃力。外見700個で称号「ああ、着る服がない」(英語 Empty Closet。戦闘速度 3.5%・待ち時間短縮 3.5%。Infinitea。5-4 も参照) | 低 |\n| 翼 | 森の精霊の翼(PvE ダメージ +3.5%)、闇の帳の翼(所持で +1%)、シーズンの翼 | 低(ギーナで買える) |\n\n**アビス回廊**: 自陣営が攻城でボスを倒すと開く。2分の PvE で最大約3万アビスポイント。攻城の後(水・土・月)にリセット(10/21。11/4 から占領戦は週2回(木・土)になり、回廊のアビスポイントは 1.5倍。リセットの曜日は要確認。アップデート情報 11/4)。メインキャラのアビスの時間は、オード集めよりアビスポイント(かけら)に使う(Fubgun)。アビスポイントの稼ぎ方は 5-6\n\n---\n\n## 4. 日課・週課(リセットは日次・週次とも 16:00。週は水曜)\n### 毎日\n| やること | 回数 |\n|---|---|\n| 使命 | 1日5回(サーバー共有、1キャラで) |\n| 悪夢 | 毎日2回分たまる(最大14) |\n| オードエネルギー | 3時間ごとに15回復。上限を超える前に使う |\n| 次元侵略の鍵・シューゴフェスタの鍵 | 上限前に使う |\n| 超越・征服の報酬回数 | 超越は12時間ごと+1(最大14)、征服は8時間ごと+1(最大21) |\n\n### 毎週\n| やること | 回数 |\n|---|---|\n| 覚醒戦 | **キャラごと3回**(週の終わり、装備が一番強いときに) |\n| デイリーダンジョン | 14回(入場時に消費) |\n| 遠征 | ダンジョンごとに7回(探険のギーナの減り方は 11/4 に変わった。5-2 の表の注) |\n| 戦場・指令・アビス指令 | 勝利3回・12回・20回 |\n| **物質変換のオードエネルギー** | **週に1キャラ4個・1サーバー16個**(10/28 の公式から。10/14 〜 10/27 は「キャラごと20回」だった。アップデート情報 10/28) |\n| アビスの滞在時間 | 7時間(メンバーシップで延長) |\n| 週ミッション・シーズンミッション | 超越・悪夢・アビスの項目は日課と一緒に |\n| 復活石(イベント) | 2.5万ギーナで30個(12/16 まで) |\n\n**注意: 報酬を開けずに出るのが週10回を超えると、水曜まで征服と超越に入れなくなる**(Leonis が確認。ドラウプニル像のために「9回で止めて、10回目は必ず開ける」)\n\n### サブキャラ(Moxsy 10/19)\n- 詳しい稼ぎ方は 5-4(10/26)\n- サブキャラを Lv22 にしておくと、遊ばない間もオードエネルギーがたまる\n- 低い遠征(クラオ洞窟・ドラウプニル。IL700)は怒りの思念が出やすい。サブキャラで回してメインに渡す(素材は拘束なし)\n- サブキャラごとにバトルパス(オードが多い)とオードの買い足しができる。ギーナをキューナに換えて買えば現金は要らない\n- 種族理解度とペットは全キャラ共通\n\n### ショップの買う順(Madsin 10/25)(10/29)\n| ショップ | メイン | サブ |\n|---|---|---|\n| シューゴフェスタ(回数はサーバー共通) | ディーヴァニオン結晶 → スティグマのかけら → 名画(能力値の良い2枚から。全部そろえると称号)→ 外見の装飾品(クローゼットで全キャラに攻撃力)→ 翼 | メインが買い切った後、結晶とかけらを集める。オード(Regna Odyl)はキャラごとに出てサーバー倉庫に入れられる |\n| 悪夢(キャラごと) | 結晶50個 → かけら20〜25個 → **悪夢の像**(14,000。6章の「ジケルの像」と同じ物かは要確認。ジケル作戦1回目+ボス1体分)→ かけらの残り → 悪夢の翼、またはクラスルーンの挑戦(+3 から PvE ダメージが付く。+3〜+5 まで) | 同じ順で、最後は外見(装飾品から) |\n| アビス(キャラごと) | **スティグマのかけら200個**(約350万アビスポイント)を買い切るまで他は買わない。勲章は買わない。PvP をするなら PvP のアミュレットの巻物を10枚(青まで) | 外見(全キャラに PvP 攻撃力。サブで分けて買う)→ 魔石(週50個。PvP の魔石にして売るとお金になる)、神石の箱(拘束だがメインに付けられる) |\n| シーズン(キャラごと) | 神秘的な結晶 → シーズンの翼(21万。ソーサラー・スピリットマスター・アサシン・クレリックは急ぐ。シーズンで約60万たまるので焦らない)→ 製作の素材 → 余ればキューブの鍵・突破石のかけら | 外見(装飾品から)。**煌めくオードはサーバー倉庫に入る**ので、サブのコインで5個もらえる |\n\n- 賢者の石はシーズンの店では買わない(1枠 6万コインと高く、継承で消える。遠征「難しい」とルドラで出る)\n\n---\n\n## 5. 稼ぎ方(ギーナ・アビスポイント)(10/26)\n今週の動画7本から。出典は10章。\n\n### 5-1. ギーナは2種類\n| 種類 | 使える所 |\n|---|---|\n| 通常のギーナ | 取引所での買い物、倉庫で別のキャラへ移せる。**買い物用にとっておく** |\n| 拘束ギーナ | そのキャラだけ。強化・NPC の店・使命の引き直し・種族理解度の分析などに使える。両方使える所では**拘束ギーナが先に減る**。強化用のお金と考える |\n- **(11/20)刻印のギーナ(取引できない)が増えた**: 11/11 からクラオ征服・ドラウプニル征服・混沌のエレシュランタ下層のモンスター、**11/18 からすべてのフィールドモンスター(1日の上限 100万も)**のギーナが刻印に(アップデート情報 11/11・11/18)。下の 5-2・5-4 の「通常」はその前の話\n- 取引所で**買う**にはメンバーシップが要る(30日、買ったサーバーだけ)。**売る**のは無料のアカウントでもできる(CrusherX)\n- 取引所で売ると**10%の手数料**+出品料(拘束ギーナ)。10万で売ると手元に来るのは9万。値下げで競う前に手数料を考える\n\n### 5-2. メインキャラだけで稼ぐ(CrusherX 10/23 ほか)\n| 稼ぎ方 | 1日の目安 | 出るギーナ | こつ |\n|---|---|---|---|\n| **遠征**(オードエネルギーで最後の箱を開ける) | エネルギーは1日120回復 = 40の箱3つ。ウルググ峡谷(仮)の征服で約90万、炎の神殿で約120万(装備・素材は別) | **征服=通常**、探険=拘束(10/23。11/11 からクラオ・ドラウプニルの征服は刻印) | ギーナはボスではなく最後の箱から出る。**稼ぎはクリアの速さではなくエネルギーの量で決まる**。上限までためると回復が止まるので、ためない |\n| 使命 | 5回×5万 = 25万以上 | 拘束 | 引き直しはだんだん高くなる。1〜2回で止める |\n| 雑魚狩り | ギーナは**1キャラ1日100万まで** | 通常(10/23。**11/18 からフィールドは刻印**。アップデート情報 11/18) | 落とし物(精霊石・皮)とペットの魂も同時に入る。アビスは通常ギーナが多めに出るが、相手陣営に狩られる |\n| 採集 | 売り値しだい(5-3) | 売れば通常 | オードは NPC の買い取りでも他の素材の4倍、等級が1つ上がると価値が3倍。木材は売れやすい。ベルテロン・アルトガルドは採集場所がアルトミン・モルヘイムの約2倍。クエストやダンジョンへの道で拾う |\n| 1回だけの物 | 封印ダンジョン1か所 1.5万(陣営ごと81か所で約120万)、地域クエスト最大14万、業績・出席・パス | 拘束 | 収入ではなく強化の元手 |\n\n遠征の箱1つのギーナ(40エネルギー。CrusherX)\n| ダンジョン | 征服(通常ギーナ) | 探険(拘束ギーナ) |\n|---|---|---|\n| クラオ洞窟・ドラウプニル | 約20万(11/11 から刻印) | クラオ洞窟は20エネルギーで7.5万。**週7回目から60%、21回目からギーナなし**(10/23。11/4 から探険のギーナは累計 0〜40回 100%、41〜50回 80%、51〜60回 60%、61〜70回 40%、71回〜 20%。報酬も征服と同じ水準に。アップデート情報 11/4) |\n| ウルググ峡谷(仮)・バクロンの空中島 | 約30万 | バクロンの空中島 15万 |\n| 炎の神殿・獰猛な角岩窟 | 約40万 | |\n| 遠征「難しい」(10/21〜) | 48万(アップデート情報 10/21) | |\n- メンバーシップ: エネルギーの上限 840。箱に2回注ぐと報酬2倍・消費2倍(得は増えないが回数が減る)。**そよ風商会でオードエネルギーをギーナで買える**。40エネルギーが10万で、30万の箱を開けられるなら得\n- 売れやすい物: 高い等級の採集素材、精霊石、皮、料理、**怒りの素材**(毎週欲しい人が出る)。近いうちに自分で使う物は売らない(売って買い戻すのが一番の損)。**売る予定の装備は装備しない**(装備すると取引できなくなる)\n- 30分なら: 使命 → 遠征でエネルギーを使い切る → 道中で採集。1時間なら: その後に同じ場所で雑魚狩り、最後の10分で出品\n- テンプラーは狩りの型(破滅のシールド Lv15+審判 Lv16+殲滅)でアビスを回ると、1時間に生のギーナ約100万+精錬石・唯一の装備などで約400万分(Leonis。テンプラーのまとめ 9章)\n\n### 5-3. 空から採集する(まろフル 10/19。日本の配信者、ハダル鯖)\n- アビスの外でオード・オリハルコンを空から集める。翼の残りを節約する飛び方: ダッシュしてすぐ解除を繰り返す(W を押したまま飛行を入り切り)\n- 翼が切れたら、Esc → アビス → F でアビスに入ってすぐ出る。約20秒で翼が満タンになる(地面で待つと2〜3分)\n- 1時間で手数料を引いて約1,000万(オード276個・オリハルコン61個ほど。煌めく(金)はそれぞれ1個・3個)。**稼ぎは煌めく素材の値段しだい**で、アリエルでは 10/25 に他鯖並みまで下がった(相場と製作のまとめ)\n- 10/14 から採集素材は出品が制限されることがある(ボット対策)。まず少しだけ出品して試す(CrusherX)\n\n### 5-4. サブキャラで稼ぐ(Soulgrot 10/20・aLuckyRO 10/25・Moxsy 10/19)\n| 項目 | 中身 |\n|---|---|\n| 何人 | 普通は1人、時間があれば2人。1サーバーに4人まで(Soulgrot) |\n| 職業 | **チャンター**(一番。序盤の火力が高くパーティーにも喜ばれる)。IL2100 以上まで上げるならクレリック。**テンプラーは次点**(盾役は低い戦闘力でも入れてもらえる)。ほかの火力職はスティグマのかけらが多く要るので向かない(Soulgrot) |\n| 上げ方 | Lv45 まで本筋のクエスト。経験値が足りなければ封印ダンジョン(結晶・知恵の石も出る)。Lv46 まで進めると武器・ガーダー・腕輪。職業のルーン2つで IL+80 |\n| 回す所 | **クラオ洞窟**(IL700。一番速くて簡単)。1時間に確実に約300万、平均400〜500万。中身: 怒りの思念(箱1つで6%、2つ開ければ12%。約200万)、名画、精錬石、唯一の装備(振り直しの材料に1つ約100万)、箱ごとに7万。ドラウプニルは遅いか同じくらい(10/20。11/11 からクラオ征服のギーナは刻印なので、ギーナの分は減る) |\n| 炎の神殿まで上げれば | 怒りの自我(約400万)が出て、1回の稼ぎが約2倍。ただし上げるのに時間がかかる |\n| オードを増やす | 物質変換・店の「キャラごと」の分だけ使う(サーバーごとの分を使うとメインの分が減る)。ディーヴァパスもサブごとに買える。ギーナ → キューナで買えば現金は要らない(取引所の「交換」で。大口のほうが高く売れる) |\n| サブでやらない(サーバー共有) | **デイリーダンジョン**、シューゴフェスタ、次元侵略、シーズンショップ。出席・郵便・イベントの品もサーバー共有 |\n| サブでもやる(キャラごと) | 遠征・悪夢・覚醒戦、闘技場、戦場、万神殿、アビス回廊 |\n| 時間 | 週2〜3時間。メインで遊ぶ日にサブでクラオ洞窟とドラウプニルを1回ずつ(1回10〜15分)、回廊は1回2分(aLuckyRO) |\n\nサブキャラでメインを強くする方法(aLuckyRO・Moxsy)\n| 方法 | やり方 |\n|---|---|\n| 強化 | メインの装備をサーバー倉庫に入れ、サブの**拘束ギーナと強化石**で強化してメインに戻す。強化して分解すれば、強化石がメインに移る |\n| 外見の図鑑 | サブで拾った白・緑・青の装備を分解すると外見が増える(図鑑は全キャラ共通)。重複は合成で上の等級へ。合成のギーナはサブの拘束ギーナで払う。**外見700個で称号「ああ、着る服がない」**(英語 Empty Closet。戦闘速度+3.5%・待ち時間短縮+3.5%。一番良い称号) |\n| 種族理解度 | 全キャラ共通。分析をサブの拘束ギーナで回す |\n| アビスポイント | サブでアビス回廊(1回 約1〜1.5万。5-6 の「約2〜3万」と違う。11/4 から 1.5倍)→ アビスの店で魔石を買い、倉庫でメインへ。アビスの外見もアカウント共通なのでサブで買う(Sen) |\n\n### 5-5. 作っては消すキャラで拘束ギーナと結晶(Fubgun 10/22)\n- 新しいキャラを作って Lv10 まで上げ(業績とペットが開く)、業績の報酬を受け取る。約15分で**拘束ギーナ約80万と分析用の結晶 600〜800個**。キャラの空き枠ごとに24時間に1回\n- 量はアカウント全体の業績しだい(ペットを多く最大にしている人ほど結晶が多い)\n- 拘束ギーナはそのキャラでしか使えないので、そのキャラで種族理解度を回す(全キャラ共通)\n- 仕様のすき間を使う方法なので、修正される可能性がある\n\n### 5-6. アビスポイント(Ashura 10/24・Sen 10/24)\nAshura は約190万でアビスポイント1位(課金なしと本人)。週の上限はシーズンを通して毎週上がるので、**毎週やれば後からでも追いつける**。\n\n| 順 | 稼ぎ方 | 中身 | 週の上限 |\n|---|---|---|---|\n| 1 | **指令**(週12回)とアビス指令 | 町とアビスにいる指令の NPC から。白〜金まで全部やる。引き直しは悪夢の券・オードエネルギー・覚醒戦が出るまで。人の少ない時間(早朝)か、ギルドで | 入る |\n| 2 | 攻城・フィールドボス | 唯一の装備と「英雄の証(Proof of Hero。日本語名は未確認)」が出る。物質変換で箱にするとアビスポイント(週に作れる数に限り) | |\n| 3 | **補給依頼** | 毎日、持っている物を納める。ボスの落とす装備を納めると多い(大きいボスなら2つで6.7万) | **別枠**(取りこぼさない) |\n| 4 | 時空の亀裂 | プレイヤーを倒すとアビスの**2倍**。出る時刻は questlog.gg の上部か NotMeter の通知(設定の通知で「時空の亀裂」「戦場」を ON) | 入る |\n| 5 | 相手陣営の封印ダンジョン・拠点 | ポイントが入る。グループで行く | |\n| 6 | アビスの雑魚狩り | PvE の人の一番の方法。狩られにくい場所が一番効率が良い | 入る |\n| 別 | **アビス回廊** | 自陣営が攻城で取った回廊に入り、時間内に雑魚を倒す。1回 約2〜3万(10/24。11/4 から 1.5倍。アップデート情報 11/4)。**キャラごと48時間に1回**(Sen。3章の「攻城の後にリセット」と食い違う。要確認)。設定「スキル使用時の自動ターゲット」ON、飛び込み技に「撃破で待ち時間リセット」の特化を付け、マクロを押し続けて回る。テンプラーは狩りの型(破滅のシールド Lv15)がそのまま使える | |\n- 回廊の制限時間は 2分(Fubgun・aLuckyRO)と 5分(Sen)で食い違う\n- 使い道(Ashura): スティグマのかけらを毎週店で買い切る → PvP の魔石 → 勲章で上位の装備。外見はサブで買う(Sen)\n- ひとりは厳しい。ギルド(レギオン)に入る(Ashura)\n\n\n### 5-7. サブキャラ以外の方法(10/26)\n| 方法 | やり方 | 稼ぎの目安 | 注意 |\n|---|---|---|---|\n| **錬金で魔石・霊石** | 中級の魔石・霊石を作ると **20% で上級**ができる(コンボ)。材料の下級・中級は覚醒戦の箱(難しいほど多い)と超越の報酬から。上級は小分けにして出品すると売れやすい | 上級の魔石 約70万・霊石 約57万(Savvvo の鯖)。2時間で約400万(JPVariety) | 上級をさらに上の物にすると売れ残った(JPVariety)。アリエルの値段は相場ボードに入っていないので取引所で確かめる |\n| 錬金で巻物・料理 | よく使われる巻物(1つ約1万)や料理を作って売る。材料(肉・油など)が安い時にまとめて買い、寝ている間に大量に作る | 巻物100個で100万以上(JPVariety)。料理は利益 約3〜7割(GAC) | 先に材料費と売値を比べる(成功率・コンボ込み。GAC は表計算で管理)。手数料10%を引いて考える |\n| 装飾品を作って売る | 真龍王のリングなどは全職業が使うので売りやすい。武器より材料が少なく、失敗の痛手も小さい | 他の鯖の例: 材料1,400〜3,000万で 2,800〜5,000万で売れた(Screamheart・JPVariety。10月上旬) | **アリエルでは差が小さい**(下の計算) |\n| 唯一の装備を拾って売る | 最高レベルの敵はどこでも唯一の装備を落とす。テンプラーはアビスで破滅のシールドを使って雑魚を回る | 20分に1つくらい、1つ約100〜130万(JPVariety・Screamheart) | 自分の振り直し・継承石の材料にも使える |\n| 採集と取引所 | 宝石(サファイア・ルビー・ダイヤ)は細工のレベル上げで欲しい人が多い。採集の技能は「宝石を探す」系を取り、ミニマップに場所を出す。朝は安く夜に高い | 鯖と時間しだい | 自動で採集し続けると確認の画面が出て、失敗すると処分される(Aragon) |\n| **サーバー移動で転売** | 移る前に今の鯖で安い物を買い込み、移った先で高く売る。持ち物と個人の倉庫・取引所で買った物は一緒に移る(サーバー倉庫は移らない) | 物によって5割〜2倍(Infinitea) | 手数料と出品料で約15%引かれる前提で計算する。ほかの物から作れる素材(純粋なオードなど)は罠。満員の鯖は1時間ごとに受け付けが変わる |\n\n**アリエルで真龍王のリングを作って売ると得か(10/26 の値段)**\n- 作る費用 約1,960万(10/24 の計算)。売値: 真龍王のリング 2,100万、光る真龍王のリング 3,800万(25% で光る)\n- 手数料10%を引くと、1回あたりの期待値は 約2,270万 → **約310万の得**。ただし製作の失敗(約1割と Screamheart)で材料を失う分を入れると **ほぼ±0〜+100万**。光らなかった回は損に近い\n- → 自分で使うなら作る価値があるが、売るための製作は今のアリエルでは割に合いにくい。相場ボードの「作るか買うか」で毎回確かめる\n\n**取引所の使い方のこつ**(Infinitea・Savvvo)\n- 1人が出品できるのは10枠。まとめて1枠に出すより、**小分けにする**ほうが売れやすい(買う人は束を分けられない)\n- 本当の相場は「出品から時間がたっていない物の値段」。1日以上残っている出品の値段では売れていない\n- 大きなパッチやボットの一斉処分のあとは、ボットが集めていた素材が上がりやすい(Infinitea)\n\n### 5-8. 時空の亀裂での PvP(10/26)\n| 項目 | 中身 |\n|---|---|\n| 何か | 相手陣営の世界(天族なら魔族側)へ行ける入口。**Lv45 から** |\n| いつ | **3時間ごと**に出て、入ってから約1時間で追い出される。**(10/29)** questlog.gg のタイマーでは 20:00(日本時間)に開いた → **2・5・8・11・14・17・20・23時**(欧米の鯖の動画からは 0・3・6…21時と読めたが、こちらが新しい)。地図(M)に出る。questlog.gg の上部のタイマー、NotMeter の通知でも分かる |\n| PvP のしかた | 亀裂に入り、画面右下で **PvP モードを ON** にすると相手陣営のプレイヤーと戦える。倒すとアビスポイントが**アビスの2倍**(Ashura)。OFF のままなら雑魚狩りや相手側の封印ダンジョン・拠点(アビスポイントが入る。グループで)だけをする(ZYASO) |\n| なぜ亀裂か | アビスにいられるのは週7時間だけなので、PvP を多くしたい人は亀裂に通う(notXeon) |\n| 死なないために | 相手の町・拠点の**衛兵の近くは一撃で倒される**。倒されると亀裂から追い出される(復活石を使えばその場で戻れるが、また倒されることがある)(Absconder) |\n| 人数 | ひとりは不利(1対2はよくある)。ギルドで行く。夜は大人数のギルド同士の戦いになる(Ashura・Chef_Zhab・StingKnight) |\n\n戦い方のこつ(notXeon=チャンター、StingKnight=テンプラー)\n- マクロは左右クリックの通常攻撃だけ。**気絶・転倒などの拘束技、バフ、防御技は手で**、使う時を自分で決める(テンプラーのまとめ 11章と同じ)\n- 囲まれたら数秒間守れる防御技が強い。テンプラーはガードが多いので 1対2 でも粘れる(StingKnight の 1対2 で勝った場面)\n- 移動速度を上げる手段があると、追う・逃げるが楽になる\n- 準備(ZYASO): アビスの店の巻物で **PvP のアミュレットを強化**(PvP ダメージ +10%)、魔石・霊石に PvP の能力値、アビスの外見(武器・装飾品は PvP ダメージ、防具は PvP 被ダメージ減)、装備のプリセットに PvP 用を1組、アビスのモノリスの羽根を集める\n- テンプラーの PvP のスティグマ・特化・1対1 の流れは `1_テンプラー/テンプラー_まとめ.md` の 11章\n\n---\n\n## 6. 悪夢\n| 項目 | 内容 |\n|---|---|\n| 回数 | 毎日2回分(最大14)。倒したことのある段は即時クリア券で済ませられる |\n| ボス | 7体。左から順に解放: 門番ピノピ・怒れるフェルク → 要塞守護者ノトゥン/ファフニル・ジゼル → ジェロッド → ジケル |\n| 解放 | 前のボスを難易度10まで倒すと次が出る |\n| 報酬 | 夢幻の破片。**初めて倒した段の報酬がずっと多い**(難易度9: 初回840個、2回目以降200個) |\n| 一番の目的 | ジケルを倒すと**ジケルの像**(万神殿)。破片約14,000個(3章・4章の「悪夢の像」と同じ物かは要確認) |\n| 交換所 | 突破石、魂の書とその初期化の書、ペットの結晶、**ディーヴァニオン結晶(最大50個)**、知恵の石、クラスルーン、**スティグマのかけら**、翼、衣装 |\n\n- ボスは「1,1,1 → 2,2,2」と均等に上げて初回報酬を取る(Moxsy)\n- ディーヴァニオン結晶を先に買い、そのあとかけら(Moxsy・Soulgrot・Fubgun)\n- ジケル対策: 地面割りは詠唱が残り1秒でジャンプして滞空、斬撃(出血)は背後に立って浄化(BoredAF)\n\n## 7. 覚醒戦\n| 項目 | 内容 |\n|---|---|\n| 回数 | キャラごと週3回 |\n| 難易度 | 7段階。ハードは IL2000、エクストリームは IL2500 |\n| 報酬 | 魔石・霊石の箱、**成長のペット箱(スコア7,000以上で20個、6,000で17個)**、突破石 |\n| スコア | ほぼタイムで決まる。**ハードは「完璧クリア2,100点+残り1秒につき3点」**(韓国版のコメント)。4,000点には約3分26秒以内のクリア |\n| 結晶 | 1,000点・3,000点・4,000点・5,000点で神秘的な結晶(アルカナ用) |\n\n- テンプラーは破滅のシールド Lv15 で回ると速い(Aragon はハード約2分40秒で4,000点)\n- 未確認: 「完璧」の条件、空虚の螺旋体を壊すと点が増えるか、死ぬと回数が減るか\n\n---\n\n## 8. 装備の強化・刻印・継承(仕組み)\n部位ごとに狙う能力値は `1_テンプラー/テンプラー_まとめ.md` の5章。\n\n### 強化\n| 段階 | 内容 |\n|---|---|\n| +10 まで | 100% 成功 |\n| +11〜+15 | 失敗すると材料だけなくなる(装備は残る)。費用は1回30万〜150万と急に上がる。IL86 の装備は IL36 の装備の約2倍 |\n| +16 以上(突破) | 突破石と強化石を使う。星1つで IL+5。**(10/29)** +0→+1 は成功66%・突破石6個・約60万、+1→+2 は9個・約90万(Fubgun)。ロングソード・ガーダー → アクセサリー → 防具の順 |\n| クラスルーン | **失敗すると壊れる唯一の装備**。+1 が安全(Ulfhednar)。壊れたら悪夢の交換所で買い直す |\n\n- IL2500 までは+10 で十分。+15 以上は長く使う装備(製作装備)だけ(Duky・Strylander)\n- **安く上げる方法**: IL の低い同じ部位を +15 にして、刻印も良い物にしてから、本命に継承する(Grobs 10/19)\n- サブキャラのギーナ(シーレンティウムを売った拘束ギーナ)と強化石で、メインの装備をサーバー倉庫経由で強化できる(Moxsy)\n\n### 魂刻印で付く行と確率(11/8。GameWith の「魂の刻印オプション DB」。韓国版の公式確率 9/30 の版)\nグローバル版は確率を公開していないので、**韓国版の数字**。1つの装備に同じ行は2回付かない。確率の数値が**低いほど出にくい**。行の名前は NotMeter・ゲームの日本語名と同じ。\n| 区分 | 行の数 | 共通の行(合計 80%) | スキルの行(合計 20%) |\n|---|---|---|---|\n| 武器・ガーダー | 製作の冥龍王・光る白龍王・光る冥龍王 **5**、ヌアクム級(IL80〜88 の唯一)・深淵 4、**怒りのクロメデの武器 3**、ルドラ(英雄 IL98)4 | 16種 | 自分の職業のアクティブ 12種(1つ **1.67%**) |\n| 防具(7部位) | IL80〜88 の唯一(ヌアクムなど)4 | 23種 | 自分の職業のパッシブ 10種(1つ **2%**) |\n| ネックレス・イヤリング | クロメデ・ヌアクム級 4、製作の冥龍王・光る冥龍王 5 | 13種 | パッシブ 10種(1つ 2%) |\n| リング | 同上 | 13種 | アクティブ 12種(1つ 1.67%) |\n\n**武器・ガーダーの共通の行(光る冥龍王)**\n| 確率 | 行 | 数値の幅(ロングソード / ガーダー) |\n|---|---|---|\n| **1.6%(一番出にくい)** | **ダメージ増幅** | 4.67〜5.44% / 3.11〜3.65% |\n| 3.2% | **戦闘速度**・**武器ダメージ増幅**・状態異常的中 | 戦闘速度 10.39〜12.02% / 7.79〜9.03%、武器ダメージ増幅 11.26〜13.02% / 8.45〜9.79% |\n| 4.8% | **多段ヒット的中**・**威力** | 多段ヒット 7.35〜8.52% / 5.51〜6.41%、威力 61〜77 / 45〜59 |\n| 5.6% | 正確・攻撃力・クリティカル・後方攻撃力・前方攻撃力・ガード | |\n| 6.4% | クリティカル攻撃力・命中・MP・HP | |\n\n**防具の部位ごとの珍しい行(IL80〜88 の唯一。ヌアクム・深淵などが同じ表)**\n| 部位 | 2.4%(その部位の目玉) | 1.2% |\n|---|---|---|\n| ヘルム | **受ける治癒量**(14.78〜17.07%) | **強打**・**攻撃力増加**(どちらも 1.28〜1.54%)・鉄壁・完璧抵抗 |\n| ショルダー | **クリティカル ダメージ増幅**(10.75〜12.43%) | 再生・鉄壁・防御力増加・鉄壁貫通 |\n| トップス | **ダメージ増幅**(9.64〜11.16%) | 再生・鉄壁・防御力増加・強打抵抗 |\n| ボトムス | **ダメージ耐性**(7.56〜8.76%) | **完璧**・**攻撃力増加**・鉄壁・強打抵抗 |\n| グローブ | **戦闘速度**(6.05〜7.03%) | **完璧**・再生・防御力増加・鉄壁貫通 |\n| シューズ | **移動速度**(15.29〜17.65%) | **完璧**・再生・防御力増加・完璧抵抗 |\n| マント | クリティカル ダメージ耐性(10.08〜11.66%) | **強打**・**完璧**・**攻撃力増加**・武器ダメージ耐性 |\n- 全部の防具に共通: 状態異常抵抗 2.4%、敏捷・HP・意志・攻撃力 3.2%、クリティカル・命中・防御力・回避・前方/後方防御力 4%、クリティカル防御力・クリティカル抵抗・ガード・MP・HP・MP/HP自然回復 4.8%(HP が 3.2% と 4.8% の2か所にある。片方は別の名前の行かもしれない。要確認)\n\n**アクセサリーの共通の行(ネックレス・イヤリング・リングで同じ)**: クリティカル抵抗・ガード・MP・HP 7.2%、MP/HP自然回復 8%、攻撃力・クリティカル・命中・防御力・回避 5.6%、飛行力 4%、知識 3.2%\n- **ネックレス・イヤリングの魂刻印には、戦闘速度・威力・正確の行がない**(クロメデ・製作の冥龍王・光る冥龍王で確かめた)。動画の「ネックレスに戦闘速度」は、装備を手に入れたときにランダムで付く**副ステータス**の話(製作の光る冥龍王のネックレスの副ステータスの候補に 戦闘速度 3.7〜4.4%・威力・正確がある)。魂刻印や調律では付けられない(11/8)\n\n**狙った行が付く確率の目安**(こちらの計算。重複しないので実際は少し高い)\n| 行の確率 | 4行の装備 | 5行の装備 |\n|---|---|---|\n| 1.2%(ヘルムの強打など) | 約5% | 約6% |\n| 1.6%(武器のダメージ増幅) | 約6% | 約8% |\n| 2.4%(グローブの戦闘速度など) | 約9% | 約11% |\n| 3.2%(武器の戦闘速度など) | 約12% | 約15% |\n| 1つのスキル(リングの審判 1.67%) | 約7% | 約8% |\n- **(11/13)調律石**: 11/11 のパッチで、超越の週のミッションから**調律石(唯一)が週3個**もらえるようになった。調律の材料に唯一の装備を壊さなくてよくなる(アップデート情報)\n- **(11/13 XifanGG、10万回)** 部位ごとの狙い: 武器・ガーダー = 戦闘速度・ダメージ増幅・武器ダメージ増幅・威力、製作品(5行)なら**攻撃力**(攻撃力は威力・攻撃力増加で伸びるので、前方・後方攻撃力より良い)か多段ヒット的中(主な技に多段ヒットの特化がある職業は攻撃力)。ヘルム = 強打 \u003e 攻撃力増加 \u003e 攻撃力、ショルダー = クリティカル ダメージ増幅 \u003e 強打 \u003e 攻撃力、トップス = ダメージ増幅 \u003e 攻撃力、ボトムス = 攻撃力増加 \u003e 攻撃力(ルドラではダメージ耐性も)、グローブ = 戦闘速度 \u003e 攻撃力、マント = 強打 \u003e 攻撃力増加 \u003e 攻撃力、シューズ = 攻撃力・完璧・移動速度。残りの枠は火力のパッシブ。**完璧は「シーズン2〜3 の行」で、今は無理に狙わない**。振り直しの書は少ないので武器とガーダーに。魂の書で数値を上げるのは、行がそろってから\n- XifanGG は「ネックレス・イヤリングに 威力・戦闘速度・正確」と言うが、上の確率表(魂刻印)にはなく、NotMeter の上位20人にも出ない。副ステータスの話と見られる(意見が割れていること)\n- 全部の行をそろえるのはとても難しい。**大事な1行が付いたら残し、調律(既にある行を除いて1行だけ付け直す。確率は上の表と少し違う)で残りを狙う**のが普通\n- 上位の人の採用率(各職業のまとめの 5章)は「付いた結果」なので、確率の低い行(ダメージ増幅など)が 100% なのは、それだけ付け直している、ということ\n\n### 刻印と継承\n| 操作 | 中身 | 要る物 |\n|---|---|---|\n| 調律(英語 Sync) | 選んだ1行を振り直す | 唯一の装備1つ、または**調律石(唯一)**(11/11 から超越の週のミッションで週3個。アップデート情報 11/11) |\n| 魂刻印(数値上げ) | 能力値の数値を上げる | 魂の書(使うたびに必要数が増える。50 → 最大540) |\n| リセット | 全部の行を振り直す | 初期化の書(貴重。製作装備用にとっておく) |\n| 追加の行 | 刻印率100%で6枠目 | 賢者の石(遠征「難しい」で1%・確定報酬でも選べる、ルドラ、シーズンショップ) |\n| 継承 | 古い装備の強化値と刻印を、IL が1以上高い同じ部位に移す(移す元で上書き) | 継承用の石(物質変換で唯一の装備1つから) |\n\n- 追加の行にはスキルを狙う(スキルの行は最初から100%なので数値上げが要らない)\n- 刻印率を100%にすると行を変えられなくなる。変えたい行は先に振り直す\n- 唯一の装備は振り直しの材料としてずっと要る(11/11 から調律石でも代えられる)。今は武器70万・防具55万ほどで安い(Soulgrot、10/18)。遠征「難しい」で出やすくなれば下がる見込み(NoBS)\n- 魔石は長く使う装備(IL86 のダンジョン装備、製作装備)にだけ良い物を\n- **(11/1 意見が割れている)** Savvvo(10/31)は「最近の更新で、**IL86 のダンジョン装備を IL86 の製作装備へ継承できる**ようになった」と言う。MrRosaPony(10/28)は「IL86 の炎の神殿の武器は、すぐには製作の武器へ移せない。もっと上の製作の武器を作ってから」と言う。前は「IL が1以上高い同じ部位」だけだった。継承画面で確かめる。**(11/4)JPVariety(11/2)は怒りのクロメデの武器から製作の武器へ実際に継承できた**(移す先の製作武器の IL は動画では言っていない)\n- **(10/28)** 継承で移るのは 強化値・刻印(・突破。Grobs)。魔石・霊石は移らず、移す先の物が残る(Fubgun)。くわしい手順はテンプラー_まとめ 5-5\n- **(10/28 Grobs)** 製作装備の良い所は「刻印が5行(ダンジョン装備は4行)」と「IL102 まで上げられる」こと。ただし IL を上げないうちはダンジョンの IL86 のほうが強い。製作の費用は1〜2か月で半分ほどに下がる見込みなので、急がない人は今は素材を売り、ダンジョン装備を +15・突破・良い刻印にしておき、安くなってから製作して継承する手もある\n- 突破石は取引所で売れる(10/24 ごろ 1個約5万ギーナ。Aragon)\n\n---\n\n## 9. 未確認・意見が割れていること\n| 点 | 内容 |\n|---|---|\n| 覚醒戦で死ぬと回数が減るか | 減る(Kanon・MR4KTV)/減らない(JPVariety) |\n| 聖域の時期と条件 | (解決)11/4 に聖域ルドラが開始。普通 IL2800・難しい IL3000、11/18 から簡単 IL2800(アップデート情報 11/4・11/18)。台湾版は IL2700 |\n| オードエネルギーの上限 | 560(メンバーシップ840)か一律840か |\n| デイリーダンジョンの回数 | 週14回が多数。「無料は週7回」の記述もある |\n\n## 10. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| Fubgun「IL2800 への道、ルドラ発表」(fQvu09hy3Kg、6万回) | 10/25 | 0-1、ルドラ 11/4、突破の費用 |\n| Spid「ルドラまでに IL3000」(9ji2Z353kXQ、3万回) | 10/26 | 0-1 の IL を上げる順(アリエル・アスフェルのボード、突破、上級の魔石) vJNQ、独) | 10/20 | 3時間ごと、地図とタイマー |\n| ZYASO「アビスポイントの稼ぎ方(PvE と PvP)」(7r0VTZvv2EU、独) | 10/20 | PvP モード、PvP の準備。1.2万回 |\n| notXeon「今 PvP するなら亀裂しかない」(zqCxGmT0uX4) | 10/12ごろ | 亀裂で PvP する理由、マクロ(1か月以内) |\n| StingKnight「時空の亀裂侵入 テンプラー視点(1対2)」(-q8li6XESeY) | 10/5ごろ | テンプラーの 1対2(1か月以内) |\n| Grobs「安価な強化術」(2vDVa75Y3XA)、Soulgrot「装備を正しく強化」(jI9i3ChAAQc) | 10/18〜19 | 強化と継承 |\n| Duky、Aragon、Soulgrot、Moxsy、Strylander、SywoGG、Leonis、BoredAF、MR4KTV、Kanon ほか | 10/7〜10/14 | 以前の出典(`_古い版/`) |\n| Metabot、mein-mmo、K1Persia ほか(日課・週課) | 10/5〜 | 回数の確度は `_古い版/AION2 日課週課まとめ.md` |\n| 펭귄몬스터、전하TV、동화의 게임 ほか(韓国版) | 10/5〜10/14 | 韓国版の今 |\n| cost「How to be Ludra ready as a sub only player」(KW9JxHJ0GAQ) | 10/28、3.1万回 | 戦闘力の中身、錬金 |\n| Drunge「Ludra officialisé et gros changements en Abysse」(NtL1-YtlyNM、フランス語) | 10/25、2.7万回 | アビスの相手の組み直し |\n| Madsin「Ludra Sanctuary - How to prepare」(JbXR0CN6UTw)、Xia(ypNZcGP326c)、Savvvo「Ludra Preparation Guide」(svOKpTzg9w4)、MrRosaPony クレリック(wz1YTR8mrSo) | 10/28〜10/31 | 0-2 ルドラの準備と中身、継承の意見の割れ |\n| Mobalytics「November Update for Aion 2」(https://mobalytics.gg/gamebase/previews/aion-2-november-update) | 10/25 | 0-2 開始日・初クリアの賞 |\n| 公式「11月4日(水) アップデートノート」(https://aion2.plaync.com/ja-jp/board/update/view?articleId=6aead0e8066b033317c02ab3) | 11/4 | アップデート情報 11/4 |\n| JPVariety「リソースを無駄にせずギアスコア3000」(rjptr7NJgSY)、「エンドゲーム武器を作る前に」(ule-TuP0V9c) | 11/2〜11/3、2.1万・3.3万回 | 0-2 IL3000 の上げ方、製作武器の費用、クロメデ → 製作の継承(11/4) |\n| Spid(ルドラ開始後の2本) | 11/5・11/7 | 0-2 ルドラの実際の戦闘力(11/8)。詳しくはアップデート情報 11/4 |\n| Aragon「製作なし・課金なしで IL3,000」 | 11/3、8万回 | 0-2 の IL3,000 の表(11/8) |\n| GameWith「魂の刻印オプション DB」(韓国版の公式確率 9/30) | 11/8 | 8章の魂刻印の確率 |\n| XifanGG(部位ごとの狙い) | 11/13、10万回 | 8章の部位ごとの狙い |\n"},{"id":"arcana","tab":"アルカナ","title":"アルカナ まとめ","file":"アルカナのまとめ.md","md":"# アルカナ まとめ(2026-11-20 最新)\n\n「悪夢・覚醒戦・アルカナ・装備厳選・クラフト」の3章と「アルカナ_強化か抽出か」をまとめた(11/20 に聖杯の指定の数の結論をそろえ、韓国版とシーズン2の話への案内を足した)。古い版は `_古い版/` にある。\n- 韓国版の 11/11 の改編では、カードの中のスキルの行だけを振り直せる。シーズン2のカードは IL +20・神の能力値 +5(Arthars)。どちらも `アップデート情報.md`(グローバル版にはまだ来ていない)\nテンプラーで狙うスキルは `1_テンプラー/テンプラー_まとめ.md` の6章。\n\n## 0. 結論\n| 項目 | 結論 |\n|---|---|\n| 集め始める時期 | **IL2500(超越の4段階目)から本格的に**。4段階目は金が約60%で出る。3段階目(IL2200)は金が約12%なので、深追いしない(XifanGG・Fubgun・Leonis) |\n| 1枚目の金 | **聖杯はスキルを2つ指定して作る(神秘的な結晶15個)のが勧め**(3章)。結晶5個+200万で1つ指定もできるが、残り3つがはずれになりやすい。急いで1枚ほしいときだけ |\n| いらないカード | 残すカードを **+2〜+3 まで強化**するのに使い、残りは**抽出**して結晶をためる |\n| +4・+5 | 「最後まで使うカード」だけ。1段に金カード12〜24枚分かかる |\n| 青・緑 | 大事なスキルが付いていれば、金より良いこともある。金に替えて大事なスキルの Lv16・20 が外れるなら替えない |\n\n---\n\n## 1. 仕組み\n| 項目 | 内容 |\n|---|---|\n| 効果 | カードを付けると、スキルのレベルと「神の能力値」が上がる |\n| 出る場所 | 超越ダンジョン(IL1600〜)。**砕けたアルカニス=羊皮紙・鏡、デウス研究基地=コンパス・鐘、両方=聖杯** |\n| 段階と出るカード | 1段階目は灰・緑、2段階目で青、3段階目(IL2200)で金が約12%、**4段階目(IL2500)で金が約60%** |\n| 付くスキル | 聖杯=どのスキルでも(だから狙ったスキルが付きにくい。1/18 など)。羊皮紙とコンパス=攻撃スキルを半分ずつ。鐘と鏡=パッシブを半分ずつ |\n| 確かめ方 | 「変換」タブ → カードを選ぶ → 追加効果、で自分のスキルがどのカードに付くか見られる |\n| セット | 活力(HP70%以上で PvE 攻撃 +60/4枚で +150)と魔力(MP 回復)。セットよりカードの神の能力値を優先してよい(Xia・XifanGG) |\n\n### レア度と強化\n| レア度 | 最初のスキル数 | 強化の上限 | IL |\n|---|---|---|---|\n| 灰 | 1 | +2 | 20 |\n| 緑 | 2 | +3 | 40 |\n| 青 | 3 | +4 | 60 |\n| 金 | 4 | +5 | 80 |\n\n- 1枚に付くスキルは最大4つ。4つ埋まった後は、強化するたびに**付いているスキルのどれか1つ**が+1。だから「4つとも良いスキルの金カード」を探す\n- 強化1段ごとに、神の能力値+1・IL+1(questlog.gg のデータ)\n- 強化は失敗しない\n\n### 神の能力値\n| 能力値 | 中身 |\n|---|---|\n| 時間 | 戦闘速度(評価が一番高い) |\n| 幻想 | 待ち時間短縮 |\n| 知恵 | 強打 |\n| 破壊 | 攻撃力増加 |\n| 死 / 自由 | クリティカル / 命中 |\n| 生命・運命・正義・空間 | PvE ではほぼ関係ない |\n\n---\n\n## 2. 強化に必要な経験値(金カード。metabot.gg のゲームデータ)\n| 段階 | 必要な経験値 | 金カード(+0)に換算 | 合計 |\n|---|---|---|---|\n| +0 → +1 | 3,000 | 1.5枚 | 1.5枚 |\n| +1 → +2 | 6,000 | 3枚 | 4.5枚 |\n| +2 → +3 | 12,000 | 6枚 | 10.5枚 |\n| +3 → +4 | 24,000 | 12枚 | 22.5枚 |\n| +4 → +5 | 48,000 | 24枚 | **46.5枚** |\n\n- 金カード(+0)を材料にすると 2,000。+4 まで上げたカードを材料にすると 47,000(注いだ分がほぼ戻る)。なので途中まで強化しても無駄になりにくい\n- 経験値用のカード(訓練のアルカナ)は最下級200〜最上級5,000。バトルパス・ショップ・出席報酬でもらえる。**強化にはまずこれ**\n- ほかのレア度の必要量: 灰 300/600、緑 600/1,200/2,400、青 1,200/2,400/4,800/9,600\n\n## 3. 神秘的な結晶\n| 項目 | 内容 |\n|---|---|\n| 使い道 | 金カードを作る(変換)。**スキル1つ指定で結晶5個+200万ギーナ**、2つ指定で結晶15個 |\n| 集め方 | ① 覚醒戦のスコア(シーズンミッション →「挑戦」→「シーズン」): 1,000点で1個、3,000点で1個、4,000点で1個、5,000点(エクストリーム)でもう1個 ② シーズンショップ(コイン25,000で1個。2個目以降は高いので1個だけにする人が多い) ③ いらないカードの抽出 |\n| 抽出の割合 | 1枚あたり 灰2%・緑4%・青6%(100%で1個)。**金は未確認**(notXeon の推測で8〜10%) |\n\n- 韓国版の항밍짱(10か月前): 聖杯は1つだけ指定すると残り3つがはずれになりやすく「結晶5個と200万を捨てるのと同じ」。**2つ指定して作る**のがよい\n- 金の聖杯は作ると7日間は次を作れない(韓国版。グローバル版は未確認)\n- 結晶の作り方の仕組みは、シーズンが変わると変わるかもしれない(metabot.gg)\n\n## 4. いらないカードは強化か抽出か\n| 手順 | やること |\n|---|---|\n| 1 | 良いスキルが2つ以上付いた金カードは**ロック**する |\n| 2 | 残すカードは、経験値用のカードといらないカードで **+2〜+3** まで上げる(金カード約10枚で届く) |\n| 3 | **+4・+5 は最後まで使うカードだけ**(1段に12〜24枚。結晶1〜2個分に当たる) |\n| 4 | 残りは抽出し、2つ指定した金の聖杯を作る分の結晶をためる |\n\n## 5. 進め方の例\n1. IL2000 で覚醒戦ハードを3分26秒以内にクリア(4,000点)→ 結晶3個。シーズンショップで1個、抽出で1個 → 5個で1つ指定の聖杯を作れるが、勧めは抽出で15個までためて2つ指定(0章・3章)\n2. IL2200〜2500 は、羊皮紙(作りやすい・付くスキルが少ない)で足りないスキルを埋める\n3. IL2500 から4段階目を回し、良い金カードを強化\n\n## 出典\n| 出典 | 中身 |\n|---|---|\n| metabot.gg「AION 2 Arcana Guide」 | 強化の経験値の表、材料の値、作る費用 |\n| XifanGG(約10/18)、Fubgun(10/21)、Leonis(10/21) | 集める時期、4段階目で金約60% |\n| notXeon、Kanon、Grobs、Society of Gaming(10/7〜10/16) | 仕組み、結晶の集め方、2つ指定で15個 |\n| 항밍짱、오지조(韓国版、10か月前) | 2つ指定して作る、強化は控えめに |\n| Antochi(10/21) | カードの出る場所 |\n"},{"id":"market","tab":"相場と製作","title":"相場と製作 まとめ","file":"相場と製作のまとめ.md","md":"# 相場と製作 まとめ(アリエル鯖・2026-11-22 最新。相場は 11/20 19:09)\n\n「市場の読み_アリエル鯖」「取引所の相場と買い時」「製作のおすすめと効率」「製作の最終段階までの素材」を1本にし、10/24 夜(19時)の相場で計算し直した。その後 10/25・10/27・10/30・11/4・11/6・11/8・**11/21** に 0章を更新し、11/13・11/19 にパッチの影響を足した。古い版は `_古い版/` にある。\n- 相場: 相場ボード https://tamanegin.github.io/aion2-market/ のデータ(Aion2Market の最安出品価格、**11/20 19:09**。他鯖は 11/20 17:00。日本時間)。毎日の判断はボードを見る。1章の品目ごとの表は 11/8 のまま\n- 「対アジア」= アジアの他6鯖の中央値と比べた差。名前は questlog.gg の日本語版の正式名\n\n## 0. 今の判断\n**今の方針(11/21)**\n- **製作は急がない**。Arthars(11/18、6万回)は「今から製作するのはやめ、シーズン2(12/16〜)の素材が出て値段が下がるのを待つ」と勧めている。下の表でも、ロングソード・ガーダーは買うほうが安くなった\n- **怒りの思念は売る**。11/8 の 235万 → **340万**まで上がったが、3日で −9% と下がり始めた(他鯖との差も +115% → +30% に縮んだ)\n- 11/18 のパッチ: 野外のモンスターのギーナが全部刻印に(取引所で使えない)。採集素材を下の等級に戻せる物質変換。ルドラ装備の出る率 5% → 15%(アップデート情報)\n\n**ワールドマーケット(11/25 開始)への備え(11/22)**\nしくみ(EUTOPIA 11/22。韓国版は 2025/12/10 から同じ形):\n| 点 | 中身 |\n|---|---|\n| 範囲 | **同じ地域・同じ種族のサーバーどうし**(アジアの天族どうし)。魔族とは別 |\n| 手数料 | ワールドマーケット・ワールド取引所とも**売るときに 20%**(今のサーバーの取引所は 10%)。1日の出品は10件。メンバーシップが要る |\n| 今の取引所 | **残る**(10% のまま)。ワールドマーケットは別にできる |\n| 韓国版の例 | 「ワールドマーケットのほうが安いことが多い」(韓国の攻略)。品が多い分、高いサーバーの値段が下がり、安いサーバーの値段が上がった |\n\n考え方: アリエルで**他鯖より高い物**は、アリエルの人がワールドマーケットで安く買えるようになるので、**アリエルの値段が下がる** → **今のうちに売る**。アリエルで**他鯖より安い物**は、売る人がワールドマーケット(手数料 20%)に出しても得になる差(約11%以上)なら出品がそちらへ流れ、**アリエルの値段が上がる** → **使う分は今のうちに買う**。差が10%前後の物は、手数料の差で動かない。\n| 区分 | 品物 | 他鯖との差 | 判断 |\n|---|---|---|---|\n| **今売る** | **達人の精錬石** | **+96%**(22.3万) | 持っていれば一番の売り時 |\n| **今売る** | **怒りの思念** | **+47%**(350万) | 持っていれば今売る(11/11 のパッチの刻印の思念でも下がる方向) |\n| 今売る | 達人の最上級精錬石 | +34%(17.5万) | 余っていれば売る |\n| 今売る | 達人の光るサファイアのリング・ルビーのネックレス | +16%・+11% | 作って売るなら 11/25 より前に。差が小さいので急ぐほどではない |\n| 今売る | 職人の光るサファイアのリング、なめした分厚い龍族の皮 | +28%・+28% | 余っていれば |\n| 注意 | 怒りの意志 | +16% | 下がっている途中(3日で −14%)。持っていれば売り寄り |\n| **今買う(使う分だけ)** | **怒りの自我** | **−25%**(360万) | 製作で使うなら 11/25 より前に |\n| **今買う(使う分だけ)** | **煌めくサファイアの原石・煌めくオード** | **−23%**(77万・74万) | リング・ネックレスの材料。使う分は今 |\n| 今買う(使う分だけ) | 煌めくオリハルコン鉱石・ルビー・ユグドラシルの木・ダイヤモンドの原石 | −16〜−20% | 同じ |\n| 今買う(要るなら) | 達人の光るロングソード | −23%(1,100万) | ロングソードは済んでいるので、要らなければ見送り |\n| 今買う(要るなら) | 達人の光るガーダー | −13%(1,003万) | ガーダーを作るなら材料として |\n- 注意: **シーズン2(12/16)で新しい素材が出ると、今の素材は値下がりする見込み**(Arthars)。だから「買う」は**近いうちに使う分だけ**。値上がりを待って転売するのは、手数料 20%(ワールドマーケット)と値下がりの見込みがあるので勧めない\n- 他鯖より安い・高いは 11/20〜11/21 の相場ボード(アリエル 11/21 2:09、他鯖 11/21 13:51)。25日までに差が縮む物もあるので、売る・買う前にボードで差を見る\n- ワールドマーケットが始まったら、売るときは「アリエルの値段 × 0.9」と「ワールドの値段 × 0.8」の高いほうに出す(ワールドで同じ手取りにするには 12.5% 高く売る必要がある)\n\n**全部の品で比べた結果(11/22 昼。取引所の 7区分 993品のうち、アリエルと他鯖3つ以上に値段がある 483品)**\nアジアの天族の**ほかの9鯖の中央値**と比べた(上の表は相場ボードの「他6鯖」なので、数字が少し違う)。白・緑の安い装備は除いた。\n| 区分 | 品物 | アリエル / 他鯖 | 差 | 判断 |\n|---|---|---|---|---|\n| **今売る** | 達人の精錬石 | 20万 / 10.5万 | **+91%** | 一番の売り時 |\n| **今売る** | 使わない**唯一の装備**(知恵のロングソード・知恵のガーダー・知恵のプレート・聖霊のロングソード・聖霊のガーダー・聖霊のボウ・聖霊のワンド・勇気のグレートソード) | 175万〜190万 / 120万〜130万 | **+45〜50%** | 調律の材料として買われている物。アリエルだけ高いので、余っていれば今売る |\n| **今売る** | 外見(甘きささやき・春の花のささやき・シャンドゥカの仮面・月光桜・白い花の息吹)、エモート：クルクル | 600万〜780万 / 280万〜350万 | **+94〜171%** | 持っていれば今売る |\n| 今売る | カイラのイヤリング | 640万 / 450万 | +42% | 出品3件 |\n| 今売る | 名画：ウルググ、なめした分厚い龍族の皮、職人の光るサファイアのリング | | +25〜48% | 余っていれば |\n| 今売る | 怒りの思念 | 310万 / 255万 | +21% | 9鯖で比べると差は小さめ(6鯖では +47%) |\n| **今買う** | **上級魔石**・中級魔石・中級深淵の霊石 | 上級 52万 / 90万 | **−42〜−47%** | **魔石を入れ替えるなら今**(出品 43件) |\n| 今買う | **封印された翼** 6種(闇の帳・青い波・黒い破片・森の精霊・クロメデ・古代アウルラウ) | 15万〜16.5万 / 20万〜27万 | **−21〜−40%** | 開けるのに煌めくオード10個が要る。集めるなら今 |\n| 今買う | 封印された深淵の波の翼(ルドラの翼) | 4,389万 / 7,788万 | −44% | 出品5件 |\n| 今買う | 名画(深淵のルドラ・東のネイケル・腐ったクタル・監視者カイラ・炎の神殿 ほか) | 深淵のルドラ 2,000万 / 3,000万 | −28〜−61% | 名画を集めるなら今 |\n| 今買う | 煌めく素材・怒りの自我 | | −23〜−26% | 上の表と同じ。使う分だけ |\n| 今買う | カイラのリング | 390万 / 500万 | −22% | |\n| 今買う | 荒野の放浪者(外形：ブーツ) | 65万 / 289万 | −78% | 外見が欲しければ |\n- **装備(武器・防具)は同じ名前でも強化値・刻印が違う**ので、一番安い値段どうしの比べはあてにならない(例: アグロのショルダー −54% は出品3件)。上の「唯一の装備」は調律の材料として買われるので、刻印に関係なく値段が付く\n- 唯一の装備は**調律の材料**でもある(調律石は週3個)。自分で調律に使う予定がなければ売る\n\n**アリエルで買ってワールドマーケットで売る・アリエルで作って売る(11/22 昼の値段で計算)**\nワールドマーケットでは全サーバーの**一番安い出品から**売れていくので、他鯖の「真ん中の値段」だけでなく「**2番目に安い値段**」でも利益を出した(こちらのほうが現実に近い)。手数料はワールド 20%、アリエル 10%。\n\n① アリエルで買ってワールドマーケットで売る(利益 = 他鯖の値段 × 0.8 − アリエルの値段。装備は刻印が違うので除いた)\n| 品物 | アリエル | 他鯖 2番目に安い / 真ん中 | 利益(2番目 / 真ん中) | 判断 |\n|---|---|---|---|---|\n| **封印された深淵の波の翼** | 4,389万(5件) | 6,350万 / 7,788万 | **+691万 / +1,842万** | 一番大きい。ただし元手が大きく、出品5件だけ |\n| 名画：監視者カイラ | 1,450万(5件) | 1,950万 / 2,000万 | +110万 / +150万 | 小さめに確実 |\n| 名画：東のネイケル・腐ったクタル | 60万(7〜8件) | 100万〜110万 / 130万〜155万 | +20〜28万 / +44〜64万 | 小さめに確実 |\n| 森の中のささやき(外形：ネックレス) | 70万 | 100万 / 126万 | +10万 / +30万 | 小さい |\n| 名画：深淵のルドラ・上級魔石・怒りの自我・煌めく素材・封印された翼 | | | 2番目で計算すると**赤字**、真ん中なら +3〜400万 | 転売には向かない(自分で使うなら安い) |\n- 1日に出せるのは10件。韓国では「ワールドマーケットのほうが安いことが多い」ので、始まると他鯖の値段も下がる見込み。**転売は「2番目に安い値段」でも黒字の物だけ**にする\n\n② アリエルの素材で作って売る(費用 = 失敗も含めた期待値。Aion2Market の計算)\n| 品物 | 作る費用 | アリエルで売る(× 0.9) | ワールドで売る(真ん中 / 2番目) | 判断 |\n|---|---|---|---|---|\n| **達人の光るオリハルコンのブーツ** | 812万 | 1,200万(6件)→ **+268万** | +276万 / −140万 | **一番よい**。アリエルは他鯖より安いので、11/25 のあとも値段が下がりにくい |\n| **達人の光るオリハルコンのマント** | 730万 | 1,000万(17件)→ **+170万** | +110万 / −114万 | よい。出品が多い(売れている) |\n| **達人の光るサファイアのリング** | 562万 | 760万(22件)→ **+122万** | +6万 / −42万 | よい。自分のリングを作るついでにも |\n| 達人の光るオリハルコンのグローブ | 730万 | 950万(3件)→ +125万 | +18万 / −98万 | まあまあ |\n| 達人の光るオリハルコンのゲートル・ショルダー・プレート・ヘルム | 812万〜1,206万 | → +133〜260万 | 赤字〜+2万 | **アリエルが他鯖より高い**ので、11/25 のあとは値段が下がる見込み。作って売るなら **11/25 より前に売り切る** |\n| 武器(ロングソード・ガーダー・ボウ・ワンドなど)、ネックレス、イヤリング | | 赤字〜+29万 | 赤字 | 作って売るのは損 |\n- 利益は**アリエルの取引所(手数料 10%)で売るほうが大きい**物がほとんど。ワールドマーケットは手数料が高く、他鯖のもっと安い出品と競う\n- 製作には達人の段の技能が要る。作る費用は外れ(光らない物)を売る分を入れていないので、実際はもう少し得\n- 値段は 11/22 昼(日本時間)の取引所のデータ。作る前に相場ボードの「作るか買うか」で今の値段を見る\n\n**11/20 19:09 の相場(かっこは 11/8)**\n| 区分 | 品物 | 値段と動き | 判断 |\n|---|---|---|---|\n| **売り時** | **怒りの思念** | **340万**(235万)。7日で +13%、3日で −9%。他鯖より +30% | 持っていれば今売る。下がり始めた |\n| 待つ | 怒りの意志 | 168万(155万)。7日で −21%、3日で −12%。他鯖とほぼ同じ | 下がっている途中。買うのは待つ |\n| 待つ | 怒りの自我 | 375万(319万)。3日で −6%。他鯖より −22% | 他鯖より安いが、まだ下がっている。急がなければ待つ |\n| 安め | 煌めく素材 6種 | 72〜83万(74〜77万)。他鯖より −15〜−27%。7日で −1〜−15% | ほぼ横ばいで他鯖より安いまま。**使う時に買えばよい**(製作を急がないので、今まとめ買いはしない) |\n| 上がった | 達人の最上級精錬石 | **16万**(12万)。7日で +35% | 要るなら少しずつ |\n| 高い | 達人の精錬石 | 19.5万(20万)。他鯖より +31% | 買わない。持っていれば売り候補 |\n| 安くなった | 職人の精錬石 | 2.45万(4.4万)。3日で −30% | 要るなら買ってよい |\n\n**作るか買うか(11/20)**\n| 品物 | 作る | 取引所 | 判断 |\n|---|---|---|---|\n| 達人の光るロングソード | 1,420万 | **1,200万**(1,280万) | 買う(差 約220万) |\n| 達人の光るガーダー | 1,350万 | **1,089万**(1,400万) | **買う**(11/8 は「どちらでも」→ 取引所が約310万下がった。差 約260万) |\n| 達人の光るリング | **550万** | 750万(900万) | 作る(差 約200万。11/8 の 約340万から縮んだ) |\n| 達人の光るネックレス | **962万** | 1,500万(940万) | 作る(差 約540万)。ただし出品が1件だけで、取引所の値段はあてにならない |\n- 製作の段を上げる(IL62 から上)のは、シーズン2の素材が出るまで待つ方針。上の表は「金の材料(達人の光る〇〇)をどう手に入れるか」の目安\n\n**相場ボードの予想の当たり(11/11〜11/20 のログ 1,389件。今の式だけ)**: 当たり **48%**。「いつも一番多い動き(下がる)と答える」だけで 52% なので、**今の式は何もしないより少し悪い**。自鯖の3日の動きとの相関は −0.03 でほぼなし。一方、**先行鯖の3日の動きとの相関が 0.85** と強く出た(10/24〜11/4 は −0.17 199万(10/27) | 1,100万(10/27) | 買う(10/30 からボードに出ていない) |\n- 光る装備は25%なので「各段階を4回作って光る物を1つ作り、次の段階へ」で計算。成功率(約94%)と外れの売値は入れていない\n- 11/6 のロングソード・ガーダーの「作る」が高かったのは、煌めくオリハルコン鉱石が1件 180万しかなかったため。11/8 は出品が戻り、元の水準になった\n\n---\n\n## 3. ロングソード・ガーダーを IL102 まで作る\n\n### 3-1. 段階\n| 段階 | IL | 天族の名前 | 作り方 |\n|---|---|---|---|\n| ① 金の材料 | 44 | 達人の光るオリハルコンのロングソード | 通常製作(白→緑→青→金、各25%で光る) |\n| ② | 62 | 真龍王 | 通常製作(**失敗あり**)。25%で③に直接。**11/4 から100%成功の新しいレシピもある**(アップデート情報 11/4。要る素材は未確認) |\n| ③ | 70 | 光る真龍王 | 継承製作(必ず成功) |\n| ④ | 78 | 白龍王 | 継承製作。①がもう1本要る。25%で⑤に直接 |\n| ⑤ | 86 | 光る白龍王 | 継承製作 |\n| ⑥ | 94 | 冥龍王 | 継承製作。①がもう1本要る。25%で⑦に直接 |\n| ⑦ | 102 | 光る冥龍王 | 継承製作 |\n- 継承製作の物は拘束されて売れない。強化値と刻印は引き継がれる(賢者の石の枠と魔石は消える)\n- ロングソードとガーダーは素材も個数も同じ(AION2 Hub)\n\n### 3-2. 素材と費用(1本分。10/24 のアリエルの値段で計算。古い。11/8 の値段では計算し直していない)\n| 段階 | 素材 | 費用 |\n|---|---|---|\n| ② IL62 | ①、達人の最上級精錬石4、精錬された分厚い龍族の角22、**怒りの思念10**、煌めくオリハルコン鉱石9、煌めくオード5 | 約4,860万(10/14 は約2,670万) |\n| ③ IL70 に上げる | 分厚い角11、怒りの思念4 | 約830万 |\n| ④ IL78 | ①、精錬石5、硬い角29、思念3、**怒りの意志15**、鉱石12、オード7 | 約4,900万 |\n| ⑤ IL86 に上げる | 硬い角15、意志5、鉱石1、オード2 | 約640万 |\n| ⑥ IL94 | ①、精錬石6、堅固な角41、思念3、意志3、**怒りの自我20**、鉱石15、オード9 | **約9,130万**(うち自我が 4,400万) |\n| ⑦ IL102 に上げる | 精錬石2、堅固な角21、自我7、鉱石2、オード3 | 約2,130万 |\n| **合計** | | **コンボなし 約2.25億 / 全部コンボ 約1.9億**(10/14 は 2.1億 / 1.7億) |\n\n- ①は取引所の 1,550万で計算。ガーダーは①が 1,690万なので、1段ごとに約140万高い\n- 角は 精髄2個+ハンマー(NPC)でも作れる(堅固な角なら約7万)\n- **⑤(光る白龍王 IL86)から次の⑥へは約9,130万(10/24)→ 10/30 の概算は約9,300万**。⑥で光らなければ⑦にさらに約2,130万\n- 10/25 の値段で⑥を概算し直すと **約9,800万**(自我20個が 4,400万→5,080万、意志3個 +100万、煌めくオリハルコン鉱石15個 −120万、角 −30万)。煌めく素材は下がったが、自我の値上がりのほうが大きい\n- 10/27 の値段で⑥を概算し直すと **約9,700万**(自我20個 +480万、煌めくオリハルコン鉱石15個 −255万、オード9個 −153万、堅固な角41個 −86万、意志3個 −60万)。煌めく素材の値下がりと自我の値上がりがほぼ打ち消し合った\n- **10/30 の値段で⑥を概算し直すと 約9,300万**(自我20個 −760万、煌めくオリハルコン鉱石15個 +270万、オード9個 +153万、①の値下がり −60万、意志・思念・角 ±数十万)。自我の値下がりが煌めく素材の値上がりより大きかった\n- 費用の中心は怒りの自我(20〜27個)と煌めく素材。どちらも今は高いので、**⑥は急がず、怒りの素材と煌めく素材が下がってから**が安い\n- 参考: Soulgrot のサーバーでは IL86 のロングソードが合計 6,000万〜7,000万、リングは 3,000万〜4,000万(10/18)\n\n### 3-3. リング・ネックレス(IL62 の真龍王。10/24〜10/30 の値段)\n| 品物 | 素材(①以外) | 作る | 取引所 | 判断 |\n|---|---|---|---|---|\n| リング | 達人の最上級精錬石2、強化された分厚い龍族の鱗8、**怒りの思念4**、煌めくサファイアの原石3、煌めくオード2 | 約1,960万 | 2,100万 | **作るほうが少し安い**。25%で光る(3,300万相当) |\n| ネックレス | 精錬石3、分厚い鱗14、**怒りの思念6**、煌めくルビーの原石6、煌めくオード2 | 約3,320万 | 出品なし | 作るしかない |\n- どちらも費用の半分以上が怒りの思念。思念が下がるのを待つと安くなる\n- 10/27 の概算: 煌めく素材が下がった分で リング 約1,880万(サファイア3個 −42万、オード2個 −36万)、ネックレス 約3,190万(ルビー6個 −90万、オード2個 −36万)\n- **10/30 の概算**: リング 約1,850万(煌めく素材 +85万、思念 −32万、①を作って 611万にすると −89万)、ネックレス 約2,950万(ルビー +156万・オード +34万、思念 −48万、①の値下がり −400万)。(10/30。ルドラの前の判断)煌めく素材はルドラ前に上がっているので、素材を先に揃えるなら早めに\n\n---\n\n## 4. 何を作るか・作り方のコツ\n| 項目 | 内容 |\n|---|---|\n| 作る順 | **ロングソード → ガーダー → リング**(Soulgrot・JOHNPAL)。ロングソードは刻印5行で戦闘速度が付き、一番強い。防具はダンジョン装備で十分 |\n| 安く済ませる | 細工(リング)が一番安い |\n| 成功率 | 熟練度で上がり、約94.6% で止まる。**高い製作は熟練度50まで上げてから**。熟練度は一番安い物(オリハルコンのインゴットなど)で上げる。「10個まとめて作る」は経験値が少ない |\n| 絞る | 製作は1種類に絞る。テンプラーのロングソードとガーダーは鍛冶 |\n| 素材 | オードは物質変換でほかの採集素材に替えられる(ただし変換した物は拘束されて売れない) |\n| 失敗作 | 捨てずに補給依頼へ(アビスポイントと強化石) |\n| 上位素材 | 怒りの素材は遠征で出る。遠征で出る物は拘束なしなので、サブキャラで集めてメインへ。**ルドラ・「難しい」から出る物は刻印で売れない**(11/11) |\n\n---\n\n## 5. 売り買いのコツ\n| コツ | 内容 |\n|---|---|\n| 小分けに売る | 高い物は小分けに、少し高めで待つ。出品が急に増えた物は値下げ競争になりやすい |\n| まとめ買い・1個売り | まとめ売りを買って1個ずつ出すと高く売れる(急ぐ人は1個で買う) |\n| 合計金額の並び | 一覧は合計金額順。大量に買う人は1個の値段を見ていないことがある |\n| 手数料 | 売れたら10%。出品の登録手数料は付け直すと戻らない |\n| 時間帯 | アリエルでは「朝は安い・夕方に売れる」ははっきりしなかった(10/14 に検証) |\n| 出品枠 | 10個まで |\n\n### 取引所の仕組み\n- 取引所とギーナ・キューナの交換所は**メンバーシップ会員だけ**(買う場合。売るのは無料のアカウントでもできるという話もある。CrusherX、画面では未確認)\n- ギーナ → キューナ: 物質変換で「ギーナの箱」(10%余計にかかる)を作り、交換所に出す\n- 現金で買ったキューナは72時間たつまで交換所で使えない\n- 拘束のギーナは取引所で使えない(登録手数料には使える)\n- 取引所はサーバーごと。ほかのサーバーからは買えない\n\n### 先行鯖(シエル・ネザカン・バイゼル)との関係(10/14 に検証)\n- 全部の品物が数日遅れで同じ動きをするわけではない。パッチで動く物は全サーバーが同じ日に動く\n- 「進むほど欲しくなる素材」(怒りの自我・意志)は、先行鯖が数日先に動く傾向。相場ボードの「数日の予想」は前はこれを使っていたが、**11/4 に「自鯖の3日の動き × −0.6」の式に変えた**\n\n---\n\n## 6. 注意\n- 最安出品価格なので、実際に売れた値段とは違うことがある。アリエル鯖は売れた数のデータがない\n- 出品が数件しかない品物は、1人が出すだけで大きく動く\n- パッチで価値が急に変わることがある(韓国版で何度も起きた)\n- 相場ボードの「予想の当たり外れ」: **11/8 の答え合わせで、新しい式は 232件のうち当たり 50%**(何も考えずに一番多い動きを答えると 44%、旧式は 33%)。記録が少ないので、まだ確かとは言えない\n- IL62 のリング・ネックレスのレシピは 10/14 に AION2 Hub で見た物。ロングソードのレシピは 10/14 にグローバル版のデータで確かめ直した\n\n## 7. 出典\n| 出典 | 中身 |\n|---|---|\n| 相場ボード(Aion2Market のデータ) | 10/24 19:09・11/8 9:09・11/12 9:09 の値段、3日・7日の変化、他鯖との差、作るか買うか |\n| AION2 Hub https://aion2hub.com/tools/crafting-calculator | 製作のレシピ |\n| Soulgrot(10/18)、JOHNPAL(10/17)、Moxsy(10/19) | 作る順、費用の目安、サブキャラ |\n| Aragon・Soulgrot(10/22) | 10/21 パッチの報酬 |\n| Arthars(11/18、6万回) | シーズン2の前に製作を急がない(アップデート情報) |\n| 以前の出典(Screamheart、Sen Evades、GAC Film Room、StingKnight、MrRosaPony、Nellan97、Duxar ほか) | `_古い版/` の各まとめ |\n"},{"id":"terms","tab":"用語","title":"用語対応表","file":"用語対応表.md","md":"# 用語対応表(英語 → アジアサーバーの日本語名)\n\n- 作成: 2026-10-14。reports/ のまとめは、この表で日本語名に置き換えた\n- スキル名は questlog.gg の日本語版データを優先し、Game8(https://game8.jp/aion2/822198)の表記も使う。職業のスキル名の対応は各職業のまとめにある: テンプラーは [テンプラー_まとめ.md](1_テンプラー/テンプラー_まとめ.md) の14章、レンジャー・チャンターは 13章、クレリックは 12章(`5_ほかの職業/`)\n- 出典の略称:\n  - wikiA = VIPでAion2 Wiki(https://wikiwiki.jp/vipdeaion2/)\n  - wikiB = AION2攻略wiki(https://wikiwiki.jp/gget/AION2%E6%94%BB%E7%95%A5wiki)\n  - 動画 = 日本の投稿者の YouTube(NAHAKU、selegames など)。字幕は自動文字起こしなので、聞き間違いの可能性がある\n\n## 1. 確認できた名前\n\n### 通貨・課金\n| 英語 | 日本語 | 出典 |\n|---|---|---|\n| Kinah | ギーナ | wikiA、動画 |\n| Quna | キューナ | wikiA |\n| Membership | クァイリン特級メンバーシップ(メンバーシップ) | wikiA |\n| Wind Breeze Merchant | そよ風商会 | wikiA |\n| Quna Exchange | キューナ交換所 | wikiA |\n| Battle Pass / Daeva Pass | ディーヴァパス | wikiA |\n| Call of the World(英語圏では Planet\u0027s Call とも) | 世界の呼びかけ | wikiA |\n| Mercenaries of Ischalgen | イスハルゲンの傭兵 | wikiA |\n| Resurrection Spirit Stone | 復活の精霊石 | wikiA |\n\n### ダンジョン・コンテンツ\n| 英語 | 日本語 | 出典 |\n|---|---|---|\n| Expedition / Exploration / Conquest | 遠征 / 探険 / 征服 | wikiA |\n| Kraocave | クラオ洞窟 | wikiA |\n| Dropnir | ドラウプニル | wikiA |\n| Uruguru Canyon | ウルググ峡谷 | wikiA |\n| Vakron Sky Island | バクロンの空中島 | wikiA |\n| Fire Temple | 炎の神殿 | wikiA |\n| Ferocious Horn Den | 獰猛な角岩窟 | wikiA |\n| Transcendence | 超越(ステージ → 「〇段階目」) | wikiA、動画 |\n| Shattered Arkanis / Deus Research Base | 砕けたアルカニス / デウス研究基地 | wikiA |\n| Nightmare / Ascension Trial | 悪夢 / 覚醒戦 | wikiA |\n| Sanctuary(Ludra) | 聖域(ルドラ) | wikiA、動画 |\n| Shugo Festival | シューゴフェスタ | wikiA |\n| Space-Time Rift | 時空の亀裂 | wikiA、動画 |\n| Supply Request | アビス補給依頼(補給依頼) | wikiA |\n| Pity reward | 天井(確定報酬) | 動画 |\n| Gear Change Voucher | 装備変更券 | 動画 |\n| Kromede(炎の神殿の武器) | クロメデ | wikiB |\n\n### システム\n| 英語 | 日本語 | 出典 |\n|---|---|---|\n| Daevanion | ディーヴァニオン | wikiA |\n| Pantheon | 万神殿 | wikiA |\n| Substance Morph | 物質変換 | wikiA |\n| Essence Extraction(採集) | 精気抽出 | wikiA |\n| Soul Binding | 魂刻印 | wikiA、wikiB |\n| Soul Codex | 魂の書 | wikiA |\n| Reset Book | 初期化の書 | 動画 |\n| Transfer / Transfer Crafting | 継承 / 継承製作 | wikiB、動画 |\n| Mana Stone / Soul Stone / Theostone | 魔石 / 霊石 / 神石 | wikiA |\n| Enhancement Stone | 強化石 | wikiA |\n| Amplify(星強化) | 突破強化 | wikiA |\n| Amplify Stone | 突破石 | 動画 |\n| Silentium | シーレンティウム | wikiA、動画 |\n| Odyle Energy | オードエネルギー | wikiA |\n\n### アルカナ\n| 英語 | 日本語 | 出典 |\n|---|---|---|\n| Chalice / Parchment / Compass / Bell / Mirror | 聖杯 / 羊皮紙 / コンパス / 鐘 / 鏡 | wikiA |\n| Primal Vigor / Magic Armor(セット) | 活力 / 魔力 | wikiA |\n| Mysterious Crystal | 神秘的な結晶 | wikiA |\n| Transmute / Extract | 錬成 / 抽出 | wikiA |\n| God stats | 時間・空間・生命・運命・自由・死・正義・破壊・幻想・知恵 | wikiA |\n\n### 製作・採集\n| 英語 | 日本語 | 出典 |\n|---|---|---|\n| Blacksmithing / Armorsmithing / Handicrafting / Alchemy / Cooking | 鍛冶 / 防具製作 / 細工 / 錬金 / 料理 | wikiA |\n| Splendid / Splendent(コンボで出る上位品) | 光る〇〇 | wikiB、動画 |\n| 白→緑→青の名前 | 職人の(緑)/ 達人の(青)。英語は questlog.gg で Artisan\u0027s Ultimate Refining Stone = 達人の最上級精錬石(10/21)なので **Artisan\u0027s = 達人の**(以前の「Artisan\u0027s = 職人の」は誤り)。Expert\u0027s = 職人の かは要確認 | wikiB、questlog.gg |\n| Artisan\u0027s Ultimate Refining Stone | 達人の最上級精錬石 | questlog.gg(10/21) |\n| 精錬石の名前 | 精錬石 / 職人の精錬石 / 達人の精錬石(相場と製作のまとめの名前)。英語名と色との対応は要確認 | 相場 |\n| Dragon Lord の段の名前 | True=真龍王(通常製作の最後の金)、White=白龍王、Star=乾龍王、Dark=黒龍王、Wise=冥龍王、Ebony=闇龍王(10/21 questlog.gg で英日 | 黒雲商人 |\n| 悪夢のボス名(ジケル以外) | ピノピ、フェルク、ノトゥン、ジゼル、ジェロッドなど(カタカナ読み) |\n| Guardian of Altgard / Saint of Altgard / Through Hell and Back(称号) | 英語のまま(日本語名は未確認) |\n| Dark Veil Wings(翼) | **闇の帳の翼**(questlog.gg の日本語データ 11/22。封印された物は「封印された闇の帳の翼」) |\n| Gemstone(Fine / Pure / Radiant) | ルビーの原石、高純度の / 純粋な / 煌めくルビーの原石(サファイア・ダイヤモンドも同じ形) |\n| Aria / Azpha / Calendula / Targena(採集の草) | アンゼリカ / アンヌス / カレンドラ / タラゴン |\n| Enhanced Balaur Scale / Tanned Balaur Leather | 強化された分厚い・硬い・堅固な龍族の鱗 / なめした分厚い・硬い・堅固な龍族の皮 |\n| 名前の確かめ方 | questlog.gg の API `database.getItem`(id=Aion2Market の item_key、language=ja)で正式名が取れる |\n"}]};
const DOCS = GUIDE.docs;
const $ = s => document.querySelector(s);
const tabsEl = $('.tabs'), docEl = $('.doc'), tocEl = $('.toc'), sideEl = $('.side'), resEl = $('.results'), qEl = $('#q');
const newNav = $('.newnav'), wide = matchMedia('(min-width: 980px)');
let current = null;

$('#built').textContent = GUIDE.built ? '(更新: ' + GUIDE.built + ')' : '';

// Map a markdown link target or code span (a local .md/.html path) to one of the tabs.
function docForPath(p) {
  if (!p) return null;
  let s = p.replace(/^<|>$/g, '');
  try { s = decodeURIComponent(s); } catch (e) {}
  const base = s.split(/[\\/]/).pop();
  if (/\.html$/.test(base)) return DOCS.find(d => d.id === 'pet') || null;
  return DOCS.find(d => d.file === base) || null;
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(md) {
  if (window.marked) return marked.parse(md, { gfm: true });
  return '<pre style="white-space:pre-wrap">' + esc(md) + '</pre>';
}

function show(id, headingIndex) {
  const d = DOCS.find(x => x.id === id) || DOCS[0];
  current = d.id;
  for (const b of tabsEl.children) b.setAttribute('aria-selected', b.dataset.id === d.id ? 'true' : 'false');
  resEl.hidden = true; docEl.hidden = false; sideEl.hidden = false;
  docEl.innerHTML = render(d.md);

  // Headings get stable ids in document order; the search uses the same order.
  const hs = docEl.querySelectorAll('h1, h2, h3, h4');
  hs.forEach((h, i) => { h.id = d.id + '-' + i; if (h.tagName === 'H2' && /結論|今の|まず/.test(h.textContent)) h.classList.add('key'); });
  tocEl.innerHTML = '';
  docEl.querySelectorAll('h2, h3').forEach(h => {
    const a = document.createElement('a'); a.href = '#' + d.id + '/' + h.id.split('-').pop();
    if (h.tagName === 'H3') a.className = 'sub';
    a.dataset.target = h.id;
    a.textContent = h.textContent.replace(/[((].*?[))]/g, '').trim(); tocEl.appendChild(a);
  });
  $('.tocbox').open = wide.matches;

  // Source lists are long and rarely read: fold everything under a 出典 heading.
  docEl.querySelectorAll('h2').forEach(h => {
    if (!/出典/.test(h.textContent)) return;
    const box = document.createElement('details'); box.className = 'fold';
    box.innerHTML = '<summary>出典の表を開く</summary>';
    while (h.nextElementSibling && h.nextElementSibling.tagName !== 'H2') box.appendChild(h.nextElementSibling);
    h.after(box);
  });

  // Wide tables scroll inside their own box instead of widening the page.
  docEl.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.appendChild(t); });

  // Links and code spans that point at another note become tab switches.
  docEl.querySelectorAll('a[href]').forEach(a => {
    const target = docForPath(a.getAttribute('href'));
    if (target && !/^https?:/.test(a.getAttribute('href'))) { a.href = '#' + target.id; a.classList.add('tab-link'); }
    else if (/^https?:/.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  docEl.querySelectorAll('code').forEach(c => {
    const target = /\.(md|html)$/.test(c.textContent) ? docForPath(c.textContent) : null;
    if (target) { const a = document.createElement('a'); a.href = '#' + target.id; a.className = 'tab-link'; a.textContent = target.title; c.replaceWith(a); }
  });

  const nNew = markNew(docEl);
  newNav.hidden = !nNew; $('.newcount').textContent = nNew;
  try { localStorage.setItem('guide-tab', d.id); } catch (e) {}

  if (headingIndex != null) {
    const h = document.getElementById(d.id + '-' + headingIndex);
    if (h) {
      const fold = h.closest('details.fold'); if (fold) fold.open = true;
      h.scrollIntoView({ block: 'start' }); h.classList.add('flash'); spy(); return;
    }
  }
  window.scrollTo({ top: 0 });
  spy();
}

// Highlight the chapter being read in the side list.
function spy() {
  if (docEl.hidden) return;
  let here = null;
  for (const a of tocEl.children) {
    const h = document.getElementById(a.dataset.target);
    if (h && h.getBoundingClientRect().top < 140) here = a;
  }
  for (const a of tocEl.children) a.classList.toggle('here', a === here);
  if (here && wide.matches) {
    const r = here.getBoundingClientRect(), s = sideEl.getBoundingClientRect();
    if (r.top < s.top || r.bottom > s.bottom) here.scrollIntoView({ block: 'nearest' });
  }
}

// Jump to the next "new" mark below the current position, wrapping to the first one.
$('.newnext').addEventListener('click', () => {
  const marks = [...docEl.querySelectorAll('.new')];
  if (!marks.length) return;
  const next = marks.find(m => m.getBoundingClientRect().top > 150) || marks[0];
  const fold = next.closest('details.fold'); if (fold) fold.open = true;
  next.scrollIntoView({ block: 'center' });
  next.classList.remove('flash'); void next.offsetWidth; next.classList.add('flash');
});

// Text size, remembered per browser.
function setFs(v) {
  document.documentElement.style.setProperty('--fs', v);
  for (const b of document.querySelectorAll('.fs button')) b.setAttribute('aria-pressed', b.dataset.fs === v ? 'true' : 'false');
}
document.querySelectorAll('.fs button').forEach(b => b.addEventListener('click', () => {
  setFs(b.dataset.fs); try { localStorage.setItem('guide-fs', b.dataset.fs); } catch (e) {}
}));
let savedFs = null; try { savedFs = localStorage.getItem('guide-fs'); } catch (e) {}
setFs(savedFs || '16px');

// On narrow screens the chapter list folds away after a pick.
tocEl.addEventListener('click', () => { if (!wide.matches) $('.tocbox').open = false; });
wide.addEventListener('change', () => { $('.tocbox').open = wide.matches; });

// Wrap dates like "(10/25" or "10/25 追加" written on the build day or the day before.
// Returns how many were marked.
function markNew(root) {
  const bm = (GUIDE.built || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!bm) return 0;
  const built = Date.UTC(+bm[1], +bm[2] - 1, +bm[3]);
  const isNew = (mo, da) => { const t = Date.UTC(+bm[1], mo - 1, da); return t <= built && built - t <= 864e5; };
  const re = /(\d{1,2})\/(\d{1,2})(?: ?追加)?/g;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; for (let n; (n = walker.nextNode());) { re.lastIndex = 0; if (re.test(n.nodeValue)) nodes.push(n); }
  let count = 0;
  for (const n of nodes) {
    re.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while ((m = re.exec(n.nodeValue))) {
      if (!isNew(+m[1], +m[2])) continue;
      frag.append(n.nodeValue.slice(last, m.index));
      const s = document.createElement('span'); s.className = 'new'; s.textContent = m[0]; frag.append(s);
      last = m.index + m[0].length; count++;
    }
    if (last) { frag.append(n.nodeValue.slice(last)); n.replaceWith(frag); }
  }
  return count;
}

function route() {
  const m = location.hash.slice(1).split('/');
  if (qEl.value.trim()) { qEl.value = ''; }
  // Without a link to a tab, reopen the tab read last time.
  let last = null; if (!m[0]) { try { last = localStorage.getItem('guide-tab'); } catch (e) {} }
  show(m[0] || last || DOCS[0].id, m[1] != null ? Number(m[1]) : null);
}

const topBtn = $('.totop');
topBtn.addEventListener('click', () => window.scrollTo({ top: 0 }));
let spyFrame = 0;
window.addEventListener('scroll', () => {
  topBtn.hidden = window.scrollY < 800;
  if (!spyFrame) spyFrame = requestAnimationFrame(() => { spyFrame = 0; spy(); });
}, { passive: true });

// Search: every line of every note, grouped under the heading it belongs to.
function search(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) { show(current || DOCS[0].id); return; }
  docEl.hidden = true; sideEl.hidden = true; newNav.hidden = true; resEl.hidden = false;
  const hits = [];
  for (const d of DOCS) {
    let hIndex = -1, hText = d.title;
    for (const line of d.md.split('\n')) {
      const hm = line.match(/^(#{1,4})\s+(.*)/);
      if (hm) { hIndex++; hText = hm[2]; }
      const low = line.toLowerCase();
      if (words.every(w => low.includes(w))) hits.push({ d, hIndex, hText, line });
      if (hits.length > 200) break;
    }
  }
  if (!hits.length) { resEl.innerHTML = '<p class="none">見つかりませんでした</p>'; return; }
  const re = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  resEl.innerHTML = '<p class="none">' + hits.length + '件</p>' + hits.slice(0, 120).map(h => {
    const plain = h.line.replace(/<!--.*?-->/g, '').replace(/[*`#>|]/g, ' ').replace(/\s+/g, ' ').trim();
    const snip = esc(plain.length > 160 ? plain.slice(0, 160) + '…' : plain).replace(re, '<mark>$1</mark>');
    const where = esc(h.d.title + (h.hIndex >= 0 ? ' › ' + h.hText.replace(/[*`]/g, '') : ''));
    return '<a class="hit" href="#' + h.d.id + (h.hIndex >= 0 ? '/' + h.hIndex : '') + '"><div class="where">' + where + '</div><div class="snip">' + snip + '</div></a>';
  }).join('');
}

for (const d of DOCS) {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.id = d.id; b.textContent = d.tab;
  b.addEventListener('click', () => { if (location.hash === '#' + d.id) route(); else location.hash = d.id; });
  tabsEl.appendChild(b);
}
let timer;
qEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => search(qEl.value.trim()), 150); });
window.addEventListener('hashchange', route);
route();
</script>
