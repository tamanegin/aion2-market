<style>
/* Same dark palette as the market board so the two pages feel like one site. */
:root {
  --bg: #0f131b; --panel: #171c27; --panel2: #1e2432; --fg: #e9ecf3; --muted: #97a0b5; --line: #2a3142;
  --accent: #7fa2ff; --gold: #f0b84a; --gold-bg: #2e2716; --mark: #5a4a12;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: var(--fs, 16px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: .9375rem/1.75 var(--font); }
a { color: var(--accent); }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 16px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.site { display: flex; gap: 6px; margin-bottom: 14px; }
.site a { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; font-size: .9rem; }
.site a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #0f131b; font-weight: 700; }
h1.title { margin: 0; font-size: 1.6rem; letter-spacing: .03em; }
.lead { margin: 4px 0 14px; color: var(--muted); font-size: .9rem; }

/* Sticky bar: tabs + search */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tabs button { flex: none; font: inherit; font-size: .9rem; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--panel2); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.search { display: flex; gap: 8px; align-items: center; }
.fs { display: flex; flex: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.fs button { font: inherit; font-size: .8rem; color: var(--muted); background: var(--panel); border: 0; padding: 8px 10px; cursor: pointer; }
.fs button[aria-pressed="true"] { background: var(--panel2); color: var(--accent); font-weight: 700; }
.search input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 0; }

/* Two columns on wide screens: chapter list on the left, the note on the right */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 28px; }
.layout > main { min-width: 0; }
.tocbox { margin: 12px 0 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.tocbox > summary { cursor: pointer; padding: 8px 12px; font-size: .85rem; font-weight: 700; color: var(--muted); }
.toc { display: grid; padding: 0 6px 8px; }
.toc a { display: block; font-size: .82rem; line-height: 1.45; text-decoration: none; color: var(--muted); padding: 4px 8px; border-left: 2px solid transparent; border-radius: 0 4px 4px 0; }
.toc a.sub { padding-left: 20px; font-size: .76rem; }
.toc a:hover { color: var(--fg); background: var(--panel2); }
.toc a.here { color: var(--accent); border-left-color: var(--accent); background: var(--panel2); font-weight: 600; }
@media (min-width: 980px) {
  .layout { grid-template-columns: 250px minmax(0, 1fr); }
  .side { position: sticky; top: 112px; align-self: start; max-height: calc(100vh - 124px); overflow-y: auto; scrollbar-width: thin; }
  .tocbox > summary { pointer-events: none; list-style: none; }
}

/* "Recently added" counter with a jump button */
.newnav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0 0; font-size: .85rem; color: var(--muted); }
.newnav button { font: inherit; font-size: .8rem; color: var(--gold); background: var(--gold-bg); border: 1px solid var(--gold); border-radius: 999px; padding: 3px 12px; cursor: pointer; }

/* Sources and other long reference sections start folded */
details.fold { margin: 8px 0 12px; }
details.fold > summary { cursor: pointer; color: var(--accent); font-size: .88rem; }

/* Rendered markdown */
.doc { margin-top: 8px; }
.doc h1 { font-size: 1.4rem; margin: 18px 0 6px; }
.doc h2 { font-size: 1.15rem; margin: 30px 0 10px; padding: 6px 12px; background: var(--panel); border-left: 4px solid var(--accent); border-radius: 4px; scroll-margin-top: 110px; }
.doc h2.key { border-left-color: var(--gold); background: var(--gold-bg); color: var(--gold); }
.doc h3 { font-size: 1rem; margin: 20px 0 8px; color: var(--accent); scroll-margin-top: 110px; }
.doc h4 { margin: 14px 0 6px; scroll-margin-top: 110px; }
.doc p, .doc li { overflow-wrap: anywhere; }
.doc ul, .doc ol { padding-left: 1.3em; }
.doc li { margin: 2px 0; }
.doc code { background: var(--panel2); border-radius: 4px; padding: 0 4px; font-size: .88em; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
.doc strong { color: #fff; }
.tw { overflow-x: auto; margin: 8px 0 12px; border: 1px solid var(--line); border-radius: 8px; }
.doc table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.doc th, .doc td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 6em; }
.doc th { background: var(--panel2); color: var(--muted); font-weight: 600; white-space: nowrap; }
.doc tr:last-child td { border-bottom: 0; }
.doc tbody td { background: var(--bg); }
.doc tbody tr:nth-child(even) td { background: #131822; }
/* Keep the first column (the row's name) in view while a wide table scrolls sideways */
.doc th:first-child, .doc td:first-child { position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--line); }
.doc td:first-child { font-weight: 600; }
.doc tbody tr:hover td { background: #1a2030; }
.doc a.tab-link { cursor: pointer; }

/* Search results */
.results { margin-top: 14px; display: grid; gap: 8px; }
.results .none { color: var(--muted); }
.hit { display: block; text-decoration: none; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.hit:hover { border-color: var(--accent); }
.hit .where { font-size: .8rem; color: var(--accent); }
.hit .snip { font-size: .88rem; overflow-wrap: anywhere; }
mark { background: var(--mark); color: #fff; border-radius: 2px; padding: 0 1px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--mark); } }
.foot { margin-top: 40px; color: var(--muted); font-size: .8rem; }
/* Dates written in the notes that fall within a few days of the build get a "new" mark */
.new { background: var(--gold-bg); color: var(--gold); border-radius: 4px; padding: 0 4px; font-weight: 600; }
.new::before { content: "新 "; font-size: .78em; }
.totop { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 6; font: inherit; font-size: .85rem; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
.totop:hover, .totop:focus-visible { border-color: var(--accent); outline: none; }
</style>

const GUIDE = {"built":"2026-10-31 18:21","docs":[{"id":"home","tab":"はじめに","title":"目次と最近の変更","file":"00_目次.md","md":"# AION2 まとめの目次(2026-10-31 更新)\n\n同じ話をしていたまとめを、テーマごとに1本ずつにまとめ直し(10/24)、その後の情報を足している。迷ったら、まずこのページを開く。\n\n| テーマ | まとめ | 中身 |\n|---|---|---|\n| テンプラー | [テンプラー_まとめ](\u003c1_テンプラー/テンプラー_まとめ.md\u003e) | スキルの順番と特化、パッシブ、スティグマ、マクロと回し方、装備の刻印、アルカナで狙うスキル、種族理解度、ディーヴァニオン、狩り、翼・称号、PvP |\n| 成長 | [成長とシステムのまとめ](\u003c2_成長とシステム/成長とシステムのまとめ.md\u003e) | IL の上げ方、10/21 パッチと今後の予定、戦闘力の上げ方、日課・週課、**ギーナとアビスポイントの稼ぎ方**、悪夢、覚醒戦、強化・刻印・継承の仕組み、韓国版の今 |\n| 成長 | [アルカナのまとめ](\u003c2_成長とシステム/アルカナのまとめ.md\u003e) | 仕組み、強化の経験値表、神秘的な結晶、いらないカードは強化か抽出か |\n| 相場と製作 | [相場と製作のまとめ](\u003c3_相場と製作/相場と製作のまとめ.md\u003e) | 今買う・売る物(10/30 の相場)、作るか買うか、ロングソードを IL102 まで作る費用、リング・ネックレス、売り買いのコツ |\n| レンジャー | [レンジャー_まとめ](\u003c5_ほかの職業/レンジャー_まとめ.md\u003e) | テンプラーと同じ項目。バイゼルの権能 Lv20 と必中の矢 Lv16 が中心 |\n| チャンター | [チャンター_まとめ](\u003c5_ほかの職業/チャンター_まとめ.md\u003e) | テンプラーと同じ項目。岩撃砕 Lv16、能力値の細かい順(戦闘速度は90.5%まで) |\n| クレリック | [クレリック_まとめ](\u003c5_ほかの職業/クレリック_まとめ.md\u003e) | テンプラーと同じ項目。大地の懲罰+断罪の回し方、回復役の基本 |\n| 共通 | [用語対応表](用語対応表.md) | 英語 → アジアサーバーの日本語名 |\n\n- 相場は毎日 **相場ボード** https://tamanegin.github.io/aion2-market/ で見る(自動で更新される)\n\n## 10/31 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| **テンプラーの PvP** | 要点の表だけ | **おすすめの PvP 設定**(能力値・特化・スティグマ・マクロ)を 11-0章に。グローバル版のテンプラーの設定が土台。あとから**スキルのレベルの順番・特化の中身・マクロの細かい作り方**も足した |\n| 職業の強さの評判 | なし | クレリック・テンプラー・チャンターが一番上、レンジャーは火力が一番低いという評判(各職業の 0章) |\n| クレリックの PvP | 要点の表だけ | **スキルのレベルと特化・スティグマ・マクロ・能力値**を 10-1章に |\n| アビス | 相手のサーバーは固定 | 10/28 から組み直し。天族どうしで当たることもある(成長とシステム 0-1) |\n\n## 10/30 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| テンプラーの種族理解度 | 動画のおすすめだけ | グローバル版のテンプラー(Mosu)の実際の設定、韓国の自然ガード型・PvP 用の組(テンプラー 7章) |\n| テンプラーの PvP | 要点の表だけ | 韓国の掲示板 Inven の話(ガード型か命中型か、特化、拘束が入りにくくなった流れ)を 11-1章に。掲示板の話は未確認として分けて書く |\n| **煌めく素材** | 62万前後(10/27)。使う分なら買ってよい | **79〜89万に戻った**(全鯖で上昇、ルドラ前の需要)。アリエルは他鯖より −17%。**使う分は早めに買う**(相場と製作 0章) |\n| 達人の光るリング | 買うほうが安い | **作るほうが安い**(作る 611万、取引所 900万)。作って売っても利益が出る |\n| 怒りの素材 | 3つとも買うのは待つ | 思念・自我は下がる方向(思念は他鯖の約2倍)。意志だけ上がっている(83万) |\n| IL の上げ方 | 0-1 の表 | **アリエルのボード(結晶1個 = IL+1、10/28 から 30 の枠がもう1つ)→ アスフェルのボード → +15・突破 → 上級の魔石** の順(Spid・Soulgrot・Ashura。成長とシステム 0-1) |\n| アクセサリーの継承 | 「できない」と書いていた | **できる**(ユーザーが画面で確認。テンプラー 5-5)。製作したアクセサリーへの継承は未確認 |\n| アクセサリーの刻印 | ― | 防御の行を先に消し、命中より正確を残す(Ashura。テンプラー 5-4) |\n\n## 10/29 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| **聖域ルドラ** | 時期は未発表 | **11/4 に開始**。普通 IL2800、難しい IL3000(公式 10/23。成長とシステム 0章) |\n| IL2800 への道 | ― | 金カード5枚(+400)→ 全部位 IL86 に中級の魔石 → **ロングソードとガーダーを +15・突破 +2**(突破1段 = IL+5、+0→+1 は約60万・突破石6個)。上級の魔石は IL102 まで取っておく(成長とシステム 0-1) |\n| ショップの買う順 | ― | 4つの店(シューゴフェスタ・悪夢・アビス・シーズン)をメインとサブに分けて表に(成長とシステム 4章) |\n| 能力値の取り忘れ | ― | 征服の普通10回の像で**命中**、外見700個の称号で戦闘速度 3.5%(成長とシステム 3章) |\n\n## 10/27〜28 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| 10/28 のパッチ | ― | 遠征「難しい」にウルググ峡谷(仮)・バクロンの空中島(IL2700)、ボスを弱く、テンプラーの HP +1,500、白龍王・黒龍王の突破の上限 3→5、採集は1サーバー1日1,000回まで(成長とシステム 1-1) |\n| 装備の厳選 | 本命を1行ずつ振り直す人もいた | **IL36〜41 の唯一で良い行を2つ以上 → +15 → 継承**(約60%安い)。唯一はシュゴフェスタ・サブキャラ・野外で集める(Fubgun。テンプラー 5-5) |\n| テンプラーのマクロ | 審判の列+殲滅 | NoBS(10/27)は **審判 → 殲滅** だけ。衰弱の猛打は入れない。懲罰の執行者で命中 +200(テンプラー 4-3) |\n| 種族理解度 | Xia の4番の表 | XifanGG の残す数値の目安(唯一は上限の70%、英雄は90%)と7番(テンプラー 7章) |\n| 煌めく素材(10/27) | 他鯖とほぼ同じ | 約62万。他鯖より4〜18%安い。使う分なら買ってよい |\n\n## 10/25〜26 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| テンプラーの能力値の順 | 戦闘速度が一番、強打は最後(Xia) | **命中(必要な値まで)→ 強打 → 前方ダメージ増幅 → 攻撃力 → 戦闘速度**(Antochi)。強打はボスの強打抵抗を超えてから効くので、超えるまでは Xia の順でよい(テンプラー 5-1) |\n| 命中の目安 | 未発表 | **命中+PvE 命中 の合計で 約1,150〜1,200**(超越・遠征「難しい」)、ルドラ約1,500。足りないと前からの攻撃が受け流されてダメージ半分(韓国版の実測。テンプラー 5-2) |\n| テンプラーの懲罰 | マクロに入れる人もいた | 手で溜める(Xia・JPVariety) |\n| クレリックの審判の雷 | マクロに入れるか割れていた | **大地の懲罰 Lv20 になったらボス戦では使わない**(4人がそろった) |\n| 怒りの素材 | 遠征「難しい」で下がる見込み | アリエルでは**下がらず上がった**(意志 60万→94万、自我 220万→254万)。他鯖より高いので買うのは待つが、「待てば下がる」とは言い切れない |\n| 煌めく素材 | 他鯖より15〜70%高い | アリエルが戻り、他鯖とほぼ同じ |\n| ロングソード IL94 の費用 | 約9,130万 | 約9,800万(怒りの自我の値上がり) |\n| 相場ボード | ― | ★を付けた品を一番上に並べられる、章へのジャンプ、名前検索は全区分から |\n| 稼ぎ方(10/26) | サブキャラの話だけ | 成長とシステムのまとめ 5章に新設。ギーナは**遠征の箱(オードエネルギー)が一番の柱**、雑魚狩りの通常ギーナは1日100万まで。サブはチャンターが一番。アビスポイントは指令 → ボス → 補給依頼(別枠)→ 時空の亀裂(2倍)、回廊はキャラごと48時間に1回。サブキャラ以外は 5-7(錬金で上級の魔石、料理、拾った唯一の装備、サーバー移動の転売)。Ariel ではリングを作って売る利益は小さい |\n\n## 10/24 の見直しで変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| テンプラーのスティグマ | ボス用に挑発・保護のシールド・戦場の旗・高潔の甲冑など複数の型 | **高潔の甲冑 Lv15 と挑発は固定**、残りは破滅のシールド・戦場の旗(Lv20 から)・保護のシールド(Xia 10/19) |\n| 防御低下(衰弱の猛打・処刑の剣) | 意見が割れていた | 使わないが多数意見(Ulfhednar だけ使う) |\n| 装備の刻印 | ― | 強打は優先が最後(ボスの強打抵抗を超えるまでほぼ効かない)。防具のパッシブは激昂 |\n| 強化 | +10 で十分 | **低い IL の装備を +15 にしてから継承**すると安い |\n| 製作の費用 | ロングソード IL102 まで約2.1億(10/14) | **約2.25億**(煌めく素材の値上がり)。自分の次の段(IL94)は約9,130万 |\n| 怒りの素材 | 自我・意志は早めに確保 | **買うのは待つ**(遠征「難しい」で出るようになった。アリエルは他鯖より30〜70%高い) |\n| 金の材料 | ロングソードは作るか買うかほぼ同じ | **買う**(1,550万。10/14 の 2,400万から下がった) |\n| 遠征「難しい」 | 10/21 に追加 | IL2600、復活3回、4分で激昂。賢者の石1%、アリエルの欠片(ディーヴァニオン結晶30個まで) |\n| アルカナ | ― | IL2500(4段階目)から本格的に。+3 までは強化、残りは抽出 |\n| 用語 | Double Chance=二重攻撃 | **強打** |\n"},{"id":"templar","tab":"テンプラー","title":"テンプラー まとめ","file":"テンプラー_まとめ.md","md":"# テンプラー まとめ(2026-10-31 最新)\n\n10/14〜10/24 に作ったテンプラーのまとめ6本(早見表、詳細版、Lv16を目指すスキル、魂刻印、種族理解度、アルカナのおすすめスキル)を1本にまとめ、10/19〜10/23 の動画で新しくした。古い6本は `_古い版/` にある。\n10/25 に今週の動画3本(JPVariety 10/21、Antochi 10/23、韓国の굳손 10/23)と命中の調査(韓国の実測)を足し、10/26 に5章(能力値と刻印)を1本の順に整理した。足した所は「(10/25)」と書いた。\n名前は questlog.gg の日本語版データで確かめた正式名。\n\n## 0. 今の結論(まずここだけ見る)\n| 項目 | 結論 |\n|---|---|\n| 最優先 | **審判を Lv16 → Lv20**。Lv16 で待ち時間がなくなり、Lv20 で特化が3つ。20 を超えても火力は少し伸びる(Xia) |\n| 2番目 | 懲罰 か 猛烈な一撃 を Lv20(人による) |\n| スティグマ | **高潔の甲冑 Lv15 と 挑発 は固定**。残り2枠は 破滅のシールド(Lv5)・戦場の旗(Lv20 になってから)・保護のシールド(激昂が切れるとき)から |\n| 防御低下 | 衰弱の猛打・処刑の剣は**使わない**が多数意見(貫通でボスの防御はほぼ0) |\n| パッシブ | 激昂 \u003e 侮辱の咆哮・断罪の加護 \u003e 衝撃的中 |\n| 装備の刻印 | 戦闘速度が一番。防具・アクセサリーのパッシブは激昂。リングはスキル(審判 \u003e 懲罰 \u003e 猛烈な一撃 \u003e 連続乱打) |\n| 能力値の順(10/25 Antochi) | **命中(必要な値まで)→ 強打 → 前方ダメージ増幅 → 攻撃力 → 戦闘速度(審判の段まで)→ 待ち時間短縮 → 完璧 → クリティカル**。強打はボスの「強打抵抗」を超えて初めて効く(5-1) |\n| 命中の目安(10/25) | **命中+PvE 命中 の合計で 約1,150〜1,200**(超越・遠征「難しい」)。ルドラは約1,500。足りないと前からの攻撃に受け流しが出てダメージ半分(5-2) |\n| スティグマの量(10/25 굳손) | アビスの店200+悪夢35+シューゴフェスタ35+Lv45までに30。全部買えば**4つとも Lv20** にできる量 |\n| アルカナ | 審判は聖杯と羊皮紙だけに付く。聖杯は審判を指定して作る |\n| 狩り | 破滅のシールド Lv15+審判 Lv16+殲滅 で一撃ずつ倒して回る |\n\n---\n\n## 1. スキル\n\n### 1-1. 優先順と目標\n| 優先 | スキル | 目標 | 理由 |\n|---|---|---|---|\n| 1 | **審判** | 16 → 20 | Lv16(特化5)で待ち時間なし。火力の約半分。Lv20 で特化3つ |\n| 2 | 懲罰 | 16 → 20 | 2番目の火力。懲罰の強化(+20%)をずっと切らさない |\n| 2 | 猛烈な一撃 | 16 → 20 | 左クリックの基本攻撃。1発ごとに庇護の一撃の待ち時間 −2秒。Lv16 で4段目の追撃 |\n| 4 | 連続乱打 | 16 | 審判が使えないときだけ打つ。懲罰の待ち時間も回す |\n| 5 | 庇護の一撃 | 16 | 審判を開く技 |\n| 6 | 殲滅 | 12〜16 | 破滅のシールドでリセットして打つ |\n| 7 | シールド強打 | 12〜16 | 審判を開く技 |\n| — | 閃光乱舞 | 使わない | 全員一致 |\n| — | 衰弱の猛打 | PvE では使わない | 3章 |\n\n- 審判を開く技は4つ: シールド強打、庇護の一撃、シールド突撃、破滅のシールド(Xia)\n- NoBS の実測(月額課金のみ): IL1,600 で約1.2万DPS → 猛烈な一撃・連続乱打 Lv16 で約2万 → 審判・懲罰も Lv16 で約4〜4.5万\n\n### 1-2. レベルの上げ方\n| 方法 | 上がる量 |\n|---|---|\n| スキルポイント(知恵の石など) | 10 まで |\n| ディーヴァニオン | 主要スキル +4 |\n| リング・武器・ガーダーの刻印 | 1行で +1。**リング2つで +2** が普通(武器・ガーダーにはスキルを付けない) |\n| アルカナ | 残りの +4 をここで取る(Xia) |\n\n→ 10+4+2=16。Lv20 には アルカナで +4 が要るので、Lv20 にできるのは現実的に1〜2個(Xia)\n\n### 1-3. 特化(ボス用)\n| スキル | Lv16 未満 | Lv16 以降 |\n|---|---|---|\n| 審判 | 追加ダメージ+確定クリティカル | **待ち時間なし**+確定クリティカル(Lv20 で3つとも) |\n| 猛烈な一撃 | 庇護の一撃の待ち時間 −2秒+多段ヒット | 4段目の追撃 |\n| 懲罰 | 継続ダメージ+α | 確定クリティカル+回避無視 |\n| 連続乱打 | 懲罰の待ち時間 −1秒+追加ダメージ | 同じ |\n| 庇護の一撃 | 待ち時間短縮+1つ | 1番と5番 |\n| 殲滅 | 行動不能無効の敵に +100%+待ち時間 −10秒 | 狩りでは多段ヒット+待ち時間 −10秒 |\n| 捕獲 | 対象へ移動+バリア | 狩りでは「撃破で待ち時間リセット」 |\n| シールド突撃 | 射程 +10m+待ち時間 −10秒 | 狩りでは範囲化 |\n\n- 詳しい特化の番号は Xia の questlog.gg のビルドにある(動画の説明欄)\n\n### 1-4. 特化の番号とレベル(10/25 追加。韓国の굳손、グローバル版シーズン1向け)\n| スキル | レベル | 特化 | 補足 |\n|---|---|---|---|\n| 猛烈な一撃 | 20 | 2・4・5(火力寄りなら 3・4・5) | |\n| 連続乱打 | 20 | 2・4・5(火力寄りなら 3・4・5) | HP 吸収が一番多いので吸収の特化を取る |\n| 審判 | 20 | **3・4・5** | 吸収はほかの2つで取り、審判は火力だけ |\n| 懲罰 | 12 か 16 | Lv12 は 1・3(吸収と速度)、Lv16 は 3・5(火力) | 今のアルカナで Lv20 を4つは無理なので |\n| 庇護の一撃 | 16 | 1・5 | パーティーのダメージ耐性 |\n| 捕獲 | 12 | 1・3 か 1・4 | |\n| シールド強打 | 12 | 2・4 | |\n| シールド突撃 | 12 | 2・4 | 射程と待ち時間 |\n| 殲滅 | 12 | 3・4 | |\n| 衰弱の猛打 | 12 | 2・4 | ボスの防御を下げる。**入れなくてもよい** |\n| 衝撃解除 | 12 | 2・3 | ボス戦で気絶したときの立て直し |\n| 閃光乱舞 | — | 使わない | |\n- 字幕は韓国語を機械で英訳した物で、スキル名は並び順から当てはめた。特化の番号は動画どおり\n\n---\n\n## 2. パッシブ\n| 優先 | パッシブ | 理由 |\n|---|---|---|\n| 1 | **激昂** | 前方攻撃のダメージが上がり、ガードするたびにパーティー全体の PvE ダメージも上がる。一番大事(全員一致) |\n| 2 | 侮辱の咆哮 | 前から当てると強くなる。後ろから殴らない |\n| 2 | 断罪の加護 | 侮辱の咆哮と同じくらい(aLuckyRO) |\n| 4 | 衝撃的中 | 強打(ダメージが2倍になる確率)が上がる |\n| 5 | HP強化、鉄壁防御 | 防御系。余裕があれば |\n| PvP | 生存意志、苦痛遮断 | PvE では要らない |\n\n---\n\n## 3. スティグマ(グローバル版は4枠)\n\n### 3-1. 1つずつの評価(Xia 10/19。上位のテンプラー数人と相談した結論)\n| スティグマ | 評価 | 目標 |\n|---|---|---|\n| **高潔の甲冑** | **必須**。激昂と侮辱の咆哮の効果 +50%。外さない | Lv15 にして放置 |\n| **挑発** | **必須**。Lv5 で萎縮(相手の PvE ダメージ耐性 −10%)。パーティー全体の火力が上がる | Lv5。15・20 で待ち時間と持続が伸びる |\n| 破滅のシールド | 審判を3秒出す。投資が少ないうちは強い | Lv5 で十分(狩り用は Lv15) |\n| 保護のシールド | 激昂を100%切らさない。ボスの攻撃が少ないときに。ヒーラーも楽 | Lv5(+1回) |\n| 戦場の旗 | Lv20 で強い。それまでは稼働時間が短い | Lv20 になってから入れる |\n| 神の懲罰 | 悪夢で少し使える程度 | 低い |\n| 衰弱の猛打・処刑の剣 | 防御低下は火力にならない(貫通でボスの防御はほぼ0になるため) | 使わない |\n\n- 注意: 破滅のシールドは Lv1 でも殲滅がリセットされる**バグ**がある。不具合の利用は規約違反で処分の対象になりうるので、Lv5 まで上げて使う(Xia)\n\n### 3-2. 構成\n| 用途 | 4枠 |\n|---|---|\n| ボス(一番火力が出る) | 高潔の甲冑、挑発、戦場の旗(Lv20)、破滅のシールド |\n| ボス(激昂が出ないとき) | 破滅のシールド → 保護のシールド に替える |\n| ボス(戦場の旗が Lv20 未満) | 戦場の旗 → 保護のシールド に替える |\n| 狩り・覚醒戦・デイリー | **破滅のシールド Lv15**、高潔の甲冑、挑発、+1(何でもよい) |\n| PvP 1対1 | 高潔の甲冑 Lv15、破滅のシールド Lv5、ネザカンのシールド、二重鎧 |\n| PvP 5対5 | 拿捕、神の懲罰、戦友保護、破滅のシールド |\n| PvP 大規模戦 | 高潔の甲冑 Lv15、拿捕 Lv15、破滅のシールド Lv5、戦友保護か二重鎧 |\n\n- 意見の割れ: Ulfhednar(10/18、Sahara のビルド)は 破滅のシールド・高潔の甲冑・戦場の旗・保護のシールドで、**衰弱の猛打(防御 −25%)もマクロに入れている**。Xia は「防御低下が効くデータがあれば考えを改める」と言っている\n- (10/25)JPVariety(10/21)は **挑発・破滅のシールド Lv15・高潔の甲冑 Lv15・戦場の旗 Lv20**。野良で味方が苦しいときは 戦場の旗 → 保護のシールド(ガードが増え、激昂のパーティーへの効果を配れる。そのぶん武器ダメージ +10% と「防御に比例した攻撃力」を失う)。破滅のシールドは Lv20 で転倒の確率が上がり、殲滅を打つ回数が増える\n- (10/25)굳손 の4つ: 保護のシールド・破滅のシールド・高潔の甲冑・戦場の旗(英訳の名前から推定)。全部 Lv20 が目標\n\n---\n\n## 4. マクロと回し方(ボス)\n\n### 4-1. マクロ\n| 項目 | 内容 |\n|---|---|\n| キー | 設定 → キー設定 → 一般 → ゲームプレイ「マクロ」を右クリックに。左クリックは猛烈な一撃 |\n| 押し方 | 左クリックと右クリックを押し続ける |\n| 列1 | **挑発** → 審判 → シールド強打 → 庇護の一撃 → 連続乱打(挑発を先頭にすると審判を無駄にしない。Xia) |\n| 列2 | 殲滅 |\n| 手で押す | 懲罰(溜める)、戦場の旗、高潔の甲冑、破滅のシールド、シールド突撃、保護のシールド |\n| 遅延 | ping 50 未満は 10 ミリ秒、それ以上は 50 ミリ秒 |\n\n- 戦場の旗はマクロに入れない(雑魚で使うと 90 秒待つことになる)\n- 段の並びは字幕から起こしたもので、画面では確かめていない\n\n### 4-2. 回し方(Xia)\n1. 戦う前に高潔の甲冑\n2. ボスの範囲に入る直前に 戦場の旗 → **懲罰を MAX まで溜める**(途中で離すと弱い)\n3. シールド突撃で飛び込み、マクロと左クリックを押し続ける\n4. 庇護の一撃で出た審判が切れたら、すぐ破滅のシールド\n5. 懲罰は待ち時間が戻り次第、審判を無駄にしない合間に打つ\n6. ボスが離れたら突撃で追う(審判が2秒ぶん出る)。回避したあとのシールド突撃も無駄にしない\n7. 保護のシールドを入れている場合は、20秒に1回、ボスの攻撃の直前に使って激昂を更新する\n\n### 4-3. ほかの人の形(10/25 追加)\n| 投稿者 | 形 |\n|---|---|\n| JPVariety(10/21) | **懲罰をマクロから外して手で**(溜めの時間を捨てて強化だけ使っていたのは失敗だった、と)。連続乱打も手で押し、懲罰の待ち時間を回す。殲滅は特化で待ち時間 −10秒、転倒した敵に連打 |\n| 굳손(10/23) | マクロ2段: **審判 → シールド強打 → 連続乱打** と **殲滅 → 衰弱の猛打**。雑魚では左右クリックだけ、ボスの前でバフを使ってから戦う。スキルの射程とボスの反応範囲がどちらも20m なので、近づきながら引き寄せ技 → すぐマクロ |\n| NoBS(10/27) | マクロは **審判 → 殲滅** だけ。**衰弱の猛打はマクロに入れない**(入れると審判の代わりに出てしまい損。防御 −25% の「衰弱」はガードしたときにも付くので、打たなくてよい)。回し方: 戦場の旗 → 懲罰を最大まで溜める(**懲罰の「執行者」効果で 命中 +200・PvE ダメージ +20%**)→ 飛び込み技 → マクロを押し続ける。審判が出ないときは破滅のシールドかシールド強打で出し直す。懲罰は戻り次第すぐ。保護のシールドとガードは使わず完璧回避で避ける(攻撃の予告の表示が出きった瞬間に回避)。保護のシールドを入れるなら外すのは戦場の旗 |\n- 굳손 は Logicool G HUB で「4つのキーを押し続ける」マウスマクロも見せているが、外部のマクロは 13章の注意のとおり無難ではない\n\n---\n\n## 5. 能力値と装備の刻印(魂刻印)\n\n### 5-1. 能力値の優先順\n| 順 | 能力値 | 理由 |\n|---|---|---|\n| 1 | **命中**(必要な値まで。5-2) | 前から殴るテンプラーは、命中が足りないと受け流されてダメージが半分になる(強打・クリティカルでも)。敵対心も稼げない |\n| 2 | **強打**(ボスの強打抵抗を超えてから) | 最終ダメージが2倍。ただしボスの「強打抵抗」がそのまま引かれる(抵抗30〜35%のボスに強打70%なら、出るのは約35%)。抵抗を超えた分は全部効く |\n| 3 | 前方ダメージ増幅 | 激昂で上がる。ほかのダメージ増幅と別の掛け算。前から当てる割合が約80%以上なら強い(ボスを持つテンプラーは約99%) |\n| 4 | 攻撃力 → クリティカル ダメージ増幅・武器ダメージ増幅 → ダメージ増幅 | 韓国の計算では1%あたり 前方 0.68%、クリダメ 0.59%、武器 0.53%、ただのダメージ増幅 0.46%(バフと同じ枠で足されるため) |\n| 5 | 戦闘速度(審判の段まで) | 速さは段階でしか効かない。韓国の測定で審判の回しは**約88〜89.4%で頭打ち**(次の段は 116.7%。韓国の Inven で、町の戦闘速度 91.6 + 上級の薬 10 + 戦場の旗 15 = 116.6 では遅く、116.7 から速くなったという測定あり(9/20)。韓国でも最上位の装備と最上級の薬でやっと届く量)。基本攻撃は約94〜95% |\n| 6 | 待ち時間短縮 | 審判を開くシールド技が早く戻る。審判はテンプラーの火力の約半分 |\n| 7 | 完璧 | 武器の最大攻撃力で当たるだけ。韓国の試しでは 0→100% で約+8.5% |\n| 8 | クリティカル | 審判は特化4(Lv12)で確定クリティカル。ほかは上限50% |\n- 出典: Antochi(10/23。韓国の検証・ゲーム内の説明・公式の装備データから)\n- **Xia(10/19)の順は違う**: 戦闘速度 \u003e ダメージ増幅・武器ダメージ増幅・多段ヒット的中・攻撃力増加 \u003e アクティブスキル・パッシブ \u003e 強打。強打を最後にするのは「ボスの強打抵抗を超えるまでほとんど効かないから」で、理由は同じ。**自分の強打がボスの抵抗より低いうちは Xia の順、超えたら Antochi の順**と読めばよい。グローバル版のボスの抵抗は未発表\n- 自分の強打がボスの抵抗に近いか下なら、強打よりクリティカル ダメージ増幅のほうが得(審判が毎回クリティカルなので)。韓国の抵抗: 遠征「難しい」20%超、ドラマタ30%、最新の聖域40%\n- ガード: 激昂のパーティーへの効果はガードで出る。韓国シーズン3のダンジョンでは約1,700〜1,800で勝手に出続けた。グローバル版の目安はない\n- **韓国の攻略を読むときの注意**: 神の能力値は韓国では1点0.2%、グローバル版は**0.1%**(半分)。強打と前方ダメージ増幅は種族理解度では4番の枠にしか出ない。韓国の後のシーズンのアルカナはまだない\n\n### 5-2. 命中の必要な値\n**結論: 今のグローバル版(超越・遠征「難しい」)なら 命中の合計 約1,150〜1,200。ルドラが来たら約1,500。**\n「合計」= 能力値画面の **命中+PvE 命中**(詳細の画面で見る)。料理・懲罰の強化の分も入る。\n\n| コンテンツ(韓国版シーズン1の実測) | 受け流しが出なくなる命中 | 出典 |\n|---|---|---|\n| 炎の神殿・獰猛な角岩窟(普通)など | 約1,000 | 왕소랑 |\n| 超越 9段 | 約1,100 | 왕소랑 |\n| 超越 10段 | 約1,150(1,100 でも数%出る。1,170 で出ない) | 왕소랑・강주・쵸피 |\n| ドラウプニルの遠征「難しい」 | 約1,160〜1,170(1,110 で 4.65% 出た。1回だけの測定) | 왕소랑 |\n| ルドラ(最初の聖域) | **約1,500**(1,450・1,480 でたまに出る、1,500 で一度も出ない) | 강주・Antochi。쵸피 は事前の予想で 1,300〜1,400 |\n| 韓国の後の超越(グローバル版にはまだない) | 3段 1,750、4段 1,900 | 오지조 |\n\n**仕組み**\n- ボスへの攻撃は必ず当たるが、**前から当てると「受け流し(パリィ)」が出てダメージが約半分**(韓国の実測で 4,189 → 1,866)。強打・クリティカルでも半分になる。後ろからは出ない\n- 足りない分 10 につき受け流しが約 1% 増える(超越10段で 1,110 → 3.9%、950 → 約5% などの実測と合う)。テンプラーはボスを前から殴り続けるので、**足りない分 100 で 火力 約 −5%**(受け流し約10% × 半分)\n- 遠距離職は前から当てる時間が短いので「命中より攻撃力」という人もいる(강주。魔道星で計算し、前から当てる時間が 50% を超えると命中が得)。**テンプラーには当てはまらない**\n\n**確かめ方**: ボスを殴ってダメージの数字に受け流しが出るか見る。韓国では「命中+100 の料理」を食べて受け流しが消えるかで目安を測っていた(料理は神の能力値・正確にも効くので +100 以上になることがある)\n\n**上げ方**(韓国版の動画から。グローバル版で同じかは未確認)\n| 場所 | 中身 |\n|---|---|\n| ロングソード・ガーダーの刻印 | **正確**: 1点で命中・クリティカルが約0.1%ずつ上がる |\n| 防具8部位・アクセサリー | 命中の行。リングはスキルを付けるまでの間なら命中でもよい |\n| 魔石 | 命中は1つに2行付けられる。足りないうちは攻撃力・クリティカルより命中 |\n| ペットの図鑑 | 野性のペットを Lv5 にすると1種ごとに命中+10(65種で +650)。自然のペットは Lv4 で正確+2 |\n| 種族理解度 | 3・6・9番(Lv7 以上)に命中 |\n| 神の能力値 | **自由**(命中と回避)。アルカナは活力のコンパス、万神殿でも上げられる。グローバル版は1点の効果が韓国の半分 |\n| 称号・翼 | 遠征「難しい」を10回クリアの称号に命中、所持で命中が付く翼(森の精霊の翼は命中+20) |\n| アリエルの盤 | PvE 命中 |\n| ディーヴァニオン | 韓国の後のシーズンに緑の盤(命中210)が出た |\n\n- 韓国の普通のプレイヤー(IL3,000、無課金)は何もしなくても合計 1,170 になっていた(강주)。届いていなければ、**届くまでは命中を攻撃力より先に**、届いたら止めて強打・前方ダメージ増幅・攻撃力へ(Antochi・쵸피)\n- 注意: グローバル版のボスの値は**誰も測っていない**。同じコンテンツなので同じと見られるが、未確認\n- 出典: Moxsy(10/24)は「ルドラは命中 1,000〜1,200、クリティカル 1,200〜1,400」と予想しているが、本人も推測と言っている\n\n### 5-3. 神の能力値\n| 順(韓国のテンプラー) | 神の能力値 | 効果 |\n|---|---|---|\n| 1 | 時間 | 戦闘速度(審判の回し) |\n| 1 | 破壊 | 攻撃力 |\n| 3 | 知恵 | 強打 |\n| 4 | 自由 | 命中(足りないうちは大事) |\n| 5 | 死 | クリティカル(テンプラーには一番弱い) |\n| 装備が強くなったら | 正義(Justice)・空間(Space) | 自由・死 と入れ替える。正義=完璧、空間=ガード。運命(Destiny)は盾役専用。この3つの日本語名は未確認 |\n- グローバル版の上位20人は 時間約75・破壊約74 に対し 知恵は約54。**時間と破壊がそろったら知恵で差がつく**\n- 取れる所: アルカナ(一番多い。唯一のカードは1枚20点、強化1回で+1、最大25点)、万神殿(美術品=知恵・幻想、像=自由・死・空間、巨像=時間・破壊・正義・知恵)、モノリスの共鳴(全部 約+6)、アビスの腕輪(ランダムに4つ)\n- アルカナ: 活力の聖杯=時間、魔力の鐘=破壊、鏡は活力なら幻想・魔力なら知恵(韓国は知恵)。上位200人の約46%が「活力2+魔力2」の組み方(Antochi)\n\n### 5-4. 部位ごと(上位20人の採用率は NotMeter 10/22、動画は Xia 10/19・Soulgrot 10/18・Ulfhednar 10/18・Antochi 10/23 ほか)\n| 部位 | 狙う物 | 補足 |\n|---|---|---|\n| ロングソード・ガーダー | **戦闘速度・武器ダメージ増幅・ダメージ増幅・威力**(+多段ヒット的中) | 上位20人は5つとも100%。**スキルは付けない**(数値が一番大きい部位なので)。命中が足りなければ正確も良い |\n| ヘルム | 強打・攻撃力増加 | 受ける治癒量も強い(Soulgrot) |\n| ショルダー | クリティカル ダメージ増幅・強打 | 審判が毎回クリティカルなのでクリダメが効く(Antochi) |\n| トップス | ダメージ増幅(+完璧) | |\n| ボトムス | 攻撃力増加・完璧(+ダメージ耐性) | |\n| グローブ | **戦闘速度**・完璧 | |\n| シューズ | **移動速度**・完璧 | 移動速度は戦闘力が大きく上がる(Ulfhednar) |\n| マント | 強打・攻撃力増加(+完璧) | |\n| ネックレス | 攻撃力・命中・クリティカル(+ガード) | 動画は「戦闘速度」と言う(Xia・Soulgrot、JPVariety も「唯一の装備なら魂刻印 → 調律で戦闘速度を付けられる」)が、上位20人にも GameWith の刻印表にもない。**未確認**。アミュレット(別の部位)の話と混ざっている可能性 |\n| イヤリング | ネックレスと同じ+移動速度 | |\n| **リング** | **スキル: 審判 \u003e 懲罰 \u003e 猛烈な一撃 \u003e 連続乱打** | 能力値よりスキル。審判・連続乱打が Lv20 になるまで(Antochi) |\n| ブレスレット | 時間・幻想・知恵・破壊 | |\n\n**上位20人の刻印(NotMeter「装備・スキル構成」、10/29 10時。スキルの行は表に出ない)(10/29)**\n| 部位 | 全員(100%) | 多い(60〜95%) | 少ない |\n|---|---|---|---|\n| ロングソード | 威力・武器ダメージ増幅・戦闘速度・多段ヒット的中・ダメージ増幅 | 攻撃力 95%、**正確 70%** | |\n| ガーダー | 威力・攻撃力・武器ダメージ増幅・戦闘速度・多段ヒット的中・ダメージ増幅 | **正確 60%** | |\n| ヘルム | 攻撃力・強打・攻撃力増加 | 敏捷 60% | ガード・受ける治癒量 10% |\n| ショルダー | 攻撃力・クリティカル ダメージ増幅 | 敏捷 95%、ガード 65% | |\n| トップス | 攻撃力・ダメージ増幅 | 敏捷 95%、ガード 65% | |\n| ボトムス | 攻撃力・完璧・攻撃力増加 | ダメージ耐性 75% | 敏捷 15% |\n| グローブ | 攻撃力・戦闘速度・完璧 | | 敏捷 35%、ガード 15% |\n| シューズ | 移動速度・攻撃力・完璧 | 敏捷 50% | |\n| マント | 攻撃力・完璧・強打・攻撃力増加 | | |\n| ネックレス | ガード・攻撃力 | **命中 95%**、クリティカル 85% | |\n| イヤリング | ガード・攻撃力 | **命中 95%**、クリティカル 90% | |\n| リング | 攻撃力 | ガード 95%、**命中 55%** | クリティカル 40% |\n| ブレスレット | 空間・時間・正義・知恵・破壊・幻想 | | 自由 10% |\n| ブローチ | 敏捷・威力・**正確** | ガード 90%、**命中 60%** | クリティカル 50% |\n| 印章 | PvE 攻撃力・ボス攻撃力・最大攻撃力・追加攻撃力 | クリティカル攻撃力 95%、封魂石の追加ダメージ 65% | |\n- 武器・ガーダーは行が6〜7つある(賢者の石で増やした分。武器は2個まで)。**上位でも7割は武器に正確を残している**\n- 命中は **ネックレス・イヤリング・ブローチ・リング** の行で取っている。ネックレスに戦闘速度を付けている人はいない\n- 装備そのもの(どの装備を使っているか)の最新の集計は見つからなかった。GameWith のビルド統計(アジア上位480人)は 10/07 の古いデータ\n\n- **防具とアクセサリー(リング以外)のパッシブは激昂を最優先**、次に 侮辱の咆哮・衝撃的中(Xia・Ulfhednar・Antochi)\n- 敏捷・攻撃力・命中・クリティカルは「付いたら残す」くらい(aLuckyRO)。戦場の旗を使うなら防御の行もむだにならない(防御が攻撃力になるため。Antochi)\n- 魔石: 前方 → 武器かクリティカル ダメージ増幅。出るまでは命中(必要な値まで)→ 攻撃力(Antochi)\n- **(10/30 Ashura、テンプラー)** アクセサリーの振り直しは「防御の行を最初に消す」→ 攻撃力・クリティカル・威力・正確・ガードを残す。命中より**正確**のほうがよい(命中とクリティカルの両方が上がるため)。リングは審判・懲罰の行を残して Lv20 に。ブーツは状態異常抵抗・敏捷・激昂・侮辱の咆哮なら振り直さない\n\n### 5-5. 安く揃える手順\n1. **拾った・買った唯一(金)の装備は、まず刻印して能力値を見る**。良い行が付いたら残す(Xia・notXeon)\n2. 良い行の付いた装備を **+15 まで上げてから継承**で本命に移す。IL の低い装備のほうが強化がずっと安い(IL86 は約2倍かかる)。取引所で低い IL の同じ部位を買い、刻印して良い行が2つ出るまで繰り返すのも手(Grobs 10/19、Reddit の方法)\n3. 1行ずつの振り直し(魂の調律)は最後の手段。材料に唯一の装備を1つ使う(取引所で買うと90〜160万ギーナ)。狙いが出る確率は約2%\n   - **(10/28 Fubgun)** 継承する装備は「**良い行が2つ以上**」(1つでも強打のような珍しい行なら可)。**IL36〜41 の唯一**を使うと、+15 までの費用が IL86 より約60%安い。行が悪い本命の装備を1行ずつ振り直すのは、長い目で見ると数千万の損\n   - 唯一の装備の集め方: **シュゴフェスタ**(報酬4枠なら1回に約0.8個、IL36〜41。刻印済みで出る)、アビスの野外の敵(1日1〜2個)、野外ボス(地図 → 探索 → 野外ボスで落とす物が見える)、**サブキャラ**(サブキャラがダンジョンで拾った装備はメインで装備・継承できないが、**振り直しの材料には使える**)\n   - 待つ間は、今の装備を **+10 まで**なら上げてよい(費用が小さい)。それ以上は継承する装備が見つかってから。拾った唯一は捨てずに取っておく\n   - 全部の行を振り直す初期化の書は週に1〜3冊しか出ない。使うなら武器 → ガーダー → リングの順\n   - シーズン2で「シンクの石」(行を振り直す石)がダンジョンで出る予定(韓国版)。出れば振り直しが安くなる\n   - **(10/28 Grobs)** 製作装備は刻印が5行、ダンジョン装備は4行(クロメデの武器は3行)。継承では強化値・刻印・**突破も移る**と言っている(画面では未確認)\n4. **(10/30)アクセサリーも継承できる**(ダンジョンで拾ったアクセサリーで継承できた。ユーザー確認)。前の「装飾品は継承できない」は誤り。製作したアクセサリーを継承先にできるかは未確認\n5. 全部そろったら刻印の効果を100%に → 賢者の石で6枠目(武器は2個)。賢者の石の枠は継承で消えるので最後の装備だけ\n   - 賢者の石は**遠征「難しい」で1%**(平均100回に1個、取引不可)とシーズンショップ\n\nロングソードの刻印の確率(GameWith): ダメージ増幅 1.6%、戦闘速度・武器ダメージ増幅 3.2%、多段ヒット的中・威力 4.8%、正確 5.6%、命中 6.4%、各スキル約1.7%\n- 行の数は装備で違う: 知恵のロングソード(IL36)は4つ、光る白龍王は5つ。「初期化(再刻印)」は全部の行を付け直し、「魂の調律」は選んだ1行だけを付け直す(GameWith、10/27)\n\n\n---\n\n## 6. アルカナ\n仕組みと「いらないカードは強化か抽出か」は `2_成長とシステム/アルカナのまとめ.md`。\n\n| カード | 能力値の種類(Xia) | 狙うスキル | 避けるスキル |\n|---|---|---|---|\n| 聖杯 | **活力**(時間=戦闘速度) | **審判**、激昂。次に懲罰・侮辱の咆哮・連続乱打 | 防御系、衝撃解除、苦痛遮断・生存意志 |\n| 羊皮紙 | どちらでもよい | **審判**、懲罰、猛烈な一撃、殲滅 | 衰弱の猛打、捕獲 |\n| コンパス | 活力(自由=命中) | **連続乱打**、シールド突撃、シールド強打、庇護の一撃 | 閃光乱舞、衝撃解除 |\n| 鐘 | **魔力**(破壊=攻撃力) | **激昂**、断罪の加護、侮辱の咆哮 | 守護の印章 |\n| 鏡 | **魔力**(知恵=強打) | **衝撃的中** | 生存意志 |\n\n- 審判が付くのは聖杯と羊皮紙だけ。羊皮紙と鏡は**砕けたアルカニス**、コンパスと鐘はデウス研究基地で出る\n- 聖杯を作るときに2つ指定するなら 審判+懲罰(aLuckyRO)\n- 4枚セットの効果は気にしない。カードの能力値のほうが得(Xia)\n- 神の能力値: 時間=戦闘速度、幻想=待ち時間短縮、知恵=強打、破壊=攻撃力増加。死(クリティカル)と自由(命中)も良い。ほかは PvE では関係ない(Xia)\n- 出典: Xia 10/19、aLuckyRO 10/20、Antochi 10/21\n\n---\n\n## 7. 種族理解度(ペットの能力値)\n種族理解度 = ペットの種族(知性・野性・自然・変形・特殊)ごとの9つの枠に能力値を付ける仕組み。\n\n| 枠 | おすすめ |\n|---|---|\n| **4番** | 種族ごとに違う「%で火力が上がる」枠。**一番大事。最初にここ**(下の表) |\n| 1・5番 | 最大攻撃力・追加攻撃力 |\n| 3・6・9番 | クリティカルか命中。命中が足りていればパワーシャードのダメージ(Xia) |\n| 7番 | ダメージ耐性 か PvE ダメージ耐性 |\n| 2・8番 | HP 増加(%) |\n\n| 種族 | 4番で狙う物 |\n|---|---|\n| 知性 | PvE ダメージ増幅 \u003e ダメージ増幅 |\n| 野性 | PvE ダメージ増幅・ダメージ増幅・武器ダメージ増幅 |\n| 自然 | PvE ダメージ増幅だけ(多段ヒット的中・完璧は罠) |\n| 変形 | **前方ダメージ増幅**(テンプラーは前から殴るので) ≧ PvE ダメージ増幅 |\n| 特殊 | **強打** |\n\n育て方\n1. **レベル10になるまで分析を続ける**(経験値はこれで入る)。それまでは、4番に高い数値が出たとき以外ロックしない\n2. 4番が決まったらロックし、ほかの種族の4番へ\n3. 4番が全部そろってから、自動分析で 1・5番の黄色の最大攻撃力、3・6・9番のクリティカル・命中を狙う(Xia)\n4. ロックするほど費用が上がる(ロックなし 結晶36個+9,000ギーナ → 5つで 172個+4.3万ギーナ)\n5. **5種族すべてレベル10で称号「Unbound by Genus」**(PvE ダメージ +4.5%、所持で +1%。全キャラ共通)\n- 「貫通」は今は選ばない(ボスの防御は貫通でほぼ0になっている)\n- **(10/28 XifanGG)** 進め方: まず特殊を Lv10 → 残り4種族を Lv10(称号) → 特殊に戻って枠を詰める。序盤は「1・4・5・7番」だけ。唯一の行は上限の70%以上なら残す(例: 追加攻撃力の上限12なら9以上)。終盤は2つ目のプリセットで英雄の行を上限の90%以上で狙う(1・5番は最大攻撃力。上限20なら18以上)。5つ目をロックすると1回の結晶が96 → 172個に上がる\n- XifanGG の4番: 特殊 = 強打(前から殴り続けられるなら前方ダメージ増幅)、変形 = 前方ダメージ増幅(8割以上前から殴れるなら。無理なら PvE ダメージ増幅)、自然・知性 = PvE ダメージ増幅、野性 = 武器ダメージ増幅。**7番はテンプラーなら Endurance(日本語名は未確認)か PvE ダメージ耐性**。3・6・9番の命中・クリティカルは、ボスの抵抗が分かるまで結晶を使わない\n\n### 上位の人の実際の選び方(10/30)\n上位の人の種族理解度は、NotMeter の統計にもキャラのページにも出ていない(10/30 に確認)。なので、上位の人が自分の画面を見せている動画から拾った。\n- **韓国版と枠の並びが違う**。グローバル版は 1・5番 = 追加攻撃力、2・8番 = HP 増加(%)、3・6・9番 = 命中かクリティカル(テンプラーはガードも出る)、4番 = 種族ごとの%の枠、7番 = ダメージ耐性(김뚱냥이。上の XifanGG・Xia と同じ)。韓国の動画の「147・258・39番」はそのまま当てはめない\n- 序盤は最大攻撃力より**追加攻撃力**(グローバル版はまだ完璧と武器ダメージ増幅が低く、最大攻撃力が生きにくい。김뚱냥이・Sen Evades)。7番は「鉄壁」(日本語名は未確認)より**ダメージ耐性**(김뚱냥이)\n\n| 人 | 何をしている人か | 選び方 |\n|---|---|---|\n| 성한의 게임 공략(韓国のテンプラー、ガード型) | 自分の種族理解度を画面で見せた | ガードが出る枠は**ガード 40以上**(上限50)。ガードが足りたらボスへの攻撃力(日本語名は未確認)。最大攻撃力は上限20を狙う。前方ダメージ増幅と強打は **6対4**(高潔の甲冑を使った前方ダメージ増幅と、ボスの強打抵抗 約40% を引いた強打の差が一番小さくなる配分)。特殊はガードが出ないので最大攻撃力で埋める。6番は PvE ダメージ耐性(ガードが足りなければガード) |\n| 갓신사(韓国、悪夢の上位・PvP 2,500点・アビス1億点。テンプラーではない) | PvE と PvP を兼ねる**プリセット3つ**を作り、戦闘中に切り替える | 作る順: ①強打の組(前に回れないときの保険。最初に作る)→ ②前方ダメージ増幅の組(タンクが頭を止めてくれるとき)→ ③PvP の命中の組。**PvP では空いた枠を全部命中**にし、耐性の枠は武器ダメージ耐性(PvP で一番評価が高い。ダンジョンでは効かない。日本語名は未確認)。命中を「最大攻撃力の枠」に入れるのは勧めない。プリセットは設定 → キー設定で2つのキーに割り当てられる |\n\n- テンプラーで PvP も見るなら: まず今の PvE の組(4番の%の枠)を仕上げ、**2つ目のプリセットを PvP 用**にする(3・6・9番を命中、7番をダメージ耐性)。PvP の目安はクレリック_まとめ 3章の「ガード型」(早期鯖の4週目で ガード約1,500)も参考になる\n- グローバル版の上位テンプラーが PvP で何を選んでいるかの動画は、まだ見つかっていない(10/30)\n\n**グローバル版のテンプラーで確かめた分(10/30)**\n| 人 | 選び方 |\n|---|---|\n| Mosu(トルコ語、グローバル版のテンプラー。自動分析の設定を画面で見せた) | 1番 = 追加攻撃力 など、3・6・9番 = 命中・クリティカル・パワーシャード(9番はダメージ増幅も)、4番 = ダメージ増幅・クリティカル ダメージ増幅、5番 = 追加攻撃力・最大攻撃力、7番 = ダメージ耐性・PvE ダメージ耐性、8番 = HP。素材が少ないので**唯一(黄)以上**で自動分析し、素材がたまったら英雄で探し直す。称号は Unbound by Genus(PvP なら Golden Glove も。日本語名は未確認)。PvP 用にスキルの組を分けている |\n| Antochi(グローバル版のテンプラーの能力値の優先度) | グローバル版では**強打と前方ダメージ増幅は4番にしか出ない**ので、出たら全部取る。強打がボスの強打抵抗を十分に超えていなければ、クリティカル ダメージ増幅のほうが得 |\n| ROX_Hyperion(フランス語、PvE・PvP のガイド) | 全部 Lv10 にして称号。素材は攻撃の能力値に使う(全キャラ共通なので)。多色の結晶は特殊にだけ使う |\n| CAHOS GAMING(スペイン語) | テンプラーは最大攻撃力・PvE 攻撃力・前方ダメージ増幅(タンクで正面に立つので) |\n- まとめると、グローバル版のテンプラーも **4番 = %の枠、1・5番 = 攻撃力、3・6・9番 = 命中・クリティカル、7番 = ダメージ耐性系、2・8番 = HP** で、上の XifanGG・Xia と食い違いはない。違いは4番の中身だけ(Mosu はダメージ増幅、XifanGG は特殊 = 強打)\n- 韓国のテンプラーのような「ガードを積む型」をグローバル版でやっている人の画面は、見つかっていない\n\n**韓国の掲示板(Inven のテンプラーの板)の「自然ガード」型(10/30 に読んだ。8〜10月の書き込み)**\n| 項目 | 書かれていたこと |\n|---|---|\n| 何のためか | 激昂(ガードで出るパーティーの火力の効果)を、保護のシールドを押さずに出し続ける。シールドを構える時間が減るので自分の火力も落ちない。ただし弱体を受ける攻撃には保護のシールドが要るので、スティグマからは外さない |\n| 広まり具合 | 9月には「上位のテンプラーの多くが自然ガード型」(9/15 の書き込み)。8月末には「今は自然ガードが一番上」の意見が多い。反対意見(ガードに振ると火力が落ちる)もある |\n| ガードの量 | 町で **約2,460〜2,950**、パーティーの強化込みで約3,250。デウス研究基地(難しい)を 2,457 で回っている人がいる。種族理解度まで仕上げると 3,600〜3,800 という見込みも |\n| ガードの集め方 | 製作の防具の上半身に敏捷・ガード。製作のアクセサリー(イヤリング・ネックレス、製作のリングなら リングも)にガード。称号はガード +110 のもの(「アルトガルドの守護者」とのこと。日本語名は未確認)。ガードが上がる青い翼を +10。ブローチに敏捷・ガード、ブレスレットに空間 |\n| 種族理解度 | ガードの枠を**4つ以上、1枠 42以上**(47以上ならなお良い)でロック。残りはボスへの攻撃力・命中・クリティカル。ある人は前方ダメージ増幅4・強打6、最大攻撃力、ガード。6番(韓国版の並び)はダメージ耐性の代わりにガードの人も。「鉄壁は要らない」という返信あり |\n| 防具の魂刻印(9/27 の書き込み、6行のとき) | どの部位も「攻撃力系・激昂・衝撃的中・侮辱の咆哮」を土台に、ヘルム=強打+敏捷、ショルダー=クリティカル ダメージ増幅+敏捷(+ガード)、トップス=ダメージ増幅+敏捷(+ガード)、ボトムス=ダメージ耐性・完璧、グローブ=戦闘速度・完璧(+敏捷)、ケープ=強打・完璧、ブーツ=移動速度・完璧(+敏捷)。7行目が付く装備なら敏捷・ガードを足す。韓国版の装備の話 |\n| スティグマ(ある人) | 挑発25・戦場の旗25・ほか。短いダンジョンでは突進系に入れ替え |\n- 韓国版の枠の番号(1・4・7番 など)はグローバル版と違う。グローバル版でガードが出るのは 3・6・9番(上の김뚱냥이)\n- 韓国版は今のグローバル版より装備が進んでいる(製作の英雄のアクセサリーなど)。**グローバル版で同じガードの量に届くか、届かなくても効果があるかは未確認**\n- Reddit(海外の掲示板)は、この環境からは読めなかった(10/30)\n\n---\n\n## 8. ディーヴァニオン\n- 主要スキル(審判・懲罰・猛烈な一撃・殲滅・連続乱打)を先に取り、角(オレンジ)の戦闘速度・ダメージ増幅・待ち時間短縮・多段ヒットへ。パッシブは激昂・侮辱の咆哮・衝撃的中。小さいノードは攻撃力・クリティカル。防御とMPは後回し\n- 結晶の上限は今 416 点(Fubgun)。集め方は `2_成長とシステム/成長とシステムのまとめ.md` の3章\n- 10/21 から新しい盤「アリエル」(PvE ダメージ増幅、ボスへのダメージなど)。遠征「難しい」のアリエルの欠片から結晶を作れる(キャラごと30個まで)\n\n---\n\n## 9. 狩り・デイリーダンジョン\n| 項目 | 内容 |\n|---|---|\n| 型 | **破滅のシールド Lv15**(敵を倒すと待ち時間が戻る)+**審判 Lv16**+殲滅。破滅のシールドで飛び込むたびに審判が出て、ほぼ一撃で倒せる(Leonis 10/21・Xia・Ulfhednar) |\n| 簡単な型 | 捕獲 Lv8 の「撃破で待ち時間リセット」で引き寄せる。すぐ組めるが遅い |\n| 稼ぎ(Leonis) | アビスで1時間に生のギーナ約100万、アビスポイント約5万、職人の精錬石約10個、達人の精錬石1〜2個、唯一の装備3〜4個。合わせて約400万ギーナ分 |\n| 設定 | 「スキル使用時の自動ターゲット」ON、ターゲット探索は「カメラ前方」。「スキル使用時の追跡」は狩りのときだけ ON(普段は勝手に歩くので OFF) |\n| リセット | 自分でとどめを刺したときだけ。PvP では効かない |\n| 狩り場 | 不滅の島の浜辺(Lv50)、アビス下層 |\n\n**デイリーダンジョン**: 中央に立つ。精鋭(300点)が出たらすぐ倒す。開始時の効果は移動速度を優先。移動速度の称号・靴・スクロールを準備\n\n---\n\n## 10. 翼・称号\n| 種類 | おすすめ |\n|---|---|\n| 翼 | 一番: タリスラの翼(シーズンショップ 21万ポイント)。次: 森の精霊の翼(ボスに強い・安い)、悪夢の翼、ダークヴェールの翼(所持で +1%) |\n| 称号(攻撃) | Unbound by Genus(種族理解度を全部レベル10)。それまでは Guardian of Altgard |\n| 称号(防御) | Saint of Altgard(アルトガルドのモノリスでレベル30) |\n| 称号(その他) | Through Hell and Back(封印ダンジョンを全部) → Empty Closet(外見を大量に集める。最終) |\n- 翼と称号の日本語名は未確認(英語のまま)\n\n---\n\n## 11. PvP(要点)\n| 項目 | 内容 |\n|---|---|\n| 特化を替える所 | 衰弱の猛打=回復量 −60%(PvP では強い)、捕獲=バリア+状態異常抵抗を下げる、殲滅=転倒+待ち時間、懲罰=継続ダメージ+HP 吸収 10% |\n| パッシブ | 激昂・衝撃的中を最大、生存意志も最大(大規模戦で倒される原因は拘束の連鎖) |\n| マクロ | PvE と同じ審判の列だけ。拘束技(捕獲・拿捕・神の懲罰)と移動技は手で |\n| 1対1 の流れ | 高潔の甲冑 → 破滅のシールドで入る → 左右クリック → 相手の気絶技を見てから懲罰 → 被弾が増えたら二重鎧かネザカンのシールド |\n| 5対5 の流れ | 捕獲でヒーラーか火力職を釣る → 逃げたら拿捕 → 範囲気絶 → 溜め懲罰 |\n| 準備 | アビスの羽根で Lv16、PvP 用ディーヴァニオン(金は PvP ダメージ耐性、青は状態異常抵抗) |\n\n### 11-0. おすすめの PvP 設定(10/31)\nグローバル版のテンプラー(종겜리아 10/20・ROX_Hyperion 10/22)の設定を土台にし、韓国の掲示板(11-1)の考え方を足した。**PvE の設定はそのまま残し、切り替えで使う**前提。\n\n**能力値**\n| 項目 | おすすめ | 理由 |\n|---|---|---|\n| 型の選び方 | 最初は**命中型**。ガードが 2,000 を超えて敏捷の効率が上がったら、ガード型も考える | 命中型は PvE と装備が同じで済む。ガード型は回避・ガードを積まない相手には強いが、魂刻印に敏捷・ガードが要る(11-1) |\n| 命中 | PvE の目安(1,150〜1,200)をまず超える | 命中は相手のガード・回避を1対1で打ち消す。PvP の目安の数字はグローバル版では未確認 |\n| 火力 | 前方ダメージ増幅 \u003e 武器ダメージ増幅 \u003e 強打 | PvP では強打が半分しか効かない(1% あたり 前方 0.8%・武器 0.6%・強打 約0.47%。韓国の計算、11-1) |\n| 耐性 | ダメージ耐性・武器ダメージ耐性・PvP ダメージ耐性・HP | ディーヴァニオンの金は PvP ダメージ耐性、青は状態異常抵抗(上の表) |\n| 種族理解度 | 2つ目のプリセットを PvP 用に。3・6・9番 = 命中、7番 = ダメージ耐性、2・8番 = HP | 戦闘中にキーで切り替えられる(7章) |\n\n**スキルのレベル(10/31。종겜리아・Ashura・Inven をまとめた目安。Lv20 にできるのは1〜2個なので順番を付けた)**\n| 順 | スキル | PvP の目標 | 理由 |\n|---|---|---|---|\n| 1 | 審判 | **20** | 全員一致。Lv20 で 追加ダメージ・確定クリティカル・待ち時間なし の3つ(PvE と同じ) |\n| 2 | 連続乱打 | **20** | Lv20 にしないと HP 吸収の特化が取れない(Ashura)。ダメージ +12%・追加の一撃と合わせて、PvP で耐える力の中心 |\n| 2 | 捕獲 | 20(余裕があれば) | Lv20 でバリア(HP の 10%)の特化。体力強化 Lv4 より効く(Inven) |\n| 4 | 懲罰 | 16 | 継続ダメージ・スキル速度 +30%・ガード回避無視。PvE と同じで変えない(Ashura) |\n| 4 | 猛烈な一撃・庇護の一撃 | 16 | 猛烈な一撃は HP 吸収と多段ヒット、庇護の一撃はバリア・ガード・ダメージ耐性(Ashura) |\n| 6 | 衰弱の猛打 | 12〜16 | **PvP だけで使う**。回復量を下げる技。ガード・回避無視の特化で必ず当てる(Ashura) |\n| 6 | シールド強打・シールド突撃・殲滅・衝撃解除 | 12 | シールド強打は「50% で衰弱の猛打」を取る。シールド突撃は射程と待ち時間。衝撃解除は HP 回復とダメージ耐性 |\n| — | 閃光乱舞 | 使わない | PvP では使わない(Ashura) |\n- Ashura は台湾版(グローバル版より先に始まった)の人で、動画は1か月より前。グローバル版のレベルの上限(1-2)に合わせて順番を付けたのはこちらの判断\n\n**スキルの特化(종겜리아。グローバル版。かっこは同じ人の PvE)**\n| スキル | PvP | PvE |\n|---|---|---|\n| 猛烈な一撃 | 4・5 | (3・4) |\n| 連続乱打 | 3・5 | (3・5) |\n| 審判 | 3・4・5(Lv20) | (3・4・5) |\n| 懲罰 | 2・3 | (2・3) |\n| 捕獲 | 2・3。韓国の掲示板では Lv20 にしてバリア(HP の 10%)の特化を勧める | (1・3) |\n| シールド強打 | 2・4 | (2・4) |\n| 衰弱の猛打 | **1・3**(PvE では使わない)。韓国では特化5で防御と治癒を下げ続けるのが強いという声 | (使わない) |\n| 庇護の一撃 | 2・4 | (1・4) |\n| シールド突撃 | 2・4 | — |\n| 殲滅 | 2・4 | (3・4) |\n| 衝撃解除 | 3・4 | (3) |\n- 特化の番号の中身は書いていない(動画どおりの番号)。グローバル版の画面で中身を確かめてから使う\n- (10/31)Ashura が選んだ特化の**中身**: 猛烈な一撃 = HP 吸収・多段ヒット / 連続乱打 = HP 吸収・ダメージ +12%・追加の一撃 / 捕獲 = 1対1 は**状態異常抵抗 +20%**と最大 HP、アビスでは再使用初期化と最大 HP / シールド強打 = 待ち時間 −2秒・50% で衰弱の猛打 / 衰弱の猛打 = ガード・回避無視 / 懲罰 = 継続ダメージ・スキル速度 +30%・ガード回避無視 / 衝撃解除 = HP 回復・ダメージ耐性\n\n**スティグマ**\n| 場面 | 構成 |\n|---|---|\n| 1対1(종겜리아) | **均衡の鎧 Lv20**・破滅のシールド・拿捕・保護のシールド |\n| パーティー戦・5対5・大規模戦(종겜리아・ROX) | 均衡の鎧の代わりに**戦友保護 Lv20**(受けたダメージをパーティーで分ける。狙われた味方が落ちにくい)。**拿捕**は3人を引き寄せる一番強い技(HP の 20% のバリアとダメージ耐性も付く) |\n| 韓国の掲示板の例(11-1) | 必須: 戦場の旗・二重鎧・保護のシールド・ネザカンのシールド |\n| 野外・アビス(Ashura、10/31) | 神の懲罰(行動不能無効の相手に +200%。Lv15 で PvE・PvP ダメージ増幅)・破滅のシールド(倒すと再使用初期化。一番先に上げる)・処刑の剣(相手の技を待ち時間にし、ガード・回避を下げる。Lv10 が大事)・ネザカンのシールド(魔法職・遠距離が相手のとき)。挑発・拿捕は試したが外した |\n\n**マクロ(종겜리아。韓国の배덕の「PvP・PvE 兼用マクロ」をグローバル版で使っている)**\n| 種類 | 中身 |\n|---|---|\n| ゲームのスキルマクロ | **審判の列だけ**(PvE と同じ) |\n| マウスのマクロ(右クリックを押している間) | 左クリック(スキルマクロ)と 6番の枠(殲滅)をくり返す。PvE でも同じ物を使える |\n| 手で押す物 | 捕獲・拿捕などの拘束技、破滅のシールド、懲罰、補助の技 |\n| 回し方(PvE の例) | 補助の技 → 懲罰を溜める → 破滅のシールドで入る → 右クリックを押し続ける。審判が光ったら懲罰、消えたら破滅のシールドで出し直す |\n\n**マクロの細かい作り方(10/31)**\n| 誰の | 中身 |\n|---|---|\n| 배덕(韓国。上の元の形) | ゲームのスキルマクロ = **審判の列だけ**を右クリックに。マウスのマクロ(押している間)= 左クリック(F1 のスキルマクロ)→ 6番の枠、離したときも左クリック。殲滅は拘束ではなく火力の技としてマクロに入れる。**手で押すのは 4番・Q・破滅のシールド・2番**(どの技を置くかは人による)。PvE も同じマクロで火力が上がった |\n| Ashura(台湾。野外・アビス用) | ゲームのスキルマクロは「**先頭のスキルから順に、使える物を撃つ**」しくみ。列の順 = 破滅のシールド → 殲滅 → 衰弱の猛打 → 連続乱打。殲滅(相手が倒れたときだけ)と衰弱の猛打(発動したときだけ)を連続乱打より前に置く。マウスの横ボタンに「庇護の一撃 → 審判」のマクロ。右クリックと横ボタンを交互に押す |\n| Ashura(1対1・闘技場用) | 破滅のシールドを列から外して手で押す(処刑の剣の前に置く)。入り方: 破滅のシールドで入る → 処刑の剣で倒す → 懲罰を溜める → 衰弱の猛打で回復を止める。連続乱打・殲滅・衰弱の猛打の列はそのまま |\n- キャンセルがうまく入ると、キャラクターに**黒い残像**が出る(Ashura)。通信の遅れ(ping)が大きいと入りにくい\n- マウスのマクロは、マウスのソフト(Razer・Logicool など)の機能を使う。**運営の規約でどう扱われるかは確かめていない**\n- 韓国では、パッチのあと殲滅を拘束ではなく火力の技として使う人が増えた(배덕)\n\n### 11-1. 韓国の掲示板(Inven のテンプラーの板)の PvP の話(10/30 に読んだ。9〜10月の書き込み。掲示板の話・未確認)\n韓国版はグローバル版より約10か月進んでいる。グローバル版の PvP が進むと、同じ流れになる可能性がある。\n| 項目 | 書かれていたこと |\n|---|---|\n| ガード型か命中型か | **どちらが上とは言えない**(10/20 の書き込み)。ガード型は、回避・ガードを積まない相手(グラディエーター・スピリットマスター・ソーサラー・チャンターなど)に強い。命中型は、回避・ガードを積む相手(アサシン・クレリック・レンジャー)に強く、捕獲や拘束が確実に入る。ガード型は魂刻印に敏捷・ガードを入れる分、パッシブを伸ばせない |\n| ガード型の体験談(10/28) | ガード約5,000(命中型のときは命中 約5,500)。「ガードは上位の人だけの物」と思っていたが、装備が弱めの人でもガード型にすると倒されにくくなった。上位の人は PvP ダメージ増幅を優先していて、命中を極めていないことが多いため |\n| 種族理解度(PvP) | 強打の代わりに**武器ダメージ増幅**か前方ダメージ増幅。耐性は**武器ダメージ耐性・前方ダメージ耐性・鉄壁**、命中に勝てそうになければガード(韓国版の枠の番号なので、グローバル版の枠とは違う) |\n| 1% あたりの火力の伸び(PvP、NotMeter の計算) | ダメージ増幅 0.4%、武器ダメージ増幅 0.6%、前方ダメージ増幅 0.8%(正面を取れたとき)、強打 約0.47%(PvP では強打が半分しか効かないとして) |\n| 特化 | 捕獲は Lv20 にして**バリアの特化**(HP の 10%。体力強化 Lv4 より効く)。衰弱の猛打は特化5で防御を下げ、治癒も下げ続ける(審判より 1.2〜1.3倍強いという測定)。シールド強打は「当たると 50% で衰弱の猛打」 |\n| 戦い方の変化(10/11) | 相手の状態異常抵抗が上がり、**拘束が入りにくくなった**。拘束を狙うより、張り付いて殴り続け、HP 吸収で耐える形に変えた人がいる。保護のシールドは1回だけ防ぐ、殲滅はなるべく使わない。武器・ガーダーの状態異常的中を外して多段ヒット的中に |\n| スティグマ(同じ人) | 必須: 戦場の旗・二重鎧・保護のシールド・ネザカンのシールド。ほかは 挑発・高潔の甲冑・破滅のシールド・戦友保護・拿捕・均衡の鎧から |\n| 韓国のテンプラーの不満 | 9/15 のパッチで主力技(連続乱打・懲罰の一撃・審判)の**キャンセルの遅れが増え**、手数が減った。PvP ではテンプラーが弱いという書き込みが多い(10月) |\n\n---\n\n## 12. 意見が割れていること\n| 点 | 意見 |\n|---|---|\n| 防御低下(衰弱の猛打・処刑の剣) | 効かない(Xia・Ashura・mattshew・trueeevil)/効く(Ulfhednar・Leonis・JPVariety)/Lv12 で入れるが外してもよい(굳손) |\n| 2番目の Lv20 | 懲罰(aLuckyRO・Ashura)/猛烈な一撃(Xia は どちらでも)/猛烈な一撃と連続乱打、懲罰は 12〜16(굳손) |\n| 懲罰をマクロに入れるか | 手で溜める(Xia・JPVariety) |\n| 強打かクリティカル ダメージ増幅か | 強打(韓国の多数・Antochi)/ボスの強打抵抗が高いとクリダメ(韓国の検証の1人)。グローバル版のボスの抵抗は未発表 |\n| 戦場の旗 | Lv20 からでないと弱い(Xia)/最初から入れる(Ulfhednar) |\n| ネックレスの戦闘速度 | 付く(Xia・Soulgrot)/上位20人にも刻印表にもない(データ) |\n| PvE で自然ガード型にするか | する: 上位のテンプラーの多くがしている、激昂が切れず自分の火力も落ちない(韓国 Inven 9月)/しない: 枠を火力に使うほうがよい(同) |\n| PvP でガード型か命中型か | 相手の職業しだいで、どちらが上とも言えない(韓国 Inven 10/20)。装備が弱めでもガード型で倒されにくくなった(同 10/28) |\n| 敏捷かガードか | 敏捷は「ガードの%」を上げる。ガードの元の値が約2,000を超えると、ほとんどの場合**敏捷のほうが得**(韓国 Inven 10/4 の計算表) |\n\n## 13. 注意\n- 外部のマウスマクロは NCSOFT が認めたことはない。ゲーム内マクロだけが無難\n- 低 ping=火力 という宣伝(ExitLag など)はスポンサー込み\n- 審判の連打を外部ソフトで速める方法(Ashura の旧版)は規約上危ない\n\n## 14. スキル名の対応(英語 → 日本語)\n| 種類 | 対応 |\n|---|---|\n| アクティブ | Vicious Strike=猛烈な一撃、Pummel=連続乱打、Poach=捕獲、Shield Smite=シールド強打、Judgment=審判、Flash Rampage=閃光乱舞、Debilitating Smash=衰弱の猛打、Warding Strike=庇護の一撃、Shield Rush=シールド突撃、Annihilate=殲滅、Punishment=懲罰、Defiance=衝撃解除 |\n| パッシブ | Fury=激昂、Insulting Roar=侮辱の咆哮、Punishing Benediction=断罪の加護、Impact Hit=衝撃的中、Enhance Health=HP強化、Ironclad Defense=鉄壁防御、Warding Shield=庇護のシールド、Guarding Seal=守護の印章、Survival Willpower=生存意志、Block Pain=苦痛遮断 |\n| スティグマ | Noble Armor=高潔の甲冑、Taunt=挑発、Doom Shield=破滅のシールド、Shield of Protection=保護のシールド、Battlefield Banner=戦場の旗、Empyrean Lord\u0027s Punishment=神の懲罰、Executing Blade=処刑の剣、Nezekan\u0027s Shield=ネザカンのシールド、Second Skin=二重鎧、Comrade in Arms=戦友保護、Grapple=拿捕、Armor of Balance=均衡の鎧、Assault Fury=強襲猛撃 |\n| 状態 | Shrink=萎縮、Stagger=グロッキー、Block=ガード、Double=強打 |\n\n## 15. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| Xia「テンプラー:完全PvE\u0026攻略ガイド」(cvv5gr19Zoo) | 10/19 | スキル・スティグマ・マクロ・刻印・アルカナ・種族理解度の最新版 |\n| Ulfhednar「テンプラー DPS ビルド」(c1T9XTyzw0w) | 10/18 | Sahara のビルド。衰弱の猛打を使う派 |\n| Leonis「壊れビルドで数百万ギーナ」(-7kEyKqn2w4) | 10/21 | 狩りビルド |\n| aLuckyRO「全8クラスの Lv16〜20 スキル」(lKmqp1HLaIw) | 10/20 | アルカナ |\n| Grobs「安価な強化術+ソウルバインド」(2vDVa75Y3XA) | 10/19 | 低 IL で +15 にしてから継承 |\n| Soulgrot「装備を正しく強化する方法」(jI9i3ChAAQc) | 10/18 | 部位ごとの刻印 |\n| NotMeter「クラス別装備・スキル構成」 | 10/22 | 上位20人の採用率 |\n| JPVariety「これだけでOK!最強テンプラービルド(最新版)」(fxui8babMrM) | 10/21 | 2つの型(戦場の旗/保護のシールド)、懲罰を手で、刻印 |\n| Antochi「テンプラーの能力値の優先順位: 強打かクリティカル ダメージか、ボスの抵抗」(I0nurD66BkA) | 10/23 | 能力値の順、強打抵抗、戦闘速度の段、神の能力値 |\n| 굳손「グローバル版 守護星のマクロの組み方」(_viFV1PHwok) | 10/23 | 特化の番号、スティグマの量、マクロ(韓国語) |\n| Moxsy「究極のダメージガイド」(WdnLK0n93JM) | 10/24 | ルドラの予想(命中 1,000〜1,200、クリティカル 1,200〜1,400。本人も「推測」) |\n| NoBS「テンプラー最強マクロローテーション」(ZiWtp1uY7vc) | 10/27、1.5万回 | マクロ(審判 → 殲滅)、衰弱の猛打を外す、懲罰の執行者 |\n| Fubgun「装備強化の正しい手順」(HGPVCjjhAjs) | 10/24、8万回 | 低い IL の唯一で +15 → 継承、唯一の集め方 |\n| Grobs「装備は製作すべき?」(J0Ioh9cjVeM) | 10/23、5万回 | 製作5行・ダンジョン4行、突破も継承で移る |\n| XifanGG「種族理解度ガイド(全職業)」(MqWMhCpsCL4) | 10/26、7.5万回 | 枠ごとの狙い、残す数値の目安 |\n| 성한의 게임 공략「수호성 자연 막기 기준 펫 이해도 세팅 방법」(hxeWV-TJukM) | 10/22、4,576回 | 韓国のテンプラーの実際の種族理解度(ガード型)、前方ダメージ増幅と強打の配分 |\n| 갓신사「이해도 PVE+PVP 가이드」(TEttCMYHPhQ) | 10/2ごろ、7.1万回 | プリセット3つの作り方と切り替え、PvP の枠。1か月近く前・韓国版 |\n| 김뚱냥이「달라진 펫 이해도」(-FsjO9nvR94) | 10/16ごろ、9,098回 | グローバル版の枠の並び(韓国版と違う) |\n| Sen Evades「Best Stat Rolls for Every Class」(IagIrnagpxI) | 10/26、1.2万回 | 4番の狙い(グラディエーター目線)、1番は追加攻撃力 |\n| Mosu「A\u0027dan Z\u0027ye Templar Rehberi」(mZjH7sQ23YE) | 10/29、1,270回 | グローバル版のテンプラーの自動分析の設定(枠ごと) |\n| 종겜리아「아이온2글로벌 수호성 PVE PVP 스킬 및 스티그마 최신 셋팅」(ullM76Z0uJE) | 10/20、5,742回 | グローバル版の PvP の特化・スティグマ・マクロ |\n| 배덕「[아이온2] 수호성 하이브리드 매크로｜PVP·PVE 하나로 끝!」(icrJkntfkHw) | 10月上旬、1.99万回 | PvP・PvE 兼用マクロの作り方(10/31) |\n| Ashura Whole Heavens「AION 2 TEMPLAR ULTIMATE GUIDE! PvP \u0026 PvE BUILD」(e8xxp9XuqZM) | 1か月より前・台湾版、3.8万回 | PvP の特化の中身・スキルのレベル・スティグマ(10/31) |\n| Ashura Whole Heavens「You\u0027re Using the WRONG Templar Macros」(1ebgmpl1YxQ) | 1か月より前・台湾版、3.6万回 | 野外用・1対1用のマクロ、キャンセルの見分け方(10/31) |\n| 배덕「수호성 하이브리드 매크로」(icrJkntfkHw) | 10/3ごろ、1.9万回 | PvP・PvE 兼用のマウスのマクロ(韓国版) |\n| Chacal「職業ティアリスト」(SGINL3w6yf4、ポルトガル語) | 10/27、1.3万回 | テンプラーは一番上の段。PvP では動きが遅めなのが弱点 |\n| Inven テンプラーの板 人気の書き込み(26901 戦闘速度の段、27401 敏捷とガード、27158 自然ガードの組み方、27648・27525・27741 PvP、27545・27041 パッチの流れ) | 9/17〜10/28 | 11-1章・12章・5-1 |\n| Inven テンプラーの板「자연막기 고민중인 수호성입니다」(inven.co.kr/board/aion2/6438/26269) と「자연막기」の検索結果 | 9/15、返信28 | 韓国版の自然ガード型のガードの量・集め方・種族理解度(掲示板の話・未確認) |\n| CAHOS GAMING「mejorar el daño de tu Templar」(f_f8m9tP7YE) | 10/16ごろ、9,887回 | テンプラーの種族理解度の狙い |\n| 韓国: 왕소랑「命中はいくら要る?」(oFJPnTFsXqI)、쵸피「受け流しを消す命中」(pyTmZ7_pn20)、강주「聖域と超越での命中の期待値」(wbFWPllUA2w)、오지조「新しい聖域に向けた最新メタ」(npTLwJXBPs0) | 2025/12〜2026/3ごろ | 命中の目安の実測。グローバル版は韓国版の約10か月遅れで同じコンテンツなので、1か月より古いがこれを使った |\n| 以前の出典(Ashura、NoBS、StingKnight、trueeevil、Antochi、mattshew ほか) | 10/12〜10/21 | `_古い版/` の各まとめ |\n"},{"id":"ranger","tab":"レンジャー","title":"レンジャー まとめ","file":"レンジャー_まとめ.md","md":"# レンジャー まとめ(2026-10-31 最新)\n\n10/23 の「レンジャー・チャンター・クレリックのビルド」のレンジャーの部分を土台に、10/13〜10/23 の動画8本で調べ直した。スキル名・特化の文は questlog.gg の日本語版データの正式名。\n特化は「Lv8で1つ、Lv12で2つ、Lv16で2つ(入れ替え可)、Lv20で3つ」。表の番号は特化の並び順(1〜5)。\n\n## 0. 今の結論(まずここだけ見る)\n| 項目 | 結論 |\n|---|---|\n| 最優先 | スティグマ **バイゼルの権能を Lv20**(クリティカル時50%で全スキルの再使用 −1秒)。これで一気に強くなる(全員一致) |\n| スキル | **必中の矢を Lv16**(追加ダメージ。1発4万 → 6万に)、**速射を Lv16**。終盤は必中の矢がダメージの40〜50% |\n| パッシブ | **集中の眼**が一番。ハンターの決意・ハンターの魂はクリティカル上限50%の影響で下がった(Krix)。ただしハンターの魂はダメージの約10%を出す(Moxsy) |\n| 回し方 | 左クリック(狙撃)・マクロ・必中の矢の**3つを押し続ける**。標的の矢は約15秒ごとに手で |\n| 設定 | **スキルキュー(スキルの予約)を OFF**。左右クリックの動作の途中で次を出す(動作キャンセル)ため(Krix) |\n| 装備 | 武器・ガーダーは戦闘速度・武器ダメージ増幅・ダメージ増幅・威力・攻撃力。防具のパッシブは集中の眼。リングは 必中の矢・狙撃・狂風の矢・鋭穿の矢 |\n| 弱点 | 立ち上がりが遅い(必中の矢とバイゼルが育つまで)。体が弱い。多くの技は4mの範囲しか巻き込まない |\n\n| **10/31 の流れ** | 職業の強さの評判(Chacal 10/27、ブラジル): **レンジャーは今一番火力が低い**と言われ、パーティーに入れてもらいにくい(同じ腕・戦闘力ならチャンターの約半分という体感)。強い所は狩りの速さと遠くから安全に殴れること。KiraSaveTheWorld(10/27)は、**グロッキーを取る役がいないダンジョンでは、スティグマのグリフォンの矢を矢嵐に替える**(グロッキーのゲージを大きく削る)。必中の矢の前に標的の矢の効果(クリティカル +300・完璧)が付いているかを見る |\n---\n\n## 1. スキル\n\n### 1-1. 優先順\n| 優先 | スキル | 目標 | 理由 |\n|---|---|---|---|\n| 1 | **必中の矢**(溜めの大技) | 16 → 20 | Lv16 の特化5「的中時に追加ダメージ」で大きく伸びる。終盤のダメージの40〜50% |\n| 1 | **速射**(右クリックの主力) | 16 | Lv16 でスキル速度+20% |\n| 2 | 狙撃(左クリック。MP 回復) | 20 | 必中の矢の再使用を減らす。Krix は Lv20 にする |\n| 2 | 鋭穿の矢 | 20 | クリティカルのあとに使える。Lv16 で1回追加発動 |\n| 2 | 狂風の矢 | 16 | 戦闘速度・PvE ダメージの強化。Lv16 で再使用 −10秒(稼働100%) |\n| 3 | 破裂の矢 | 20(最後) | 鈍化・束縛の敵に使える |\n| 4 | 標的の矢 | 低くてよい | 開幕の強化(クリティカル・完璧)。Lv16 未満で十分 |\n| 4 | 捕縛の矢 | 中 | 鈍化+スキル速度 |\n| — | 爆発の罠 | 狩りだけ | 1番「爆発時に敵を引き寄せる」で集める。ボスでは使わない |\n| — | 制圧の矢 | 手で温存 | ボスの大技の直前に気絶値を入れて止める(Moxsy) |\n| — | 矢乱射 | 使わない | グロッキー中も、ほかの技のほうが強い(全員一致) |\n\n- 上げ方: スキルポイントで10、ディーヴァニオンで+4、リング・武器・ガーダーの刻印、アルカナ\n- Lv45 ですべての地域クエストを終えると、ほぼ全スキル Lv10(FRESHY)\n\n### 1-2. 特化(PvE)\n| スキル | Lv8 | Lv12 | Lv16 | Lv20 |\n|---|---|---|---|---|\n| 狙撃 | 3 多段ヒット+50%(MP が足りなければ 1 MP回復) | 3+4(4=必中の矢の再使用 −1秒) | 4+5(5=連続スキル[疾風の矢]) | 3+4+5 |\n| 速射 | 3 対象が少ないほど+12% | 2+3(2=クリティカル+10%) | 3+5(5=スキル速度+20%) | 2+3+5 |\n| 必中の矢 | 2 スキル速度+30% | 2+3(3=移動可能) | 2+5(5=追加ダメージ) | 2+3+5(命中が足りない所では 4=ガード・回避無視) |\n| 鋭穿の矢 | 3 スキル速度+20% | 3+4(4=必ず多段ヒット) | 3+5(5=1回追加) | 3+4+5(アビス狩りは1=HP吸収) |\n| 狂風の矢 | 1 持続+5秒 | 1+4 | 4+5(5=再使用 −10秒) | 3+4+5 |\n| 破裂の矢 | 2 多段ヒット+50% | 3+4 | | 2+4+5 |\n| 標的の矢 | 3 持続+5秒 | 1+3(1=完璧+5%) | | |\n| 捕縛の矢 | 2 スキル速度(動きたいなら 3 移動可能) | 2+3 | | |\n| 爆発の罠 | 3 3秒後に追加 | 1+3(1=引き寄せ) | | |\n| 衝撃解除 | 3 HP20%回復 | | | |\n- 出典: JOHNPAL の資料(10/17)、Krix Domi(10/23)、Moxsy(10/12)\n\n---\n\n## 2. パッシブ\n| 優先 | パッシブ | 補足 |\n|---|---|---|\n| 1 | **集中の眼** | 命中・PvE ダメージ増幅・強打。Krix は「今のグローバル版で本当に役立つのはこれだけ」 |\n| 2 | ハンターの魂 | クリティカル時に追加ダメージ。ダメージの約10%(Moxsy の実測) |\n| 2 | ハンターの決意 | クリティカル ダメージ増幅。クリティカルの上限が80%→50%に下がって価値が落ちた |\n| 4 | 集中砲火、束縛の眼、近接射撃 | 継続ダメージ・鈍化した敵・近くの敵に追加ダメージ |\n| 5 | 警戒の目、風の活力、抵抗の決意、蘇生の契約 | 守り。PvP で大事 |\n\n---\n\n## 3. スティグマ\n| スティグマ | 目標 | 理由 |\n|---|---|---|\n| **バイゼルの権能** | **20 が最優先** | 20でクリティカル時に50%で全スキルの再使用 −1秒。ほかを1にしてでも先に(Krix・Moxsy・FRESHY) |\n| 支援射撃 | 10 → 15 | 追加の射撃と回復。10・15 で持続と再使用が良くなる |\n| 祝福のボウ | 5 → 20 | 5で多段ヒット+50%。20で強打+7%。15(クリティカル ダメージ)はクリティカル上限の影響で後回し(Krix) |\n| グリフォンの矢 / 爆発の矢 | どちらか1つ | 少ないポイントでは**爆発の矢 Lv5**(再使用 −15秒)。**グリフォンの矢は Lv15** で受けるダメージが増える効果が付いてから(Moxsy・Krix)。FRESHY は「Lv20 なら爆発の矢が上」 |\n\n- Krix の配り方: バイゼル 20 → 支援射撃 15 → グリフォン 15 → 祝福のボウ 20 → 支援射撃 20\n- スティグマのかけらは アビス(一番多い)、悪夢、シューゴフェスタ。アビスの「タイル」は PvP 専用なので買わない\n- PvP で使う物: 大自然の息吹(守り)、奇襲蹴り、矢嵐(攻め)、幻影の矢・封印の矢(1対1で特定の職業に)\n\n---\n\n## 4. マクロと回し方\n### 4-1. マクロ(右クリック。Moxsy・JOHNPAL)\n| 段 | 中身(上から順に試す) |\n|---|---|\n| 1 | 狂風の矢 → 捕縛の矢 → 爆発の矢(またはグリフォンの矢) |\n| 2 | 鋭穿の矢 |\n| 3 | 破裂の矢 → バイゼルの権能 → 祝福のボウ → 支援射撃 |\n| 4 | 鋭穿の矢(Lv16 で追加発動があるので2回入れる) |\n| 空いたとき | 速射 |\n\n- 強化(バイゼル・ボウ・支援射撃)を入れておくと、雑魚では出ず、体力のある敵で出る。バイゼルが 20 なら勝手に戻るので、マクロに入れても損は小さい(Moxsy)。最大火力を狙うなら手で\n- **必中の矢はマクロに入れない**(溜めの1段目しか出ない)。**制圧の矢と爆発の罠も入れない**\n- 遅延: ping 50 未満は10ミリ秒、80〜100 以上は40〜50ミリ秒\n\n### 4-2. 回し方(ボス)\n1. 強化(バイゼル・ボウ・支援射撃)を手で → 標的の矢\n2. 狂風の矢とグリフォンの矢が出たら、**マクロ・狙撃(左)・必中の矢の3つを押し続ける**(押す順は マクロ → 狙撃 → 必中の矢)\n3. **標的の矢は約15秒ごと**、必中の矢の前に。効果が残り1秒ほどで掛け直す(早すぎると損)\n4. 狙撃を挟むと MP が切れず、必中の矢の再使用も減る\n- **設定: スキルキュー OFF**(左右クリックで動作を途中で切って速く撃つため。Krix)。ターゲットは「カメラ前方優先」、「スキル使用時の自動ターゲット」ON\n\n---\n\n## 5. 装備の刻印(魂刻印)\n| 部位 | 狙う物 | 出典 |\n|---|---|---|\n| 弓・ガーダー | 戦闘速度、武器ダメージ増幅、ダメージ増幅、威力、攻撃力(多段ヒット的中も良い) | Krix・JOHNPAL・FRESHY。**正確(クリティカル)は今は要らない**(クリティカル上限50%にすぐ届く。Krix) |\n| ヘルム | 強打・攻撃力増加(PvP は受ける治癒量) | |\n| ショルダー | クリティカル ダメージ増幅 | |\n| トップス | ダメージ増幅 | |\n| グローブ | **戦闘速度** | |\n| ボトムス・マント | 完璧、ダメージ耐性(マントは強打) | |\n| シューズ | 移動速度 | |\n| リング | **威力+スキル: 必中の矢・狙撃・狂風の矢・鋭穿の矢** | Krix |\n| イヤリング | パッシブ: ハンターの魂・集中の眼・ハンターの決意・集中砲火 | FRESHY |\n| ネックレス | アクティブ2つ+攻撃力・クリティカル | FRESHY |\n- **防具のパッシブは集中の眼**(Krix)\n- 前方ダメージ増幅を取れる所では取る。取れなければ攻撃力(Krix)。前方・後方ダメージ増幅を1つずつどこかに持っておく(Moxsy)\n- 魔石: 前方/後方ダメージ ≧ 攻撃力 \u003e 武器ダメージ増幅 \u003e クリティカル・命中。クリティカルより命中(JOHNPAL)\n- 命中の目安 1,000〜1,200(祝福のボウの+300込み)。ルドラは命中が要るので、必中の矢の特化を「ガード・回避無視」に替える(Krix)\n\n---\n\n## 6. アルカナ(Krix 10/23)\n| カード | 能力値の種類 | 狙うスキル |\n|---|---|---|\n| 聖杯 | **活力**(時間=戦闘速度) | 最初は**必中の矢**を指定して作る。理想は 集中の眼 +4 と アクティブ2つ +2 |\n| 羊皮紙 | どちらでもよい | 鋭穿の矢 +4、速射・狙撃 +2 など |\n| コンパス | 死(クリティカル)→ ルドラ用に自由(命中) | アクティブ +4 と もう1つ +2。標的の矢・制圧の矢・矢乱射は要らない |\n| 鐘 | **魔力**(破壊=攻撃力) | ハンターの決意 +4 |\n| 鏡 | **魔力**(知恵=強打) | **集中の眼 +4** |\n- 目標: 主力スキルにアルカナで +4(ディーヴァニオン4+リング2+スキル10と合わせて Lv20)\n- 神の能力値: **幻想(待ち時間)と知恵(強打)**を重ねる。像は足りない方(自由=命中、死=クリティカル)\n\n## 7. 種族理解度(Krix)\n| 種族 | 4番 |\n|---|---|\n| 知性 | ダメージ増幅・PvE ダメージ増幅(クリティカル ダメージ増幅は高くても振り直した) |\n| 野性 | 武器ダメージ増幅 |\n| 自然 | PvE ダメージ増幅(多段ヒット・完璧は数値が低い) |\n| 変形 | **前方ダメージ増幅**(PvE ダメージ増幅より上) |\n| 特殊 | **強打** |\n- 1・5番は最大攻撃力と追加攻撃力(今はどちらも同じくらい。ずっと先は最大攻撃力)\n\n## 8. ディーヴァニオン\n- 角(オレンジ)を全部 → 主力スキル(必中の矢・速射・狙撃・鋭穿の矢・狂風の矢)→ パッシブ(集中の眼・ハンターの魂・ハンターの決意)→ 攻撃力・クリティカルの小さいノード。防御とMPは後回し\n- 400 点前後で角は全部取れる(FRESHY)。Fubgun・JOHNPAL・Moxsy が questlog.gg に盤面を載せている\n\n## 9. 狩り\n- **一番強い狩りの職業の1つ**。マクロを押して回るだけで周りが倒れる(JOHNPAL)\n- 遠くの敵を撃って集め → 標的の矢と爆発の罠で引き寄せ → まとめて倒す(Moxsy)\n- ひとりのときは狙撃を「HP 吸収」に替えると、0.5秒ごとに約300回復(Moxsy)\n\n## 10. 翼・称号\n| 種類 | おすすめ |\n|---|---|\n| 翼 | タリスラの翼(シーズンショップ。待ち時間短縮)が一番。ダークヴェールの翼、森の精霊の翼 |\n| 称号 | テンプラーと同じ(Unbound by Genus など) |\n\n## 11. PvP(FRESHY 9/30、台湾版の情報をもとに)\n| 項目 | 内容 |\n|---|---|\n| 装備 | アビスの店の PvP 装備(3段階)+武器は PvE の製作武器 |\n| 刻印 | 武器・ガーダーは PvE と同じ。ヘルムは受ける治癒量。命中と回避が大事 |\n| スキルを Lv20 に | 必中の矢、鋭穿の矢、破裂の矢、狂風の矢 |\n| 特化 | 速射=クリティカル・少ない対象・ノックバック、標的の矢=完璧・ノックバック・ガード回避無視でクリティカル、必中の矢=移動可能・ガード回避無視・追加ダメージ、衝撃解除=Lv12 で HP 回復と耐性 |\n| スティグマ | バイゼルの権能・祝福のボウは固定。火力ならグリフォン・爆発の矢、守りなら大自然の息吹・奇襲蹴り、1対1なら幻影の矢・封印の矢 |\n| 動き | 「マクロ20%、手80%」。距離を取り、鈍化・束縛で止め、**標的の矢の直後に必中の矢**。守りの技は相手が寄ってきたときのために温存 |\n\n## 12. 意見が割れていること\n| 点 | 意見 |\n|---|---|\n| ハンターの決意・ハンターの魂 | 価値が下がった(Krix)/ハンターの魂はダメージの10%(Moxsy)/決意と集中の眼が最重要(FRESHY・Fubgun) |\n| グリフォンと爆発の矢 | 少ないうちは爆発、Lv15 からグリフォン(Moxsy・Krix・JOHNPAL)/グリフォンが先で Lv20 なら爆発(FRESHY) |\n| 狙撃の Lv20 | Krix は Lv20 にする/ほかはそこまで言わない |\n\n## 13. 名前の対応(英語 → 日本語)\n| 種類 | 対応 |\n|---|---|\n| アクティブ | Snipe=狙撃、Tempest Shot=速射、Deadshot=必中の矢、Drill Dart=鋭穿の矢、Gale Arrow=狂風の矢、Burst Arrow=破裂の矢、Marking Shot=標的の矢、Snare Shot=捕縛の矢、Explosion Trap=爆発の罠、Suppressing Arrow=制圧の矢、Arrow Scattershot=矢乱射、Defiance=衝撃解除 |\n| パッシブ | Focused Eye=集中の眼、Hunter\u0027s Resolve=ハンターの決意、Hunter\u0027s Soul=ハンターの魂、Concentrated Fire=集中砲火、Rooting Eye=束縛の眼、Melee Fire=近接射撃、Vigilant Eye=警戒の目、Wind Vigor=風の活力、Unyielding Resolve=抵抗の決意、Revitalization Contract=蘇生の契約 |\n| スティグマ | Vaizel\u0027s Authority=バイゼルの権能、Bow of Blessing=祝福のボウ、Supporting Fire=支援射撃、Griffon Arrow=グリフォンの矢、Explosive Arrow=爆発の矢、Mother Nature\u0027s Breath=大自然の息吹、Ambush Kick=奇襲蹴り、Arrow Storm=矢嵐、Illusory Arrow=幻影の矢、Sealing Arrow=封印の矢、Ensnaring Trap=結縛の罠、Stealth=隠れ身 |\n\n## 14. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| Krix Domi「Ranger is BROKEN(Rank 1 Build)」(go6P1BBAlMg) | 10/23 | NotMeter で1位多数。特化・パッシブ・スティグマ・刻印・アルカナ・種族理解度 |\n| JOHNPAL TV「レンジャー究極攻略ガイド」(otTvwv5pG1s)と資料 | 10/17 | 特化の番号、マクロ、刻印の優先順 |\n| Moxsy「DPS 5万超え!レンジャー最強ビルド最新版」(dHIm6D2KPMc) | 10/12 | 終盤の実測、マクロ、回し方 |\n| FRESHY「Best Ranger PVE Build」(1Et2C2-c8po)、「PvP Build Guide」(8i-KegEYvdQ) | 10/11、9/30 | 刻印、PvP |\n| Fubgun「レンジャーのエンドゲーム」(GdAakaOGPLo) | 10/10 | パッシブ、ディーヴァニオン |\n| KaidGames「レンジャーが弱い理由と改善策」(Pkb5plpH3zM) | 10/16 | 序盤の特化、マクロの遅延 |\n| Moxsy「最強レンジャー完全ガイド」(VsvTt5JkEzY) | 10/5 | 上げ方 |\n| Chacal「職業ティアリスト」(SGINL3w6yf4、ポルトガル語) | 10/27、1.3万回 | 職業の強さの評判 |\n| KiraSaveTheWorld「レンジャー完全ガイド」(hFV_btEbN6g、ポルトガル語) | 10/27、1.8万回 | 矢嵐への入れ替え、マクロの優先順 |\n"},{"id":"chanter","tab":"チャンター","title":"チャンター まとめ","file":"チャンター_まとめ.md","md":"# チャンター まとめ(2026-10-31 最新)\n\n10/23 の「レンジャー・チャンター・クレリックのビルド」のチャンターの部分を土台に、10/5〜10/23 の動画8本で調べ直した。スキル名・特化の文は questlog.gg の日本語版データの正式名。\n特化は「Lv8で1つ、Lv12で2つ、Lv16で2つ(入れ替え可)、Lv20で3つ」。表の番号は特化の並び順(1〜5)。\n\n## 0. 今の結論(まずここだけ見る)\n| 項目 | 結論 |\n|---|---|\n| 役割 | 分類は支援だが、**今の調整では火力がとても高い**。早い段階から強い(gigawhale、グローバル版1位) |\n| 最優先 | **岩撃砕を Lv16**(再使用時間がなくなり連打できる)→ Lv20。次に撃破砕・回転撃を Lv20 |\n| スティグマ | **不敗のマントラ 20** と **疾風の権能 20** は固定。守護の祝福は **Lv15 にしてから**(風の約束が1.5倍) |\n| パッシブ | **風の約束 \u003e 攻撃準備 \u003e 衝撃的中** だけ上げる |\n| 装備 | **クリティカルは要らない**(岩撃砕・回転撃が確定クリティカル)。攻撃力 \u003e 強打 \u003e 武器ダメージ増幅 \u003e ダメージ増幅系 \u003e 戦闘速度(90.5% まで)(Antochi) |\n| マクロ | 岩撃砕 → 回転撃 → マルクタンの怒り → 打撃砕 を**同じ段**に入れ、空いたら百裂撃。左クリック(撃破砕)と右クリックを押し続ける |\n| ダメージの中心 | 岩撃砕とその連続スキル 貫通砕 で約4割 |\n\n| **10/31 の流れ** | 職業の強さの評判(Chacal 10/27、ブラジル): **クレリック・テンプラーと並んで一番上**。「今は壊れている」と言われるほど火力が高く、PvP でも同じ火力が出る。Şükrü(10/27、220時間遊んだ人)の形も上の結論と同じ。追加の点: ① 突進撃破は敵を倒すと再使用時間が戻るので、狩りでは敵から敵へ飛び移る ② マウスの右で連続のマクロ、同時に左も押したままにして基本攻撃で動作の隙を消す ③ **ロッドの神石は範囲の効果の物**(ほとんどの技が4体に当たるので発動が多い) ④ 自分の火力を最優先するなら、疾走のマントラの代わりに守護の祝福 Lv15 |\n---\n\n## 1. スキル\n\n### 1-1. 優先順\n**Lv16: 岩撃砕 → 撃破砕 → 回転撃・百裂撃。Lv20: 岩撃砕 → 撃破砕 = 回転撃**(gigawhale・notXeon・Grobs 一致)。PvP なら 岩撃砕 → 快癒の呪文 → 回転撃\n\n| スキル | 役割 | 目標 |\n|---|---|---|\n| **岩撃砕** | 主力。回転撃・マルクタンの怒り・打撃砕を使った直後の数秒だけ使える。Lv16 で再使用時間なし | 16 → 20 |\n| 撃破砕 | 左クリック。MP が増える。Lv16 で4段目[暴風砕] | 20 |\n| 回転撃 | 岩撃砕を開く。クリティカル ダメージ +15%(2回で+30%) | 20 |\n| 百裂撃 | 右クリックの基本(MP を使う) | 16 |\n| 打撃砕 | 岩撃砕を開く+気絶 | 12〜16 |\n| 突進撃破 | 移動。Lv12 で敵を倒すと再使用が戻る(狩りが速い) | 12 |\n| 震動砕 | 2つ目の移動(回避のあとに使える) | 8〜12 |\n| 快癒の呪文 | パーティーの回復 | 12〜16(PvP は 20) |\n| 疾風乱舞・波動撃・裂波撃 | PvE では使わない(疾風乱舞は Lv16 でないと意味がなく、それでも火力が下がる) | |\n\n### 1-2. 特化(PvE)\n| スキル | Lv8〜12 | Lv16 | Lv20 |\n|---|---|---|---|\n| 岩撃砕 | 3 確定クリティカル、4 連続スキル[貫通砕] | +5 再使用時間削除(**最重要**) | 3+4+5 |\n| 撃破砕 | 2 HP 吸収、3 多段ヒット+50% | 4+5(**4 回転撃の再使用 −1秒は必ず**、5=[暴風砕]) | 3+4+5 |\n| 回転撃 | 1 再使用 −5秒、3 対象が少ないほど+20% | 1+5(5=確定クリティカル) | 1+3+5 |\n| 百裂撃 | 3 対象が少ないほど+12% | 3+5(5=ガード・回避無視) | |\n| 打撃砕 | 3 移動可能 | 3+4(4=スキル速度+30%) | |\n| 突進撃破 | Lv12 で 4 敵を倒すと再使用初期化 | | |\n| 震動砕 | 2 射程+10m(突進撃破と同じ射程) | 2+3 | |\n| 快癒の呪文 | 1 連続+1回と持続回復、Lv12 で +4 HP5% | 1+5(5=再使用 −3秒) | PvP は 2 デバフ解除 |\n\n---\n\n## 2. パッシブ\n| 優先 | パッシブ | 理由 |\n|---|---|---|\n| 1 | **風の約束** | クリティカル ダメージ増幅。主力が確定クリティカルなので一番効く。1レベルで約0.44%(攻撃準備・衝撃的中の2倍以上。Antochi が韓国の計算を紹介) |\n| 2 | 攻撃準備 | PvE ダメージ増幅・防御・命中 |\n| 3 | 衝撃的中 | 強打 |\n| — | 保護陣 | 攻撃10回でパーティーにバリア。上げなくてよいが仕組みは知っておく |\n| — | 十字防御、生存意志 | PvP・守り |\n\n---\n\n## 3. スティグマ\n| スティグマ | 目標 | 理由 |\n|---|---|---|\n| **不敗のマントラ** | **20 が最優先** | パーティー全体の PvE ダメージ増幅・耐性。20で強打+5% |\n| **疾風の権能** | 5 → 20 | 5で再使用 −30秒。6〜15 はほぼ差がない。20で自分の攻撃力+20%、仲間+10% |\n| マルクタンの怒り | 5〜10 | 岩撃砕を開く(連打用)。PvP は 15 で回復阻害 |\n| 守護の祝福 | **15**(15未満なら入れない) | 15で風の約束が1.5倍。2分持続 |\n| 疾走のマントラ | 序盤・速さ重視・地上の PvP | 移動速度でパーティーが攻撃を避けやすい |\n\n- 入れ替え: グロッキーが要る → 滅火、ガードが効くボス(ルドラなど)→ 集中防御、パーティーを守る → 遮断の権能、回復 → 快癒の手(15でデバフ5個解除)\n- 序盤は粉砕撃(防御 −30%)も強い(Grobs)\n- **クレリックの一部のスキルと重ならない**: 不敗のマントラとクレリックの保護の光は、同じレベルならマントラが優先\n\n---\n\n## 4. マクロと回し方\n### 4-1. マクロ(右クリック)\n| 段 | 中身(上から順に試す) |\n|---|---|\n| 1 | **岩撃砕 → 回転撃 → マルクタンの怒り → 打撃砕**(4つを同じ段に) |\n| 2 | 百裂撃 |\n| 別(任意) | 守護の祝福(持続と再使用が2分なので入れてよい) |\n- 仕組み: 引き金の技を使う → 岩撃砕が使えるようになる → マクロが岩撃砕に戻る → 次の引き金…と自動で回る\n- notXeon はマルクタンの怒りを外し、岩撃砕が止まったときに手で押す\n- 人形での最大火力の計測では、守護の祝福をマクロに入れると5〜10%下がることがある(ping で崩れる)。普段は入れてよい(gigawhale)\n\n### 4-2. 回し方\n1. 疾風の権能でパーティーを強化(マルクタンの怒りを先にすると、それも強化される)\n2. 突進撃破で飛び込む → 左右クリックを押し続ける\n3. 減った人がいたら快癒の呪文\n- 料理・巻物: 速度・勇気の巻物、パワーシャードは周回でも使う。高い料理(攻撃力+25 など)は大事なときだけ(gigawhale)\n\n---\n\n## 5. 装備の刻印(Antochi 10/23 の能力値の順。韓国の検証とグローバル版の上位を元に)\n**攻撃力 \u003e 強打 \u003e 武器ダメージ増幅 \u003e 前方/後方ダメージ・ダメージ増幅・クリティカル ダメージ増幅(ほぼ同じ)\u003e 戦闘速度(90.5%まで)\u003e 完璧(70〜80%まで)\u003e クリティカル \u003e 待ち時間短縮**\n\n| 能力値 | なぜその順か |\n|---|---|\n| 攻撃力 | ほぼ全部位に付き、ボスの抵抗で削られない。回復量も上がる(生命の祝福) |\n| 強打 | ボスの**強打抵抗**(韓国の難しいボスで30〜40)を超えるまでほぼ効かない。超えると全部効く。自分の強打の合計を見て判断 |\n| 戦闘速度 | 少しずつではなく**区切りで速くなる**。岩撃砕は 82.5%、貫通砕は **90.5%** が目標(韓国の検証。グローバル版では未検証) |\n| クリティカル | 岩撃砕と回転撃は確定クリティカル。上限50%もあり、ほぼ要らない |\n| 命中 | 後ろから殴ればボスのガードを無視できるので、足りていれば要らない |\n\n| 部位 | 狙う物 |\n|---|---|\n| ワンド・ガーダー | 武器ダメージ増幅、戦闘速度、ダメージ増幅、威力(PvP は 戦闘速度 → ダメージ増幅 → 威力 → 正確 → 状態異常的中) |\n| ヘルム・マント | 強打、攻撃力増加 |\n| ショルダー | 強打、クリティカル ダメージ増幅 |\n| トップス | ダメージ増幅(+完璧) |\n| グローブ | 戦闘速度(+完璧) |\n| ボトムス・シューズ | 完璧(シューズは移動速度) |\n| リング | スキル: **岩撃砕・撃破砕**(次に回転撃) |\n| イヤリング・ネックレス | 攻撃力+**風の約束**(ネックレスは戦闘速度も。MFIA) |\n- 魔石: ダメージ増幅系は約200回に1回しか出ない。出るまで攻撃力で埋める\n- 武器: 炎の神殿の武器は射程+2m(PvP や一部のボスで便利)、製作武器は刻印5行で最終的に強い(notXeon)\n\n## 6. アルカナ\n| カード | 能力値の種類 | 狙うスキル |\n|---|---|---|\n| 聖杯 | 活力(時間=戦闘速度) | 岩撃砕を指定。風の約束・衝撃的中が付けば良い |\n| 羊皮紙 | 生命(HP と再生) | **岩撃砕・撃破砕・回転撃・突進撃破**(波動撃・裂波撃は外れ) |\n| コンパス | どちらでも | 快癒の呪文・打撃砕・百裂撃・震動砕(衝撃解除・疾風乱舞は外れ) |\n| 鐘 | **魔力**(破壊=攻撃力) | 攻撃準備 → 生命の祝福 → 生存意志(激怒の呪文は外れ) |\n| 鏡 | **魔力**(知恵=強打)。PvP は幻想 | **風の約束 → 衝撃的中**(十字防御は外れ) |\n- 神の能力値: **知恵 \u003e 破壊・時間 \u003e 幻想 \u003e 正義 \u003e 空間**(Antochi)。**グローバル版は1点=0.1%**(韓国の攻略は0.2%で書かれているので半分に読む)\n- 鏡は知恵(強打)と幻想(待ち時間)のどちらか。韓国の人形の検証では、待ち時間が増えても強打の減少を取り戻せなかった → 強打がボスの抵抗を超えているなら知恵\n- 上位のグローバル版チャンターは 時間 約76・破壊 約75・知恵 約51(Antochi)\n- Lv20 にしたスキルの20を超えた分は無駄。カードとリングで振り分ける(notXeon)\n\n## 7. 種族理解度\n| 枠 | おすすめ |\n|---|---|\n| 4番 | クリティカル ダメージ増幅 か ダメージ増幅。**特殊ペットの4番は強打** |\n| ほか | 攻撃力。攻撃力が付かない枠はパワーシャードのダメージ(gigawhale・notXeon) |\n| PvP(MFIA) | 4番はダメージ増幅3%・前方ダメージ増幅3%など、ほかは攻撃力・命中・HP |\n- 韓国のチャンターは、強打用と後方ダメージ用のページを分け、ボスで切り替える(Antochi)\n\n## 8. ディーヴァニオン(Antochi 10/14。グローバル版の盤の数字から)\n| 順 | 取るもの | 点 | 累計 |\n|---|---|---|---|\n| 1 | 岩撃砕・撃破砕・回転撃を Lv12 に | 55 | 55 |\n| 2 | 1枚目の戦闘速度の角 | 16 | 71 |\n| 3 | 2枚目のダメージ増幅の角 | 10 | 81 |\n| 4 | 1枚目の待ち時間短縮の角 | 27 | 108 |\n| 5 | 主要3つを +4 に | 35 | 143 |\n| 6 | 百裂撃・打撃砕・快癒の呪文・突進撃破を Lv12 に | 40 | 183 |\n| 7 | 風の約束・衝撃的中・攻撃準備 | 16 | 199 |\n| 8 | 3枚目のクリティカル ダメージ増幅の角(岩撃砕が確定クリティカルなので得) | 18 | 217 |\n| 9 | 攻撃力・クリティカルのノード | 80 | 約300 |\n| 10〜 | 4枚目の多段ヒットの角 → 衝撃的中・大地の約束 +4 → 百裂撃・快癒の呪文 +4 → 波動撃 Lv12 → 攻撃力・クリティカル → HP | | 約490 で全部 |\n- 取らない: 震動砕(2つ目の移動)、疾風乱舞、裂波撃、衝撃解除、十字防御、保護陣、生存意志\n- 振り直しは1ノード500ギーナなので、間違えても安い\n\n## 9. 狩り\n- 突進撃破 Lv12(倒すと再使用が戻る)で、飛び込む → マクロ → 次へ、と速く回れる(Moxsy・Grobs)\n- サブキャラにも向く(早くから強い・自分で回復できる。Moxsy)\n\n## 10. 翼・称号(notXeon)\n| 種類 | PvE | PvP |\n|---|---|---|\n| 翼 | ダークヴェールの翼 → 森の精霊の翼。将来はシーズンショップの翼 | Brawler の翼(状態異常的中)、Telesto の翼(待ち時間短縮) |\n| 称号 | Unbound by Genus、Saint of Altgard、Executioner of High Command(フィールドボス) | Treading on White Wings(300人倒す) |\n- 翼と称号の日本語名は未確認\n\n## 11. PvP(notXeon 10/10)\n| 項目 | 内容 |\n|---|---|\n| 大事なこと | **行動不能(気絶・転倒など)に「だんだん短くなる」仕組みがない**ので、つなげれば何回でも決まる |\n| 流れ | 打撃砕(Lv16 で気絶確率+20%)で相手に**衝撃解除を使わせる** → 衝撃解除が使えない約45秒の間に、ほかの気絶技でつないで倒す。相手のバフ欄で衝撃解除の印を見る |\n| 特化 | 気絶の時間と確率が付く物に替える(打撃砕・震動砕・波動撃)。突進撃破は 1=衝撃系抵抗 −20% かガード・回避無視。回転撃は 封印(4)も強い |\n| 衝撃解除 | Lv8 で HP 回復、Lv12 で連続スキル(気絶もある) |\n| 1対1 | 不敗のマントラ、マルクタンの怒り、粉砕撃(防御 −30%)、守護の祝福(15)。地上や闘技場は粉砕撃 → 疾走のマントラ |\n| 集団 | 不敗のマントラ、快癒の手、遮断の権能、疾風の権能。時空の亀裂など地上なら遮断の権能 → 疾走のマントラ |\n| 使わない | 滅火(射程4mで止まる)、結界の呪文(HP が10%未満にならないだけ)、強襲衝撃(気絶30%) |\n\n## 12. 意見が割れていること\n| 点 | 意見 |\n|---|---|\n| マルクタンの怒り | マクロに入れる(Grobs・gigawhale)/手で押す(notXeon) |\n| 2番目の Lv20 | 撃破砕(gigawhale・notXeon の PvE)/回転撃でも同じくらい |\n| 守護の祝福 | 15 で必須(gigawhale・notXeon)/無理なら粉砕撃か疾走のマントラ |\n\n## 13. 名前の対応(英語 → 日本語)\n| 種類 | 対応 |\n|---|---|\n| アクティブ | Dark Crush=岩撃砕(連続スキル Piercing Strike=貫通砕)、Onslaught=撃破砕(4段目=暴風砕)、Spinning Strike=回転撃、Incandescent Blow=百裂撃(連続=破裂撃)、Impactful Crush=打撃砕、Rushing Smash=突進撃破、Tremor Crush=震動砕、Recuperation=快癒の呪文、Gust Rampage=疾風乱舞、Wave Blow=波動撃、Heat Wave Blow=裂波撃、Defiance=衝撃解除 |\n| パッシブ | Wind\u0027s Promise=風の約束、Attack Preparation=攻撃準備、Impact Hit=衝撃的中、Protection Circle=保護陣、Crossguard=十字防御、Blessing of Life=生命の祝福、Inspiring Spell=鼓舞の呪文、Raging Spell=激怒の呪文、Earth\u0027s Promise=大地の約束、Survival Willpower=生存意志 |\n| スティグマ | Undefeated Mantra=不敗のマントラ、Power of the Storm=疾風の権能、Marchutan\u0027s Wrath=マルクタンの怒り、Guardian Blessing=守護の祝福、Sprint Mantra=疾走のマントラ、Fracturing Blow=粉砕撃、Focused Defense=集中防御、Healing Touch=快癒の手、Impeding Authority=遮断の権能、Obliterate=滅火、Ensnaring Mark=結縛の烙印、Barrier Spell=結界の呪文、Assault Shock=強襲衝撃 |\n\n## 14. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| gigawhale「世界ランク1位のチャンターが教えるビルド構築術」(Y1KYRLH3xIM) | 10/20 | 終盤の DPS ビルド、スティグマ、マクロ、種族理解度 |\n| Antochi「Chanter Stat Priority」(eHyp4sXGOow) | 10/23 | 能力値の順、戦闘速度の区切り、神の能力値 |\n| Antochi「Chanter Daevanion Guide」(XTqRpivnL2Y) | 10/14 | ディーヴァニオンの振り順 |\n| notXeon「2500+ Chanter Guide」(enxMRSkU8Qg)、「PvP Skill Guide」(RTSmajnBzw4) | 10/18、10/10 | Lv20 の選び方、アルカナ、PvP、翼・称号 |\n| Grobs「チャンターの PvE 完全攻略ガイド」(2qTjfkuzdj4) | 10/5 | 序盤〜中盤、マクロの仕組み |\n| MFIA「Global Chanter PvP Guide」(OPx39VzNJHQ) | 10/18 | PvP の部位ごとの刻印、種族理解度 |\n| Chacal「職業ティアリスト」(SGINL3w6yf4、ポルトガル語) | 10/27、1.3万回 | 職業の強さの評判 |\n| Şükrü「チャンターガイド 220時間」(uunaou5Bk-8) | 10/27、5,356回 | 狩り、マクロ、神石 |\n"},{"id":"cleric","tab":"クレリック","title":"クレリック まとめ","file":"クレリック_まとめ.md","md":"# クレリック まとめ(2026-10-31 最新)\n\n10/23 の「レンジャー・チャンター・クレリックのビルド」のクレリックの部分を土台に、10/4〜10/23 の動画9本で調べ直した。スキル名・特化の文は questlog.gg の日本語版データの正式名。\n10/25 に今週の動画3本(Th3Ruthless 10/24、Rised 10/24、BoredAF 10/22)を足した。足した所は「(10/25)」と書いた。\n特化は「Lv8で1つ、Lv12で2つ、Lv16で2つ(入れ替え可)、Lv20で3つ」。表の番号は特化の並び順(1〜5)。\n\n## 0. 今の結論(まずここだけ見る)\n| 項目 | 結論 |\n|---|---|\n| 仕組み | **断罪**がダメージの約5割。断罪は苦痛の連鎖が付いた敵にだけ使え、クリティカルで再使用が戻る。スティグマ**大地の懲罰**(Lv5)で断罪が確定クリティカル → 連打できる |\n| 最優先 | **大地の懲罰を Lv20**(効果時間+10秒)、スキルは**断罪を Lv20** |\n| スティグマ | 大地の懲罰・増幅の祈り は固定。チャンターがいなければ保護の光、いれば高潔の気。野良では**召喚復活**を持つ人が多い |\n| 回し方 | 増幅の祈り → 霹靂(最大まで溜める)→ 大地の懲罰 → 苦痛の連鎖 → 左クリックとマクロを押し続ける。大地の懲罰と苦痛の連鎖を**そろえて**使う |\n| **10/25 の流れ** | **大地の懲罰 Lv20+断罪・霹靂 Lv16 になったら、ボス戦では審判の雷を使わない**(Th3Ruthless・Rised・Welps・BoredAF がそろった)。審判の雷と稲妻乱射は雑魚狩り用だけ。Th3Ruthless は「霹靂から始めない。断罪が止まったときだけ霹靂」 |\n| アルカナで Lv20 にする順(10/25) | 断罪 → 神聖な気 → 大地の裁き → 苦痛の連鎖 → 霹靂(Th3Ruthless)。Rised は 断罪 → 霹靂(16以上あれば十分) |\n| 回復役として | 死んだ人はすぐ起こす。パーティーの枠を画面の中央寄りに置くと気づきやすい(MR4KTV) |\n| 強い時期 | 早い。大地の懲罰 Lv5+断罪 Lv12 だけで、装備なしでも上位の火力(Moxsy)。サブキャラにも向く |\n| 弱点 | 範囲攻撃が弱い(断罪は1体にしか使えない) |\n\n| **10/31 の流れ** | 職業の強さの評判(Chacal 10/27、ブラジル): **一番楽な職業**。パーティーに入りやすく、ソロの内容も強く、PvP でも硬く役に立つ(戦闘中に味方を起こせる) |\n---\n\n## 1. スキル\n\n### 1-1. 優先順\n| 優先 | スキル | 目標 | 理由 |\n|---|---|---|---|\n| 1 | **断罪** | 20 | ダメージの約5割(全員一致) |\n| 2 | 霹靂(溜めの大技) | 16 → 20 | Lv16 で確定クリティカル。2番目の火力 |\n| 2 | 快癒の光輝(全体回復) | 16 → 20 | Lv16 で HP5%・再使用短縮。回復の中心 |\n| 3 | 大地の裁き(左クリック) | 16〜20 | [放電]で霹靂の再使用 −7秒 |\n| 3 | 神聖な気(設置型の攻撃) | 16 | Lv16 で再使用 −10秒 |\n| 4 | 審判の雷(右クリック) | 16 | 大地の懲罰が Lv20 になったらボス戦では外す(3章) |\n| 4 | 治癒の光 | 16 | Lv16 で再使用 −2秒(MR4KTV が重視) |\n| — | 稲妻乱射 | 16 で止める | グロッキー中だけ。断罪が出ないときに |\n- Lucia の順: 大地の裁き・審判の雷 → 断罪 → 回復。Lv45 で地域クエストを終えると全部 Lv12 を超える\n- Welps: シーズン1は断罪だけ Lv20 にすれば十分。2つ目は聖杯の運しだい\n- (10/25)Th3Ruthless(NotMeter で1位を取った人): Lv20 にする順は **断罪 → 神聖な気(特化で再使用 −10秒・持続 +3秒。待ち時間短縮があればほぼ出しっぱなし)→ 大地の裁き(多段ヒット)→ 苦痛の連鎖 → 霹靂**。Lv21 以上は要らない\n- (10/25)Rised: 断罪だけ 20、霹靂は 16 以上なら十分(20 は後で)。神聖な気 20 は今シーズンはやらない。快癒の光輝・大地の裁き・再生の光はなるべく上げる\n\n### 1-2. 特化(PvE)\n| スキル | Lv8〜12 | Lv16 | Lv20 |\n|---|---|---|---|\n| 断罪 | 2 対象が少ないほど+12%、4 クリティカル時に再使用初期化 | **2+4 のまま**(Lv16 の 5 多段ヒットより2+4のほうが1体への火力が上。NoBS の検証) | 2+4+5 |\n| 大地の裁き | 2 [放電]が出る確率+20%、4 [放電]で霹靂の再使用 −7秒 | 2+4 | 2+3+4(3=多段ヒット) |\n| 審判の雷 | 2 対象が少ないほど+12% | 2+5(5=[天罰]1回追加) | 2+3+5 |\n| 霹靂 | 3 スキル速度+30%、4 対象が少ないほど+20% | 3+5(5=確定クリティカル) | 3+4+5 |\n| 神聖な気 | 3 発射速度+50%、4 持続+3秒(範囲が欲しければ 2) | 3+5(5=再使用 −10秒) | 3+4+5 |\n| 苦痛の連鎖 | 2 持続+3秒、4 敵の PvE ダメージ耐性 −10% | 2+4(+3 転倒) | |\n| 弱化の烙印 | 2 防御 −15%、4 敵の PvE ダメージ増幅 −10% | 2+4 | 2+3+4 |\n| 快癒の光輝 | 2 連続+1回(またはデバフ解除の1)、3 再使用 −3秒 | 3+5(5=HP5%) | 2+3+5 か 1+3+5 |\n| 治癒の光 | 1 連続+2回、4 HP2% | 1+5(5=再使用 −2秒) | 1+4+5 |\n| 再生の光 | 2 HP50%以下で+20%、4 移動速度+5%(または 3 受ける治癒量) | 4+5 か 3+5 | 1+4+5 |\n| 稲妻乱射 | | 4+5(5=全スキルの再使用 −1秒) | |\n| 衝撃解除 | 1 連続スキル、3 HP 回復 | | 1+3+5 |\n- 出典: BoredAF(10/14)、NoBS(10/13)、Krix(10/18)、Lucia(10/4)、Welps(10/20)\n\n---\n\n## 2. パッシブ\n| 優先 | パッシブ | 理由 |\n|---|---|---|\n| 1 | **神の恩恵** | クリティカルと強打 |\n| 1 | **大地の恩恵** | クリティカル ダメージ増幅(レベルに比例)と命中 |\n| 1 | **治癒力強化** | 回復量が攻撃力に比例して増える。だから攻撃寄りに組む |\n| 2 | 煌めく加護 | 攻撃するとパーティーが回復する(NoBS は一番大事と言う) |\n| 3 | 不死の帳、暖かな加護 | 防御・HP。序盤に役立つ |\n| 後回し | 回復遮断、集中の祈り、神の加護 | BoredAF |\n- (10/25)Th3Ruthless: 火力が上がるのは **神の恩恵と大地の恩恵だけ**。この2つをなるべく高く。Rised: 神の恩恵・大地の恩恵・治癒力強化 → 生存意志・煌めく加護・不死の帳\n\n---\n\n## 3. スティグマ\n| スティグマ | 目標 | 理由 |\n|---|---|---|\n| **大地の懲罰** | **20 が最優先** | 5で断罪が確定クリティカル、10で強打、20で効果時間+10秒(断罪を打てる時間が延びる) |\n| **増幅の祈り** | 20(2番目) | PvE ダメージ増幅+20%。15で大地の恩恵1.5倍、20で攻撃力+15% |\n| 保護の光 | 3番目に20 | **チャンターがいないとき**。チャンターの不敗のマントラと重ならない(同じレベルならマントラが優先) |\n| 高潔の気 | 5〜10(チャンターがいれば20) | 火力。10で弱化の烙印の敵に+20% |\n| 召喚復活 | 野良では入れる | MR4KTV と BoredAF は野良で必ず。Lucia は「起こしてもすぐ石で戻る人がいる」と入れない |\n| 生命の権能 | デバフが多いボス・PvP | 20で5秒ごとに浄化 |\n| 免罪 | 大回復。15で強い | |\n\n| 場面 | 4枠 |\n|---|---|\n| 野良のダンジョン | 大地の懲罰、増幅の祈り、高潔の気(チャンターがいなければ保護の光)、召喚復活 |\n| 固定パーティー | 召喚復活 → 生命の権能 |\n| ひとりで雑魚狩り | 召喚復活 → 保護の光 |\n| PvP ひとり(BoredAF) | 大地の懲罰、高潔の気、保護の光、救援。高潔の気 → 破滅の声 で回復阻害とバリア除去(テンプラーの大きなバリアに) |\n| PvP 集団(BoredAF) | 免罪、ユスティエルの権能、生命の権能、救援 |\n| (10/25)最大火力(Th3Ruthless) | パーティーが上手でチャンターがいるとき: 保護の光・召喚復活などを外し、**強襲烙印 Lv5+高潔の気 Lv20**(当てると5秒間 攻撃力+20%)。始める前に再生の光 |\n| (10/25)クラオ洞窟など(Th3Ruthless) | 最初の中ボス(中央に引き寄せる攻撃)と最後のボスの範囲攻撃で人が倒れるので、先にバリアを張る型に。チャンターがいれば免罪、いなければ保護の光 |\n| (10/25)PvP ひとり(BoredAF 10/22) | 保護の光、救援、大地の懲罰、高潔の気(集団戦なら攻撃の2つを 生命の権能・ユスティエルの権能・免罪 に) |\n| (10/25)闘技場(Th3Ruthless) | 救援を必ず。相手しだいで替える: クレリック・ヒーラー相手=破滅の声、近接(グラディエーター・アサシン)相手=**束縛 Lv15**(確率100%の拘束)、遠距離相手=救援 |\n- (10/25)スティグマの上げ方: 大地の懲罰 20 → 増幅の祈り 20(攻撃力+15、神の恩恵・大地の恩恵が1.5倍)→ 保護の光か高潔の気。高潔の気を 20 にできるまでは保護の光に点を入れ、20 にできたら保護の光を 5 に戻して高潔の気へ(Th3Ruthless・Rised)\n- (10/25)Rised: チャンターと組むときは**弱化の烙印を使わない**(チャンターのバフが同じ効果で上書きする)\n\n---\n\n## 4. マクロと回し方\n### 4-1. 基本(NoBS 10/13 の検証。一番火力が出る形)\n| 手順 | 押すもの |\n|---|---|\n| 1 | 増幅の祈り(手で) |\n| 2 | 霹靂を最大まで溜める(手で) |\n| 3 | 大地の懲罰(手で) |\n| 4 | 苦痛の連鎖(手で) |\n| 5 | **左クリック(大地の裁き)とマクロを押し続ける** |\n| マクロの段 | 断罪 → 高潔の気 → 弱化の烙印 → 神聖な気 → 再生の光 |\n\n- **大地の懲罰(再使用20秒)と苦痛の連鎖(30秒)は待ち時間が違う**ので、両方そろうのを待って一緒に使う。だから手で押す\n- 霹靂は戻ったらすぐ使う。次の連鎖まで10秒以上あれば、左クリックの[放電]でまた戻る\n- **審判の雷はマクロに入れない**。入れると、断罪が戻ってもマクロが審判の雷を先に出してしまう(不具合と思われる)。断罪が使えない間に手で挟むのは可\n- 回復(治癒の光・快癒の光輝)は Q・E など押しやすいキーに置き、マクロを押しながら手で\n\n### 4-2. 簡単な形\n| 投稿者 | 形 |\n|---|---|\n| Lucia・Th3Ruthless | マクロ1段目: 増幅の祈り → 大地の懲罰 → 苦痛の連鎖 → 断罪(断罪を何回も入れる)。2段目: 神聖な気 → 審判の雷 |\n| BoredAF | 全部を2つのボタンに。大地の懲罰と苦痛の連鎖が付いている間は**左クリックを離して右(マクロ)だけ**押すと、断罪の割合が増えて火力が上がる |\n| MR4KTV | ボタン1つで回復も攻撃もするマクロ(慣れていない人向け) |\n| Welps | 大地の懲罰 Lv20 になったら、ボス戦では審判の雷を外す(断罪の動作を止めるため) |\n| (10/25)Th3Ruthless | マクロは前と同じ(10段を5段に縮めただけ)。**再生の光をマクロに入れる**(PvE・PvP ダメージ耐性がずっと付く。30秒に1回なので火力は落ちない)。ボス戦: 戦う前に再生の光 → 突入 → 断罪が出ている間は**マクロと左クリックだけ** → 断罪が止まったら霹靂 → また断罪。霹靂から始めると最初の2秒を失う。審判の雷は動作が長く、そのぶん断罪が減る |\n| (10/25)Rised | 右クリックで2段(増幅の祈りの段と弱化の烙印の段)を回すだけ。ボス・悪夢・ワールドボスでは審判の雷なし |\n| (10/25)BoredAF(PvP) | 2列に分け、霹靂と同じ列に審判の雷(断罪の合間の埋め)。左右クリックで弱体を付けてから断罪を連打、解除されたら霹靂と審判の雷。PvE では審判の雷を外す(火力が下がる) |\n- 遅延: ping 50 未満は10ミリ秒、それ以上は50ミリ秒(aLuckyRO)\n- MP が足りなくなりやすい。アルカナの魔力2枚、MP ポーション(Krix)\n\n### 4-3. 設定(BoredAF・MR4KTV)\n- 操作は「アクション」モード\n- ターゲット探索は「カメラ前方」。優先順位の1・2番目に「敵のプレイヤー」「自分を攻撃している敵」\n- 「スキル使用時の自動ターゲット」ON(PvP では雑魚を狙わないよう OFF にすることも)\n- パーティーの枠を画面の中央寄りへ。ボスの向きの表示を「前方」に\n\n---\n\n## 5. 装備の刻印\n| 部位 | 狙う物 | 出典 |\n|---|---|---|\n| メイス・ガーダー | 武器ダメージ増幅、威力、戦闘速度、正確 | Lucia |\n| ヘルム | 強打、受ける治癒量、防御力増加 | Lucia |\n| ショルダー | 強打、クリティカル ダメージ増幅 | |\n| トップス | ダメージ増幅、完璧 | |\n| グローブ | 戦闘速度、完璧 | |\n| ボトムス | 完璧、攻撃力増加(Lucia はガード型) | |\n| シューズ | 移動速度、完璧 | |\n| アクセサリー | 戦闘速度、威力、正確+1枠に神の恩恵か大地の恩恵 | Lucia |\n| リング | 断罪、快癒の光輝、審判の雷、治癒の光か神聖な気 | Lucia。**リングは最後**(武器 → ガーダー → 防具 → ほかのアクセサリーが先。Welps) |\n- 防具のパッシブは 大地の恩恵・神の恩恵(Krix)\n- **待ち時間短縮を積むほど断罪が途切れない**。目安33%だがシーズン1の上限は10〜11%(Welps)\n- 命中・クリティカルはルドラに行くなら各1,000以上(Lucia)\n- (10/25)Rised の順: **リングで断罪を Lv20 にする(19 で止まっているなら最優先)**→ 武器の良い行 → 戦闘速度の付く部位を全部 → 武器ダメージ増幅 → ダメージ増幅 → 移動速度。Lv20 にしたいスキルはアルカナ +5 とリングの両方が要る\n- (10/25)PvP のガード型(BoredAF、アビスで鯖1位): 魔石・魂刻印に**ガードを2行以上**、余ればクリティカル抵抗。種族理解度もガード、敏捷(ガードとクリティカル抵抗の両方が伸びる)。早期鯖の4週目で**ガード約1,500**が目安(正式鯖は1週遅れなので少なくてもよい)。PvE の火力は落ちるので、両立するなら装備を2組\n\n## 6. アルカナ\n| カード | 能力値の種類 | 狙うスキル |\n|---|---|---|\n| 聖杯 | 活力(時間) | **断罪**を指定して作る |\n| 羊皮紙 | どちらでも(魔力なら MP が楽) | **断罪**、霹靂、快癒の光輝。断罪付きは全部とっておく |\n| コンパス | 活力か魔力 | 審判の雷、再生の光、**神聖な気**、治癒の光(神聖な気 +4 が理想) |\n| 鐘 | **魔力**(破壊=攻撃力) | **神の恩恵**、暖かな加護、不死の帳、生存意志 |\n| 鏡 | 活力(幻想=待ち時間)か魔力(知恵=強打) | **大地の恩恵**、神の加護、治癒力強化、煌めく加護 |\n- 魔力2枚のセット(MP 回復)があると MP が楽(Krix・BoredAF)\n- 断罪にアルカナで +4 がまず目標。2つ目の Lv20 は聖杯に付いたスキルしだい(Welps)\n- 神の能力値(万神殿): 幻想と知恵\n- (10/25)Th3Ruthless: 金のカードは最初から4つのスキルが付き、強化のたびにどれか1つが+1(+5 まで。どれに付くかは運)。時間(戦闘速度)と待ち時間短縮が欲しい。最初は「4枚が金の能力値+1枚が青」から。超越のエネルギーは本命キャラに残してカードを掘る\n- (10/25)Rised: 聖杯・羊皮紙・鏡・コンパスは活力、**鐘だけ魔力**(破壊=攻撃力)。弱化の烙印・審判の雷が付いたカードは、霹靂・神聖な気が付いた物に替えたい\n\n## 7. 種族理解度(Krix・Lucia)\n| 枠 | おすすめ |\n|---|---|\n| 1・5番 | 追加攻撃力か最大攻撃力 |\n| 2・8番 | HP 増加(%) |\n| 3・6・9番 | 命中(とクリティカル)。Lucia はガード型でガード |\n| 4番 | 知性=クリティカル ダメージ増幅か PvE ダメージ増幅、野性=武器ダメージ増幅、自然=完璧、変形=前方(PvE なら後方も)ダメージ増幅、**特殊=強打** |\n| 7番 | ダメージ耐性 か 再生 |\n- (10/25)Rised: まず 1・4・5番(攻撃力・最大攻撃力・4番の%)。低い数値は残さず、中くらい以上で止める。4番は 特殊=前方か後方ダメージ増幅か強打、野性=武器ダメージ増幅・ダメージ増幅・PvE ダメージ、自然=多段ヒットか完璧、知性=ダメージ増幅か PvE ダメージ増幅、変形=**前方**ダメージ増幅か PvE(ルドラは前からしか当てられない所が多い)。次に7番の PvE ダメージ耐性、HP は最後\n\n## 8. ディーヴァニオン(BoredAF・Lucia)\n- 角(オレンジ)を先 → アクティブ(断罪・快癒の光輝・審判の雷・霹靂など)→ パッシブ\n- 取らない: 稲妻乱射、回復遮断\n- BoredAF は 416 点(地域クエスト・封印ダンジョン+悪夢の店50+シューゴの店50)\n\n## 9. 翼・称号(Welps)\n| 種類 | おすすめ |\n|---|---|\n| 翼 | 森の精霊の翼(安くてボスに強い)→ ダークヴェールの翼 → タリスラの翼(シーズンショップ。待ち時間短縮。一番) |\n| 称号(攻撃) | Guardian of Altgard → Unbound by Genus |\n| 称号(防御) | Saint of Altgard |\n| 称号(その他) | Through Hell and Back(待ち時間短縮)→ Empty Closet(外見700個) |\n- (10/25)Rised: 森の精霊の翼は所持でボス攻撃力+30・命中+20・ダメージ耐性1%、装備でボス攻撃力+95。シーズンの翼(タリスラ、20万ポイント)は所持で待ち時間短縮4%・攻撃力+60・防御+400・命中+35。封印された翼の開放には**煌めくオード10個**(1個約60万)が要る。Empty Closet は戦闘速度+3.5%(外見は闇市場の商人から毎日買う)\n\n## 10. PvP\n| 項目 | 内容 |\n|---|---|\n| スティグマ | 3章の表。Lucia は 増幅の祈り・保護の光・ユスティエルの権能・破滅の声 |\n| 特化を替える所 | 大地の裁きは Lv20 で多段ヒット+ガード・回避無視、霹靂は気絶、苦痛の連鎖は転倒 |\n| 型 | ガード型(Lucia)、命中型(MFIA) |\n| 破滅の声 | 回復と回復薬を60%減らす(20秒)。Lv10 でバリア除去。クレリック・チャンター・テンプラー相手に強い |\n| 注意 | マクロは回復をあとで手で出せる形に(KaidGames) |\n\n### 10-1. PvP の細かい設定(10/31)\nグローバル版の Cheris(トルコ語、10/31)・BoredAF(アビスで鯖1位、10/22)と、韓国の김다크(10/16〜10/19)から。\n\n**PvP で一番違う点**: 相手が浄化で苦痛の連鎖・大地の懲罰を消すので、**断罪を撃ち続けられない**。そのため PvP では**審判の雷が火力の中心**になる(김다크)。BoredAF も「PvE では審判の雷を外すが、PvP では断罪の合間に使う」。\n\n**スキルのレベルと特化**\n| スキル | レベル | PvP の特化 | 出典・補足 |\n|---|---|---|---|\n| 審判の雷 | **20**(16 でもよいが、戦っていると MP が足りなくなる) | 2(対象が少ないほど +12%)・5([天罰]1回追加)。김다크は 1・2・5 | Cheris・김다크 |\n| 断罪 | 20(ガード型で大地の懲罰を使わないなら 16 でもよい) | 2・4(クリティカル時に再使用初期化)。Lv20 の3つ目は多段ヒット(束縛の特化は取らない) | Cheris・김다크 |\n| 苦痛の連鎖 | — | 持続 +3秒、**ガード・回避と状態異常抵抗を無視する特化は必ず取る**(付かないと断罪が撃てない) | Cheris |\n| 大地の裁き(左クリック) | 16 | 2([放電] +20%)・4([放電]で霹靂の再使用 −7秒)。PvP では火力の割合が大きい。持続の特化は浄化で消されるので取らない | Cheris・김다크 |\n| 弱化の烙印 | — | 2(防御 −15%)と、相手の PvP ダメージ増幅を下げる特化 | Cheris |\n| 霹靂(溜めの大技) | 16〜20 | 3(スキル速度 +30%)。PvP なら気絶の特化も選べる。マクロに入れず手で撃つ | Cheris |\n| 神聖な気 | 16 | 3(発射速度 +50%)・4(持続 +3秒)。範囲と再使用短縮は取らない(1対1の戦いは短いので) | Cheris |\n| 治癒の光 | **20** | 1・3・4(3 の代わりに 5 も可)。PvP は HP が多いので 4(HP2%)が効く | 김다크 |\n| 快癒の光輝 | 20 | **2・3・5** | 김다크 |\n| 再生の光 | 16 | 4・5(1〜3 は効きが分かりにくい)。Cheris は防御 +5%・受ける治癒量 +5% | 김다크・Cheris |\n| 衝撃解除 | 16 | HP 回復より状態異常に強くなる特化(回復は足りているので) | 김다크 |\n- 韓国の動画の字幕は機械の聞き取りなので、特化の番号は画面で確かめてから使う\n\n**パッシブ**: PvP で効くのは**生存意志・治癒力強化・不死の帳**の3つ。大地の恩恵は PvP では割合が小さい(김다크)\n\n**スティグマ**\n| 場面 | 構成 |\n|---|---|\n| 1対1(BoredAF) | 保護の光(火力と回復)、救援(無敵。一気に削られるのを防ぐ・仕切り直し)、大地の懲罰(断罪を撃つため)、高潔の気(浄化されても出る火力) |\n| 集団戦(BoredAF) | 攻撃の2つを 生命の権能・ユスティエルの権能・免罪 に替える |\n| 韓国の例(김다크) | 増幅の祈り・生命の権能・ユスティエルの権能・救援・高潔の気が固定、免罪と大地の懲罰を入れ替え。Lv20 にするのは **増幅の祈り(特化5)・ユスティエルの権能(回復を減らされてもバリアは減らない)・生命の権能(浄化)**。4つ目は救援(再使用を短くするため)か高潔の気 |\n\n**マクロ**\n| 人 | 作り方と使い方 |\n|---|---|\n| BoredAF(グローバル版) | スキルを**2列**に並べ、マクロが2列を行き来しながら、使えるときは断罪を連打する。審判の雷は霹靂と同じ列(断罪の合間の埋め)。使い方: ① 左右クリックを押し続けて弱体(苦痛の連鎖など)を付ける → ② 弱体が付いている間は断罪を連打 → ③ 浄化されたら、霹靂・審判の雷のボタンと左右クリックを押し続け、次に弱体が付くまでつなぐ。**ボタンは3つ**。PvE では審判の雷を抜く |\n| 김다크(韓国) | PvE の3段のマウスのマクロをそのまま使い、スキルの並びだけ変える。弱体が付いているときは断罪、浄化されたら審判の雷が出る作り。戦闘速度は関係ない。争奪戦・アーティファクト戦のように断罪を撃ちにくい場面では、左右クリックだけのマクロのほうがよい |\n| Cheris(グローバル版) | 左右クリックを押し続けると攻撃が続く形。再生の光をマクロに入れる。霹靂ともう1つの回復は手で |\n\n**能力値**\n| 型 | 中身 |\n|---|---|\n| ガード型(BoredAF) | 魔石・霊石は**全部にガード2行以上**、余ればクリティカル抵抗。種族理解度もガード。装備には敏捷(ガードとクリティカル抵抗の両方が伸びる)。早期鯖の4週目で**ガード約1,500**が目安(正式鯖は1週遅れ)。ルドラのアビスのブレスレットなどに空間も。PvE の火力は落ちるので、両立するなら装備を2組 |\n| 切り替え型(김다크、韓国) | 種族理解度のプリセットで**命中かクリティカル抵抗**を切り替える。仕上がりで 命中 5,500 か クリティカル抵抗 3,500〜3,800(韓国版の数字)。魂刻印・魔石は意志・HP・状態異常抵抗・鉄壁・再生・強打抵抗。種族理解度は 3・9番(韓国版の並び)に前方・武器ダメージ増幅、6番に鉄壁、残りに命中かクリティカル抵抗 |\n\n## 11. 意見が割れていること\n| 点 | 意見 |\n|---|---|\n| 召喚復活を入れるか | 野良では必ず(MR4KTV・BoredAF)/入れない(Lucia) |\n| 審判の雷をマクロに入れるか | 入れない(NoBS・Welps、**10/25 に Th3Ruthless・Rised も「ボス戦では外す」に変わった**)/入れる(Lucia。BoredAF は PvP だけ) |\n| 大事なパッシブ | 神の恩恵・大地の恩恵・治癒力強化(Krix・Lucia)/煌めく加護が一番(NoBS) |\n| 鏡の能力値 | 活力(幻想=待ち時間。Welps)/魔力(知恵=強打。BoredAF) |\n\n## 12. 名前の対応(英語 → 日本語)\n| 種類 | 対応 |\n|---|---|\n| アクティブ | Condemnation=断罪、Chain of Torment=苦痛の連鎖、Bolt=霹靂、Earth\u0027s Retribution=大地の裁き(連続=放電)、Judgment Thunder=審判の雷(追加=天罰)、Divine Aura=神聖な気、Debilitating Mark=弱化の烙印、Radiant Recovery=快癒の光輝、Healing Light=治癒の光、Light of Regeneration=再生の光、Lightning Strike Scattershot=稲妻乱射、Defiance=衝撃解除 |\n| パッシブ | Empyrean Lord\u0027s Grace=神の恩恵、Earth\u0027s Grace=大地の恩恵、Healing Enhancement=治癒力強化、Radiant Benediction=煌めく加護、Immortal Veil=不死の帳、Warm Benediction=暖かな加護、Empyrean Lords\u0027 Benediction=神の加護、Prayer of Concentration=集中の祈り、Heal Block=回復遮断、Survival Willpower=生存意志 |\n| スティグマ | Earth Punishment=大地の懲罰(付く効果=大地の祝福)、Prayer of Amplification=増幅の祈り、Light of Protection=保護の光、Noble Aura=高潔の気、Summon Resurrection=召喚復活、Benevolence=生命の権能、Absolution=免罪、Salvation=救援、Yustiel\u0027s Power=ユスティエルの権能、Voice of Doom=破滅の声、Power Burst=権能爆発、Root=束縛、Assault Mark=強襲烙印 |\n\n## 13. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| Krix Domi「Rank 1 Ultimate Cleric Guide」(zioAbsvcX_8) | 10/18 | NotMeter の DPS 1位。特化・マクロ・アルカナ・種族理解度 |\n| TheWhelps「新版クレリック・エンドゲームガイド」(N3ONhVc0K-U) | 10/20 | 大地の懲罰 Lv20 後、アルカナ、翼・称号 |\n| BoredAF「クレリックの最新ガイド」(iAcPSLfCk38) | 10/14 | ランク1位。特化の番号、スティグマ、アルカナ、設定 |\n| NoBS「極めて高度なクレリックのマクロ」(VfX5GVnk4ac) | 10/13 | 一番火力が出る回し方の検証 |\n| MR4KTV「99% of Clerics Are Playing WRONG」(9oxwXZ-lemI) | 10/23 | 回復役の基本、設定 |\n| Lucia「世界ランク1位が教えるクレリックガイド」(KptUtnv35vk) | 10/4 | 上げ方、刻印、PvP |\n| aLuckyRO「クレリック PvE マクロ設定」(t4bB4AN6mxI)、Th3Ruthless「クレリック・マクロ完全ガイド」(5Dy9OA_NEzs) | 10/17、10/10 | マクロ |\n| KaidGames「なぜあなたのクレリックは弱いのか」(CYXcLmgmSZk) | 10/16 | 回復寄りの組み方 |\n| Th3Ruthless「これさえ見れば完璧!クレリック上級者向け完全ガイド」(kCYoKiK9Nmc) | 10/24 | ボスの回し方、アルカナ、場面ごとのスティグマ、闘技場 |\n| Rised「クレリック PvE ガイド 更新版」(WToI-WhgbDc) | 10/24 | 審判の雷を外した理由、種族理解度、翼、刻印の順 |\n| BoredAF「クレリック PvP ガイド(更新)」(QzxYs4hS9yU) | 10/22 | ガード型の続き、PvP のスティグマとマクロ |\n| Chacal「職業ティアリスト」(SGINL3w6yf4、ポルトガル語) | 10/27、1.3万回 | 職業の強さの評判 |\n| Cheris「CLERIC PVE / PVP GUIDE」(VHTlmkv0BG0、トルコ語) | 10/31、365回 | PvP の特化・マクロ |\n| 김다크「치유성 PVP 스킬특화 및 아르카나」(ZaDFt5JF0-g)・「PVP용 종결마매」(SdAuKo8iglM)・「명중/치저 스왑」(G9XhLZThiuw) | 10/16〜10/19、各7,000〜8,000回 | 韓国の PvP のレベル・特化・スティグマ・マクロ・能力値 |\n\n"},{"id":"growth","tab":"成長","title":"成長とシステム まとめ","file":"成長とシステムのまとめ.md","md":"# 成長とシステム まとめ(2026-10-31 最新)\n\n「IL2100以降の上げ方」「悪夢・覚醒戦・アルカナ・装備厳選・クラフト」「AION2 日課週課まとめ」「先行サーバー(韓国・台湾)の今」と、10/21・10/14 の動画まとめを1本にし、10/21 パッチと 10/19〜10/23 の動画で新しくした。古い版は `_古い版/` にある。\nアルカナは `アルカナのまとめ.md`、製作は `3_相場と製作/相場と製作のまとめ.md`。\n\n## 0. 今の道筋(シーズン1は 12/16 まで)\n| IL | やること | 次 |\n|---|---|---|\n| 2100 | 獰猛な角岩窟(防具・ガーダー)と炎の神殿(武器・アクセサリー)。ここの装備を長く使う | 2200 |\n| 2200 | 超越3段階目で青カードをそろえる(金は約12%なので深追いしない) | 2500 |\n| 2500 | **超越4段階目で金カード(約60%)**。主力スキルを Lv20 へ。製作装備に取りかかる | 2600 |\n| **2600** | **遠征「クラオ洞窟」「ドラウプニル」の難しい**(10/21 追加)。怒りの素材・賢者の石・アリエルの欠片・絵画 | 2700 |\n| **2700** | **遠征「ウルググ峡谷(仮)」「バクロンの空中島」の難しい**(10/28 追加)。報酬は同じ形 | 2800 |\n| **2800 / 3000** | **聖域ルドラ(10人レイド)が 11/4 に開始**。普通は IL2800、難しいは IL3000(10/23 に公式発表。Fubgun・海外の記事で確認 10/29)。難しいの初クリア競争「Ludra Hunt」は 11/24〜25 のメンテまで。オードエネルギーのボーナスは 11/10 のメンテまで | 次のシーズン |\n\n### 0-1. IL2800 への近道(Fubgun 10/25)(10/29)\n| 段階 | やること |\n|---|---|\n| 土台 | アビスのモノリスの羽根を全部(IL +36)、ディーヴァニオンの基本 416 点(シューゴフェスタの店・悪夢の店・封印ダンジョン・地域クエスト) |\n| 〜2100 | 主な14部位のうち 12 部位を IL70 に。下級の魔石で緑の行を1〜2本(白 = IL+1、緑 +2、青 +3)。IL70 の装備は +10 まで(すぐ替えるので) |\n| 2100〜2500 | 獰猛な角岩窟・炎の神殿で全部位 IL86。武器だけ製作するなら炎の神殿の武器は取らない(製作は刻印が2行多い)。ガーダーは2番目に大事 |\n| 2500〜 | **超越4段階目で金カードを5枚**(1枚 IL+80 → 合計 +400)。主力スキル Lv20 のアルカナで火力も伸びる |\n| 2600〜 | 遠征「難しい」はディーヴァニオンの新しい 60 点(IL+60)だけ。戦闘力はほとんど増えないので、IL が足りないときだけ |\n| 仕上げ | IL86 の全部位に**中級の魔石**(15% で青い行 = IL+3。1個 約3.5万)。**上級の魔石は IL102 の装備まで取っておく**(約100万)。ただし IL が少し足りない人は上級で埋める手もある(Spid 10/26。10/30) |\n| 突破 | **突破1段 = IL+5**。+0→+1 は成功66%・突破石6個・約60万ギーナ、+1→+2 は突破石9個・約90万。+15 を何本も作るより、1本を突破するほうが安い |\n\n- ルドラに向けた目安: **ロングソードとガーダーを +15・突破 +2 以上**。突破1段ごとに武器・ガーダーはダメージ増幅 +1%・攻撃力 +16、アクセサリーは +0.5%・攻撃力 +18。防具の突破は火力にならないので最後\n- IL3000 は「突破を2〜3段の部位を増やす」だけで、やることは同じ。ギーナがかかる\n\n**IL を上げる順(Spid 10/26・Soulgrot 10/28・Ashura 10/30。どれも IL2800〜3000 を目指す人向け)(10/30)**\n| 順 | やること | IL | メモ |\n|---|---|---|---|\n| 1 | シューゴフェスタの店でディーヴァニオン結晶、悪夢の店を買い切る | | まだなら先に。ここが済んでいないと 2800 は苦しい(Spid) |\n| 2 | **アリエルのボード**: 遠征「難しい」のアリエルの欠片 → 物質変換でディーヴァニオン結晶 | **結晶1個 = IL+1** | Spid によると、10/28 の新しい遠征で **30個の枠がもう1つ**増えた(30+30。前は「キャラごと30個まで」)。Spid は 30 を埋め、残り9 |\n| 3 | **アスフェルのボード**: アビスポイントでディーヴァニオン結晶を買う | 30〜80 | 火力は増えず PvP の能力値と IL だけ。アビスを1週間回して 100万〜150万ポイント(Spid) |\n| 4 | **+15 → 突破**。突破石は物質変換で作れる(強化石+突破石のかけら) | 星1つ = +5 | かけらが足りなくなる(Soulgrot)。突破石はルドラ前に値上がりしそう。突破は**ロングソード → ネックレス → イヤリング → リング → トップス・ボトムス**の順(基本の攻撃力・防御力が大きい順。Ashura) |\n| 5 | **上級の魔石**(空いた枠や弱い行に) | 1つで +4 ほど(Spid の実演) | 足りない人が週末に買うので、100万〜120万に上がる見込み(Spid)。買うなら早めに |\n- 火力を上げるには、IL より スティグマ・アルカナ・刻印 にお金を使うほうがよい。IL だけを上げるのは「ルドラに初週から入りたい」人向け(Spid)\n- Ashura(テンプラー)は審判・懲罰を Lv20 にするため、ガーダーやリングの刻印のスキル行を振り直して集めた。武器に審判が付いたときも「Lv20 にしたいので残す」\n- ルドラで出る物: ブレスレット(Spid)、ロングソードなどのメインの武器(Ashura は「射程が長いルドラのメイン武器」を狙う)\n- ルドラの前の配布(EUTOPIA 10/25): 10/28 のメンテから 11/10〜11 まで、キャラごとに毎日オードエネルギー2個を郵便で(受け取りは7日以内)。ルドラの出席7日(拘束ギーナ 150万、アビスポイント 3万、魂の結晶など)\n- **(10/31 cost、課金は月額だけの人)** 装備とアルカナを全部外しても IL 448 残り、うち 410 はディーヴァニオンの結晶(アリエル・アスフェルのボード)。**スティグマのかけらだけで戦闘力 約4万**(全部外すと 173K → 135K)。戦闘力だけを上げたいなら、全部のスティグマをまず Lv10 にそろえる。生活の製作は**錬金が一番大事**(上級の巻物・薬・魔石を作れる)。取引所の売り買いで7,000万稼いで装備に回した\n- **(10/31 Drunge)** 10/28 からアビスの相手のサーバーが組み直された。韓国・台湾と同じく、**天族どうし・魔族どうしで当たることもある**。組み合わせは装備の強さ、回廊やワールドボスの勝ち具合、そこでの火力などから決まる(ネットの情報)。負け続けていたサーバーは、同じくらい弱いサーバーと当たりやすくなる\n\n- 戦闘力の大半は装備以外(スティグマ・ディーヴァニオン・ペット・アルカナなど)から来る。装備を全部外しても約10.7万残る(Fubgun、19.5万の人)\n- 野良パーティーは戦闘力で選ばれる。IL2100 で9.5万〜10万、炎の神殿は10〜12万が目安(10/14 時点)\n\n---\n\n## 1. 最近のパッチ(グローバル版)\n\n### 1-1. 10/28 のパッチ(公式の英語版のお知らせ。日本語名に「(仮)」とある物は未確認)\n| 変更 | 中身 |\n|---|---|\n| **遠征「難しい」が増えた** | **ウルググ峡谷(仮。Urugugu Canyon)・バクロンの空中島**に追加。**IL2700**、4分で激昂、復活は1人3回。報酬はクラオ洞窟・ドラウプニルの難しいと同じ形(賢者の石:啓示は選べる確定報酬にもなる、アリエルの欠片は確定、絵画、ギーナは通常より多い、**怒りの思念・意志・自我を含む唯一の製作素材が全部出る**)。新しい業績で唯一の外見 |\n| 遠征・超越のボスを弱く | 通常の遠征と超越 Lv1: ボスの攻撃 −15%。難しい遠征と超越 Lv2〜4: ボスの攻撃とダメージ増幅 −10%ずつ。超越 Lv1〜2: ボスの HP −6.5% |\n| 職業 | **Lv45 の基本 HP: グラディエーター・テンプラー +1,500(4,702→6,202)**、ほかの職業 +1,000(→5,702)。アサシン: 研ぎ澄まされた第六感の HP 効果アップ、幻影分身の待ち時間 90秒→60秒 |\n| **製作・遠征装備の突破の上限** | 真龍王・星龍王(光るも)1→**3**、**白龍王・黒龍王(光るも)3→5** |\n| 継承できる組み合わせが増えた | 遠征の3段目 → 製作の2段目、遠征の2段目 → 製作の1段目(例: 怒りのクロメデのネックレス → 白龍王のネックレス) |\n| オードエネルギー(拘束) | 1キャラ20個の上限をなくし、**週に1キャラ4個・1サーバー16個**に |\n| **採集の上限** | **1サーバー1日1,000回**(リセットは 16:00。今後変わるかも)。採集できる最低レベル 10→45。マクロ対策 |\n| アビス | 入れる人数を増やした。下層の次元コアの HP を増やし、アーティファクト戦が10分以上続くとコアが弱くなる効果「力の消散(仮)」 |\n| 日課ダンジョン | 「オディリウムの保管庫(仮。Odylium Repository)」を追加。入場回数はデーヴァ生体研究所(仮)と共通 |\n| シーズンミッション | 報酬からアビスポイントをなくし、アビス下層の亀裂の石(仮)に |\n| ショップ | 即時完了チケット: 悪夢(拘束)を追加(週に1サーバー14枚、1枚3万ギーナ)。日課ダンジョンのチケットも同じ条件に |\n| そのほか | 何もしないとロビーに戻るまで 3時間→**30分**。隠しキューブが出やすく。キャラを消すまで 1日→7日 |\n| イベント | 28日の出席「アトレイアの呼び声」、ディーヴァパス「飛翔への序曲(仮)」(どちらも 12/2 のメンテまで) |\n\n- **相場への影響(予想)**: 難しいが2つ増えて怒りの素材の出る量が増える → 怒りの思念・意志・自我は下がる方向。採集の上限は採集素材が上がる方向、オードエネルギーの販売は下がる方向で、どちらが強いかは数日見ないと分からない\n- テンプラーには HP +1,500 と、突破の上限アップ(白龍王 +5)が関係する\n- **(10/29 動画から補足)** オディリウムの保管庫(仮)は泡を集めてスコアを出す形で、**ペットの魂が出る**(ペットのレベル上げ、上限ならペットの結晶)。強化石が要らない人はこちら(Spid・Grobs)。ディーヴァパスは 1,000 キューナで、オードエネルギーと悪夢のチケットが入る。アビスの亀裂の石(アビスにいられる時間)は店で買えなくなり、ショップのサーバー移動のタブもなくなった(Spid)\n- 相場(Grobs の予想): ルドラ前で皆が IL2800〜3000 を目指すので、**装備の材料の値段は上がる**方向。Grobs は前日に達人のリングの台を2つ(約920万)買っておいた\n\n### 1-2. 10/21 のパッチ\n| 変更 | 中身 |\n|---|---|\n| 遠征「難しい」 | クラオ洞窟・ドラウプニルに追加。**IL2600**、復活は3回まで、最後のボスは**4分で激昂** |\n| 報酬 | 箱1つのギーナが 40万 → **48万**。報酬枠5: **怒りの思念 66%、意志・自我 16%ずつ**(今まで遠征で出にくかった)。装備は通常と同じ IL54 の物 |\n| 新しい物 | **賢者の石:啓示(刻印)** 1%(平均100回に1個、取引不可。装備に6枠目)。**アリエルの欠片** 毎回60〜90個(物質変換でディーヴァニオン結晶に。キャラごと30個まで。**10/28 の新しい遠征でもう30個の枠が増えた**(Spid。10/30)。その後は強化石5個に)。**絵画「怒りのクラオ」「怒りのドラウプニル」**(高く売れる見込み) |\n| 注意 | 新しい物は**最後のボスだけ**が落とす。途中のボスは通常と同じ |\n| ディーヴァニオン | 新しい盤「アリエル」(PvE ダメージ増幅・耐性、ボスへのダメージなど) |\n| イベント「挑戦に立ち向かえ」 | 12/16 まで。そよ風商会の特殊で復活石 30個を2.5万ギーナ(週1回、サーバーごと)。もう30個は5万ギーナ |\n| アビス | 入れる人数が増えた。下層の次元コアとボスの HP が増えた |\n| 採集素材 | 出品の制限を一部のプレイヤーで緩和 |\n| 職業 | チャンター(回転撃の表示)、ソーサラー(冷気の嵐・炎の壁の不具合)の修正 |\n\n### 今後の予定(NoBS の予想。確定ではない)\n- 台湾版にある「難しい」は、ほかの遠征にも順に来る見込み。難しいは金装備の出る率が通常の2倍(20%)で、英雄装備も入る\n- 製作の上位素材も難しいのほうが出やすい → 製作の費用は下がっていく見込み\n- 超越はシーズン1の間は今のまま。次のシーズンで新しいボス\n\n## 2. 韓国版の今(グローバル版への影響)\n| 韓国で起きたこと | グローバル版で考えること |\n|---|---|\n| ゲーム内通貨の現金相場が約3か月で65%下がった | 今の高い相場は下がっていく可能性が高い |\n| パッチで装備や素材の価値が急に下がった(射程の付いた製作武器、精錬石の緩和、PvP 装備) | 調整されそうな物に一度に大きく投資しない |\n| 人が離れている(9月ごろから) | 強くなるのを急ぎすぎない |\n| ハロウィンイベント(遠征・超越の強化石1.5倍、キャンディの鍵でオードエネルギーなどを選べる) | グローバル版に来れば、強化石・オード・オリハルコンは下がりやすい |\n- グローバル版は韓国版の失敗を直して始まった(製作装備は継承製作でしか上げられず売れない、割合の能力値を下げた、クリティカルの上限50%など)\n\n---\n\n## 3.
