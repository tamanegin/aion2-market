const GUIDE = {"built":"2026-11-22 12:15","docs":[{"id":"home","tab":"はじめに","title":"目次と最近の変更","file":"00_目次.md","md":"# AION2 まとめの目次(2026-11-22 更新)\n\n同じ話をしていたまとめを、テーマごとに1本ずつにまとめ直し(10/24)、その後の情報を足している。迷ったら、まずこのページを開く。\n\n| テーマ | まとめ | 中身 |\n|---|---|---|\n| テンプラー | [テンプラー_まとめ](\u003c1_テンプラー/テンプラー_まとめ.md\u003e) | スキルの順番と特化、パッシブ、スティグマ、マクロと回し方、装備の刻印、アルカナで狙うスキル、種族理解度、ディーヴァニオン、狩り、翼・称号、PvP |\n| アップデート | [アップデート情報](\u003c2_成長とシステム/アップデート情報.md\u003e) | 公式のパッチの要点(11/18・11/11・11/4・10/28・10/21)、韓国の改編とその手直し、シーズン2の準備、混沌のエレシュランタ表層の詳しい話、今後の予定 |\n| 成長 | [成長とシステムのまとめ](\u003c2_成長とシステム/成長とシステムのまとめ.md\u003e) | IL の上げ方、戦闘力の上げ方、日課・週課、**ギーナとアビスポイントの稼ぎ方**、悪夢、覚醒戦、強化・刻印・継承の仕組み、韓国版の今。稼ぎ方は 11/18 の変更あり(野外のギーナが刻印に) |\n| 成長 | [アルカナのまとめ](\u003c2_成長とシステム/アルカナのまとめ.md\u003e) | 仕組み、強化の経験値表、神秘的な結晶、いらないカードは強化か抽出か |\n| 相場と製作 | [相場と製作のまとめ](\u003c3_相場と製作/相場と製作のまとめ.md\u003e) | 買う・売る物(相場は 11/20。今は製作を急がない)、作るか買うか、ロングソードを IL102 まで作る費用、リング・ネックレス、売り買いのコツ |\n| レンジャー | [レンジャー_まとめ](\u003c5_ほかの職業/レンジャー_まとめ.md\u003e) | テンプラーと同じ項目。バイゼルの権能 Lv20 と必中の矢 Lv16 が中心 |\n| チャンター | [チャンター_まとめ](\u003c5_ほかの職業/チャンター_まとめ.md\u003e) | テンプラーと同じ項目。岩撃砕 Lv16、能力値の細かい順(戦闘速度は90.5%まで) |\n| クレリック | [クレリック_まとめ](\u003c5_ほかの職業/クレリック_まとめ.md\u003e) | テンプラーと同じ項目。大地の懲罰+断罪の回し方、回復役の基本 |\n| 共通 | [用語対応表](用語対応表.md) | 英語 → アジアサーバーの日本語名 |\n\n- 相場は毎日 **相場ボード** https://tamanegin.github.io/aion2-market/ で見る(自動で更新される)\n\n## 11/22 に変わった主な点(2)\n| 点 | 前 | 今 |\n|---|---|---|\n| **ワールドマーケット(11/25)** | — | アジアの天族どうしで売り買い、手数料 20%。**今売る物・今買う物**の分析。**全部の品(483品)でも比べた**: 唯一の装備・外見は今売る、上級魔石・封印された翼・名画は今買う(相場と製作 0章、アップデート情報)。翼 Dark Veil の正式名は**闇の帳の翼** |\n\n## 11/22 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| テンプラーの PvP | 人ごとの PvP の話が 11-0〜11-3 に分かれていた | **PvP の早見表**(能力値・スキルと特化・場面ごとのスティグマ・マクロ・立ち回り)と、大規模アビス戦の立ち回り(StingKnight、11-5)。テンプラー 11章 |\n\n## 11/21 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| 相場の見直し | 11/8 の相場 | **11/20 の相場**。怒りの思念 340万で売り時(下がり始めた)、ガーダーも「買う」に、リングの作る得は約200万に縮んだ。相場ボードの予想は何もしないより少し悪い(相場と製作 0章) |\n\n## 11/20 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| 全体の見直し | — | 重複・食い違い・古い情報・名前の揺れを全部のまとめで直した(相場と製作は 11/8 の相場が古いと明記) |\n\n## 11/19 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| **11/18 のパッチ** | — | **ルドラに「簡単」**(入場 IL 2,800・復活無制限・武器とガーダー)、ルドラ装備の出る率 5% → 15%、**アビスポイント3倍(12/16 まで)**、野外のギーナが刻印に(アップデート情報) |\n| シーズン2の準備 | — | オードのエネルギー2,000・悪夢の券30を残す、今は製作しない(Arthars)。韓国の新シーズンの入場条件は戦闘力、虚無の揺りかご(仮)は20万(アップデート情報) |\n| 4職業 | — | テンプラーの PvP ビルド(11-3)、チャンター(Rised)、クレリックのルドラ(Th3Ruthless)、レンジャー(各 0章) |\n\n## 11/17 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| クレリックの場面ごとの設定 | PvE・PvP が別々の章 | PvE・PvP・狩りのスキルの特化・スティグマ・マクロの早見表、上位20人(11/17)のスキル・スティグマ・アルカナ。狩り用のマクロ(審判の雷を入れる・ボタン1つの設定)(クレリック 0-5・1-3・4-5) |\n\n## 11/16 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| **韓国の改編の手直し** | 審判は5回続けて撃って初めて強くなる | 11/13・11/14 の緊急メンテで、審判の力(仮)は**3回で付く**、**懲罰はすぐ撃つ技に**。ソーサラーなどは改編の多くが元に戻った。グローバル版にはまだ来ていない(アップデート情報、テンプラー 0-0) |\n| テンプラーの今の形 | — | Screamheart の完全ガイド(高潔の甲冑 Lv15 を最優先、アルカナは鐘だけ魔力)。改編のあとの台湾版の1分の木人(Ashura)。テンプラー 4-7・0-0 |\n| テンプラーの上位20人と能力値 | 11/4 の上位20人 | **11/16 の上位20人**(スティグマ・パッシブ・アルカナの色と付いているスキル・魔石)、マクロの並びで審判が1分6回増える形、NotMeter の「ステータス効率計算機」で自分に合う能力値の順を出す方法(テンプラー 1-6・4-8・5-1) |\n| 種族理解度 | — | 1枚に約1,000万ギーナ。レベル9から選ぶ、最後の HP の行は回さない(テンプラー 7章) |\n| 3職業 | — | 今週の動画と韓国の手直し(レンジャー・クレリック・チャンター 0-4) |\n\n## 11/13 に変わった主な点\n| 点 | 前 | 今 |\n|---|---|---|\n| **11/11 のパッチ** | — | ルドラの制限時間 2時間・報酬に怒りの素材、炎の神殿・獰猛な角岩窟に「難しい」、消耗品が10分で死んでも消えない、**調律石が週3個**、アビスポイントが増えた(アップデート情報) |\n| **韓国・台湾の大改編** | — | 「再使用を消す特化」がなくなる。**テンプラーの審判は5回分を溜めて撃つ技に**(台湾版で試した Xia は「今のままでは遊べない」)。レンジャー・クレリック・チャンターの変更も。グローバル版にはまだ来ていない(アップデート情報、テンプラー 0-0、各職業) |\n| 怒りの素材の相場 | 強く売り時 | パッチで刻印の怒りの素材が出るようになり、下がる方向のはず(相場と製作 0章) |\n| 魂刻印の狙い | 確率表 | XifanGG(10万回)の部位ごとの狙い、攻撃力の行の価値(成長とシステム 8章) |\n\n"},{"id":"update","tab":"アップデート","title":"アップデート情報","file":"アップデート情報.md","md":"# アップデート情報(グローバル版・アジアサーバー)(2026-11-20 最新)\n\n公式のアップデートノートと、各パッチの要点。新しい順(韓国版の話は 11/18 のパッチのすぐ下にまとめた。11/20)。名前はアジアサーバーの日本語名。\n- 公式の一覧: https://aion2.plaync.com/ja-jp/board/update/list\n\n## 11/25 のパッチの予告: ワールドマーケット(11/22)\n出典: EUTOPIA(11/22)。公式の日本語のお知らせでは未確認。\n| 点 | 中身 |\n|---|---|\n| ワールドマーケット・ワールド取引所 | **11/25 の定期メンテのあと**に開く。**同じ地域・同じ種族のサーバーどうし**で売り買いできる(アジアの天族どうし) |\n| 手数料など | 売るときの手数料 **20%**(今のサーバーの取引所は 10%)。1日の出品は10件。メンバーシップが要る。今のサーバーの取引所も残る |\n| 韓国版 | 2025/12/10 に同じ形で始まった(最初は新しいサーバー2つを外した) |\n| 業者の停止 | 11/18〜11/20 の3日で **47,516件**のアカウントを制限(業者・不正なプログラム・RMT・不自然な取引) |\n| 公式の配信 | 11/23(月)10:00(太平洋時間。日本時間 11/24 3:00)に NC America の運営の責任者が話す。話題は 連絡の仕方・ルドラ・RMT と業者・調律石・サーバーのマッチング・今後の予定 |\n- 相場への影響と「今売る・今買う」は `相場と製作のまとめ.md` の0章\n\n## 11/18 のパッチ(公式の日本語のアップデートノート、11/18 17:00)(11/19)\n| 区分 | 変わった所 |\n|---|---|\n| **ルドラに「簡単」** | 「深淵の再錬：ルドラ」に難易度[簡単]。**入場 IL 2,800**、制限時間2時間、**個人の復活回数は無制限**。HP は普通と同じだが、ギミックへの対処がゆるく、クリティカルが出やすい。報酬は**ルドラの武器・ガーダー(刻印)** |\n| ルドラ装備の出る率 | 普通・難しいで装備の合計の獲得率が **5% → 15%**。簡単も 15% |\n| 装備変更券 | 物質変換で「深淵の再錬：武器選択箱(刻印)」が取れる: 変更券 難しい ×1・普通 ×2・簡単 ×4 → 武器選択箱 ×1。必要なギーナは 1,000万 → **500万**。前に難しい1枚で交換した人には難しいの変更券が1枚戻る |\n| **アビスポイント3倍** | 11/18 〜 **12/16 の定期メンテ前**まで。混沌のエレシュランタ表層のモンスターのドロップ、戦場の勝利・参加報酬、戦場の勝利のミッション報酬。表層の PvP の分は対象外。累積の上限は変わらない |\n| 採集素材 | 上の等級を下の等級に戻せる(唯一 ×1 → 伝承 ×3、伝承 ×1 → 希少 ×2、希少 ×1 → 一般 ×2) |\n| **野外のギーナ** | **すべてのフィールドモンスターのギーナが刻印のギーナ(取引に使えない)に**。1日の上限 100万も刻印に(業者対策。JPVariety は「普通の人も困る」と批判) |\n| 修正 | 自動翻訳が動かない、チャットのスクロール、ルドラの一部の攻撃が正しく動かない |\n- **公式の配信(11/17〜18、英語)**: 中身はルドラの簡単の発表だけ。**シーズン2の内容は「まだ言えない」**。次の配信は 12/1(Spid 11/18、5.2万回)。JPVariety(11/18)は「業者・ラグ・素材の値上がりに触れていない」と批判\n- アビスポイント3倍の間は、スティグマのかけら(アビスの店)を集めやすい\n- 11/19 に NC Japan が RMT をした人の大量の停止を始めた(aLuckyRO 11/19、1.8万回)\n\n## シーズン2に向けて今からやること(Arthars 11/18、6万回)(11/19)\nグローバル版のシーズン1は **12/16 まで(あと約4週)**。シーズン2で持ち越せる物・消える物から。\n| 点 | Arthars の勧め |\n|---|---|\n| オードのエネルギー | 期限付きのエネルギーはシーズンの終わりで消える。**使って青の数字(貯め)に入れた分は持ち越せる**。シーズン2の始めに**2,000 を残しておく** |\n| 悪夢の券 | **30 まで貯めておく**(シーズン2の始めに先に進める) |\n| 覚醒戦・デイリー | 回数を貯められるが、無理に貯めなくてよい |\n| 製作 | **今から作るのはやめる**(素材が高い)。86 の武器・アクセサリーがあれば十分。シーズン2の素材が出て値段が下がるのを待つ。Arthars はギーナを貯めて入る |\n| アルカナ | シーズン2のカードは IL が上がり(+20)、神の能力値 +5。古いカードを食わせてもレベルは引き継がれにくい |\n| アビス・シューゴの店 | 翼・ペット・外見はシーズンで消えない。銀のメダルはアビスポイントで買わない(シーズン2で金のメダル) |\n| 征服 | シーズン1は「エネルギーの無駄」。シーズン2では征服が大事になる |\n- グローバル版でも同じかは、シーズン2が来るまで分からない(韓国・台湾の流れから)\n\n## 韓国の新シーズンのそのほかの変更(Anders 11/16、9.5万回)(11/19)\nグローバル版の**次のシーズンで来そうな物**の目安。韓国版のみの話。\n| 区分 | 中身 |\n|---|---|\n| 入場の条件 | 遠征の入場は **IL ではなく戦闘力**に。**虚無の揺りかご(仮。英語 Cradle of Nihility)= 戦闘力 20万**(グローバル版の来月の新しい段の見込み) |\n| 1人で遠征 | 遠征の 1〜7 段は**1人でも入れて、人数で強さが変わる**(下の手直しの節では「征服は1人でも」。遠征か征服かは要確認)。古い遠征(クラオ洞窟・獰猛な角岩窟など)は消え、報酬は装備変更券の物質変換で取れる |\n| 超越 | 征服より上の段。アルカナと装備が出る。新しい7段は週5回まで |\n| ギーナ | 週63回(超越15回)を超えた分は刻印のギーナ。モンスターと表層のギーナも刻印(グローバル版は今週同じ変更) |\n| 装備 | **聖域の装備は2シーズン使える設計に**。英雄の製作装備にも潜在。英雄の装備の増幅は +7 まで、増幅で攻撃力ではなく**ダメージ増幅**。上位継承は一律 2,000万ギーナ |\n| アビス | アビスの装備は今のが最後。闘技場の協力戦は 2対2、闘技場・戦場では巻物・料理が使えない |\n| 新しい職業 | 韓国の次のシーズン(3月)に銃の職業らしい(予告の影だけ) |\n\n## 韓国版の改編の手直し(11/13・11/14 の緊急メンテ)(11/16)\n下の大改編のあと、韓国は2日続けて緊急メンテで手直しをした。11/13 は「技の回しを滑らかにし、押す回数を減らす」、11/14 は**改編の多くを元に戻した**(前の日の変更を戻した物もある)。NC は「職業の強さの調整は今回はしない。データと意見を見て後で」と言う。出典: Anders「AION 2 が自分の改編を元に戻した」(11/15、6.2万回)。**グローバル版にいつ来るかは未確認**。\n| 職業 | 中身 |\n|---|---|\n| 全職業(11/14) | 闘技場とアビスで**受ける回復が −20% → −50%**(「回復で戦いが長引かないように」) |\n| **テンプラー** | 審判を開ける時間 3→5秒、審判の力(仮)は3回続けて撃てば付く、**懲罰がすぐ撃つ技に**、保護のシールドのガードで審判の再使用が戻る。テンプラー 0-0 |\n| レンジャー | 破裂の矢は使った時点でバフ。遅くする・束縛を「Fetter(仮。状態異常抵抗 −30%)」にまとめた。速射の MP 減。矢乱射の PvP −30%。レンジャー 0-4 |\n| クレリック | 断罪 PvE +15%、霹靂 +10%、高潔の気の5つ目の特化 +30% → +50%。クレリック 0-4 |\n| チャンター | 岩撃砕・貫通砕 PvE +7%、新しいスティグマ Tempest Call(日本語名は未確認)が武器ダメージ増幅に。チャンター 0-4 |\n| ソーサラー | **一番多く元に戻った**。Winter Shackles を溜める形をやめ、集中の願いなどは前の効果に戻った。新しく Hellfire に「過熱(5秒、ダメージ +150%)」 |\n| グラディエーター・アサシン・格闘家(Brawler)・スピリットマスター | 再使用・MP・バフの時間の細かい調整。アサシンは「殺意」の付き方を作り直し、スピリットマスターは精霊の呼び出しが 30秒 → 10秒(改編前の 15秒より短い) |\n- 韓国の新しい進み方(Anders): **超越が征服より上**(装備とアルカナの素材が出る)。**征服は1人でも入れて、人数に合わせて強さが変わる**(炎の神殿「難しい」を1人で、など)。オード(英語 Odal)はダンジョンで集めず、報酬の箱から出る\n- Anders: 「NotMeter の順位で職業の強さを見るのは少なくとも2週間待て」「いくつかの変更はまったく意味が分からない。グローバル版は時間をかけてほしい」\n\n## 韓国版の1周年の大改編(韓国 11/11 開始。グローバル版にはまだ来ていない)(11/13)\n韓国版の1周年の配信(11/9)で発表され、韓国・台湾で 11/11 に入った。**グローバル版にいつ来るかは決まっていない**。グローバル版のシーズン1は 12/16 まで(Spid は「12/16 か、その次の週のシーズン2で来るのでは」と予想)。出典: Aragon(11/9、5万回)・aLuckyRO(11/9、5.2万回)・Spid(11/10、6.5万回)・Xia(台湾で試した、11/12)。\n| 区分 | 中身 |\n|---|---|\n| **戦闘の考え方** | 「同じ技の連打」を減らす。**多くの職業で「再使用時間を消す特化」がなくなり**、主力の技の「必ずクリティカル」は「クリティカル率が上がる」に変わる(クリティカルの能力値の価値が上がる)。手で操作したときの効率を約20%上げる。戦闘速度・強打・神の能力値の効き方も調整 |\n| **テンプラー** | **審判の「再使用時間を消す特化」がなくなり、審判は「溜めて撃つ」技(チャージ5回)に**。テンプラーのまとめ 0-0 |\n| レンジャー | バイゼルの権能は**その技だけ**の再使用を減らす(全スキルではない)。矢乱射も同じ。今の「バイゼルで全部回す」形はなくなる |\n| クレリック | 大地の懲罰+苦痛の連鎖の回しから、**苦痛の連鎖 → 断罪 → 弱化の烙印 → 断罪** の形に。断罪は再使用が戻る代わりに全属性ダメージが上がる |\n| チャンター | ほとんど変わらない。**疾走のマントラがなくなり**、移動速度は不敗のマントラに入る |\n| グラディエーター・アサシン・ソーサラー・スピリットマスター | グラディエーターは Frenzy(日本語名は未確認)を溜める形、アサシンは Elusive Clone で Hardcore の再使用が戻らなくなる、ソーサラーは Wish of Concentration が全属性ダメージに、スピリットマスターは精霊の呼び出しの間隔を空ける形(この4職業のスキル名は英語のまま。まとめがないため未確認) |\n| アルカナ | **カードの中のスキルの行だけを振り直せる**(レベルの並びは固定で、どのスキルかが変わる)。何万枚も集めなくてよくなる |\n| 聖域 | ボスごとに報酬(1体目・2体目でも出る)。**普通と難しいの差は「ポイント」の量だけ**(普通1点・難しい2点で、欲しい物と交換)。普通だけでも時間をかければ同じ物が取れる |\n| 成長 | 最大レベル 55、ディーヴァニオンの点の追加、唯一のペンダントを英雄に、英雄のベルト・アミュレット、上級スティグマのかけらがレベルが上がるごとに1つ、装備の成長の上限の拡大 |\n| ギーナ・取引 | 古いコンテンツのギーナは刻印に、新しいコンテンツは取引できるギーナ。信用の仕組みで取引の1日の上限を上げる |\n| そのほか | ハウジング(280種以上の家具)、釣り、1人用のダンジョン、古い遠征を1つの1人用の遠征にまとめる。アビスは週ごとのランキングと称号 |\n| 韓国版の予定 | 11/11 新シーズン(新しい遠征・超越・悪夢・覚醒戦)→ 12/2 ルドラの挑戦イベント → 年末 遠征・超越・悪夢の追加 → **1/20 新しい聖域** → 2027年1〜3月 虚無の揺りかご(仮)の試練モード |\n- **評判**: 韓国・台湾・グローバル版の全部で反発が大きい。「多くの職業の火力が大きく下がった」(Spid)。NC は「うまくいかなければ変える」と言っている(Xia)\n\n## 11/11 のパッチ(公式の日本語のアップデートノート、11/11 17:00)(11/13)\n| 区分 | 変わった所 |\n|---|---|\n| **ルドラ(普通・難しい)** | 制限時間 **1時間 → 2時間**(韓国・台湾は最初から2時間だった。Spid)。「中央の深淵融合炉」の HP を下げた。**第5報酬グループの確率 30% → 100%**、中身に**怒りの思念・意志・自我(刻印)**を追加 |\n| **遠征に「難しい」を追加** | **炎の神殿・獰猛な角岩窟**。入場 IL **2,800**、ボスは4分で狂暴化、最後のボスは復活3回まで。報酬: 賢者の石:啓示(刻印。確定報酬でも選べる)、**アリエルの欠片**(ダンジョンごとに別の種類、100%)、遠征英雄名画、普通より多いギーナ、**怒りの思念・意志・自我**(一定の確率) |\n| アリエルの欠片 | 100個 → ディーヴァニオン結晶:アリエル(物質変換、1キャラ30回まで)。1個 → 強化石5個(回数制限なし) |\n| ギーナ | クラオ征服・ドラウプニル征服、混沌のエレシュランタ下層のモンスターのギーナが**ギーナ(刻印)**(取引できない)に。ボット対策と見られる |\n| アビスポイント | 混沌のエレシュランタ表層で増えた。シューゴフェスタに週のシーズンミッションを追加(アビスポイント)。「使命」のアビスポイント **1,000 → 2,500**。PvP をしなくてもスティグマのかけらを買いやすくなった |\n| **消耗品** | ポーション・料理・スクロールの一部が **5分 → 10分**、**死んで復活しても消えない** |\n| **調律石** | 超越の週のシーズンミッション「超越した者たちの歩み」STEP1〜3 で **調律石(唯一)(刻印)を週3個まで**。調律(魂刻印の1行の付け直し)に使える |\n| そのほか | ダンジョンの読み込みの改善(一時的に止まる現象を減らす)。ルドラで全滅したとき「ルドラの試練」のスキルが戻らない不具合を修正。11/4 の遠征の確定報酬の回数の変更で探検の報酬を受け取れなかった人に防具選択箱 |\n- **相場への影響(こちらの見方)**: ルドラと新しい「難しい」で**怒りの素材(刻印)が手に入る**ようになった。刻印の物は売れないが、自分で使う分を買う人が減るので、**怒りの思念・意志・自我の値段は下がる方向**に働くはず。11/12 9時のアリエルでは思念 270万(3日 +9%)とまだ上がっていた(相場と製作のまとめ 0章)\n- 戦闘の改編(上の韓国版の話)は**今回は入っていない**(Spid)\n\n## 11/4 のパッチ(公式の日本語のアップデートノート、11/4 15:30)(11/4)\n| 区分 | 変わった所 |\n|---|---|\n| **聖域「深淵の再錬:ルドラ」** | 普通(IL2,800)・難しい(IL3,000)。制限時間1時間(11/11 から2時間)。**普通でも難しいと同じ種類の報酬**が出る(出る確率は違う)。報酬: **ルドラの武器・ガーダー**、ルドラのブレスレット、深淵のブレスレット、封印された深淵の波の翼、名画:深淵のルドラ(どれも刻印)。難しいの上位は地域別の「名誉の殿堂」に載る |\n| **装備変更券** | ルドラでは「装備変更券」を確定報酬として選べる(普通=装備変更券:ルドラ、難しい=装備変更券:ルドラ[難しい])。物質変換で: 普通の券×6 または 難しいの券×3 → **ルドラのブレスレット**。普通の券×2 → 難しいの券×1。券から「深淵の再錬:武器選択箱」も作れる |\n| ブレスレット | 深淵のブレスレット(突破は最大3段)、ルドラのブレスレット(最大5段) |\n| アビス | **混沌のエレシュランタ表層**を追加。全員の能力値・スキル・スティグマが同じ水準に補正される PvP の場。Lv45 から、週3時間(アビス表層の亀裂石で延長)。報酬はギーナ・アビスポイント・装備・製作素材。PvP のアビスポイントは 50% 減 |\n| アーティファクト占領戦 | 週3回 → **週2回(木・土 21:00)**。代わりにアビス回廊の1回のアビスポイントが **1.5倍**。アーティファクトボス3種も木・土 21:30 |\n| フィールドボス | 永遠のガルトゥア・軍団長ラグタは12時間 → **11時間**ごと。精霊王アグロI は毎日 10:30・22:30 |\n| **遠征(探索)の上方修正** | ドラウプニル・バクロンの空中島・獰猛な角岩窟の「探索」の報酬が**普通と同じ水準**に(ギーナ・強化石・シーレンティウム・魂の書が増え、**突破石の欠片(唯一)**が追加。精錬石と製作素材は取引不可で出る)。確定報酬の回数は「征服」と同じ。ギーナは累計 0〜40回 100%、41〜50回 80%、51〜60回 60%、61〜70回 40%、71回〜 20% |\n| **製作** | **真龍王・乾龍王の装備を100%成功で作れる新しいレシピ**を追加。失敗しない代わりにコンボ(大成功)はなく、できた物は刻印(取引不可)。材料の達人〜伝承の装備は刻印・非刻印どちらでも使える。前のレシピもそのまま残る |\n| ペット | 一部のペットの「魂」が、ペット箱だけでなく遠征・超越ダンジョンでも出る |\n| イベント | ルドラ討伐の出席(11/4 23:00〜11/18、7日分: ギーナ50万・百年人参の証・夢幻の破片・アビスポイント3万・魂結晶ポイント・ギーナ100万・外見のヘルム)。オードエネルギー×4 を毎日メールで(〜11/11)。ルドラの初討伐の称号(〜11/25。難しいを各地域で20番目までに倒したフォース。期間中に倒せば誰でも「ルドラの宿敵」) |\n- **混沌のエレシュランタ表層(英語名 Chaotic Outer Reshanta)の詳しい所(11/4)**\n  | 項目 | 内容 |\n  |---|---|\n  | 何をする所 | アビスの中の別の場。**能力値・スキルのレベル・スティグマのレベルが全員同じ値にそろう**。効くのは職業ごとのスキル・スティグマの能力値と特化だけ(公式)。装備の差で一撃で倒される心配がない |\n  | 時間 | Lv45 から。週3時間(普通のアビスとは別枠)。アビス表層の亀裂石で延長 |\n  | 報酬 | ギーナ(刻印)・アビスポイント・一般/希少/伝承の装備(唯一は出ない)・亀裂石・製作素材(刻印)。**PvP で得るアビスポイントは 50% 減**。一部のシーズンミッションも進む |\n  | 韓国版との違い | 韓国版にも7月から「表層」があったが、**戦闘力40万・IL4,300 以下なら入れる**という上限の形だった。強い人が装備を外して上限ぎりぎりで入り、弱い人を狩る(「양학」)のが問題になった(Inven 7〜8月)。グローバル版は能力値ごとそろえるので、この問題は起きにくい作り |\n  | 韓国版で稼げた量(参考) | 5キャラで週の表層時間を使い切った人: 狩りで**アビスポイント 1時間 約10万**、14時間で純ギーナ 約4,000万、拾った物の売却 約2,000万、アビスポイント 約140万(Inven 9/6)。グローバル版は仕組み・報酬が違うので同じにはならない |\n  | 韓国版の立ち回り(청귤 8月、3か月前・韓国版) | ① 店で**パーティー用のキスク**(その場で復活できる設置物)を買い、パーティーを作って狩場の近くに置く → 倒されてもすぐ戻れる。② 敵が来たら戦わずに離れる(相手の階級を見る。上の階級の将校には勝てない)。③ 敵の多い基地の近くは避け、壁ぞいに移動して空いている場所を探す。④ 良い狩場は相手も来るので、ミニマップの赤い三角(敵)を見て、来たら一度離れて戻る。**20分でアビスポイント約5万**(韓国版の普通のプレイヤー)。中層のほうが多く稼げるが危ない。相手の陣営があまり狩りをしないなら表層が楽 |\n  | 韓国版で稼いだ物の使い道 | アビスポイントで**深淵の霊石**を作って売ると、1キャラ1日 約2,000万(Inven 9/6)。グローバル版でも、アビスポイント → 下級深淵の魔石・霊石 → 中級(20% で上級)にして売る道がある(相場と製作のまとめ) |\n  | 韓国版の評判 | 「新人のための場なのに、強い人が装備を外して新人を狩る」が一番の不満(동화의 게임・머핀、7〜8月)。開発は PvP の能力値に上限を付けて調整した。グローバル版の「能力値をそろえる」形は、この反省からと見られる |\n  | 実際の評判(グローバル版) | まだ出ていない(11/4 に入ったばかり)。Spid(11/4)は「無課金や普通の人には大きな前進。ただし PvP のアビスポイント半分と、唯一の装備が出ないのは残念」 |\n- **ルドラのボスの動き(11/6。NoBS Game Guides の2本、11/5・11/6、3.4万回・3,300回。グローバル版)**。10人を2組に分け、1組目と2組目で別のボスと戦う。ボスの日本語名は未確認(英語の字幕では Rahu・Ketu)\n  | ボス | 動きと対処 |\n  |---|---|\n  | 共通 | **盾役がボスを外側へ向け、ほかの全員はボスの真後ろに固まる** |\n  | 1組目(Rahu) | ① 普通の攻撃が全部前方の範囲 → 盾役と反対側に立つ(盾役の側に印を置くと分かりやすい)。② 十字の攻撃2回 → 方向キーを押さずに完璧回避すると後ろへ下がり、2回目も避けられる。近くの範囲 → ドーナツ型も同じ。③ 目の印が付いた人に直線の攻撃 → 場の端へ引っぱってから安全地帯へ。④ **爆弾**(HP が緑に光る。20秒で爆発し、そのとき近くの味方に移る。近くに誰もいない・持ったまま倒れる = 失敗で紫の水たまりが残り、**3回失敗で全滅**)→ 全員で重なって立てば自然に移る。爆弾を持って紫の水たまりを踏むと即爆発 ⑤ HP が減ると全員が場の端へ飛ばされる → すぐ戻り、印の付いた人に全員で重なる(近くの範囲は無視してよい)⑥ 武器を上げたら端へ走って水たまりを置く ⑦ 50% で場が4つに分かれ、盾役に飛びかかる → 盾役は真ん中で受ける。後ろ → 前の順の範囲は、前の範囲が消えても当たるので注意 ⑧ 最後: 周りに出るモンスターを、目の印の人の直線の攻撃で倒す。倒し損ねも「失敗」に数える |\n  | 2組目(Ketu)。1組目より易しい | ① 盾役への普通の攻撃が重い → 動きを覚えて回避かガード。② 場の半分ずつを叩く → ボスの近くにいれば横へずれるだけ。③ **場の奥へ飛んだら追わない**。全員で真ん中に立って待つ。目の印の人に飛びかかってきたら、**盾役が飛び込んでガードすると、ダメージも後の輪の攻撃も消える** ④ 精霊がボスへ向かう → 南から北へ全部倒す(南からのレーザーと光の壁に注意)。そのあと真ん中へ ⑤ 手を向けた方向にレーザー ⑥ 「静かに沈み、滅びよ(英語の字幕)」→ 玉が2つ出るので2人が跳んで取る ⑦ 50% から青い玉と赤い玉 → **青は背を向け、赤は顔を向ける**(カメラではなくキャラクターの向き)⑧ 鎌が2人を追う → ほかの人で鎌を壊す ⑨ 最後: 全員に範囲 → **結晶を壊すと4秒無敵**。全員同じ側に集まり、結晶を1回だけ叩いて待ち、範囲の直前に壊す。そのあとの長い範囲も別の結晶で防ぐ ⑩ 最後はこれまでの動きが同時に来る |\n- **ルドラの開始から数日の様子(11/8。Spid 11/5・11/7、8万回・6万回、Arthars Gaming 11/7、3.5万回)**\n  | 点 | 中身 |\n  |---|---|\n  | 要る戦闘力 | 普通は**パーティー全員 約21万以上**。難しいは**火力職 24.5万以上**、テンプラー・クレリックは 21〜22万でもよい(実際に倒した組の戦闘力から。Spid) |\n  | 難しいを倒した組 | 開始から2〜3日で**世界で約5組**。最初の組(gigawhale)は大きく課金していると言われ、「難しいは課金者向け」という声が多い(Arthars) |\n  | 普通と難しいの違い | **ボスの動きの流れは同じ**。普通は玉の数が半分(難しい = 赤2・青4、普通 = 赤1・青2)。普通で動きを練習できる(Arthars) |\n  | 普通の組を作る難しさ | 戦闘力の高い人は難しいに行くので、普通の組は集めにくい(Arthars) |\n- **不正への対応(11/8。Spid)**: 公式は 11/4 のお知らせで、ボット・RMT(現実のお金でギーナを売り買いすること)で **約2,400 件**を処分した。ルドラの開始日に、RMT をしていた配信者が配信中に処分された。一方で、普通に遊んでいる人が「精算の上限」に引っかかる例もある。**1日に買えるギーナには上限(5億)がある**(gigawhale の話)。RMT が減ると、取引所の値段が下がる方向に働く可能性がある(こちらの見方)\n- 自分に関係が大きい所: ルドラで**ガーダーと武器**が出る(JPVariety の「武器はルドラで出る」の話にガーダーも加わった。製作のガーダーを急ぐ理由は少し弱まった)。真龍王を自分で使うなら、100% のレシピで失敗の損がなくなる(売る物は前のレシピで作る)。アビスポイントは回廊の1.5倍で取りやすくなった\n\n## 10/28 のパッチ(公式の英語版のお知らせ。日本語名に「(仮)」とある物は未確認)\n| 変更 | 中身 |\n|---|---|\n| **遠征「難しい」が増えた** | **ウルググ峡谷(仮。Urugugu Canyon)・バクロンの空中島**に追加。**IL2700**、4分で狂暴化、復活は1人3回。報酬はクラオ洞窟・ドラウプニルの難しいと同じ形(賢者の石:啓示は選べる確定報酬にもなる、アリエルの欠片は確定、名画、ギーナは通常より多い、**怒りの思念・意志・自我を含む唯一の製作素材が全部出る**)。新しい業績で唯一の外見 |\n| 遠征・超越のボスを弱く | 通常の遠征と超越 Lv1: ボスの攻撃 −15%。難しい遠征と超越 Lv2〜4: ボスの攻撃とダメージ増幅 −10%ずつ。超越 Lv1〜2: ボスの HP −6.5% |\n| 職業 | **Lv45 の基本 HP: グラディエーター・テンプラー +1,500(4,702→6,202)**、ほかの職業 +1,000(→5,702)。アサシン: 研ぎ澄まされた第六感の HP 効果アップ、幻影分身の待ち時間 90秒→60秒 |\n| **製作・遠征装備の突破の上限** | 真龍王・乾龍王(光るも)1→**3**、**白龍王・黒龍王(光るも)3→5** |\n| 継承できる組み合わせが増えた | 遠征の3段目 → 製作の2段目、遠征の2段目 → 製作の1段目(例: 怒りのクロメデのネックレス → 白龍王のネックレス) |\n| オードエネルギー(拘束) | 1キャラ20個の上限をなくし、**週に1キャラ4個・1サーバー16個**に |\n| **採集の上限** | **1サーバー1日1,000回**(リセットは 16:00。今後変わるかも)。採集できる最低レベル 10→45。マクロ対策 |\n| アビス | 入れる人数を増やした。下層の次元コアの HP を増やし、アーティファクト戦が10分以上続くとコアが弱くなる効果「力の消散(仮)」 |\n| 日課ダンジョン | 「オディリウムの保管庫(仮。Odylium Repository)」を追加。入場回数はデーヴァ生体研究所(仮)と共通 |\n| シーズンミッション | 報酬からアビスポイントをなくし、アビス下層の亀裂の石(仮)に |\n| ショップ | 即時完了チケット: 悪夢(拘束)を追加(週に1サーバー14枚、1枚3万ギーナ)。日課ダンジョンのチケットも同じ条件に |\n| そのほか | 何もしないとロビーに戻るまで 3時間→**30分**。隠しキューブが出やすく。キャラを消すまで 1日→7日 |\n| イベント | 28日の出席「アトレイアの呼び声」、ディーヴァパス「飛翔への序曲(仮)」(どちらも 12/2 のメンテまで) |\n\n- **相場への影響(予想)**: 難しいが2つ増えて怒りの素材の出る量が増える → 怒りの思念・意志・自我は下がる方向。採集の上限は採集素材が上がる方向、オードエネルギーの販売は下がる方向で、どちらが強いかは数日見ないと分からない\n- テンプラーには HP +1,500 と、突破の上限アップ(白龍王 +5)が関係する\n- **(10/29 動画から補足)** オディリウムの保管庫(仮)は泡を集めてスコアを出す形で、**ペットの魂が出る**(ペットのレベル上げ、上限ならペットの結晶)。強化石が要らない人はこちら(Spid・Grobs)。ディーヴァパスは 1,000 キューナで、オードエネルギーと悪夢のチケットが入る。アビスの亀裂の石(アビスにいられる時間)は店で買えなくなり、ショップのサーバー移動のタブもなくなった(Spid)\n- 相場(Grobs の予想): ルドラ前で皆が IL2800〜3000 を目指すので、**装備の材料の値段は上がる**方向。Grobs は前日に達人のリングの台を2つ(約920万)買っておいた\n\n## 10/21 のパッチ\n| 変更 | 中身 |\n|---|---|\n| 遠征「難しい」 | クラオ洞窟・ドラウプニルに追加。**IL2600**、復活は3回まで、最後のボスは**4分で狂暴化** |\n| 報酬 | 箱1つのギーナが 40万 → **48万**。報酬枠5: **怒りの思念 66%、意志・自我 16%ずつ**(今まで遠征で出にくかった)。装備は通常と同じ IL54 の物 |\n| 新しい物 | **賢者の石:啓示(刻印)** 1%(平均100回に1個、取引不可。装備に6枠目)。**アリエルの欠片** 毎回60〜90個(物質変換でディーヴァニオン結晶に。キャラごと30個まで。**10/28 の新しい遠征でもう30個の枠が増えた**(Spid。10/30)。その後は強化石5個に。11/11 の公式では欠片はダンジョンごとに別の種類で「結晶は1キャラ30回まで」。種類ごとの枠かは要確認)。**名画「怒りのクラオ」「怒りのドラウプニル」**(高く売れる見込み) |\n| 注意 | 新しい物は**最後のボスだけ**が落とす。途中のボスは通常と同じ |\n| ディーヴァニオン | 新しい盤「アリエル」(PvE ダメージ増幅・耐性、ボスへのダメージなど) |\n| イベント「挑戦に立ち向かえ」 | 12/16 まで。そよ風商会の特殊で復活石 30個を2.5万ギーナ(週1回、サーバーごと)。もう30個は5万ギーナ |\n| アビス | 入れる人数が増えた。下層の次元コアとボスの HP が増えた |\n| 採集素材 | 出品の制限を一部のプレイヤーで緩和 |\n| 職業 | チャンター(回転撃の表示)、ソーサラー(冷気の嵐・炎の壁の不具合)の修正 |\n\n## 今後の予定(NoBS の予想 10/18。確定ではない)\n- **(実現)** 台湾版にある「難しい」は、ほかの遠征にも順に来る見込み → 10/28(ウルググ峡谷(仮)・バクロンの空中島)と 11/11(炎の神殿・獰猛な角岩窟)に来た。「難しいは金装備の出る率が通常の2倍(20%)で、英雄装備も入る」は公式ノートには書かれていない(要確認)\n- 製作の上位素材も難しいのほうが出やすい → 製作の費用は下がっていく見込み(10/28・11/11 の難しいで怒りの素材が出るようになったのは実現。費用が下がったかは相場と製作のまとめ)\n- 超越はシーズン1の間は今のまま。次のシーズンで新しいボス(まだ分からない)\n\n"},{"id":"templar","tab":"テンプラー","title":"テンプラー まとめ","file":"テンプラー_まとめ.md","md":"# テンプラー まとめ(2026-11-22 最新)\n\n10/14〜10/24 に作ったテンプラーのまとめ6本(早見表、詳細版、Lv16を目指すスキル、魂刻印、種族理解度、アルカナのおすすめスキル)を1本にまとめ、10/19〜10/23 の動画で新しくした。古い6本は `_古い版/` にある。\n10/25 に今週の動画3本(JPVariety 10/21、Antochi 10/23、韓国の굳손 10/23)と命中の調査(韓国の実測)を足し、10/26 に5章(能力値と刻印)を1本の順に整理した。足した所は「(10/25)」と書いた。\n名前は questlog.gg の日本語版データで確かめた正式名。11月は 0-0・0-1(韓国版の改編と1年の流れ)、1-6(上位20人 11/16)、4-4〜4-9(回しとマクロ)、5-2(ルドラの命中・クリティカル 11/20)、11-2・11-3(PvP)を足した。0章は新しい結論だけにまとめてある。\n\n## 0. 今の結論(まずここだけ見る)\n| 項目 | 結論 |\n|---|---|\n| 最優先 | **審判を Lv16 → Lv20**。Lv16 で待ち時間がなくなり、Lv20 で特化が3つ。20 を超えても火力は少し伸びる(Xia) |\n| 主力4つ(11/16) | **審判・懲罰・猛烈な一撃・連続乱打**。上位20人は4つとも 17〜21(1-6)。審判の次に 懲罰 と 猛烈な一撃 のどちらを先にするかは人による(12章)。衰弱の猛打は 5〜12、シールド突撃は 12〜14 と低め |\n| スティグマ(11/16) | **高潔の甲冑・戦場の旗・挑発**が上位のほぼ全員で Lv20。4つ目は破滅のシールド(12人)か保護のシールド(9人)。**戦場の旗は Lv20 にしてから**(それまでは破滅のシールド。Krix Domi・Screamheart)。ルドラでは保護のシールドを外せないという人も(4-9)。10/19 の Xia の「高潔の甲冑 Lv15・挑発 Lv5」は 3-1 |\n| 防御低下 | 衰弱の猛打・処刑の剣は PvE では**使わない**が多数意見(貫通でボスの防御はほぼ0。マクロから外すと審判が増える、4-8)。マクロに入れる人もいる(12章)。PvP では使う |\n| パッシブ | **激昂 \u003e 侮辱の咆哮 \u003e 衝撃的中 \u003e 断罪の加護**(2章。上位20人の刻印も激昂・侮辱の咆哮・衝撃的中の3つ)。断罪の加護を2番にする人もいる(12章) |\n| 装備の刻印 | 戦闘速度が一番。防具・アクセサリーのスキルの行は激昂・侮辱の咆哮・衝撃的中。リングはスキルの行を 審判・猛烈な一撃・連続乱打・懲罰 の4つ(上位 11/8、5-4) |\n| 能力値の順(11/16) | **命中(約1,250 まで)→ 前方ダメージ増幅 → 強打 → ダメージ増幅・武器ダメージ増幅 → 攻撃力増加 → クリティカル ダメージ増幅**。完璧はほぼ伸びない。強打はボスの「強打抵抗」を超えて初めて効く。**NotMeter の計算機に自分の能力値を貼ると、自分に合った順が出る**(5-1) |\n| 命中の目安(11/20) | ルドラは **命中+PvE 命中 の合計で 約1,250**(1,200 が最低)、難しいは **1,400〜1,500**。足りないと前からの攻撃に受け流しが出てダメージ半分。超越・遠征「難しい」は韓国の実測で約1,150〜1,200(5-2) |\n| クリティカルの目安(ルドラ、11/20) | **約1,700**(料理・チャンターのマントラ込み。普通も難しいも同じ)。**命中が先、次にクリティカル**。審判・懲罰は確定クリティカルだが、ほかの技はクリティカルが足りないとほとんど出ない(5-2) |\n| スティグマの量(10/25 굳손) | アビスの店200+悪夢35+シューゴフェスタ35+Lv45までに30。全部買えば**4つとも Lv20** にできる量 |\n| アルカナ(11/16) | 審判は聖杯と羊皮紙だけに付く。聖杯は審判を指定して作る。羊皮紙は 審判・猛烈な一撃・懲罰(4つ目は殲滅)。色は上位は鐘・鏡が魔力、ほかは活力が多い(1-6)。Screamheart は鐘だけ魔力(4-7。12章) |\n| 狩り | 破滅のシールド Lv15+審判 Lv16+殲滅 で一撃ずつ倒して回る |\n| **職業の強さ(11/6 Viles)** | **S**(アサシン使いの評価)。「審判 Lv20 と懲罰 16 がそろうとボスを溶かす。盾役なのに戦闘力 20万のアサシンと同じくらいの火力」。ボスの防御を下げ、激昂でパーティーの火力も上げる |\n| **ルドラの盾役(11/6 NoBS)** | 両方のボスとも**盾役がボスを外側へ向け、ほかの全員はボスの真後ろに固まる**。1組目のボス(Rahu)は普通の攻撃が全部前方の範囲。2組目のボス(Ketu)は飛びかかりを**盾役が受けてガードすると、ダメージも後の輪の攻撃も消える**。詳しくは `アップデート情報.md` の 11/4 のルドラ |\n| **回しの確かめ方(11/8 Xia)** | 木人で1分回して**審判の回数**を数える。**戦闘速度 46% 以上**でシールド強打・庇護の一撃が審判4回ずつ、破滅のシールドが6回。1分で **72回未満なら練習不足**(4-4) |\n| **マクロの並び(11/16 StingKnight)** | 右のマクロは下から **審判 → 庇護の一撃 → シールド強打 → 連続乱打**、衰弱の猛打は外す。1分で審判が6回増える(4-8)。挑発は手で押す(Xia 11/6、4-4) |\n| **ルドラに要る戦闘力(11/8 Spid)** | 普通は**パーティー全員 約21万以上**。難しいは火力職 **24.5万以上**、テンプラー・クレリックは 21〜22万でもよい。11/7 の時点で難しいを倒したのは世界で数組(アップデート情報) |\n| **ルドラ「簡単」(11/19)** | 11/18 のパッチで追加。**入場 IL 2,800**・復活は無制限・報酬はルドラの武器とガーダー。装備の出る率は全難易度で 15% に(アップデート情報) |\n| **世界最速の盾役の形(11/13 Krix Domi)** | 神の懲罰は「難しい」でグロッキーが足りないとき Lv10(グロッキーのダメージ 100)。**戦場の旗は Lv20 にしてから**(再使用が長いので、それまでは破滅のシールド)。アルカナのコンパスは連続乱打4+猛烈な一撃2、鐘は青(破壊)で激昂4+侮辱の咆哮3。リングは威力・正確・猛烈な一撃・審判・懲罰・攻撃力 |\n| **韓国・台湾の大改編(11/13、手直し 11/16)** | 審判が「**溜めて撃つ技**」になり、再使用を消す特化がなくなる。続けて撃つと懲罰が強くなる。韓国の 11/13・11/14 の手直しで、**審判を開ける時間が 3→5秒**、審判の力は**3回続けて撃てば付く**(前は5回)、**懲罰が溜めない技(すぐ撃つ)に**、保護のシールドのガードで審判の再使用が戻る。ソーサラーなどは改編の多くが元に戻った。グローバル版にはまだ来ていない(0-0、アップデート情報) |\n| **今後のビルドの流れ(11/9)** | 韓国版の1年を見ると、**審判が中心なのは最後まで同じ**。変わるのは「どのスキルで審判をキャンセルするか」(猛烈な一撃 ⇔ 連続乱打 を何度も行き来した)、戦闘速度の上限、ガード型の流行、激昂の弱体化。0-1 |\n| **PvP のビルド(11/6・11/17)** | 人によって大きく違う(12章)。1対1 は 二重鎧・ネザカンのシールド・保護のシールド・破滅のシールド(近接職が相手なら保護のシールド → 挑発。Ashura、11-2)、または 高潔の甲冑・戦場の旗を外して **ネザカンのシールド・破滅のシールド・挑発・処刑の剣**(JPVariety、11-3)。PvP では衰弱の猛打を使う |\n| **PvP の早見表(11/22)** | 能力値は 命中 → 前方ダメージ増幅 → 武器ダメージ増幅 → 状態異常的中。連続乱打に HP 吸収、衰弱の猛打は PvP だけ。1対1 は 二重鎧・ネザカンのシールド・保護のシールド・破滅のシールド、**大規模戦は拿捕と保護のシールドを Lv15 にして高い所から引き寄せる「釣り役」**(11章の頭の「PvP の早見表」) |\n\n\n## 0-0. 韓国・台湾の大改編でテンプラーはどう変わるか(11/13)\n韓国・台湾で 11/11 に入った戦闘の改編(アップデート情報)。**グローバル版にはまだ来ていない**(早くても 12/16 のシーズン2ごろの見込み)。Xia が台湾版で試した結果(11/12、1.2万回)と、Spid・aLuckyRO の発表のまとめから。\n| 点 | 今のグローバル版 | 改編のあと(台湾版) |\n|---|---|---|\n| 審判 | 特化で**再使用時間がなく**、シールド強打・庇護の一撃・破滅のシールドで開いて連打する | **5回分を溜めておく技**。1回使うと1つ減り、**3秒ごとに1つ戻る**。「再使用を消す特化」はなくなる |\n| 審判の特化 | 3・4・5(追加ダメージ・必ずクリティカル・再使用なし) | 3つ目の特化が「**続けて撃つほど強くなる**」に。必ずクリティカルは**クリティカル率 +30%** に変わる |\n| 新しいバフ | — | 5回続けて撃つと「**審判の力**(仮。英語 Power of Judgment)」: 攻撃力・前方ダメージ増幅が上がり、**懲罰のダメージも上がる**。だから**毎回5回続けて撃つ**のが前提 |\n| 回し方 | 左右クリックを押したまま、マクロが審判を出す | バフ → 審判を5回 → 審判の力が付いたら**懲罰** → **破滅のシールドで5回分を一気に戻す** → また5回。残りが4つになったらシールド強打を使う(撃っている間に5つ目が戻るため)。マクロからは審判を外し、**ほとんど手で押す** |\n| 火力 | 審判の回数が多いほど強い(4-4) | 審判の回数は約半分(1分 33回 ≒ 今の 66回分)。1回の威力は約2倍。**戦闘力 100万の人でも審判の回数がほとんど増えていない**ので、戦闘速度・再使用短縮を上げても伸びにくいのでは、と Xia は心配している |\n| パーティーへの効果 | 激昂が中心 | 激昂は弱くなったのに、パーティーの火力への貢献(RDPS)はとても大きく出た(理由は Xia にも分からない) |\n- **Xia の感想は「今のままでは遊べない」**。NC は「うまくいかなければ変える」と言っているので、グローバル版に来るまでに変わる可能性が高い\n- 今のうちにできること: 審判は今のまま Lv20 が一番大事(どちらの形でも中心)。**懲罰の価値は上がる**(審判の力で強くなる)。戦闘速度を「審判の回数のため」だけに積むのは、改編のあとは効きが落ちるかもしれない\n- 0-1 の「韓国版の1年の流れ」は、この改編より前の話\n\n**11/13・11/14 の手直し(韓国版。Anders 11/15、6.2万回)(11/16)**\n韓国は改編のあと2回、緊急メンテで手直しをした。NC は「職業の強さの調整はまだ。データを見て後で」と言っている。Anders は「NotMeter の順位で職業の強さを見るのは、少なくとも2週間待て」。\n| 日 | 変わった点 |\n|---|---|\n| 11/13 | シールド強打・破滅のシールドで**審判を開ける時間が 3秒 → 5秒** |\n| 11/13 | 審判の3つ目・5つ目の特化: 続けて撃つときの間隔が **1秒 → 1.5秒** |\n| 11/13 | 3つ目の特化の追加ダメージ(続けた回数ごと)が 20・50・100・200% → **50・100・150・200%** |\n| 11/13 | 5つ目の特化: 審判の力(仮)が付くのが **5回続けて → 3回続けて** |\n| 11/13 | **保護のシールド**の3つ目の特化: 「ガードで攻撃力が上がる」→「**ガードすると審判の再使用が戻り、5秒間撃てる**」 |\n| 11/14 | **懲罰が溜める技 → すぐ撃つ技に** |\n| 11/14 | 全職業: 闘技場とアビスで**受ける回復が −20% → −50%**(PvP) |\n\n**改編のあとの台湾版の1分の木人(Ashura 11/12、1万回。11/13 の手直しの前)(11/16)**\n| 回し方 | 1分の DPS | 審判 / 連続乱打のダメージ |\n|---|---|---|\n| 今までどおり(マクロに審判) | 約44.5万 | 520万 / 370万(**連続乱打のほうが多い**) |\n| 破滅のシールドもマクロに入れる | 約43万 | 670万 / 380万 |\n| **殲滅 → 挑発 → シールド強打 → 審判 → 破滅のシールド → 庇護の一撃 → 連続乱打** の順のマクロ | **約50.4万**(一番高い) | 760万 / 約600万(連続乱打+猛烈な一撃) |\n- 改編のあとは、審判を開けるのは**シールド強打と破滅のシールドだけ**(庇護の一撃・シールド突撃では開かない)。「溜める技」と書いてあるが、実際は溜め時間なしですぐ出る(Ashura は「翻訳が悪い」と言う)\n- Ashura の結論: **PvE は弱体化ではなく作り直し**(改編前より少し上がった)。ただし**破滅のシールドが必須**になる。スティグマが4枠のままだと、ルドラのように保護のシールドが欲しい場面で枠が足りない。6枠になってから来てほしい。PvP は火力を溜めてからでないと出ないので弱くなりそう\n- 目標は 猛烈な一撃・連続乱打・懲罰・審判を全部 Lv20\n\n**韓国版の改編のあとの回し(옐 11/12、4.6万回。韓国のテンプラーで今週一番人気。11/13 の手直しの前)(11/16)**\n- 木人1分で 780万〜800万 DPS。マウスの左 = 猛烈な一撃、右 = 審判だけのマクロ(審判・殲滅・閃光乱舞)、別のキーに 懲罰・戦場の旗・連打用の閃光乱舞\n- 回し: 懲罰 → シールド強打で審判を開ける → **3秒の間に審判を5回** → 審判の力(仮)を取る。**破滅のシールドは「保険」に取っておく**(ボスの動きで5回撃てなかったときに使う)。ダンジョンでは審判の力を 70〜80% の時間付けておくのが目標\n- 懲罰の再使用を見ておく。審判を4回まで撃った所で懲罰が出てしまうと、3秒に間に合わない。**懲罰を先に撃ってから審判5回**が正しい\n- 感想は「火力は出るが、とても疲れる。3秒は短すぎる」。→ 翌日の手直しで5秒に延び、ガードで審判が戻る形になった(上の表)\n\n## 0-1. 今後のビルドの流れ(韓国版の1年から)(11/9)\n韓国版は 2025年11月に始まり、グローバル版より**約10か月進んでいる**(グローバル版がもっと速く進めば、下の時期も早まる)。韓国の掲示板 Inven のテンプラーの板(2025/11〜2026/11)の書き込みから、時期ごとの変化をまとめた。台湾版は、台湾で遊ぶ Ashura(11-0 の 10/31 の分は Ashura Whole Heavens。0-0 の 11/12 の分がどちらの Ashura かは未確認)の動画のほかに、まとまった資料が見つからなかった(4章・11-2 の Ashura はグローバル版の天族と書いてあり、別の人の可能性がある。要確認)。\n**韓国版のパッチがそのままグローバル版に来るとは限らない**(グローバル版は能力値の数字が違う。神の能力値は半分など)。「この順で来る可能性が高い」と読む。\n\n**時期ごとの流れ(韓国版)**\n| 韓国の時期 | グローバル版で言うと | 起きたこと |\n|---|---|---|\n| 2025/11〜2026/1(シーズン1) | **今** | 審判が中心。盾役としては弱い(パッシブの苦痛遮断・鉄壁防御が弱く、超越の雑魚にも倒される)という不満が多かった。「火力は1人分に届かないが、ダメージ耐性・ダメージ増幅・敵対値・防御低下でパーティーの火力を上げる職業」という見方(1/6) |\n| 2026/3〜4(シーズン2〜3) | 2027年1〜2月ごろ | **ガード型(自然ガード)が流行**。料理と高潔の甲冑でガード 約3,900〜4,000。悪夢のランキングでは「ガードは必須」と言う上位の人もいた(4月)。装備は**防具がダンジョンの物、武器とアクセサリーが製作**で上位に入れた(無課金の人、10/2) |\n| 2026/7/22 のパッチ | 2027年5月ごろ | 侮辱の咆哮の攻撃力が上がり、**戦場の旗の戦闘速度 10% → 15%**、懲罰の PvE ダメージ増幅 10% → 15%。一方で**激昂が弱くなった**(PvE ダメージ増幅 40 → 34、盾でガードできる回数 3 → 2。二重鎧との組み合わせも変わった)。「自分の火力は上がったが、パーティーを強くする力は下がった」 |\n| 2026/8/26 のパッチ | 2027年6月ごろ | **連続乱打で審判をキャンセルする形(연심캔)が主流**に。猛烈な一撃は「つなぎの技」になり、「もう Lv20 にする必要はない(アルカナは捨てずに取っておく)」。ただし9/2 に連続乱打が弱くなり、「アサシンの上位と同じくらいだったテンプラーの火力が、補助役らしい量に戻った」 |\n| 2026/9 | 2027年7月ごろ | 聖域4(10人)は**テンプラーが1人いる前提**の作り(2人いると敵対値の取り合いになる)。上位はスティグマを **Lv25** まで上げている |\n| 2026/10〜11(シーズン3の終わり) | 2027年8〜9月ごろ | **戦闘速度の上限**の話が中心(審判の2段目の上限 116.7%。戦場の旗 Lv23〜25 で届かせる)。PvP では命中型かガード型か、HP を積む形かで意見が分かれている |\n- 韓国の人の言葉では、キャンセルの形は「猛烈な一撃 → 連続乱打 → 猛烈な一撃 → 連続乱打 → 猛烈な一撃」と何度も入れ替わり、そのたびに審判・猛烈な一撃・連続乱打のどれかが弱くなった(10/13。PvP の不満の書き込み)\n- 新しい聖域「侵食」(仮。韓国名 침식)で、**全職業に HP 吸収**が付いた(治癒の頼りすぎを減らすため)\n\n**韓国版の8月の PvE の形(上位でない人の「基本の形」、8/22・8/28)**\n| 項目 | 中身 |\n|---|---|\n| スキルの特化 | 猛烈な一撃 3・4・5、連続乱打 2・3・4、捕獲 1・3、**審判 3・4・5(ずっと同じ)**、庇護の一撃 2・5、シールド突撃 2・4、懲罰 2・3・5(Lv16 なら 3・4)、殲滅 1・3・4(上位の形では必須) |\n| パッシブ | **激昂 \u003e 侮辱の咆哮 \u003e 衝撃的中**(今のグローバル版と同じ) |\n| マクロ(連続乱打の形) | 審判 → 破滅のシールド → 庇護の一撃 → シールド強打。始めは懲罰の遠くからの攻撃 → 破滅のシールド。シールド強打は動きが止まるが、審判を出し続けるので必ず入れる |\n| 戦闘速度と回数 | 戦闘速度 91.6% +巻物 20% = 111.6% で、1分の木人で 約580回の攻撃・審判 約230回。巻物が 15% なら 568回・210回 |\n| 閃光乱舞 | グロッキーのときにキャンセルでき、戦場の旗の再使用を戻す・MP 回復になるので、遠征・超越で役に立つ |\n| 衝撃解除 | 強靭(状態異常を防ぐ)の 7秒が大きい。PvE では特化 1 を使わない |\n| 刻印(PvE) | 武器・ガーダー = 威力・正確・戦闘速度・武器ダメージ増幅・ダメージ増幅・攻撃力・多段ヒット的中。防具 = 部位の目玉(5章)+ 激昂・侮辱の咆哮・衝撃的中。アクセサリー = 攻撃力・ガード・激昂・侮辱の咆哮・衝撃的中・断罪の加護 |\n| アルカナ | 守護4・懲罰4 のセット。羊皮紙で懲罰・審判・猛烈な一撃のどれかを Lv4、コンパスで連続乱打 Lv4。鐘で激昂 3以上、鏡で衝撃的中 3以上 |\n| 目安の数字 | 高潔の甲冑を使って **強打 75〜80、前方ダメージ増幅 40 以上** |\n| ガード型にするなら | 敏捷とガード(敏捷が先)。ガードの目安は 遠征 2,400〜2,500、超越 3,100(予想) |\n\n**韓国版の10月の上位の回し(PvE、10/2。悪夢・遠征で区間1位を取った人)**\n- ガード型: 戦場の旗 → **強襲猛撃** → **神の懲罰** → 左右クリックを3秒 → 懲罰を溜めきる → あとは左右クリック。ガード型でなければ強襲猛撃を外し、戦場の旗 → 懲罰を溜めきる → 神の懲罰 → 左右クリック\n- 戦場の旗・神の懲罰・懲罰は手で。懲罰の溜めは**審判が終わるころ**が一番よい\n- 8月の別の人(戦闘力 93万、木人で平均 420〜440万 DPS)のマクロも「審判 → 神の懲罰 → 破滅のシールド → 連続乱打」で、**神の懲罰を PvE で使っている**。今のグローバル版の上位(高潔の甲冑・挑発 固定)と違う所\n\n**今のグローバル版で気をつけること(上の流れから。こちらのまとめ)**\n| 点 | おすすめ |\n|---|---|\n| スキル | **審判・懲罰・連続乱打**を先に。猛烈な一撃は、今はキャンセルの技として大事だが、韓国では途中で「つなぎ」に下がった。Lv20 にしたあとも、**猛烈な一撃・連続乱打のアルカナは捨てずに取っておく**(形が何度も入れ替わったため) |\n| 戦闘速度 | これからも一番大事な能力値の1つ。韓国では上限(116.7%)に届かせるのが話題の中心になった。戦場の旗は後で強くなる可能性がある |\n| ガードの行 | 韓国ではシーズン2〜3 で**ガード型が流行**した。今付いているガードの行は、無理に消さなくてよい |\n| 激昂(パーティーの補助) | 韓国では後で弱くなった。テンプラーは「パーティーを強くする役」から「自分も火力を出す役」に寄っていく流れ |\n| スティグマ | 韓国の上位は 戦場の旗・神の懲罰・二重鎧・強襲猛撃(ガード型)などを Lv25 まで上げる。**神の懲罰は後で PvE でも使われる**ので、欠片に余裕ができたら候補 |\n| 装備 | 韓国の無課金の上位は「防具はダンジョン、武器とアクセサリーは製作」。今の製作の予定(リング・ネックレス・ロングソード)と同じ方向 |\n\n---\n\n## 1. スキル\n\n### 1-1. 優先順と目標\n| 優先 | スキル | 目標 | 理由 |\n|---|---|---|---|\n| 1 | **審判** | 16 → 20 | Lv16(特化5)で待ち時間なし。火力の約半分。Lv20 で特化3つ |\n| 2 | 懲罰 | 16 → 20 | 2番目の火力。懲罰の強化(+20%)をずっと切らさない |\n| 2 | 猛烈な一撃 | 16 → 20 | 左クリックの基本攻撃。1発ごとに庇護の一撃の待ち時間 −2秒。Lv16 で4段目の追撃 |\n| 4 | 連続乱打 | 16 | 審判が使えないときだけ打つ。懲罰の待ち時間も回す |\n| 5 | 庇護の一撃 | 16 | 審判を開く技 |\n| 6 | 殲滅 | 12〜16 | 破滅のシールドでリセットして打つ |\n| 7 | シールド強打 | 12〜16 | 審判を開く技 |\n| — | 閃光乱舞 | 使わない | 10月の動画は全員一致。11/4 の上位は特化5(全スキルの待ち時間 −1秒)のため 7〜16 にしていたが、11/16 は 1〜3(1-5・1-6) |\n| — | 衰弱の猛打 | PvE では使わない | 3章・12章 |\n- この表は10月の目標。**11/16 の上位20人は主力4つ(審判・懲罰・猛烈な一撃・連続乱打)を 17〜21** にしている(1-6)\n\n- 審判を開く技は4つ: シールド強打、庇護の一撃、シールド突撃、破滅のシールド(Xia)\n- NoBS の実測(月額課金のみ): IL1,600 で約1.2万DPS → 猛烈な一撃・連続乱打 Lv16 で約2万 → 審判・懲罰も Lv16 で約4〜4.5万\n\n### 1-2. レベルの上げ方\n| 方法 | 上がる量 |\n|---|---|\n| スキルポイント(知恵の石など) | 10 まで |\n| ディーヴァニオン | 主要スキル +4 |\n| リングの刻印 | 1行で +1。**リング2つで +2** が普通(武器・ガーダーにもスキルの行は付くが、上位は付けない。5-4) |\n| アルカナ | 残りの +4 をここで取る(Xia) |\n\n→ 10+4+2=16。Lv20 には アルカナで +4 が要るので、Lv20 にできるのは現実的に1〜2個(10/19 の Xia。**11/4・11/16 の上位は主力4つをほぼ Lv20** にしている。1-5・1-6)\n\n### 1-3. 特化(ボス用)\n| スキル | Lv16 未満 | Lv16 以降 |\n|---|---|---|\n| 審判 | 追加ダメージ+確定クリティカル | **待ち時間なし**+確定クリティカル(Lv20 で3つとも) |\n| 猛烈な一撃 | 庇護の一撃の待ち時間 −2秒+多段ヒット | 4段目の追撃 |\n| 懲罰 | 継続ダメージ+α | 確定クリティカル+回避無視 |\n| 連続乱打 | 懲罰の待ち時間 −1秒+追加ダメージ | 同じ |\n| 庇護の一撃 | 待ち時間短縮+1つ | 1番と5番 |\n| 殲滅 | 行動不能無効の敵に +100%+待ち時間 −10秒 | 狩りでは多段ヒット+待ち時間 −10秒 |\n| 捕獲 | 対象へ移動+バリア | 狩りでは「撃破で待ち時間リセット」 |\n| シールド突撃 | 射程 +10m+待ち時間 −10秒 | 狩りでは範囲化 |\n\n- 詳しい特化の番号は Xia の questlog.gg のビルドにある(動画の説明欄)\n\n### 1-4. 特化の番号とレベル(10/25 追加。韓国の굳손、グローバル版シーズン1向け)\n| スキル | レベル | 特化 | 補足 |\n|---|---|---|---|\n| 猛烈な一撃 | 20 | 2・4・5(火力寄りなら 3・4・5) | |\n| 連続乱打 | 20 | 2・4・5(火力寄りなら 3・4・5) | HP 吸収が一番多いので吸収の特化を取る |\n| 審判 | 20 | **3・4・5** | 吸収はほかの2つで取り、審判は火力だけ |\n| 懲罰 | 12 か 16 | Lv12 は 1・3(吸収と速度)、Lv16 は 3・5(火力) | 今のアルカナで Lv20 を4つは無理なので(10/23 の話。11月の上位は4つとも Lv20 近く、1-5・1-6) |\n| 庇護の一撃 | 16 | 1・5 | パーティーのダメージ耐性 |\n| 捕獲 | 12 | 1・3 か 1・4 | |\n| シールド強打 | 12 | 2・4 | |\n| シールド突撃 | 12 | 2・4 | 射程と待ち時間 |\n| 殲滅 | 12 | 3・4 | |\n| 衰弱の猛打 | 12 | 2・4 | ボスの防御を下げる。**入れなくてもよい** |\n| 衝撃解除 | 12 | 2・3 | ボス戦で気絶したときの立て直し |\n| 閃光乱舞 | — | 使わない | |\n- 字幕は韓国語を機械で英訳した物で、スキル名は並び順から当てはめた。特化の番号は動画どおり\n\n### 1-5. 上位20人の実際のスキル・特化・スティグマ・パッシブ(11/4)\nNotMeter「装備・スキル構成」のテンプラー上位20人(11/4 6時47分の集計)。特化は戦闘記録が取れた人だけの割合。\n\n| スキル | レベル | 特化(選んだ人の割合) |\n|---|---|---|\n| 猛烈な一撃 | 20 | 3 多段ヒット 95%・4 庇護の一撃の待ち時間 100%・5 威嚇の猛打 100% |\n| 審判 | 20 | **3・4・5 が 100%** |\n| 連続乱打 | 20 | **3・4・5 が 100%**(HP 吸収の2は0%) |\n| 懲罰 | 17〜20 | 3 スキル速度 100%・5 ガード回避無視のクリティカル 95%(1 HP 吸収 10%、2 継続ダメージ 20%) |\n| 庇護の一撃 | 15〜16 | 1 待ち時間 100%・2 ガード +100 65%・5 パーティーのダメージ耐性 35% |\n| 閃光乱舞 | 7〜16 | 5 全スキルの待ち時間 −1秒 100%・4 必ず多段ヒット 67% |\n| 殲滅 | 14〜16 | 3 行動不能無効の敵に +100%・4 待ち時間 −10秒 が 100% |\n| シールド強打 | 14〜16 | 4 待ち時間 −2秒 100%・2 MP 消費なし 80% |\n| シールド突撃 | 12〜15 | 2 射程 +10m 100%・4 待ち時間 −10秒 89% |\n| 衰弱の猛打 | 12〜14 | 2 衰弱の時間 +3秒・4 ガード回避無視 が 100% |\n| 衝撃解除 | 12〜15 | 3 HP 20% 回復 100%・4 強靭 +2秒 60% |\n| 捕獲 | 12〜14 | 1 対象へ移動 100%・3 撃破で待ち時間リセット 79%・4 バリア 21% |\n\n| スティグマ(13個とも持っている) | レベル | パッシブ | レベル |\n|---|---|---|---|\n| 挑発・戦場の旗 | 25 | 激昂 | 36 |\n| 神の懲罰・強襲猛撃・破滅のシールド・高潔の甲冑 | 20〜25 | 侮辱の咆哮 | 30〜32 |\n| 保護のシールド・二重鎧・拿捕・ネザカンのシールド・処刑の剣・均衡の鎧・戦友保護 | 20 | 衝撃的中 | 30〜31 |\n| | | 苦痛遮断・鉄壁防御・生存意志・HP強化・断罪の加護・守護の印章 | 13〜16 |\n- 上位は全員、主力4つ(猛烈な一撃・審判・連続乱打・懲罰)をほぼ Lv20 にしている。閃光乱舞もレベルは上げている(特化の5「全スキルの待ち時間 −1秒」のため)\n- 連続乱打は全員が火力の3番(HP 吸収の2番は0%)。1-4 の「2・4・5」より火力寄り\n- スティグマは13個とも Lv20 以上。使う4枠を選ぶのではなく、全部を上げてある(かけらが行き渡った段階)\n\n### 1-6. 上位20人の今(NotMeter 11/16 14時35分、グローバル版)(11/16)\nレベルの数字は 11/4 の表(1-5)より全体に低い。集計の仕方が変わったのか、上位の顔ぶれが変わったのかは分からない(どちらもグローバル版の表示)。**どのスキルに何人が何レベルを置いているか**の目安として見る。\n| スキル | 上位のレベル | 特化(選んだ人の割合) |\n|---|---|---|\n| 審判 | **20〜21** | 3・4・5 が 100% |\n| 懲罰 | 18〜20 | — |\n| 猛烈な一撃 | 17〜20 | 4 庇護の一撃の待ち時間 100%・5 威嚇の猛打 100%・3 多段ヒット 60% |\n| 連続乱打 | 17〜20 | 4 懲罰の待ち時間 100%・5 追加ダメージ 90%・3 少数相手 +12% 70% |\n| 庇護の一撃・殲滅 | 15〜16 | — |\n| シールド強打 | 12〜16 | — |\n| シールド突撃 | 12〜14 | 2 射程 +10m 100%・4 待ち時間 −10秒 95% |\n| 捕獲 | 12 | 1 対象へ移動 100%・4 バリア 55%・3 撃破でリセット 40% |\n| 衝撃解除 | 10〜12 | 3 HP 20% 回復 100%・4 強靭 +2秒 53% |\n| 衰弱の猛打 | **5〜12** | (使うのは自動で出る分だけ) |\n| 閃光乱舞 | 1〜3 | (11/4 の 7〜16 から下がった) |\n\n| スティグマ(使っている人) | レベル | パッシブ | レベル |\n|---|---|---|---|\n| 高潔の甲冑(20人) | **20** | 激昂 | 22〜27 |\n| 戦場の旗(19人) | 20 | 侮辱の咆哮・衝撃的中 | 18〜24 |\n| 挑発(17人) | 20 | 鉄壁防御・HP強化 | 15〜17 |\n| 破滅のシールド(12人) | 20 | 断罪の加護 | 15〜16 |\n| 保護のシールド(9人)・神の懲罰(2人)・ネザカンのシールド(1人) | 20 | 生存意志・苦痛遮断・守護の印章・庇護のシールド | (全員が少し) |\n- 4枠の組み方は **高潔の甲冑・戦場の旗・挑発 がほぼ全員**、4つ目は破滅のシールド(12人)か保護のシールド(9人)\n\n**アルカナ(上位20人)**\n| カード | 使っている色 | 付いているスキル(人数) |\n|---|---|---|\n| 聖杯 | **活力 20人** | 審判 18・懲罰 10・猛烈な一撃 9・連続乱打 8 |\n| 羊皮紙 | 活力 15・魔力 5 | **審判 20・猛烈な一撃 20・懲罰 19**・殲滅 10 |\n| コンパス | 活力 13・魔力 7 | **連続乱打 20**・衝撃解除 14・庇護の一撃 14・シールド強打 12 |\n| 鐘 | **魔力 20人** | **激昂 20**・侮辱の咆哮 19・HP強化 17・断罪の加護 13 |\n| 鏡 | 魔力 13・活力 7 | **衝撃的中 20**・鉄壁防御 19・生存意志 17 |\n- 全員が活力と魔力のセットを組み合わせている(聖杯・羊皮紙・コンパスが活力、鐘・鏡が魔力の「活力3+魔力2」が一番多い形)。Screamheart(4-7)の「鐘だけ魔力」より、鏡も魔力にする人が多い\n- 魔石・霊石のダメージの行: 魔石は ダメージ増幅 12人・前方ダメージ増幅 11人・クリティカル ダメージ増幅 10人・武器ダメージ増幅 9人。霊石は前方ダメージ増幅 10人が一番\n\n---\n\n## 2. パッシブ\n| 優先 | パッシブ | 理由 |\n|---|---|---|\n| 1 | **激昂** | 前方攻撃のダメージが上がり、ガードするたびにパーティー全体の PvE ダメージも上がる。一番大事(全員一致) |\n| 2 | 侮辱の咆哮 | 前から当てると強くなる。後ろから殴らない |\n| 3 | 衝撃的中 | 強打(ダメージが2倍になる確率)が上がる。上位20人は激昂・侮辱の咆哮とともに全員が刻印に付けている(5-4) |\n| 4 | 断罪の加護 | 侮辱の咆哮と同じくらい(aLuckyRO 10/20)。2番目に置く人もいる(Ashura。12章)。上位20人の刻印にはほぼない |\n| 5 | HP強化、鉄壁防御 | 防御系。余裕があれば |\n| PvP | 生存意志、苦痛遮断 | PvE では要らない |\n\n- **(11/4 Ashura)** PvE は「激昂 \u003e 断罪の加護 \u003e 侮辱の咆哮」。断罪の加護はクリティカルが上がるので、ルドラ向けに2番目に置く。衝撃的中の強打(ダメージ2倍の確率)も PvE で良い。PvP は 鉄壁防御 \u003e 生存意志 \u003e 衝撃的中\n- 上位20人のパッシブのレベルは 1-5(11/4)・1-6(11/16)の表。順は 激昂 \u003e 侮辱の咆哮・衝撃的中 \u003e 断罪の加護(1-6)。Screamheart(4-7)・JPVariety(4-5)・韓国版(0-1)も同じ順\n\n---\n\n## 3. スティグマ(グローバル版は4枠)\n\n### 3-1. 1つずつの評価(Xia 10/19。上位のテンプラー数人と相談した結論)\n| スティグマ | 評価 | 目標 |\n|---|---|---|\n| **高潔の甲冑** | **必須**。激昂と侮辱の咆哮の効果 +50%。外さない | Lv15 にして放置(11/16 の上位は全員 Lv20、1-6) |\n| **挑発** | **必須**。Lv5 で萎縮(相手の PvE ダメージ耐性 −10%)。パーティー全体の火力が上がる | Lv5。15・20 で待ち時間と持続が伸びる(11/16 の上位は Lv20、1-6) |\n| 破滅のシールド | 審判を3秒出す。投資が少ないうちは強い | Lv5 で十分(狩り用は Lv15) |\n| 保護のシールド | 激昂を100%切らさない。ボスの攻撃が少ないときに。ヒーラーも楽 | Lv5(+1回) |\n| 戦場の旗 | Lv20 で強い。それまでは稼働時間が短い | Lv20 になってから入れる |\n| 神の懲罰 | 悪夢で少し使える程度 | 低い |\n| 処刑の剣 | 防御低下は火力にならない(貫通でボスの防御はほぼ0になるため) | 使わない |\n- 衰弱の猛打(防御低下のアクティブスキル。スティグマではない)も同じ理由で PvE では使わない(1-1・12章)\n\n- 注意: 破滅のシールドは Lv1 でも殲滅がリセットされる**バグ**がある。不具合の利用は規約違反で処分の対象になりうるので、Lv5 まで上げて使う(Xia)\n\n### 3-2. 構成\n| 用途 | 4枠 |\n|---|---|\n| ボス(一番火力が出る) | 高潔の甲冑、挑発、戦場の旗(Lv20)、破滅のシールド |\n| ボス(激昂が出ないとき) | 破滅のシールド → 保護のシールド に替える |\n| ボス(戦場の旗が Lv20 未満) | 戦場の旗 → 保護のシールド に替える |\n| 狩り・覚醒戦・デイリー | **破滅のシールド Lv15**、高潔の甲冑、挑発、+1(何でもよい) |\n| PvP 1対1 | 高潔の甲冑 Lv15、破滅のシールド Lv5、ネザカンのシールド、二重鎧 |\n| PvP 5対5 | 拿捕、神の懲罰、戦友保護、破滅のシールド |\n| PvP 大規模戦 | 高潔の甲冑 Lv15、拿捕 Lv15、破滅のシールド Lv5、戦友保護か二重鎧 |\n- PvP の3行は 10/19 の Xia。ほかの人の形(高潔の甲冑を外す JPVariety など)は 11章。人によって大きく違う(12章)\n\n- 意見の割れ: Ulfhednar(10/18、Sahara のビルド)は 破滅のシールド・高潔の甲冑・戦場の旗・保護のシールドで、**衰弱の猛打(防御 −25%)もマクロに入れている**。Xia は「防御低下が効くデータがあれば考えを改める」と言っている\n- (10/25)JPVariety(10/21)は **挑発・破滅のシールド Lv15・高潔の甲冑 Lv15・戦場の旗 Lv20**。野良で味方が苦しいときは 戦場の旗 → 保護のシールド(ガードが増え、激昂のパーティーへの効果を配れる。そのぶん武器ダメージ +10% と「防御に比例した攻撃力」を失う)。破滅のシールドは Lv20 で転倒の確率が上がり、殲滅を打つ回数が増える\n- (10/25)굳손 の4つ: 保護のシールド・破滅のシールド・高潔の甲冑・戦場の旗(英訳の名前から推定。**挑発が入っていない**ので、ほかの人の「挑発は固定」と違う。12章)。全部 Lv20 が目標\n\n**(11/1)遠征「難しい」のボスごとの入れ替え(Xia 10/31)**\n「難しい」のボスは命中が高く、自然なガードで激昂を保つのが難しい。**ほとんどのボスで保護のシールドを入れる**(そのぶん戦場の旗を外すことがある)。グロッキーで止める必要がある所は**神の懲罰がほぼ必須**。\n| ダンジョン | ボス | 4枠 |\n|---|---|---|\n| クラオ洞窟 | 1・2番目 | 普通の形 + 保護のシールド(よく動き、狙いも変えるので張り付く) |\n| クラオ洞窟 | 最後 | **高潔の甲冑・挑発 Lv20・神の懲罰 Lv10以上・保護のシールド Lv5以上**(即死の技をグロッキーで止める。保護のシールドは Lv10・15 で回転の段階が楽) |\n| ドラウプニル | 途中 | 普通の形 |\n| ドラウプニル | 最後 | 神の懲罰を入れる。保護のシールドは入れない(ガードできる攻撃が少ない) |\n| ウルググ峡谷の2番目・バクロンの空中島の1番目 | | よく殴ってくるので、保護のシールドなしでも激昂が出る(火力を少し上げたいとき) |\n| ほかのボス | | 保護のシールドを入れる |\n\n---\n\n## 4. マクロと回し方(ボス)\n\n### 4-1. マクロ\n| 項目 | 内容 |\n|---|---|\n| キー | 設定 → キー設定 → 一般 → ゲームプレイ「マクロ」を右クリックに。左クリックは猛烈な一撃 |\n| 押し方 | 左クリックと右クリックを押し続ける |\n| 列1 | **挑発** → 審判 → シールド強打 → 庇護の一撃 → 連続乱打(挑発を先頭にすると審判を無駄にしない。10/19 の Xia。**11/6 に Xia は挑発を手で押す形に変えた**(4-4)。並びは庇護の一撃をシールド強打より先にするほうが審判が増える(4-8)) |\n| 列2 | 殲滅 |\n| 手で押す | 懲罰(溜める)、戦場の旗、高潔の甲冑、破滅のシールド、シールド突撃、保護のシールド |\n| 遅延 | ping 50 未満は 10 ミリ秒、それ以上は 50 ミリ秒 |\n\n- 戦場の旗はマクロに入れない(雑魚で使うと 90 秒待つことになる)\n- 段の並びは字幕から起こしたもので、画面では確かめていない\n\n### 4-2. 回し方(Xia)\n1. 戦う前に高潔の甲冑\n2. ボスの範囲に入る直前に 戦場の旗 → **懲罰を MAX まで溜める**(途中で離すと弱い)\n3. シールド突撃で飛び込み、マクロと左クリックを押し続ける\n4. 庇護の一撃で出た審判が切れたら、すぐ破滅のシールド\n5. 懲罰は待ち時間が戻り次第、審判を無駄にしない合間に打つ\n6. ボスが離れたら突撃で追う(審判が2秒ぶん出る)。回避したあとのシールド突撃も無駄にしない\n7. 保護のシールドを入れている場合は、20秒に1回、ボスの攻撃の直前に使って激昂を更新する\n\n### 4-3. ほかの人の形(10/25 追加)\n| 投稿者 | 形 |\n|---|---|\n| JPVariety(10/21) | **懲罰をマクロから外して手で**(溜めの時間を捨てて強化だけ使っていたのは失敗だった、と)。連続乱打も手で押し、懲罰の待ち時間を回す。殲滅は特化で待ち時間 −10秒、転倒した敵に連打 |\n| 굳손(10/23) | マクロ2段: **審判 → シールド強打 → 連続乱打** と **殲滅 → 衰弱の猛打**。雑魚では左右クリックだけ、ボスの前でバフを使ってから戦う。スキルの射程とボスの反応範囲がどちらも20m なので、近づきながら引き寄せ技 → すぐマクロ |\n| NoBS(10/27) | マクロは **審判 → 殲滅** だけ。**衰弱の猛打はマクロに入れない**(入れると審判の代わりに出てしまい損。防御 −25% の「衰弱」はガードしたときにも付くので、打たなくてよい)。回し方: 戦場の旗 → 懲罰を最大まで溜める(**懲罰の「執行者」効果で 命中 +200・PvE ダメージ +20%**)→ 飛び込み技 → マクロを押し続ける。審判が出ないときは破滅のシールドかシールド強打で出し直す。懲罰は戻り次第すぐ。保護のシールドとガードは使わず完璧回避で避ける(攻撃の予告の表示が出きった瞬間に回避)。保護のシールドを入れるなら外すのは戦場の旗 |\n- 굳손 は Logicool G HUB で「4つのキーを押し続ける」マウスマクロも見せているが、外部のマクロは 13章の注意のとおり無難ではない\n\n**(11/4)Ashura(テンプラー、戦闘力 17.9万)の新しい話**\n| 項目 | 内容 |\n|---|---|\n| ボスの回し方 | 戦場の旗 → 高潔の甲冑 → 懲罰 → 捕獲で飛び込み → シールド強打・庇護の一撃・シールド突撃・破滅のシールドで審判を出し続ける。1回し 約12〜13万 DPS |\n| 懲罰の溜め | **戦闘速度が 50% 未満なら、2回目以降の懲罰は溜めずにすぐ放す**。60〜70% あれば最大まで溜めても間に合う |\n| マクロの遅延 | ping 43〜45 で **25 ミリ秒**のほうが 10 ミリ秒より火力が出た(4-1 の「ping 50 未満は 10 ミリ秒」と違う。ping に合わせて試す)。ただし 11/2・11/6 の動画(4-6・11-2)では Ashura も 10ms を使っている |\n| 1分間の木人の比べ(11/3) | Xia の形(連続乱打を審判と同じ列、挑発 → 審判、殲滅は別、10 ミリ秒)が 約9.6万 DPS で、Ashura の形(殲滅 → 連続乱打)の約8.4万より上。Xia の形で挑発と審判の場所を入れ替えると 9.3万〜10.1万で一番良かった |\n| 審判20・懲罰20 のあと | 閃光乱舞はなくてもよい、と言う(11/4 の上位20人はレベルを上げていたが、11/16 は 1〜3 に下がった。1-5・1-6) |\n| スキルのレベル | **12 → 16 → 20 の段に届かないなら、途中で止めずに他へ回す**(段の間のポイントはむだが多い) |\n\n### 4-4. 審判の回数で回しを確かめる(Xia 11/6、1.7万回)(11/8)\nXia は「DPS の数字は運(多段ヒット)で大きく変わるので見ない。**審判の回数**だけを見る」と言う。木人で1分回して、ダメージの記録の審判の回数を数える。\n| 戦闘速度 | シールド強打・庇護の一撃 1回で出る審判 | 破滅のシールド 1回で出る審判 |\n|---|---|---|\n| 19% 未満 | 3回ずつ | 4回 |\n| 19% 以上 | 3回ずつ | 5回 |\n| **46% 以上**(一番大事な境目) | **4回ずつ** | **6回** |\n- 大きい巻物で 53.8% にしても、それ以上は増えない。3つを続けて出すと審判は 14回。殲滅・挑発がマクロで出ると、審判が1回減ることがある\n- 1分の理想: 庇護の一撃 8回・シールド強打 8回・破滅のシールド 2回 = **審判 76回**(理論の最大。4-8 の StingKnight は20秒で30回=1分90回相当、0-1 の韓国版は1分 約230回で、どれもこの最大を超える。**数え方(多段ヒットや別の段を数えるか)が違う可能性**があり、要確認)。挑発2回・殲滅5回がマクロで出る分を引いた**最悪の値が 69回**。**72回未満なら練習不足**\n| 手順 | 中身 |\n|---|---|\n| マクロ | ゲームのスキルマクロは**入れた枠**を見る(枠のスキルを後で入れ替えても動く)。右クリック = スキルマクロ、左クリック = 猛烈な一撃(動作のキャンセル用) |\n| 練習の場所 | **近接用の練習かかし**(攻撃してくるので激昂が出る)。激昂が出たら始める |\n| 始め方 | 高潔の甲冑 → 戦場の旗 → 懲罰を溜めきる → **挑発は手で**(マクロで審判の代わりに出るのを防ぐ)→ 左右クリックを押し続ける |\n| 破滅のシールド | 庇護の一撃のあとシールド強打が出たら準備。**連続乱打の最初の動きが見えた瞬間に**破滅のシールド(左右を一瞬離してキーを連打) |\n| 懲罰 | 再使用が戻ったらすぐ。ただし**審判が出せる状態なら審判を先に**終えてから |\n| 上級(Derpy と相談) | 再使用が戻った破滅のシールドを、**戦場の旗の再使用まで取っておく**(バフ中の審判を増やす)。この場合、懲罰は「庇護の一撃の最後の審判のあと、シールド強打の前」に入れる |\n- 自分の戦闘速度を見て、46% に届いていなければ巻物・刻印で届かせるのが先(刻印の狙い方は 5-4。5-1 の「88〜89.4%・116.7%」は韓国版の段の話)\n\n### 4-5. JPVariety の今の形(11/5、2.1万回。IL 3,048・戦闘力 20.8万)(11/8)\n| 項目 | 中身 |\n|---|---|\n| スキルの中心 | **審判・懲罰・連続乱打の3つを Lv20**(そろえば完成)。次が猛烈な一撃。連続乱打は懲罰の再使用を減らすので Lv16 は必要、Lv20 でダメージ +12% の特化。懲罰は Lv16 で十分、Lv20 なら HP 10% 吸収(「3つを Lv20」と「懲罰は Lv16 で十分」が同じ動画にある。どちらが本人の結論かは要確認) |\n| 外した物 | **衰弱の猛打を全部外した**(発動が少なく、ポイントに合わない)。捕獲も近づく・引き寄せる時だけ |\n| 庇護の一撃 | Lv16 にすると PvE ダメージ耐性の特化が取れる |\n| パッシブ | 衝撃的中・侮辱の咆哮(敵対値 +100%・攻撃力 +15%)・激昂(自分のダメージ +6%、パーティーの PvE ダメージ増幅 +7.5%、20秒)の3つ。次は断罪の加護(クリティカル +260、50% で追加ダメージ)。生存意志は PvE では要らない |\n| スティグマの順 | **挑発 → 破滅のシールド → 戦場の旗 → 高潔の甲冑**(高潔の甲冑は Lv20 でも伸びが小さい)。保護のシールドは激昂を出すためだが、ガードが高く激昂がいつも出ているなら要らない |\n| マクロ | 挑発 → 審判 → シールド強打・庇護の一撃・シールド突撃・破滅のシールド(どれも審判を開く)。右クリックにマクロ、左右を押し続けてキャンセル。キャラクターに**黒い残像**が出ればキャンセルが入っている |\n| 始め方 | 3番(バフ)→ 懲罰を溜めきる → 近づく。シールド突撃はマクロから外した(毎回ボスへ突進するため)。近づくのは捕獲・破滅のシールド・シールド突撃で |\n| ディーヴァニオン | 盤の四隅を先に(割合の能力値が大きい)、次に回しで使うスキルの点 |\n| アルカナ | 連続乱打・猛烈な一撃・審判・懲罰が付いた物 |\n| 木人の火力 | 約20万 DPS(最初の溜め懲罰で 40万) |\n\n### 4-6. マクロ1つの形でも大差ない(Ashura 11/2、1.6万回)(11/8)\n- マウスの特別なボタン(Razer の Hypershift)がない人向けに、**ゲームのスキルマクロ1つ**の形を試した。間隔は **10ms**。木人で 7.8万〜8.7万 DPS で、2つのマクロの形とほぼ同じ(2つの形のほうがわずかに上)\n- 神の懲罰は**グロッキーのゲージを 100% 削る**ので、グロッキーを取る場面では強い。破滅のシールドを外し、シールド突撃・シールド強打・庇護の一撃だけで回す形もある(Ashura は破滅のシールドの移動が好きなので残す)\n\n### 4-7. Screamheart のテンプラー PvE 完全ガイド(11/15、1万回。今のグローバル版)(11/16)\n「自分より戦闘力の高い人より火力が出ている」。動画の画面は審判 Lv16 のまま(Lv20 前)の形。目標は 審判・猛烈な一撃・懲罰を Lv20。\n| 項目 | 中身 |\n|---|---|\n| マクロ | 猛烈な一撃(左)と連続乱打(右のマクロ)を同時に押したまま。右のマクロの並びは下から **審判 → 庇護の一撃・シールド強打 → 連続乱打**(審判を一番優先)。2つ目の列に 高潔の甲冑・挑発・殲滅・衰弱の猛打。**懲罰はマクロに入れない**(溜めるほど強い。一番ダメージが大きい技) |\n| 始め方 | 右クリック1回でバフ → 戦場の旗 → 挑発 → 懲罰を溜めて撃つ → 捕獲で寄る → 押したまま。ときどきガードして激昂を切らさない |\n| 設定 | 表示 → 戦闘 →「ボスの向きの表示」を**前**にする(テンプラーは前からのダメージが上がる) |\n| 特化 | 猛烈な一撃: 再使用 −2秒・追加の連続スキル(Lv20 なら多段ヒット)。連続乱打: 懲罰の再使用 −1秒・追加ダメージ(Lv20 なら少数相手 +12%)。シールド強打: 50% で衰弱の猛打・再使用 −2秒。庇護の一撃: 再使用 −5秒・PvE ダメージ耐性。殲滅: 状態異常にかからない敵に +100%・再使用 −10秒。懲罰: 必ずクリティカル・継続ダメージ(Lv20 で戦闘速度 30%)。衝撃解除: HP 20% |\n| パッシブ | **激昂**(パーティー全員に効く)\u003e 侮辱の咆哮 \u003e 衝撃的中(強打)\u003e 断罪の加護・鉄壁防御(戦場の旗は防御力で伸びる)。庇護のシールド・守護の印章は「ほぼ役に立たない」 |\n| スティグマ | **高潔の甲冑を最優先で Lv15**(HP・防御力・激昂と侮辱の咆哮を強くする)、**戦場の旗は Lv20**(再使用 −30秒が大きい)。挑発(ボスの PvE ダメージ耐性を下げる)。保護のシールドはガードが少ないうちだけ。神の懲罰はグロッキーが要るボス(ドラウプニル・クラオ洞窟)で強い(Lv15 で PvE ダメージ +10%)。破滅のシールドは狩り用。処刑の剣は詰めた形なら候補 |\n| 装備 | 出にくい行(強打・完璧・攻撃力増加)が付いた物を先に育てる。武器は多段ヒット的中が一番出にくい |\n| アルカナ | **鐘だけ魔力(破壊)、ほかは活力**。羊皮紙は 審判・猛烈な一撃・懲罰(4つ目は殲滅)。コンパスは連続乱打(庇護の一撃も可)。聖杯は3つの主力を Lv20 にするため |\n| 称号・翼 | 称号は 種族のしがらみから逃れた(Unbound by Genus)・ベルテロンの聖者(Saint of Verderon。防御とガード)・ああ、着る服がない(Empty Closet)。翼は 闇の帳の翼(英語 Dark Veil。PvE で一番火力が出る) |\n| 種族理解度 | 命中・ガード、クリティカルは上限まで(7章) |\n| 消耗品 | 勇気・速度・祝福の巻物、パワーシャード、料理(果物のサラダがテンプラー向き。日本語名は未確認) |\n- 0章・4-1 の形と同じ(4-1 も懲罰は手で押す)。違うのは「衰弱の猛打をマクロに入れて使う」(0章の多数意見は使わない。12章)\n\n### 4-8. マクロの並びで審判の回数が変わる(StingKnight 11/7、1.6万回)(11/16)\n| 形 | 右のマクロの並び(下が一番優先) | 木人20秒の結果 |\n|---|---|---|\n| **良い形** | 審判 → **庇護の一撃** → シールド強打 → 連続乱打。衰弱の猛打は外す | 審判 **30回**・連続乱打 約18回・庇護の一撃 3回 |\n| 前の形 | 審判 → シールド強打 → 庇護の一撃 → 連続乱打 + 衰弱の猛打 | 審判 28回・連続乱打 20回・庇護の一撃 2回 |\n- 1分にすると**審判が6回違う**(平均で DPS 約1万の差)。衰弱の猛打は動きが長く、防御を下げてもボスにはほとんど効かないので PvE では外す(PvP では気絶があるので残す)\n- 比べ方: NotMeter の木人の記録で、DPS ではなく**スキルごとの回数**を見る(クリティカルなどの運に左右されない)\n\n### 4-9. ルドラの盾役のスティグマ(Leonis 11/11、1.2万回)(11/16)\n- **保護のシールド**(ガードと激昂。赤い玉はガードしないと全滅)・**挑発**(全員のダメージ +10%)・**高潔の甲冑**(侮辱の咆哮と激昂を強くする)の3つは「入れ替えられない」。4つ目は**破滅のシールド**(審判をずっと開けておける、場の中を動きやすい)。戦場の旗は試していない\n- ガードは右クリック(マクロ)で途中でやめられる。やめないと約5秒ガードの動きのまま固まる\n\n---\n\n## 5. 能力値と装備の刻印(魂刻印)\n\n### 5-1. 能力値の優先順\n| 順 | 能力値 | 理由 |\n|---|---|---|\n| 1 | **命中**(必要な値まで。5-2) | 前から殴るテンプラーは、命中が足りないと受け流されてダメージが半分になる(強打・クリティカルでも)。敵対心も稼げない |\n| 2 | **強打**(ボスの強打抵抗を超えてから) | 最終ダメージが2倍。ただしボスの「強打抵抗」がそのまま引かれる(抵抗30〜35%のボスに強打70%なら、出るのは約35%)。抵抗を超えた分は全部効く |\n| 3 | 前方ダメージ増幅 | 激昂で上がる。ほかのダメージ増幅と別の掛け算。前から当てる割合が約80%以上なら強い(ボスを持つテンプラーは約99%) |\n| 4 | 攻撃力 → クリティカル ダメージ増幅・武器ダメージ増幅 → ダメージ増幅 | 韓国の計算では1%あたり 前方 0.68%、クリダメ 0.59%、武器 0.53%、ただのダメージ増幅 0.46%(バフと同じ枠で足されるため) |\n| 5 | 戦闘速度(審判の段まで) | 速さは段階でしか効かない。韓国の測定で審判の回しは**約88〜89.4%で頭打ち**(次の段は 116.7%。韓国の Inven で、町の戦闘速度 91.6 + 上級の薬 10 + 戦場の旗 15 = 116.6 では遅く、116.7 から速くなったという測定あり(9/20)。韓国でも最上位の装備と最上級の薬でやっと届く量)。基本攻撃は約94〜95% |\n| 6 | 待ち時間短縮 | 審判を開くシールド技が早く戻る。審判はテンプラーの火力の約半分 |\n| 7 | 完璧 | 武器の最大攻撃力で当たるだけ。韓国の試しでは 0→100% で約+8.5% |\n| 8 | クリティカル | 審判は特化4(Lv12)で確定クリティカル。ほかは上限50%。**ルドラでは命中のあとにクリティカル 約1,700 が要る**(11/20、5-2の後半) |\n- 出典: Antochi(10/23。韓国の検証・ゲーム内の説明・公式の装備データから)\n- **この表は 10/23 の Antochi の順**。11/16 の NotMeter の計算機(下)では **前方ダメージ増幅 → 強打 → ダメージ増幅・武器ダメージ増幅 → 攻撃力増加 → クリティカル ダメージ増幅** で、前方と強打の順、ダメージ増幅とクリティカル ダメージ増幅の順が逆。0章は 11/16 の順にした\n- **Xia(10/19)の順は違う**: 戦闘速度 \u003e ダメージ増幅・武器ダメージ増幅・多段ヒット的中・攻撃力増加 \u003e アクティブスキル・パッシブ \u003e 強打。強打を最後にするのは「ボスの強打抵抗を超えるまでほとんど効かないから」で、理由は同じ。**自分の強打がボスの抵抗より低いうちは Xia の順、超えたら Antochi の順**と読めばよい。グローバル版のボスの抵抗は未発表\n- 自分の強打がボスの抵抗に近いか下なら、強打よりクリティカル ダメージ増幅のほうが得(審判が毎回クリティカルなので)。韓国の抵抗: 遠征「難しい」20%超、ドラマタ30%、最新の聖域40%\n- ガード: 激昂のパーティーへの効果はガードで出る。韓国シーズン3のダンジョンでは約1,700〜1,800で勝手に出続けた。グローバル版の目安はない\n- **韓国の攻略を読むときの注意**: 神の能力値は韓国では1点0.2%、グローバル版は**0.1%**(半分)。強打と前方ダメージ増幅は種族理解度では4番の枠にしか出ない。韓国の後のシーズンのアルカナはまだない\n\n**NotMeter の「ステータス効率計算機」(11/16)**\nhttps://notmeter.com/?view=stat-efficiency 。NotMeter の戦闘記録の上の「統計をコピー」を押して貼ると、**自分の能力値で**「どの能力値を1%(攻撃力は +10)上げると期待ダメージが何%増えるか」の順位が出る。グローバル版は神の能力値1点 +0.1%、ボスの強打抵抗は自分で入れる(初めは 0%)。攻撃方向は「前方」にする。\n| 1% 上げたときの期待ダメージ(見本のグラディエーター、前方、強打抵抗 0%) | 増え方 |\n|---|---|\n| 前方ダメージ増幅 | +0.93% |\n| 強打 | +0.75% |\n| ダメージ増幅・PvE ダメージ増幅・ボス ダメージ増幅 | +0.73% |\n| 武器ダメージ増幅 | +0.72% |\n| 攻撃力増加 | +0.67% |\n| クリティカル ダメージ増幅 | +0.46% |\n| 完璧 | +0.05% |\n- 見本の人の数字なので、**自分の値を貼ると順位が変わる**(持っている量が多い能力値ほど伸びが小さい)。命中・戦闘速度・待ち時間短縮・スキルの回しは計算に入っていない\n- 上の 5-1 の表(強打 → 前方 → 攻撃力 → クリダメ・武器 → ダメージ増幅)とは、前方と強打の順、ダメージ増幅とクリティカル ダメージ増幅の順が違う。**完璧は今はほとんど伸びない**のは同じ\n- 命中の目安は、ほかの職業の今週の動画でも**約1,200**(クレリックの Itsmitchyo、レンジャーの Realm Gaming)\n\n### 5-2. 命中の必要な値\n**結論(11/20): ルドラは命中の合計 約1,250(1,200 が最低)、難しいは 1,400〜1,500(グローバル版の実測。下の「ルドラでは命中のあとにクリティカルが要る」)。超越・遠征「難しい」は韓国の実測で 約1,150〜1,200。** 前に書いた「ルドラは約1,500」は韓国版の実測で、グローバル版の普通には当てはまらなかった。\n「合計」= 能力値画面の **命中+PvE 命中**(詳細の画面で見る)。料理・懲罰の強化の分も入る。\n- **ガード(受け流し)の計算(11/6。notXeon が紹介した検証の話)**: 攻撃する側の命中と受ける側のガードが**同じなら受け流しは 0%**。ガードが 100 多いごとに約 10%。ガードに上限はない(回避は 30% まで)。クリティカルとクリティカル抵抗も同じ。つまり「ボスのガード以上の命中があれば受け流されない」で、下の実測の目安と同じ考え方。正面だけで、後ろから殴れば受け流されない\n\n| コンテンツ(韓国版シーズン1の実測) | 受け流しが出なくなる命中 | 出典 |\n|---|---|---|\n| 炎の神殿・獰猛な角岩窟(普通)など | 約1,000 | 왕소랑 |\n| 超越 9段 | 約1,100 | 왕소랑 |\n| 超越 10段 | 約1,150(1,100 でも数%出る。1,170 で出ない) | 왕소랑・강주・쵸피 |\n| ドラウプニルの遠征「難しい」 | 約1,160〜1,170(1,110 で 4.65% 出た。1回だけの測定) | 왕소랑 |\n| ルドラ(最初の聖域) | **約1,500**(1,450・1,480 でたまに出る、1,500 で一度も出ない) | 강주・Antochi。쵸피 は事前の予想で 1,300〜1,400 |\n| 韓国の後の超越(グローバル版にはまだない) | 3段 1,750、4段 1,900 | 오지조 |\n| **(11/1)グローバル版のルドラの予想** | 普通 **約900**、難しい **約1,200**(クリティカルは普通 約800・難しい 約1,100)。グローバル版は能力値が全体に下がっているので、韓国・台湾の 1,400 より低いと見る。今の遠征「難しい」(★2)のボスのガードは約800 | Madsin(テンプラー、10/31。予想。**11/20 の実測(普通 約1,250)より低かった**) |\n- (11/1)Madsin によると、テンプラーは**懲罰でほぼずっと命中 +200**、料理 +100、チャンターのマントラ +100 が乗る。ルドラの第2段階は正面からしか殴れないので、命中の不足をごまかせない\n\n**仕組み**\n- ボスへの攻撃は必ず当たるが、**前から当てると「受け流し(パリィ)」が出てダメージが約半分**(韓国の実測で 4,189 → 1,866)。強打・クリティカルでも半分になる。後ろからは出ない\n- 足りない分 10 につき受け流しが約 1% 増える(超越10段で 1,110 → 3.9% などの実測と合う。「950 → 約5%」という実測もあるが、この計算なら約20%になるはず。別のコンテンツの数字かもしれない。要確認)。テンプラーはボスを前から殴り続けるので、**足りない分 100 で 火力 約 −5%**(受け流し約10% × 半分)\n- 遠距離職は前から当てる時間が短いので「命中より攻撃力」という人もいる(강주。魔道星で計算し、前から当てる時間が 50% を超えると命中が得)。**テンプラーには当てはまらない**\n\n**確かめ方**: ボスを殴ってダメージの数字に受け流しが出るか見る。韓国では「命中+100 の料理」を食べて受け流しが消えるかで目安を測っていた(料理は神の能力値・正確にも効くので +100 以上になることがある)\n\n**上げ方**(韓国版の動画から。グローバル版で同じかは未確認)\n| 場所 | 中身 |\n|---|---|\n| ロングソード・ガーダーの刻印 | **正確**: 1点で命中・クリティカルが約0.1%ずつ上がる |\n| 防具8部位・アクセサリー | 命中の行。リングはスキルを付けるまでの間なら命中でもよい |\n| 魔石 | 命中は1つに2行付けられる。足りないうちは攻撃力・クリティカルより命中 |\n| ペットの図鑑 | 野性のペットを Lv5 にすると1種ごとに命中+10(65種で +650)。自然のペットは Lv4 で正確+2 |\n| 種族理解度 | 3・6・9番(Lv7 以上)に命中 |\n| 神の能力値 | **自由**(命中と回避)。アルカナは活力のコンパス、万神殿でも上げられる。グローバル版は1点の効果が韓国の半分 |\n| 称号・翼 | 遠征「難しい」を10回クリアの称号に命中、所持で命中が付く翼(森の精霊の翼は命中+20) |\n| アリエルの盤 | PvE 命中 |\n| ディーヴァニオン | 韓国の後のシーズンに緑の盤(命中210)が出た |\n\n- 韓国の普通のプレイヤー(IL3,000、無課金)は何もしなくても合計 1,170 になっていた(강주)。届いていなければ、**届くまでは命中を攻撃力より先に**、届いたら止めて強打・前方ダメージ増幅・攻撃力へ(Antochi・쵸피)\n- 注意(10/25): グローバル版のボスの値は**誰も測っていない**。同じコンテンツなので同じと見られるが、未確認。→ ルドラは 11/20 にグローバル版の実測が出た(下)。超越・遠征「難しい」は今も韓国の値\n- 出典: Moxsy(10/24)は「ルドラは命中 1,000〜1,200、クリティカル 1,200〜1,400」と予想しているが、本人も推測と言っている\n- **(11/4)** Ashura(テンプラー)はルドラに向けて **命中 1,500・クリティカル 1,500** を目指している(今は命中 約1,000・クリティカル 約1,400)。JPVariety(11/3)は「韓国版のルドラは 1,600 と聞いた。グローバル版は 1,400 かもしれない」と言う(どちらも聞いた話)。料理で命中 +100(製作の料理。作るのにオード エネルギーを使う)\n\n**ルドラでは命中のあとにクリティカルが要る(11/20)**\nルドラのボスはクリティカル抵抗が高く、クリティカルが足りないと**確定クリティカルの技以外はほとんどクリティカルが出ない**。\n| 点 | 中身 | 出典 |\n|---|---|---|\n| クリティカルの目安 | **約1,700**(料理 +100・チャンターのマントラ +100 を含めて)。普通も難しいも同じ | Nellan97(11/8、1.1万回。戦闘力 21.5万のアサシン)。StingKnight(11/13、1.4万回)の聞いた話では 1,600〜1,800 |\n| 命中の目安 | **約1,250**(1,200 が最低)。難しいは 1,400〜1,500 で受け流しを感じない | StingKnight・Nellan97。23KCO(11/5)は難しい 1,450〜1,700、普通 1,100 以上 |\n| テンプラーの場合 | **審判と懲罰は確定クリティカルなので 100%**。ほかの技(猛烈な一撃・連続乱打・殲滅・挑発など)は、クリティカル 1,100 の盾役で **2〜4%** しか出ていなかった。審判・懲罰はダメージの約5〜6割なので、残りの4〜5割がクリティカルなしになる | Nellan97 の記録 |\n| 確かめ方 | NotMeter の戦闘記録の詳細で「確定クリティカルを除く」を選ぶ。**約50% なら上限**、30% なら約200不足、10% なら約400不足、0% なら500以上不足。命中は受け流し・回避の割合が 0.1% でも出ていれば足りない | StingKnight |\n- **順番は 命中(約1,250)→ クリティカル(約1,700)**。命中が足りないと受け流しで全部の技が半分になるので、命中を削ってクリティカルにするのは逆効果\n- 上げ方: 魔石・霊石、種族理解度(3・6・9番に命中・クリティカル。23KCO は 3・7・9 と言う。要確認)、クリティカルの料理(パスタ。+100)、チャンターと組む\n\n### 5-3. 神の能力値\n| 順(韓国のテンプラー) | 神の能力値 | 効果 |\n|---|---|---|\n| 1 | 時間 | 戦闘速度(審判の回し) |\n| 1 | 破壊 | 攻撃力 |\n| 3 | 知恵 | 強打 |\n| 4 | 自由 | 命中(足りないうちは大事) |\n| 5 | 死 | クリティカル(テンプラーには一番弱い) |\n| 装備が強くなったら | 正義・空間 | 自由・死 と入れ替える。正義=完璧、空間=ガード。運命は盾役専用 |\n- グローバル版の上位20人は 時間約75・破壊約74 に対し 知恵は約54。**時間と破壊がそろったら知恵で差がつく**\n- 取れる所: アルカナ(一番多い。唯一のカードは1枚20点、強化1回で+1、最大25点)、万神殿(美術品=知恵・幻想、像=自由・死・空間、巨像=時間・破壊・正義・知恵)、モノリスの共鳴(全部 約+6)、アビスの腕輪(ランダムに4つ)\n- アルカナ: 活力の聖杯=時間、魔力の鐘=破壊、鏡は活力なら幻想・魔力なら知恵(韓国は知恵)。上位200人の約46%が「活力2+魔力2」の組み方(Antochi)\n\n### 5-4. 部位ごと(上位20人の採用率は NotMeter 10/22、動画は Xia 10/19・Soulgrot 10/18・Ulfhednar 10/18・Antochi 10/23 ほか)\n| 部位 | 狙う物 | 補足 |\n|---|---|---|\n| ロングソード・ガーダー | **戦闘速度・武器ダメージ増幅・ダメージ増幅・威力**(+多段ヒット的中) | 上位20人は5つとも100%。**スキルは付けない**(数値が一番大きい部位なので)。命中が足りなければ正確も良い |\n| ヘルム | 強打・攻撃力増加 | 受ける治癒量も強い(Soulgrot) |\n| ショルダー | クリティカル ダメージ増幅・強打 | 審判が毎回クリティカルなのでクリダメが効く(Antochi) |\n| トップス | ダメージ増幅(+完璧) | |\n| ボトムス | 攻撃力増加・完璧(+ダメージ耐性) | |\n| グローブ | **戦闘速度**・完璧 | |\n| シューズ | **移動速度**・完璧 | 移動速度は戦闘力が大きく上がる(Ulfhednar) |\n| マント | 強打・攻撃力増加(+完璧) | |\n| ネックレス | 攻撃力・命中・クリティカル(+ガード) | 動画は「戦闘速度」と言う(Xia・Soulgrot、JPVariety も「唯一の装備なら魂刻印 → 調律で戦闘速度を付けられる」)が、上位20人にも GameWith の刻印表にもない。**(11/8 答え)魂刻印の表に戦闘速度はない**。付くのは装備の**副ステータス**(手に入れたときにランダムで付く能力値。製作の光る冥龍王のネックレスで 3.7〜4.4%)。魂刻印・調律では付けられない |\n| イヤリング | ネックレスと同じ(10月の動画は「+移動速度」と言ったが、11/1・11/8 の資料では移動速度はシューズだけ) | (11/1)韓国の Inven のテンプラーの設定(8/22・10/20)では、移動速度は**シューズだけ**。イヤリングは攻撃力・ガード・命中かクリティカル。移動速度の上限は韓国版で **150%**(7/1 から。The Games Wiki)。グローバル版の上限は未確認 |\n| **リング** | **スキル: 審判 \u003e 懲罰 \u003e 猛烈な一撃 \u003e 連続乱打** | 能力値よりスキル。審判・連続乱打が Lv20 になるまで(Antochi)。11/8 の上位は 猛烈な一撃・審判・連続乱打 95%、懲罰 85%(下の表) |\n| ブレスレット | 時間・幻想・知恵・破壊 | |\n\n**上位20人の刻印(NotMeter「装備・スキル構成」、11/8 8時47分。スキルの行も出るようになった)(11/8 更新)**\n数字は20人のうち何%がその行を付けているか。「技:」はスキル(パッシブ・アクティブ)の行。行の付きやすさは成長とシステムのまとめ 8章「魂刻印で付く行と確率」。\n| 部位 | 全員(95〜100%) | 多い(50〜90%) | 少ない |\n|---|---|---|---|\n| ロングソード | 威力・攻撃力・武器ダメージ増幅・戦闘速度・多段ヒット的中・ダメージ増幅 | **正確 65%** | **スキルの行は 0%** |\n| ガーダー | 威力・攻撃力・武器ダメージ増幅・戦闘速度・多段ヒット的中・ダメージ増幅 | **正確 50%** | 技: 懲罰 5% |\n| ヘルム | **技: 激昂・侮辱の咆哮・衝撃的中**、強打・攻撃力増加・攻撃力 | 敏捷 60% | ガード 15%・受ける治癒量 15% |\n| ショルダー | 技: 同じ3つ、攻撃力・クリティカル ダメージ増幅 | 敏捷 90%・ガード 75% | |\n| トップス | 技: 同じ3つ、攻撃力・ダメージ増幅 | 敏捷 95%・ガード 75% | 再生 5% |\n| ボトムス | 技: 同じ3つ、攻撃力・完璧・攻撃力増加 | ダメージ耐性 75% | 敏捷 10%・ガード 5% |\n| グローブ | 技: 同じ3つ、攻撃力・**戦闘速度**・完璧 | 敏捷 50% | ガード 5% |\n| シューズ | 技: 同じ3つ、**移動速度**・攻撃力・完璧 | 敏捷 50% | |\n| マント | 技: 同じ3つ、完璧・強打・攻撃力増加・攻撃力 | | ガード 5% |\n| ネックレス | 技: 同じ3つ、**ガード・攻撃力・命中 95%** | クリティカル 85% | 技: 断罪の加護 10%・鉄壁防御 5% |\n| イヤリング | 技: 同じ3つ、ガード・攻撃力・命中 95% | クリティカル 90% | 技: 断罪の加護 10%・鉄壁防御 5% |\n| リング | **技: 猛烈な一撃・審判・連続乱打 95%**、攻撃力 | **技: 懲罰 85%**、ガード 90%・命中 50% | 技: 庇護の一撃 35%・閃光乱舞 35%・殲滅 20%、クリティカル 40% |\n| ブレスレット | 時間・正義・知恵・破壊・幻想・空間 95% | | 自由 15% |\n| ブローチ | 敏捷・威力・正確 | ガード 90%・命中 60%・クリティカル 50% | HP 15% |\n| 印章 | PvE 攻撃力・ボス攻撃力・クリティカル攻撃力・最大攻撃力・追加攻撃力 | 封魂石の追加ダメージ 75% | |\n- **防具とアクセサリーのスキルの行は、全員が 激昂・侮辱の咆哮・衝撃的中 の3つ**。ほかのパッシブ(断罪の加護など)はほぼいない\n- **リングのスキルは 猛烈な一撃・審判・連続乱打・懲罰** の4つが中心(2つのリングで分けて持つ)。武器・ガーダーにスキルを付けている人はほぼいない(数値が一番大きい部位なので能力値にする)\n- 11/4 との違い: ほぼ同じ。ガーダーの正確が 60% → 50%、ロングソードの攻撃力が 95% → 100%\n\n**部位ごとの狙い方(上の採用率と確率から。こちらのまとめ)**\n| 部位 | まず残す1行(出にくい・効く) | 残りで狙う | 確率のメモ |\n|---|---|---|---|\n| ロングソード・ガーダー | **ダメージ増幅**(1.6%)か 戦闘速度・武器ダメージ増幅(3.2%) | 多段ヒット的中・威力(4.8%)→ 攻撃力。命中が足りないうちは正確も残す | 5行の製作品でもダメージ増幅は約8% |\n| ヘルム | 強打 か 攻撃力増加(1.2%) | 技 3つ(2%ずつ)、攻撃力 | |\n| ショルダー | クリティカル ダメージ増幅(2.4%) | 技 3つ、攻撃力 | |\n| トップス | ダメージ増幅(2.4%) | 技 3つ、攻撃力 | |\n| ボトムス | 完璧・攻撃力増加(1.2%) | ダメージ耐性(2.4%)、技、攻撃力 | |\n| グローブ | **戦闘速度**(2.4%) | 完璧(1.2%)、技、攻撃力 | |\n| シューズ | 移動速度(2.4%) | 完璧(1.2%)、技、攻撃力 | |\n| マント | 強打・完璧・攻撃力増加(1.2%) | 技、攻撃力 | |\n| ネックレス・イヤリング | 命中(5.6%。必要な値まで)・ガード | 技 3つ、攻撃力・クリティカル | 戦闘速度は付かない(上の部位の表のネックレス) |\n| リング | 審判・懲罰・連続乱打・猛烈な一撃(1.67%ずつ) | 攻撃力・ガード・命中 | |\n- 魔石(ダメージ系の行だけの集計、11/4): 前方ダメージ増幅 100%(20人で合計175)、クリティカル ダメージ増幅 70%、武器ダメージ増幅 50%、後方 25%、ダメージ増幅 15%。霊石も前方が 100%(合計191)。**11/16 の集計(1-6)ではダメージ増幅 12人・前方 11人と大きく違う**(集計の仕方が変わった可能性もある。要確認)\n- 武器・ガーダーは行が6〜7つある(賢者の石で増やした分。武器は2個まで)。**上位でも約65%は武器に正確を残している**(11/8)\n- 命中は **ネックレス・イヤリング・ブローチ・リング** の行で取っている。ネックレスの戦闘速度は上の部位の表\n- 装備そのもの(どの装備を使っているか)の最新の集計は見つからなかった。GameWith のビルド統計(アジア上位480人)は 10/07 の古いデータ\n\n- **防具とアクセサリー(リング以外)のパッシブは激昂を最優先**、次に 侮辱の咆哮・衝撃的中(Xia・Ulfhednar・Antochi)\n- 敏捷・攻撃力・命中・クリティカルは「付いたら残す」くらい(aLuckyRO)。戦場の旗を使うなら防御の行もむだにならない(防御が攻撃力になるため。Antochi)\n- 魔石: 前方 → 武器かクリティカル ダメージ増幅。出るまでは命中(必要な値まで)→ 攻撃力(Antochi)\n- **(10/30 Ashura、テンプラー)** アクセサリーの振り直しは「防御の行を最初に消す」→ 攻撃力・クリティカル・威力・正確・ガードを残す。命中より**正確**のほうがよい(命中とクリティカルの両方が上がるため)。リングは審判・懲罰の行を残して Lv20 に。ブーツは状態異常抵抗・敏捷・激昂・侮辱の咆哮なら振り直さない\n\n### 5-5. 安く揃える手順\n1. **拾った・買った唯一(金)の装備は、まず刻印して能力値を見る**。良い行が付いたら残す(Xia・notXeon)\n2. 良い行の付いた装備を **+15 まで上げてから継承**で本命に移す。IL の低い装備のほうが強化がずっと安い(IL86 は約2倍かかる)。取引所で低い IL の同じ部位を買い、刻印して良い行が2つ出るまで繰り返すのも手(Grobs 10/19、Reddit の方法)\n3. 1行ずつの振り直し(魂の調律)は最後の手段。材料に唯一の装備を1つ使う(取引所で買うと90〜160万ギーナ)。狙いが出る確率は約2%\n   - **(10/28 Fubgun)** 継承する装備は「**良い行が2つ以上**」(1つでも強打のような珍しい行なら可)。**IL36〜41 の唯一**を使うと、+15 までの費用が IL86 より約60%安い。行が悪い本命の装備を1行ずつ振り直すのは、長い目で見ると数千万の損\n   - 唯一の装備の集め方: **シューゴフェスタ**(報酬4枠なら1回に約0.8個、IL36〜41。刻印済みで出る)、アビスの野外の敵(1日1〜2個)、野外ボス(地図 → 探索 → 野外ボスで落とす物が見える)、**サブキャラ**(サブキャラがダンジョンで拾った装備はメインで装備・継承できないが、**振り直しの材料には使える**)\n   - 待つ間は、今の装備を **+10 まで**なら上げてよい(費用が小さい)。それ以上は継承する装備が見つかってから。拾った唯一は捨てずに取っておく\n   - 全部の行を振り直す初期化の書は週に1〜3冊しか出ない。使うなら武器 → ガーダー → リングの順\n   - シーズン2で「シンクの石」(行を振り直す石)がダンジョンで出る予定(韓国版)。出れば振り直しが安くなる\n   - **(10/28 Grobs)** 製作装備は刻印が5行、ダンジョン装備は4行(クロメデの武器は3行)。継承では強化値・刻印・**突破も移る**と言っている(画面では未確認)\n4. **(10/30)アクセサリーも継承できる**(ダンジョンで拾ったアクセサリーで継承できた。ユーザー確認)。前の「装飾品は継承できない」は誤り。製作したアクセサリーを継承先にできるかは未確認\n5. 全部そろったら刻印の効果を100%に → 賢者の石で6枠目(武器は2個)。賢者の石の枠は継承で消えるので最後の装備だけ\n   - 賢者の石は**遠征「難しい」で1%**(平均100回に1個、取引不可)とシーズンショップ\n\nロングソードの刻印の確率(GameWith): ダメージ増幅 1.6%、戦闘速度・武器ダメージ増幅 3.2%、多段ヒット的中・威力 4.8%、正確 5.6%、命中 6.4%、各スキル約1.7%\n- 行の数は装備で違う: 知恵のロングソード(IL36)は4つ、光る白龍王は5つ。「初期化(再刻印)」は全部の行を付け直し、「魂の調律」は選んだ1行だけを付け直す(GameWith、10/27)\n\n\n---\n\n## 6. アルカナ\n仕組みと「いらないカードは強化か抽出か」は `2_成長とシステム/アルカナのまとめ.md`。\n\n| カード | 能力値の種類(Xia) | 狙うスキル | 避けるスキル |\n|---|---|---|---|\n| 聖杯 | **活力**(時間=戦闘速度) | **審判**、激昂。次に懲罰・侮辱の咆哮・連続乱打 | 防御系、衝撃解除、苦痛遮断・生存意志 |\n| 羊皮紙 | どちらでもよい | **審判**、懲罰、猛烈な一撃、殲滅 | 衰弱の猛打、捕獲 |\n| コンパス | 活力(自由=命中) | **連続乱打**、シールド突撃、シールド強打、庇護の一撃 | 閃光乱舞、衝撃解除 |\n| 鐘 | **魔力**(破壊=攻撃力) | **激昂**、断罪の加護、侮辱の咆哮 | 守護の印章 |\n| 鏡 | **魔力**(知恵=強打) | **衝撃的中** | 生存意志 |\n\n- 審判が付くのは聖杯と羊皮紙だけ。羊皮紙と鏡は**砕けたアルカニス**、コンパスと鐘はデウス研究基地で出る\n- 聖杯を作るときに2つ指定するなら 審判+懲罰(aLuckyRO)\n- 4枚セットの効果は気にしない。カードの能力値のほうが得(Xia)\n- 神の能力値: 時間=戦闘速度、幻想=待ち時間短縮、知恵=強打、破壊=攻撃力増加。死(クリティカル)と自由(命中)も良い。ほかは PvE では関係ない(Xia)\n- 出典: Xia 10/19、aLuckyRO 10/20、Antochi 10/21\n- **(11/4)上位20人(NotMeter)**: 聖杯は全員「守護の聖杯」。付いているスキルは 激昂(Lv4)100%・侮辱の咆哮(Lv2)95%・衝撃的中(Lv2)90%・猛烈な一撃 50%・審判 45%(11/16 の集計(1-6)では聖杯は審判 18・懲罰 10…で、激昂は鐘に 20人。どのカードの集計かを取り違えた可能性がある。要確認)。セット効果は「守護される魂」4枚と「懲罰の序曲」4枚が全員、「不屈の執念」2枚が 70%\n- **(11/4 Ashura)** 一番大事なのは聖杯と羊皮紙。聖杯は時間(戦闘速度)、羊皮紙は魔力。どちらも**審判と懲罰は必須**(アルカナで上げると、装備のスキルの行が少なくて済む)\n\n---\n\n## 7. 種族理解度(ペットの能力値)\n種族理解度 = ペットの種族(知性・野性・自然・変形・特殊)ごとの9つの枠に能力値を付ける仕組み。\n\n| 枠 | おすすめ |\n|---|---|\n| **4番** | 種族ごとに違う「%で火力が上がる」枠。**一番大事。最初にここ**(下の表) |\n| 1・5番 | 最大攻撃力・追加攻撃力 |\n| 3・6・9番 | クリティカルか命中。命中が足りていればパワーシャードのダメージ(Xia) |\n| 7番 | ダメージ耐性 か PvE ダメージ耐性 |\n| 2・8番 | HP 増加(%) |\n\n| 種族 | 4番で狙う物 |\n|---|---|\n| 知性 | PvE ダメージ増幅 \u003e ダメージ増幅 |\n| 野性 | PvE ダメージ増幅・ダメージ増幅・武器ダメージ増幅 |\n| 自然 | PvE ダメージ増幅だけ(多段ヒット的中・完璧は罠) |\n| 変形 | **前方ダメージ増幅**(テンプラーは前から殴るので) ≧ PvE ダメージ増幅 |\n| 特殊 | **強打** |\n\n育て方\n1. **レベル10になるまで分析を続ける**(経験値はこれで入る)。それまでは、4番に高い数値が出たとき以外ロックしない\n2. 4番が決まったらロックし、ほかの種族の4番へ\n3. 4番が全部そろってから、自動分析で 1・5番の黄色の最大攻撃力、3・6・9番のクリティカル・命中を狙う(Xia)\n4. ロックするほど費用が上がる(ロックなし 結晶36個+9,000ギーナ → 5つで 172個+4.3万ギーナ)\n5. **5種族すべてレベル10で称号「種族のしがらみから逃れた」(Unbound by Genus)**(PvE ダメージ +4.5%、所持で +1%。全キャラ共通)\n- 「貫通」は今は選ばない(ボスの防御は貫通でほぼ0になっている)\n- **(10/28 XifanGG)** 進め方: まず特殊を Lv10 → 残り4種族を Lv10(称号) → 特殊に戻って枠を詰める。序盤は「1・4・5・7番」だけ。唯一の行は上限の70%以上なら残す(例: 追加攻撃力の上限12なら9以上)。終盤は2つ目のプリセットで英雄の行を上限の90%以上で狙う(1・5番は最大攻撃力。上限20なら18以上)。5つ目をロックすると1回の結晶が96 → 172個に上がる\n- XifanGG の4番: 特殊 = 強打(前から殴り続けられるなら前方ダメージ増幅)、変形 = 前方ダメージ増幅(8割以上前から殴れるなら。無理なら PvE ダメージ増幅)、自然・知性 = PvE ダメージ増幅、野性 = 武器ダメージ増幅。**7番はテンプラーなら Endurance(日本語名は未確認)か PvE ダメージ耐性**。3・6・9番の命中・クリティカルは、ボスの抵抗が分かるまで結晶を使わない\n\n### 7-1. 上位の人の実際の選び方(10/30)\n上位の人の種族理解度は、NotMeter の統計にもキャラのページにも出ていない(10/30 に確認)。なので、上位の人が自分の画面を見せている動画から拾った。\n- **韓国版と枠の並びが違う**。グローバル版は 1・5番 = 追加攻撃力、2・8番 = HP 増加(%)、3・6・9番 = 命中かクリティカル(テンプラーはガードも出る)、4番 = 種族ごとの%の枠、7番 = ダメージ耐性(김뚱냥이。上の XifanGG・Xia と同じ)。韓国の動画の「147・258・39番」はそのまま当てはめない\n- 序盤は最大攻撃力より**追加攻撃力**(グローバル版はまだ完璧と武器ダメージ増幅が低く、最大攻撃力が生きにくい。김뚱냥이・Sen Evades)。7番は「鉄壁」(日本語名は未確認。上の XifanGG の Endurance と同じ物かは要確認)より**ダメージ耐性**(김뚱냥이)\n\n| 人 | 何をしている人か | 選び方 |\n|---|---|---|\n| 성한의 게임 공략(韓国のテンプラー、ガード型) | 自分の種族理解度を画面で見せた | ガードが出る枠は**ガード 40以上**(上限50)。ガードが足りたらボスへの攻撃力(日本語名は未確認)。最大攻撃力は上限20を狙う。前方ダメージ増幅と強打は **6対4**(高潔の甲冑を使った前方ダメージ増幅と、ボスの強打抵抗 約40% を引いた強打の差が一番小さくなる配分)。特殊はガードが出ないので最大攻撃力で埋める。6番は PvE ダメージ耐性(ガードが足りなければガード) |\n| 갓신사(韓国、悪夢の上位・PvP 2,500点・アビス1億点。テンプラーではない) | PvE と PvP を兼ねる**プリセット3つ**を作り、戦闘中に切り替える | 作る順: ①強打の組(前に回れないときの保険。最初に作る)→ ②前方ダメージ増幅の組(タンクが頭を止めてくれるとき)→ ③PvP の命中の組。**PvP では空いた枠を全部命中**にし、耐性の枠は武器ダメージ耐性(PvP で一番評価が高い。ダンジョンでは効かない。日本語名は未確認)。命中を「最大攻撃力の枠」に入れるのは勧めない。プリセットは設定 → キー設定で2つのキーに割り当てられる |\n\n- テンプラーで PvP も見るなら: まず今の PvE の組(4番の%の枠)を仕上げ、**2つ目のプリセットを PvP 用**にする(3・6・9番を命中、7番をダメージ耐性)。PvP の目安はクレリック_まとめ 5章の「ガード型」(早期鯖の4週目で ガード約1,500)も参考になる\n- グローバル版の上位テンプラーが PvP で何を選んでいるかの動画は、まだ見つかっていない(10/30)\n\n**グローバル版のテンプラーで確かめた分(10/30)**\n| 人 | 選び方 |\n|---|---|\n| Mosu(トルコ語、グローバル版のテンプラー。自動分析の設定を画面で見せた) | 1番 = 追加攻撃力 など、3・6・9番 = 命中・クリティカル・パワーシャード(9番はダメージ増幅も)、4番 = ダメージ増幅・クリティカル ダメージ増幅、5番 = 追加攻撃力・最大攻撃力、7番 = ダメージ耐性・PvE ダメージ耐性、8番 = HP。素材が少ないので**唯一(黄)以上**で自動分析し、素材がたまったら英雄で探し直す。称号は 種族のしがらみから逃れた(PvP なら Golden Glove も。こちらは日本語名は未確認)。PvP 用にスキルの組を分けている |\n| Antochi(グローバル版のテンプラーの能力値の優先度) | グローバル版では**強打と前方ダメージ増幅は4番にしか出ない**ので、出たら全部取る。強打がボスの強打抵抗を十分に超えていなければ、クリティカル ダメージ増幅のほうが得 |\n| ROX_Hyperion(フランス語、PvE・PvP のガイド) | 全部 Lv10 にして称号。素材は攻撃の能力値に使う(全キャラ共通なので)。多色の結晶は特殊にだけ使う |\n| CAHOS GAMING(スペイン語) | テンプラーは最大攻撃力・PvE 攻撃力・前方ダメージ増幅(タンクで正面に立つので) |\n- まとめると、グローバル版のテンプラーも **4番 = %の枠、1・5番 = 攻撃力、3・6・9番 = 命中・クリティカル、7番 = ダメージ耐性系、2・8番 = HP** で、上の XifanGG・Xia と食い違いはない。違いは4番の中身だけ(Mosu はダメージ増幅、XifanGG は特殊 = 強打)\n- 韓国のテンプラーのような「ガードを積む型」をグローバル版でやっている人の画面は、見つかっていない\n\n**韓国の掲示板(Inven のテンプラーの板)の「自然ガード」型(10/30 に読んだ。8〜10月の書き込み)**\n| 項目 | 書かれていたこと |\n|---|---|\n| 何のためか | 激昂(ガードで出るパーティーの火力の効果)を、保護のシールドを押さずに出し続ける。シールドを構える時間が減るので自分の火力も落ちない。ただし弱体を受ける攻撃には保護のシールドが要るので、スティグマからは外さない |\n| 広まり具合 | 9月には「上位のテンプラーの多くが自然ガード型」(9/15 の書き込み)。8月末には「今は自然ガードが一番上」の意見が多い。反対意見(ガードに振ると火力が落ちる)もある |\n| ガードの量 | 町で **約2,460〜2,950**、パーティーの強化込みで約3,250。デウス研究基地(難しい)を 2,457 で回っている人がいる。種族理解度まで仕上げると 3,600〜3,800 という見込みも |\n| ガードの集め方 | 製作の防具の上半身に敏捷・ガード。製作のアクセサリー(イヤリング・ネックレス、製作のリングなら リングも)にガード。称号はガード +110 のもの(10章の Guardian of Altgard のことらしい。日本語名は未確認)。ガードが上がる青い翼を +10。ブローチに敏捷・ガード、ブレスレットに空間 |\n| 種族理解度 | ガードの枠を**4つ以上、1枠 42以上**(47以上ならなお良い)でロック。残りはボスへの攻撃力・命中・クリティカル。ある人は前方ダメージ増幅4・強打6、最大攻撃力、ガード。6番(韓国版の並び)はダメージ耐性の代わりにガードの人も。「鉄壁は要らない」という返信あり |\n| 防具の魂刻印(9/27 の書き込み、6行のとき) | どの部位も「攻撃力系・激昂・衝撃的中・侮辱の咆哮」を土台に、ヘルム=強打+敏捷、ショルダー=クリティカル ダメージ増幅+敏捷(+ガード)、トップス=ダメージ増幅+敏捷(+ガード)、ボトムス=ダメージ耐性・完璧、グローブ=戦闘速度・完璧(+敏捷)、ケープ=強打・完璧、ブーツ=移動速度・完璧(+敏捷)。7行目が付く装備なら敏捷・ガードを足す。韓国版の装備の話 |\n| スティグマ(ある人) | 挑発25・戦場の旗25・ほか。短いダンジョンでは突進系に入れ替え |\n- 韓国版の枠の番号(1・4・7番 など)はグローバル版と違う。グローバル版でガードが出るのは 3・6・9番(上の김뚱냥이)\n- 韓国版は今のグローバル版より装備が進んでいる(製作の英雄のアクセサリーなど)。**グローバル版で同じガードの量に届くか、届かなくても効果があるかは未確認**\n- Reddit(海外の掲示板)は、この環境からは読めなかった(10/30)\n\n### 7-2. 安く回す手順(Screamheart 11/12、6.7万回。全職業共通)(11/16)\n| 点 | 中身 |\n|---|---|\n| かかった費用 | 1枚を仕上げるのに**約1,000万ギーナと虹色の結晶(仮。英語 rainbow crystals)約5万個**。費用の多くは後半 |\n| 始める所 | **レベル9から**行を選ぶ(英雄の行が出始める) |\n| 進め方 | 1つの行だけを狙わない。まず全部の行を「使える物」にして、良い行を1つずつ固定する。**固定するほど1回の費用が上がる**(1つ以外を全部固定すると 1回 324個・8.1万ギーナ) |\n| 枠の順 | 1番目の優先 = 種族ごとの一番の行(武器ダメージ増幅・ダメージ増幅など。字幕が崩れていて、どの種族の話かは未確認)→ 1・5番 → 3・6・9番(パワーシャードのダメージ)→ 7番 → 2・8番 |\n| やめどき | 最後の HP・HP 増加・耐久は**回さなくてよい**(火力は変わらない) |\n- 枠の番号はグローバル版の画面の番号。7-1 と合わせて見る\n- 虹色の結晶(仮)は、7-1 の ROX_Hyperion の「多色の結晶」と同じ物かもしれない(要確認)\n\n---\n\n## 8. ディーヴァニオン\n- 主要スキル(審判・懲罰・猛烈な一撃・殲滅・連続乱打)を先に取り、角(オレンジ)の戦闘速度・ダメージ増幅・待ち時間短縮・多段ヒットへ。パッシブは激昂・侮辱の咆哮・衝撃的中。小さいノードは攻撃力・クリティカル。防御とMPは後回し\n- 結晶の上限は今 416 点(Fubgun)。集め方は `2_成長とシステム/成長とシステムのまとめ.md` の3章\n- 10/21 から新しい盤「アリエル」(PvE ダメージ増幅、ボスへのダメージなど)。遠征「難しい」のアリエルの欠片から結晶を作れる(キャラごと30個まで)\n\n---\n\n## 9. 狩り・デイリーダンジョン\n| 項目 | 内容 |\n|---|---|\n| 型 | **破滅のシールド Lv15**(敵を倒すと待ち時間が戻る)+**審判 Lv16**+殲滅。破滅のシールドで飛び込むたびに審判が出て、ほぼ一撃で倒せる(Leonis 10/21・Xia・Ulfhednar) |\n| 簡単な型 | 捕獲 Lv8 の「撃破で待ち時間リセット」で引き寄せる。すぐ組めるが遅い |\n| 稼ぎ(Leonis) | アビスで1時間に生のギーナ約100万、アビスポイント約5万、職人の精錬石約10個、達人の精錬石1〜2個、唯一の装備3〜4個。合わせて約400万ギーナ分 |\n| 設定 | 「スキル使用時の自動ターゲット」ON、ターゲット探索は「カメラ前方」。「スキル使用時の追跡」は狩りのときだけ ON(普段は勝手に歩くので OFF) |\n| リセット | 自分でとどめを刺したときだけ。PvP では効かない |\n| 狩り場 | 永遠の島の浜辺(Lv50。英語では「不死者の島」)、アビス下層 |\n\n**(11/2)狩り場の候補(永遠の島が混んでいるとき)**\n| 場所 | 中身 | 出典 |\n|---|---|---|\n| 永遠の島の**北側・南側の浜辺** | 3匹ずつ固まった敵が浜辺に並ぶ。1匹 500〜2,000ギーナ。北と南で場所を変えられる | Wakayashi(10/18ごろ、ドイツ語) |\n| **紅玉の島**(ベルテロン) | 韓国で種族理解度集めの狩り場として名前が出る。遠距離職に敵を取られやすいという書き込み | 韓国 Inven(1/20、韓国版) |\n| アビス下層(混沌のエレシュランタ下層) | 通常ギーナが多め。1時間でアビスポイント約10万・100万ギーナ以上という書き込みも。相手の陣営に狩られる | Leonis、韓国 Inven(9/25) |\n| **ペット集めと一緒に回る** | 足りないペットの敵を世界中で狩れば、そのぶん100万の上限も埋まる。人の少ない場所に散れる | Wakayashi |\n- 相手の陣営の土地で敵を1,000匹倒す称号は、持っているだけで戦闘速度 +0.5%(韓国 Inven 7/26)。書き込みでは「時空の亀裂で相手の土地へ渡り、永遠の島で10分ほど狩れば達成」。どの島で数えられるかなど細かい条件は未確認\n\n**デイリーダンジョン**: 中央に立つ。精鋭(300点)が出たらすぐ倒す。開始時の効果は移動速度を優先。移動速度の称号・靴・スクロールを準備\n\n---\n\n## 10. 翼・称号\n| 種類 | おすすめ |\n|---|---|\n| 翼 | 一番: タリスラの翼(シーズンショップ 21万ポイント)。次: 森の精霊の翼(ボスに強い・安い)、悪夢の翼、闇の帳の翼(所持で +1%) |\n| 称号(攻撃) | 種族のしがらみから逃れた(Unbound by Genus。種族理解度を全部レベル10)。それまでは Guardian of Altgard(日本語名は未確認) |\n| 称号(防御) | Saint of Altgard(日本語名は未確認。アルトガルドのモノリスでレベル30)。Screamheart はベルテロンの聖者(4-7) |\n| 称号(その他) | Through Hell and Back(日本語名は未確認。封印ダンジョンを全部) → ああ、着る服がない(Empty Closet。外見を大量に集める。最終) |\n- 翼の日本語名は未確認(カタカナは英語の読み。タリスラの翼は 11-2 の mattshew の「Telestra の翼」と同じ物かもしれない)。称号は 11/20 に NotMeter の日本語表示で3つ確認(種族のしがらみから逃れた・ベルテロンの聖者・ああ、着る服がない)\n- 一番の翼は意見が割れている(12章)\n\n---\n\n## 11. PvP(要点)\n| 項目 | 内容 |\n|---|---|\n| 特化を替える所 | 衰弱の猛打=回復量 −60%(PvP では強い)、捕獲=バリア+状態異常抵抗を下げる、殲滅=転倒+待ち時間、懲罰=継続ダメージ+HP 吸収 10% |\n| パッシブ | 激昂・衝撃的中を最大、生存意志も最大(大規模戦で倒される原因は拘束の連鎖) |\n| マクロ | PvE と同じ審判の列だけ。拘束技(捕獲・拿捕・神の懲罰)と移動技は手で |\n| 1対1 の流れ | 高潔の甲冑 → 破滅のシールドで入る → 左右クリック → 相手の気絶技を見てから懲罰 → 被弾が増えたら二重鎧かネザカンのシールド |\n| 5対5 の流れ | 捕獲でヒーラーか火力職を釣る → 逃げたら拿捕 → 範囲気絶 → 溜め懲罰 |\n| 準備 | アビスの羽根で Lv16、PvP 用ディーヴァニオン(金は PvP ダメージ耐性、青は状態異常抵抗) |\n\n\n### PvP の早見表(11/22。下の 11-0〜11-5 のまとめ。まずここを見る)\n**グローバル版の今の形**。韓国版の改編(審判が溜める技になる)はまだ来ていない。PvE の設定は残し、**スキルのプリセット・種族理解度のプリセットで切り替える**前提。\n\n**能力値**\n| 順 | 能力値 | 理由・目安 |\n|---|---|---|\n| 1 | **命中**(PvE の目安 約1,250 をまず超える) | 相手のガード・回避を打ち消す。拘束(捕獲・拿捕)を確実に入れるにも要る。PvP の目安の数字はグローバル版では未確認 |\n| 2 | **前方ダメージ増幅 \u003e 武器ダメージ増幅 \u003e 強打** | PvP では強打が半分しか効かない(1% で 前方 0.8%・武器 0.6%・強打 約0.47%。11-1) |\n| 3 | **状態異常的中** | Ashura は「PvP では正確より大事」(武器の正確 → 状態異常的中、11-2)。相手の状態異常抵抗が上がると拘束が入らなくなる(11-1) |\n| 守り | ダメージ耐性・武器ダメージ耐性・PvP ダメージ耐性・HP、**状態異常抵抗** | ディーヴァニオンの金は PvP ダメージ耐性、青は状態異常抵抗。大規模戦で倒される原因は拘束の連鎖 |\n| 型 | **最初は命中型**。ガード型はガード 2,000 を超えてから | 命中型は PvE と装備が同じで済む(11-0・11-1) |\n\n**スキルと特化(PvE から替える所)**\n| スキル | PvP のレベル | PvP の特化 |\n|---|---|---|\n| 審判 | 20 | PvE と同じ(追加ダメージ・確定クリティカル・再使用削除) |\n| 連続乱打 | **20** | **HP 吸収**の特化を入れる(耐える力の中心。Lv20 で取れる) |\n| 衰弱の猛打 | 12〜16(**PvP だけで使う**) | **ガード・回避無視**(必ず当てる)と回復量 −60%。JPVariety はマクロの一番前に置く(11-3) |\n| 捕獲 | 16〜20 | アビスでは**倒すと再使用初期化**(Lv8)と **50% で気絶**(Lv16)、1対1 では状態異常抵抗 +20%。Lv20 でバリア(HP の 10%) |\n| 懲罰 | 16〜20 | 継続ダメージ・スキル速度・ガード回避無視。大規模戦は「移動しながら撃てる」に替える(StingKnight)。mattshew は「PvP では弱い」 |\n| 殲滅 | 16 | 転倒の確率・再使用短縮 |\n| シールド強打 | 12〜16 | 50% で衰弱の猛打・再使用 −2秒 |\n| 保護のシールド(スティグマ) | **15 を先に** | Lv5 で連続 +1回、移動しながら使える特化、3秒の移動速度。大規模戦の逃げ道(StingKnight) |\n\n**スティグマ(場面ごと)**\n| 場面 | 4枠 | 出典 |\n|---|---|---|\n| **1対1 の基本** | 二重鎧・ネザカンのシールド・保護のシールド・破滅のシールド | Ashura(11-2 ②) |\n| 近接職が相手 | 上の保護のシールド → **挑発**(相手の命中 −200・火力を下げる) | Ashura ③ |\n| ひとりでアビス(1対多) | **ネザカンのシールド・破滅のシールド・挑発・処刑の剣**(高潔の甲冑・戦場の旗は外す) | JPVariety(11-3) |\n| 闘技場・野外の1対1 | **拿捕・破滅のシールド・挑発** + 保護のシールドかネザカンのシールド | mattshew |\n| 5対5・パーティー戦 | 拿捕・保護のシールド + 戦友保護(狙われるのが味方のとき)か二重鎧 | Ashura ④・종겜리아 |\n| **大規模戦(数百人のアビス)** | **拿捕・保護のシールド**(この2つを Lv15 に)+ ネザカンのシールド + 二重鎧(戦友保護は「効きが小さい」) | StingKnight(11-5) |\n\n**マクロ**\n- ゲームのスキルマクロは**審判の列が中心**(PvE と同じ)。列は「先頭から使える物を撃つ」ので、殲滅(相手が倒れたときだけ)・衰弱の猛打を連続乱打より前に置く(Ashura)\n- **拘束技(捕獲・拿捕)と移動技(破滅のシールド・シールド突撃)は手で**押す(勝手に突っ込まないように)\n- 1対1 の入り方の例: 二重鎧・ネザカンのシールドなどの守り → 破滅のシールドで入る → (処刑の剣で倒す)→ 懲罰 → 衰弱の猛打で回復を止める → 左右クリックを押し続ける(Ashura・JPVariety)\n\n**立ち回り**\n| 場面 | 要点 |\n|---|---|\n| 1対1 | 最初に守りのバフと庇護の一撃(ガード・ダメージ耐性)を重ねる。相手の気絶技を見てから懲罰。**「ガード・回避無視」の技(グラディエーター・チャンターの掴み・アサシンの一部)は保護のシールドも抜ける**ので、ガードの時を読む。魔法職の守りのバフが出ている間は保護のシールドでしのぎ、切れたら攻める(11-2) |\n| 5対5 | 捕獲で回復役か火力職を釣る → 逃げたら拿捕 → 範囲気絶 → 溜め懲罰(11章の冒頭) |\n| 大規模戦 | **盾役ではなく「釣り役」**。敵の群れに入っても数百人に一瞬で倒される。**高い所を飛び**、拿捕(4人)と捕獲で上の位置から敵を味方の所へ引き寄せる。入るのは指揮役の合図があって、20〜30人が一緒に入るときだけ。入る前に二重鎧・ネザカンのシールド、危なくなったらすぐ保護のシールドで下がる(11-5) |\n- 韓国版(11/14)では闘技場・アビスで**受ける回復が −50%**。グローバル版に来れば衰弱の猛打の価値は下がるかもしれない(アップデート情報)\n\n\n### 11-0. おすすめの PvP 設定(10/31)\nグローバル版のテンプラー(종겜리아 10/20・ROX_Hyperion 10/22)の設定を土台にし、韓国の掲示板(11-1)の考え方を足した。**PvE の設定はそのまま残し、切り替えで使う**前提。\n\n**能力値**\n| 項目 | おすすめ | 理由 |\n|---|---|---|\n| 型の選び方 | 最初は**命中型**。ガードが 2,000 を超えて敏捷の効率が上がったら、ガード型も考える | 命中型は PvE と装備が同じで済む。ガード型は回避・ガードを積まない相手には強いが、魂刻印に敏捷・ガードが要る(11-1) |\n| 命中 | PvE の目安(1,150〜1,200)をまず超える | 命中は相手のガード・回避を1対1で打ち消す。PvP の目安の数字はグローバル版では未確認 |\n| 火力 | 前方ダメージ増幅 \u003e 武器ダメージ増幅 \u003e 強打 | PvP では強打が半分しか効かない(1% あたり 前方 0.8%・武器 0.6%・強打 約0.47%。韓国の掲示板に載った NotMeter の計算、11-1) |\n| 耐性 | ダメージ耐性・武器ダメージ耐性・PvP ダメージ耐性・HP | ディーヴァニオンの金は PvP ダメージ耐性、青は状態異常抵抗(上の表) |\n| 種族理解度 | 2つ目のプリセットを PvP 用に。3・6・9番 = 命中、7番 = ダメージ耐性、2・8番 = HP | 戦闘中にキーで切り替えられる(7章) |\n\n**スキルのレベル(10/31。종겜리아・Ashura・Inven をまとめた目安。Lv20 にできるのは1〜2個なので順番を付けた。11月の上位は主力4つをほぼ Lv20 にしている(1-6))**\n| 順 | スキル | PvP の目標 | 理由 |\n|---|---|---|---|\n| 1 | 審判 | **20** | 全員一致。Lv20 で 追加ダメージ・確定クリティカル・待ち時間なし の3つ(PvE と同じ) |\n| 2 | 連続乱打 | **20** | Lv20 にしないと HP 吸収の特化が取れない(Ashura)。ダメージ +12%・追加の一撃と合わせて、PvP で耐える力の中心 |\n| 2 | 捕獲 | 20(余裕があれば) | Lv20 でバリア(HP の 10%)の特化。HP強化 Lv4 より効く(Inven) |\n| 4 | 懲罰 | 16 | 継続ダメージ・スキル速度 +30%・ガード回避無視。PvE と同じで変えない(Ashura) |\n| 4 | 猛烈な一撃・庇護の一撃 | 16 | 猛烈な一撃は HP 吸収と多段ヒット、庇護の一撃はバリア・ガード・ダメージ耐性(Ashura) |\n| 6 | 衰弱の猛打 | 12〜16 | **PvP だけで使う**。回復量を下げる技。ガード・回避無視の特化で必ず当てる(Ashura) |\n| 6 | シールド強打・シールド突撃・殲滅・衝撃解除 | 12 | シールド強打は「50% で衰弱の猛打」を取る。シールド突撃は射程と待ち時間。衝撃解除は HP 回復とダメージ耐性 |\n| — | 閃光乱舞 | 使わない | PvP では使わない(Ashura) |\n- ここの Ashura は台湾版(グローバル版より先に始まった)の Ashura Whole Heavens で、動画は1か月より前(4章・11-2 のグローバル版の Ashura とは別の人の可能性がある。要確認)。グローバル版のレベルの上限(1-2)に合わせて順番を付けたのはこちらの判断\n\n**スキルの特化(종겜리아。グローバル版。かっこは同じ人の PvE)**\n| スキル | PvP | PvE |\n|---|---|---|\n| 猛烈な一撃 | 4・5 | (3・4) |\n| 連続乱打 | 3・5 | (3・5) |\n| 審判 | 3・4・5(Lv20) | (3・4・5) |\n| 懲罰 | 2・3 | (2・3) |\n| 捕獲 | 2・3。韓国の掲示板では Lv20 にしてバリア(HP の 10%)の特化を勧める | (1・3) |\n| シールド強打 | 2・4 | (2・4) |\n| 衰弱の猛打 | **1・3**(PvE では使わない)。韓国では特化5で防御と治癒を下げ続けるのが強いという声 | (使わない) |\n| 庇護の一撃 | 2・4 | (1・4) |\n| シールド突撃 | 2・4 | — |\n| 殲滅 | 2・4 | (3・4) |\n| 衝撃解除 | 3・4 | (3) |\n- 特化の番号の中身は書いていない(動画どおりの番号)。グローバル版の画面で中身を確かめてから使う\n- (10/31)Ashura が選んだ特化の**中身**: 猛烈な一撃 = HP 吸収・多段ヒット / 連続乱打 = HP 吸収・ダメージ +12%・追加の一撃 / 捕獲 = 1対1 は**状態異常抵抗 +20%**と最大 HP、アビスでは再使用初期化と最大 HP / シールド強打 = 待ち時間 −2秒・50% で衰弱の猛打 / 衰弱の猛打 = ガード・回避無視 / 懲罰 = 継続ダメージ・スキル速度 +30%・ガード回避無視 / 衝撃解除 = HP 回復・ダメージ耐性\n\n**スティグマ**\n| 場面 | 構成 |\n|---|---|\n| 1対1(종겜리아) | **均衡の鎧 Lv20**・破滅のシールド・拿捕・保護のシールド |\n| パーティー戦・5対5・大規模戦(종겜리아・ROX) | 均衡の鎧の代わりに**戦友保護 Lv20**(受けたダメージをパーティーで分ける。狙われた味方が落ちにくい)。**拿捕**は3人を引き寄せる一番強い技(HP の 20% のバリアとダメージ耐性も付く) |\n| 韓国の掲示板の例(11-1) | 必須: 戦場の旗・二重鎧・保護のシールド・ネザカンのシールド |\n| 野外・アビス(Ashura、10/31) | 神の懲罰(行動不能無効の相手に +200%。Lv15 で PvE・PvP ダメージ増幅)・破滅のシールド(倒すと再使用初期化。一番先に上げる)・処刑の剣(相手の技を待ち時間にし、ガード・回避を下げる。Lv10 が大事)・ネザカンのシールド(魔法職・遠距離が相手のとき)。挑発・拿捕は試したが外した |\n\n**マクロ(종겜리아。韓国の배덕の「PvP・PvE 兼用マクロ」をグローバル版で使っている)**\n| 種類 | 中身 |\n|---|---|\n| ゲームのスキルマクロ | **審判の列だけ**(PvE と同じ) |\n| マウスのマクロ(右クリックを押している間) | 左クリック(スキルマクロ)と 6番の枠(殲滅)をくり返す。PvE でも同じ物を使える |\n| 手で押す物 | 捕獲・拿捕などの拘束技、破滅のシールド、懲罰、補助の技 |\n| 回し方(PvE の例) | 補助の技 → 懲罰を溜める → 破滅のシールドで入る → 右クリックを押し続ける。審判が光ったら懲罰、消えたら破滅のシールドで出し直す |\n\n**マクロの細かい作り方(10/31)**\n| 誰の | 中身 |\n|---|---|\n| 배덕(韓国。上の元の形) | ゲームのスキルマクロ = **審判の列だけ**を右クリックに。マウスのマクロ(押している間)= 左クリック(F1 のスキルマクロ)→ 6番の枠、離したときも左クリック。殲滅は拘束ではなく火力の技としてマクロに入れる。**手で押すのは 4番・Q・破滅のシールド・2番**(どの技を置くかは人による)。PvE も同じマクロで火力が上がった |\n| Ashura(台湾。野外・アビス用) | ゲームのスキルマクロは「**先頭のスキルから順に、使える物を撃つ**」しくみ。列の順 = 破滅のシールド → 殲滅 → 衰弱の猛打 → 連続乱打。殲滅(相手が倒れたときだけ)と衰弱の猛打(発動したときだけ)を連続乱打より前に置く。マウスの横ボタンに「庇護の一撃 → 審判」のマクロ。右クリックと横ボタンを交互に押す |\n| Ashura(1対1・闘技場用) | 破滅のシールドを列から外して手で押す(処刑の剣の前に置く)。入り方: 破滅のシールドで入る → 処刑の剣で倒す → 懲罰を溜める → 衰弱の猛打で回復を止める。連続乱打・殲滅・衰弱の猛打の列はそのまま |\n- キャンセルがうまく入ると、キャラクターに**黒い残像**が出る(Ashura)。通信の遅れ(ping)が大きいと入りにくい\n- マウスのマクロは、マウスのソフト(Razer・Logicool など)の機能を使う。**運営の規約でどう扱われるかは確かめていない**\n- 韓国では、パッチのあと殲滅を拘束ではなく火力の技として使う人が増えた(배덕)\n\n### 11-1. 韓国の掲示板(Inven のテンプラーの板)の PvP の話(10/30 に読んだ。9〜10月の書き込み。掲示板の話・未確認)\n韓国版はグローバル版より約10か月進んでいる。グローバル版の PvP が進むと、同じ流れになる可能性がある。\n| 項目 | 書かれていたこと |\n|---|---|\n| ガード型か命中型か | **どちらが上とは言えない**(10/20 の書き込み)。ガード型は、回避・ガードを積まない相手(グラディエーター・スピリットマスター・ソーサラー・チャンターなど)に強い。命中型は、回避・ガードを積む相手(アサシン・クレリック・レンジャー)に強く、捕獲や拘束が確実に入る。ガード型は魂刻印に敏捷・ガードを入れる分、パッシブを伸ばせない |\n| ガード型の体験談(10/28) | ガード約5,000(命中型のときは命中 約5,500)。「ガードは上位の人だけの物」と思っていたが、装備が弱めの人でもガード型にすると倒されにくくなった。上位の人は PvP ダメージ増幅を優先していて、命中を極めていないことが多いため |\n| 種族理解度(PvP) | 強打の代わりに**武器ダメージ増幅**か前方ダメージ増幅。耐性は**武器ダメージ耐性・前方ダメージ耐性・鉄壁**、命中に勝てそうになければガード(韓国版の枠の番号なので、グローバル版の枠とは違う) |\n| 1% あたりの火力の伸び(PvP、NotMeter の計算) | ダメージ増幅 0.4%、武器ダメージ増幅 0.6%、前方ダメージ増幅 0.8%(正面を取れたとき)、強打 約0.47%(PvP では強打が半分しか効かないとして) |\n| 特化 | 捕獲は Lv20 にして**バリアの特化**(HP の 10%。HP強化 Lv4 より効く)。衰弱の猛打は特化5で防御を下げ、治癒も下げ続ける(審判より 1.2〜1.3倍強いという測定)。シールド強打は「当たると 50% で衰弱の猛打」 |\n| 戦い方の変化(10/11) | 相手の状態異常抵抗が上がり、**拘束が入りにくくなった**。拘束を狙うより、張り付いて殴り続け、HP 吸収で耐える形に変えた人がいる。保護のシールドは1回だけ防ぐ、殲滅はなるべく使わない。武器・ガーダーの状態異常的中を外して多段ヒット的中に |\n| スティグマ(同じ人) | 必須: 戦場の旗・二重鎧・保護のシールド・ネザカンのシールド。ほかは 挑発・高潔の甲冑・破滅のシールド・戦友保護・拿捕・均衡の鎧から |\n| 韓国のテンプラーの不満 | 9/15 のパッチで主力技(連続乱打・懲罰・審判)の**キャンセルの遅れが増え**、手数が減った。PvP ではテンプラーが弱いという書き込みが多い(10月) |\n\n### 11-2. Ashura の PvP ビルド5種(11/6。グローバル版の天族、サーバー7位の5つ星の将校。闘技場 162勝73敗)\n題名は「レイドボス用」だが、中身は PvP。マウスの特別なボタンがない人向けに、**ゲームのスキルマクロ1つ**で組んだ形(マクロの間隔は 10ms)。左右クリックを押したまま審判を回す。(11/6)\n| 型 | スティグマ | マクロの列(先頭から使える物を撃つ) | 向く場面 |\n|---|---|---|---|\n| ① 野外(拿捕型) | 保護のシールド・ネザカンのシールド・拿捕(+破滅のシールド) | 破滅のシールド → 審判 → 庇護の一撃 → 審判、のあと 殲滅 → 衰弱の猛打 → 連続乱打 | 敵の近くにモンスターがいる所(アビス・表層)。拿捕で引き寄せ、モンスターを使って技を戻す。1対1 だけなら②のほうが強い |\n| ② 1対1 の基本 | **二重鎧・ネザカンのシールド・保護のシールド・破滅のシールド** | 審判 → 殲滅 → 衰弱の猛打 → 連続乱打(庇護の一撃と審判は最初に重ねる) | 一番の基本。二重鎧(20秒、ガードが大きく上がる)を先に使い、相手が抜けてくるなら拘束と回避で戦う |\n| ③ 近接職が相手 | ②の保護のシールドを**挑発**に替える | ② と同じ | グラディエーターなどは「ガード・回避無視」の技が多く、ガードしても意味がない。挑発で相手の火力と命中を下げ、張り付いて殴る |\n| ④ 集団戦(指揮型) | 破滅のシールドを外して**拿捕**。保護のシールド。狙われるのが味方なら二重鎧の代わりに戦友保護 | | 敵を味方の所へ引き寄せ、まとまって戦う。ガード中は引き寄せられず、遠くからの技もほとんど効かない |\n| ⑤ 全力の火力 | **高潔の甲冑・戦場の旗**・ネザカンのシールド・保護のシールド(か拿捕) | | 1人を倒しきる形。保護のシールドでガードして激昂を早く溜める(ガードが多ければ自然にも溜まる) |\n| 点 | 中身 |\n|---|---|\n| ガードを抜ける技 | 「ガード・回避無視」の技は保護のシールドも抜ける(グラディエーター・チャンターの掴み・アサシンの一部の技)。いつガードするかを読むのが大事 |\n| 遠距離・魔法職 | ソーサラーやスピリットマスターの守りのバフが出ている間は保護のシールドでしのぎ、切れたら攻める |\n| 庇護の一撃 | 戦いの最初に審判と重ねて撃つ(ダメージ耐性とガードが上がる)。説明文は「パーティー」だけで、**自分にも効くかは分からない**(台湾版では自分にも効いた) |\n| 衰弱の猛打 | 回復を止める技として入れる。回復する職が少ない相手なら外して火力を上げる |\n| 数字の例 | ガード 1,000・ダメージ耐性 29% → バフを全部使うと 1,400・40%(庇護の一撃で 1,500〜1,600 の見込み) |\n| スキル | 審判 21(装備込み)。連続乱打は 17 で、**Lv20 の HP 吸収の特化**を取るまで HP 吸収の型は使わない |\n| 装備の予定 | 炎の神殿・ヌアクムを +20 にしてから製作へ。**製作するのはガーダー**(武器は炎の神殿の物を使う) |\n| PvP 用の刻印 | 威力 → ダメージ増幅か武器ダメージ増幅、正確 → 状態異常的中(PvP では正確より大事)。リングの懲罰は1つ残す |\n\n**mattshew の PvP(11/5、2.7万回。PvE 寄りのビルドのまま PvP もする人)**(11/8)\n| 点 | 中身 |\n|---|---|\n| 1対1(闘技場・アビス) | 必須は **拿捕・破滅のシールド・挑発**。残りは保護のシールドかネザカンのシールド(Lv20 で、シールドを壊されると HP 20% 回復)。どれも再使用が短い |\n| 特化 | 殲滅は 2・4(転倒の確率と再使用 −7秒)。**懲罰は PvP では弱い** |\n| 翼 | 一番は Brawler の翼(アビスポイント 80万)、次は Warrior の翼(20万)、Telestra の翼(再使用短縮で捕獲を多く使える)。日本語名は未確認 |\n\n### 11-3. JPVariety の PvP ビルド(11/17、1.1万回。アビスで将軍3位、ひとりで戦う)(11/19)\n| 項目 | 中身 |\n|---|---|\n| スティグマ | **ネザカンのシールド**(保護のシールドに全属性耐性 +20%、PvE・PvP ダメージ耐性、切れると HP 20% 回復。1対多で生き残る)・**破滅のシールド**(移動、5秒ガード、転倒させることがある)・**挑発**(PvP ダメージ耐性、相手の命中 −200)・**処刑の剣**(Lv20 で衝撃系の状態の相手に +30%。4体まで、防御も下げる) |\n| 外した物 | **高潔の甲冑**(この形では役に立たない)・**戦場の旗**(スティグマが育っていれば火力は足りる。すぐ倒れたらバフを使えない) |\n| マクロ | PvE と違い、**衰弱の猛打を一番優先**にする(挑発より先)。相手のガードを下げ、確定クリティカル、衝撃系の状態の相手に +50% |\n| 特化 | 猛烈な一撃: 威嚇の猛打 + 庇護の一撃の再使用。庇護の一撃: 再使用 −5秒・PvE と PvP のダメージ耐性。回復役やガードの高いチャンターが相手なら「ガード・回避を無視して多段ヒット」の特化 |\n| パッシブ | 侮辱の咆哮(前から当てると攻撃力 +16%・5秒)、激昂(ガードで PvP ダメージ増幅 +7.5%) |\n- 闘技場向けの「戦場の旗を使う形」は別の動画で出す予定と言っている\n\n---\n\n### 11-4. KaidGames2 の盾役ビルド(10/31ごろ、2,000回)(11/22)\n題名は「盾役の PvP ビルド」だが、中身はほとんど PvE。PvP に関わる所だけ。\n- 処刑の剣は **PvP で特に価値がある**(相手の技を待ち時間にし、ガード・回避を下げて後の攻撃を当てやすくする)\n- 懲罰は射程 20m で、相手が離れても撃てる。捕獲の「当てると5秒間、状態異常抵抗 −20%」は対人で役立つ\n- ネザカンのシールドは魔法職が相手のとき(属性の守り・ダメージ耐性・回復)\n\n### 11-5. 大規模アビス戦の立ち回り(StingKnight 10/31ごろ、7,000回。数百人どうしの戦い)(11/22)\n| 点 | 中身 |\n|---|---|\n| 役目 | **盾役ではなく「釣り役」**(ゲーム LoL のブリッツクランクのように引き寄せるだけ)。数百人の中に入ると、保護のシールドでも一瞬で倒される |\n| スティグマ | **拿捕を1番**(4人まで引き寄せ。Lv5 で気絶の特化、Lv15 で再使用 −30秒)、**保護のシールドを Lv15 を最優先**(ダメージを100%防ぐ。Lv5 で連続 +1回、移動しながら使える特化・3秒の移動速度で逃げる)。残りは ネザカンのシールド(40m 内のパーティーにもバリア。Lv1 でも可)と、**二重鎧**(自分の守り。戦友保護より確か)。上げる順: 拿捕 5 → 保護のシールド 5・10・15 → 拿捕 15 |\n| 位置 | **敵より高い所を飛ぶ**。上からは狙われにくく、こちらは引き寄せやすい。前に出すぎると逆に引き寄せられる。敵も高く飛び始めたら、高さの取り合いになる |\n| 入る時 | 指揮役の合図のときだけ。**20〜30人が一緒に入らないと意味がない**(5人だと全員すぐ倒れる)。入る前に二重鎧・ネザカンのシールド → シールド突撃で入る → ガード。数が互角なら、すぐ保護のシールドで下がる |\n| 特化 | 捕獲を Lv8 以上(倒すと再使用初期化)、できれば Lv16(50% で気絶。引き寄せた相手が何もできない)。懲罰は「移動しながら撃てる」に |\n| 消耗品 | 料理で持久力の回復(よく走るため)、飛行力を戻す薬 |\n| 画面の設定 | グラフィック →「大規模戦闘の品質」を高(遠くの敵まで見える。最低は中)、「プレイヤーの外見を統一」を ON(軽くなる)。日本語の表記は未確認 |\n\n## 12. 意見が割れていること\n| 点 | 意見 |\n|---|---|\n| 防御低下(衰弱の猛打・処刑の剣)を PvE で使うか | 効かない・外す(Xia・Ashura・mattshew・trueeevil・NoBS・StingKnight 11/7・JPVariety 11/5)/使う(Ulfhednar・Leonis 10/21・Screamheart 11/15 はマクロに入れる)/Lv12 で入れるが外してもよい(굳손)。PvP では使う人が多い(11章) |\n| 2番目の Lv20 | 懲罰(aLuckyRO・Ashura)/猛烈な一撃(Xia は どちらでも)/猛烈な一撃と連続乱打、懲罰は 12〜16(굳손)/審判・懲罰・連続乱打(JPVariety 11/5)。**11/16 の上位は主力4つともほぼ Lv20**(1-6)なので、順番の違いだけ |\n| 懲罰を溜めきるか | 毎回最大まで溜める(Xia・NoBS)/戦闘速度が 50% 未満なら2回目以降は溜めずに放す(Ashura 11/4)。マクロに入れず手で押すのは全員同じ(Xia・JPVariety・Screamheart) |\n| 強打かクリティカル ダメージ増幅か | 強打(韓国の多数・Antochi)/ボスの強打抵抗が高いとクリダメ(韓国の検証の1人)。グローバル版のボスの抵抗は未発表 |\n| 戦場の旗 | Lv20 からでないと弱い(Xia・Krix Domi・Screamheart)/最初から入れる(Ulfhednar) |\n| スティグマの上げる順 | 高潔の甲冑を最優先で Lv15(Screamheart 11/15)/挑発 → 破滅のシールド → 戦場の旗 → 高潔の甲冑(高潔の甲冑は Lv20 でも伸びが小さい。JPVariety 11/5) |\n| 4つ目のスティグマ(ボス) | 破滅のシールド(上位 12人・Leonis 11/11・Xia)/保護のシールド(上位 9人・遠征「難しい」の Xia 10/31・ルドラの Leonis は外せない)/破滅のシールドは狩り用(Screamheart) |\n| 挑発を固定するか | 固定(Xia・上位17人・Leonis)/굳손 の4つには挑発がない(英訳の名前から推定) |\n| PvP の4枠 | 1対1 だけでも 高潔の甲冑・破滅・ネザカン・二重鎧(Xia 10/19)/均衡の鎧・破滅・拿捕・保護(종겜리아)/二重鎧・ネザカン・保護・破滅(Ashura 11/6)/拿捕・破滅・挑発+1(mattshew)/ネザカン・破滅・挑発・処刑の剣で高潔の甲冑と戦場の旗を外す(JPVariety 11/17) |\n| アルカナの色 | 羊皮紙: どちらでも(Xia)/魔力(Ashura)/活力が 15人(上位 11/16)。鏡: 活力(Screamheart は鐘だけ魔力)/魔力が 13人(上位)。鐘は魔力で全員一致 |\n| ディーヴァニオンの順 | 主要スキルを先に、次に角(8章)/盤の四隅を先に、次に回しで使うスキル(JPVariety 11/5) |\n| 一番の翼(PvE) | タリスラの翼(10章)/闇の帳の翼(Screamheart 11/15) |\n| PvE で自然ガード型にするか | する: 上位のテンプラーの多くがしている、激昂が切れず自分の火力も落ちない(韓国 Inven 9月)/しない: 枠を火力に使うほうがよい(同) |\n| PvP でガード型か命中型か | 相手の職業しだいで、どちらが上とも言えない(韓国 Inven 10/20)。装備が弱めでもガード型で倒されにくくなった(同 10/28) |\n| マクロの遅延(11/4) | ping 50 未満は 10 ミリ秒(Xia)/ping 43〜45 で 25 ミリ秒のほうが火力が出た(Ashura 10/31ごろ。11/2・11/6 の動画では Ashura も 10ms) |\n| 2番目のパッシブ(11/4) | 侮辱の咆哮(Xia ほか・上位20人のレベル・Screamheart)/断罪の加護(Ashura・aLuckyRO。クリティカルのため) |\n| 敏捷かガードか | 敏捷は「ガードの%」を上げる。ガードの元の値が約2,000を超えると、ほとんどの場合**敏捷のほうが得**(韓国 Inven 10/4 の計算表) |\n\n## 13. 注意\n- 外部のマウスマクロは NCSOFT が認めたことはない。ゲーム内マクロだけが無難\n- 低 ping=火力 という宣伝(ExitLag など)はスポンサー込み\n- 審判の連打を外部ソフトで速める方法(Ashura の旧版)は規約上危ない\n\n## 14. スキル名の対応(英語 → 日本語)\n| 種類 | 対応 |\n|---|---|\n| アクティブ | Vicious Strike=猛烈な一撃、Pummel=連続乱打、Poach=捕獲、Shield Smite=シールド強打、Judgment=審判、Flash Rampage=閃光乱舞、Debilitating Smash=衰弱の猛打、Warding Strike=庇護の一撃、Shield Rush=シールド突撃、Annihilate=殲滅、Punishment=懲罰、Defiance=衝撃解除 |\n| パッシブ | Fury=激昂、Insulting Roar=侮辱の咆哮、Punishing Benediction=断罪の加護、Impact Hit=衝撃的中、Enhance Health=HP強化、Ironclad Defense=鉄壁防御、Warding Shield=庇護のシールド、Guarding Seal=守護の印章、Survival Willpower=生存意志、Block Pain=苦痛遮断 |\n| スティグマ | Noble Arm
