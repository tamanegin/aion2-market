ab":"レンジャー","title":"レンジャー まとめ","file":"レンジャー_まとめ.md","md":"# レンジャー まとめ(2026-11-20 最新)\n\n10/23 の「レンジャー・チャンター・クレリックのビルド」のレンジャーの部分を土台に、10/13〜10/23 の動画8本で調べ直した。スキル名・特化の文は questlog.gg の日本語版データの正式名。\n特化は「Lv8で1つ、Lv12で2つ、Lv16で2つ(入れ替え可)、Lv20で3つ」。表の番号は特化の並び順(1〜5)。\n\n## 0. 今の結論(まずここだけ見る)\n| 項目 | 結論 |\n|---|---|\n| 最優先 | スティグマ **バイゼルの権能を Lv20**(クリティカル時50%で全スキルの再使用 −1秒)。これで一気に強くなる(全員一致) |\n| スキル | **必中の矢を Lv16**(追加ダメージ。1発4万 → 6万に)、**速射を Lv16**。終盤は必中の矢がダメージの40〜50% |\n| パッシブ | **集中の眼**が一番。ハンターの決意・ハンターの魂はクリティカル上限50%の影響で下がった(Krix)。ただしハンターの魂はダメージの約10%を出す(Moxsy) |\n| 回し方 | 左クリック(狙撃)・マクロ・必中の矢の**3つを押し続ける**。標的の矢は約15秒ごとに手で |\n| 設定 | **スキル予約を OFF**(4-2) |\n| 装備 | 武器・ガーダーは戦闘速度・武器ダメージ増幅・ダメージ増幅・威力・攻撃力。防具のパッシブは集中の眼。リングは 必中の矢・狙撃・狂風の矢・鋭穿の矢(上位20人は捕縛の矢も。5-0) |\n| 弱点 | 立ち上がりが遅い(必中の矢とバイゼルが育つまで)。体が弱い。多くの技は4mの範囲しか巻き込まない |\n| **10/31 の流れ** | 職業の強さの評判(Chacal 10/27、ブラジル): **レンジャーは今一番火力が低い**と言われ、パーティーに入れてもらいにくい(同じ腕・戦闘力ならチャンターの約半分という体感)。強い所は狩りの速さと遠くから安全に殴れること。KiraSaveTheWorld(10/27)は、**グロッキーを取る役がいないダンジョンでは、スティグマのグリフォンの矢を矢嵐に替える**(グロッキーのゲージを大きく削る)。必中の矢の前に標的の矢の効果(クリティカル +300・完璧)が付いているかを見る |\n| **11/16 の最新** | 今の形はバイゼルの権能・祝福のボウ・グリフォンの矢・支援射撃、命中 約1,200・クリティカル 1,200〜1,400(Realm Gaming)。韓国の改編でバイゼルはその技だけの再使用を減らす形(全スキルではない)に、祝福のボウは再使用1分に(0-4。韓国版の話で、グローバル版は今のまま) |\n---\n\n## 0-1. 11/4 の最新(上位20人の実際と今週の動画)(11/4)\nNotMeter「装備・スキル構成」のレンジャー上位20人(11/4 6時47分の集計)と、FRESHY「エンドゲームの PvE レンジャーガイド」(11/2、3.8万回。課金なしで作った形)。\n\n| 項目 | 上位20人 | 動画・補足 |\n|---|---|---|\n| スキルのレベル | 狂風の矢・鋭穿の矢・捕縛の矢・必中の矢 **20**、速射・狙撃・矢乱射 16、破裂の矢 16〜19、標的の矢 14〜15、衝撃解除・爆発の罠 12〜14、制圧の矢 7〜12 | **最初に Lv20 にするのは必中の矢**(一番火力が出る)。Lv20 が難しくても、6つを Lv16 にするのは現実的で、それだけで火力が約2倍(FRESHY) |\n| 狂風の矢 | 3 移動可能・4 対象が少ないほど戦闘速度・PvE ダメージ・5 再使用 −10秒 が全員 | 一番大事な技。戦闘速度 +15%・PvE ダメージ +15% が10秒。Lv16 の −10秒で効果が切れなくなる(FRESHY) |\n| 鋭穿の矢 | 5 1回追加 100%・3 スキル速度 85%・4 必ず多段ヒット 85%・1 HP 吸収 25% | Lv16 の「1回追加」で当たりが2回になり、多段ヒット・強打などもそれぞれに乗る(FRESHY) |\n| 必中の矢 | 2 スキル速度・5 追加ダメージ 100%、3 移動可能 95% | |\n| 捕縛の矢・標的の矢 | 捕縛 2・3・4 が 95〜100%。標的 1 完璧 +5%・3 持続 +5秒 が全員 | 捕縛の矢は破裂の矢を開く、標的の矢は +5秒で正確のバフがずっと続く。どちらも Lv12 でよい(FRESHY) |\n| 速射・狙撃 | 速射 3・5、狙撃 4・5 が全員 | 狙撃は Lv16 で多段ヒットの代わりに 5(4段目の疾風の矢。ほかの3段の約3倍の火力)。速射は Lv16 でクリティカル +10% の代わりにスキル速度 +20%(FRESHY) |\n| 破裂の矢・矢乱射 | 破裂 4 95%・5 65%・3 60%。矢乱射 5 全スキルの再使用 −1秒 100% | **矢乱射はポイントのむだ**(Lv16 で試しても全体の火力が下がった。FRESHY)。上位はレベルを上げている |\n| 爆発の罠・制圧の矢 | 爆発の罠 1 引き寄せ・3 追加ダメージ。制圧の矢 3 スキル速度 100% | 爆発の罠は Lv12。使うと火力は下がるが、標的の矢と合わせて回避に使える。制圧の矢は PvE では使わない(グロッキーの時だけ) |\n| スティグマ | **13個とも Lv20 以上**。バイゼルの権能・支援射撃 25、祝福のボウ 24〜25、グリフォンの矢 23 | バイゼルの権能 20 は必須。次は**グリフォンの矢 15**(ほかの2つを Lv5 に下げてでも)。最終形は 20・15・15・15。前に勧めた「爆発の矢 Lv20」は試したら遠く及ばなかった(FRESHY) |\n| パッシブ | 集中の眼 35〜36、ハンターの決意 32〜33、ハンターの魂 18〜21、集中砲火 17〜18 | 上げるのは ハンターの決意・集中の眼、次に ハンターの魂・集中砲火・束縛の眼・近接射撃 の順(FRESHY) |\n| アルカナ | 聖杯は全員「守護の聖杯」。集中の眼(Lv4)・ハンターの決意(Lv2)が 100%、鋭穿の矢 70% | 聖杯は出にくい(欲しい物が出るのは22分の1)ので、金の聖杯を作って必中の矢を指定する。セットは活力4。魔力はレンジャーには要らない(FRESHY。6章の Krix は鐘・鏡を魔力にする。12章) |\n| 刻印 | 武器・ガーダーは 威力・攻撃力・武器ダメージ増幅・戦闘速度・多段ヒット的中・ダメージ増幅 が全員(前方攻撃力 55〜65%)。**防具にもクリティカル**(ショルダー 100%・トップス 95%・グローブ 95%・シューズ 85%)と命中。ネックレス・イヤリングは クリティカル・攻撃力・命中 が 95〜100% | FRESHY: ボウとガーダーは 戦闘速度・武器ダメージ増幅・威力 が先。ヘルム 強打・受ける治癒量、ショルダー クリティカル ダメージ増幅・強打、トップス ダメージ増幅・完璧、ボトムス 完璧、グローブ 戦闘速度・完璧、シューズ 移動速度・完璧、マント 強打。防具の残りは攻撃力・命中と、パッシブ 集中の眼・ハンターの決意。ネックレス = 戦闘速度・威力・正確・ハンターの決意・集中の眼(**ネックレスの戦闘速度は上位20人には見えない**)、リング = 威力+必中の矢・狂風の矢・鋭穿の矢・速射、イヤリング = 移動速度・正確・威力+パッシブ2つ |\n| 魔石 | 前方ダメージ増幅 100%(合計175)、武器ダメージ増幅 50%。霊石は前方 100%・武器 75% | 今は無理に追わない。青の攻撃力・命中で十分(FRESHY) |\n| 装備 | | **製作の武器は要らない**: IL86 の製作武器は怒りのクロメデの武器より 2〜3% 強いだけ。材料の7割を自分で集められるなら作る(FRESHY は約5,000万で IL86・+15) |\n| そのほか | | スキル予約は**オフ**(4-2)。バフ(バイゼルの権能・支援射撃・祝福のボウ)はマクロに入れず手で(ボスが飛んで攻撃できない間に切れるのを防ぐ。12章)。戦闘速度は 40% +巻物10% +狂風の矢15% で 65%。翼は悪夢の店の翼が一番、次は闇の帳の翼(FRESHY。10章・12章) |\n\n## 0-2. 11/6 の最新(今週の動画)(11/6)\n마린시티아이파크「グローバル版のレンジャー PvE ガイド。今弱い理由」(11/2、3,600回。韓国語。グローバル版で遊ぶ人)、파트장「レンジャーのマウスのマクロ」(11/3、1万回。**韓国版**)、Viles の職業の強さの順(11/2、1万回)。韓国語のスキル名は日本語名に直した(13章は英語 → 日本語の表で、韓国語は載せていない。直した名前に迷う所は要確認)。(11/6)\n\n**職業の強さ(Viles)**: 序盤〜中盤(戦闘力 7〜15万)は B+、終盤(16〜20万)は A−。スティグマと戦闘速度がそろうまで弱い。**バフ(祝福のボウ・バイゼルの権能)が切れている間の火力が低い**。\n\n**今弱い理由と強くなる道筋(마린시티아이파크)**\n| 点 | 中身 |\n|---|---|\n| 弱い理由 | チャンターなどのスティグマはパーティー全員が強くなる(レンジャーもその恩恵を受ける)。レンジャーの4つ(バイゼルの権能・祝福のボウ・支援射撃・グリフォンの矢)は**自分だけ**強くなる。だから育つまでは差が出るが、全部そろうと大きく伸びる |\n| バイゼルの権能 | 20秒、攻撃力 +20%・完璧 +10%、クリティカルのとき 50% で全スキルの再使用 −1秒、集中の眼・ハンターの魂の効果 1.5倍。グローバル版はクリティカルの上限が 50% なので韓国版より減りが遅い。**支援射撃 Lv20 は必ずクリティカル**なので、再使用を減らすのを手伝う |\n| 本命 | **グリフォンの矢**。当てると相手が「紅炎(仮)」の状態になり、当たるたびに追加ダメージ |\n| スキルの順 | **狂風の矢 Lv16 が一番先**(アルカナ・リングで +を足して 16 にしてもよい)→ 速射 16(スキル速度 +20%)→ 鋭穿の矢 16(特化 3・5 か 4・5)→ 必中の矢を 20 へ(特化は 2・3 → Lv20 で 2・3・5。火力だけなら 2・4・5) |\n| 使わない物 | 爆発の罠・矢乱射は Lv16 になるまで使わない(MP が足りなくなる) |\n| マクロ | 速射の列には鋭穿の矢だけ。バフは1つの列にまとめる。狂風の矢は別。**必中の矢はマクロだと溜めきらない**ので手で押し続ける |\n| スティグマの順 | バイゼルの権能 20 → 祝福のボウ(多段ヒット)5 → 20 → 支援射撃 15 → 最後の1つを 20(順番は字幕から推定) |\n| パッシブ | ハンターの魂(ダメージに占める割合が高い)→ ハンターの決意 → 集中の眼 |\n\n**マウスのマクロ(파트장。韓国版。「最高の火力ではないが、指2本で中の上」)**\n| 点 | 中身 |\n|---|---|\n| Lv20 のスキル | 前は 狙撃・速射・狂風の矢・必中の矢 など5つ。今は**捕縛の矢と矢乱射も要る**(狙撃の MP が足りなくなったため)。足りない分はアルカナのリングで |\n| スティグマ | 遠征・超越の周回では矢嵐(グロッキーを溜める)、悪夢・聖域などでは大自然の息吹 |\n| ゲームのスキルマクロ | **2つだけ**(右クリックの技とグリフォンの矢)。3〜4個入れると技が抜ける |\n| マウスのマクロ(右クリック) | スキルマクロ → バフ → 必中の矢 |\n| 回し方 | ボスでバフ(5番)→ 標的の矢を手で → 左クリックと右クリックを押し続ける。必中の矢は溜めきる |\n| 火力 | タンクなしでも 300万以上(韓国版の遠征・超越の一番上) |\n\n## 0-3. 11/8 の最新(今週の人気動画)(11/8)\nMoxsy「10万 DPS 以上のレンジャー(ルドラ向け)」(11/4、2.9万回。製作の装備は1つだけ)、Rythmn「PvE レンジャー完全ガイド」(11/3、2.9万回)、AndreGainzz「レンジャーの DPS が低い? 直し方」(11/6、1.5万回。製作の装備なし)。\n\n| 項目 | 中身 |\n|---|---|\n| スティグマ(Moxsy) | まず **バイゼルの権能 20・祝福のボウ 15・グリフォンの矢 15・支援射撃 15**。次は**祝福のボウを 20**(1分の木人で何度も比べ、支援射撃 20 より多段ヒットの分だけ明らかに上だった)。支援射撃 20 は全部クリティカルになるが、クリティカルの上限 50% の今は差が小さい |\n| スティグマ(Andre) | バイゼルの権能 20 → 祝福のボウ 15 → 爆発の矢 10 → 支援射撃 5 |\n| **マクロに入れない物**(Andre) | **必中の矢はマクロから外す**(手で溜める)。標的の矢・爆発の罠・制圧の矢は動作が長いので外す。入れるのは **狂風の矢・鋭穿の矢・破裂の矢**(動作が短い物)。外しただけで DPS が約30%上がった。制圧の矢はグロッキーを取るときだけ手で |\n| 特化(Moxsy) | 狂風の矢は再使用と戦闘速度・PvE ダメージ増幅、爆発の罠は気絶と追加ダメージ(引き寄せはもう使わない)、破裂の矢は移動可能と対象が少ないときの +20%、制圧の矢はスキル速度と気絶、必中の矢はスキル速度・移動可能・追加ダメージ |\n| 回し方(Moxsy) | バフを自分で → 標的の矢 → マクロ(バフ → 必中の矢)→ 左クリック・右クリック・マクロの3つを押し続け、標的の矢と大きなバフの再使用だけ見る |\n| 能力値(Moxsy) | ルドラのクリティカルの目安は5章を参照。装備の行は武器ダメージ増幅・ダメージ増幅・戦闘速度・クリティカル・攻撃力・多段ヒット的中(Andre)。防具は集中の眼の行 |\n| 装備(Andre) | **製作の装備がなくても全部のコンテンツを倒せる**(製作は「追いかける物」) |\n| 戦闘力を上げる小技(Andre) | ドラウプニルの遠征を**10回**倒すと戦闘力の像がもらえる(火曜のリセット前に)。悪夢の店のジケルの像は 14,000枚(スティグマと結晶を買ったあとに)。称号も戦闘力に入る |\n| PvP(Moxsy) | 武器かガーダーに**封印**の神石(封印された相手は基本攻撃しかできない) |\n\n**韓国・台湾の大改編(11/13。グローバル版にはまだ来ていない)**: **バイゼルの権能は「その技だけ」の再使用を減らす**形になり、矢乱射も同じ。今の「バイゼルの権能で全スキルを回す」形はなくなる。主力の技の必ずクリティカルはクリティカル率の上昇に変わる(アップデート情報)\n\n---\n\n## 0-4. 11/16 の最新(今週の動画と韓国の改編の手直し)(11/16)\n**今のグローバル版のビルド(Realm Gaming TV 11/11、1,300回)**\n| 項目 | 中身 |\n|---|---|\n| スティグマ | **バイゼルの権能**(クリティカルのたびに全スキルの再使用 −1秒。クリティカル率が上限のとき一番強い)・祝福のボウ・グリフォンの矢・支援射撃の4つ |\n| 目安 | **命中 約1,200**、クリティカルは標的の矢が付いた状態で **1,200〜1,400**。足りなければ先にそこまで上げる |\n| 武器・ガーダー | 戦闘速度・武器ダメージ増幅・ダメージ増幅・威力・多段ヒット・攻撃力・正確。**スキルの行はリングとアルカナで取る** |\n| アルカナ | 活力の聖杯 = 必中の矢・鋭穿の矢・速射・集中の眼・ハンターの魂。羊皮紙 = 鋭穿の矢・速射(狙撃・破裂の矢も可)。コンパス = 必中の矢をできるだけ |\n\n**台湾・韓国の改編(JOHNPAL 11/14、2.1万回。aLuckyRO 11/15、3,700回)**\n| 点 | 中身 |\n|---|---|\n| バイゼルの権能 | 再使用が減るのは Lv20 から、しかも**その技だけ**(全スキルではない。アップデート情報)。3つ目の特化はハンターの魂ではなく**ハンターの決意**(クリティカル ダメージ)を強くする → パッシブは決意を優先に |\n| 祝福のボウ | 再使用 2分 → **1分**、効果 +5秒。再使用短縮込みで**ほぼ半分の時間**付けておける(JOHNPAL の今の記録では 25〜28%) |\n| 支援射撃 | ダメージ +15% |\n| 新しい回し | 標的の矢 → 捕縛の矢(遅くする)→ 破裂の矢(Inspiration(仮)= 全属性ダメージ +20%)→ **爆発の矢**(+175%)→ 3秒の間に**矢乱射**を約4回(1回ごとに +1%、10回まで)。捕縛の矢の効果は3秒(Lv16 の特化で +2秒) |\n| マクロ | 捕縛の効果が3秒しかないので、**今のままではマクロにしにくい**(JOHNPAL) |\n| 画面 | 職業ごとの大事なバフを3つの枠で見せる表示が増えた |\n\n**韓国の手直し(11/13・11/14。Anders 11/15、6.2万回)**\n- 11/13: 破裂の矢は**使った時点で** Inspiration(仮)が付く(前は当たったとき)。5つ目の特化は「35% で再使用が戻る」→「Inspiration を +2秒」\n- 11/14: 遅くする・束縛を1つにまとめた新しい効果「Fetter(仮。状態異常抵抗 −30%)」。捕縛の矢は当たると3秒 Fetter、1つ目の特化は MP を使わず 200 戻す形に。速射の MP 120 → 70。爆発の罠の3つ目の特化はシールドを消す形に。矢乱射は PvP ダメージ −30%\n- グローバル版にいつ来るかは未確認。NC は職業の強さの調整は後で行うと言っている\n\n## 0-5. 11/19 の最新(今週の動画は少ない)(11/19)\n今週のレンジャーの人気動画は、英語ではルドラの戦闘の映像だけだった。ブラジルの Eletrico「レンジャーのガイド」(11/14、ポルトガル語、3,300回)から。\n| 点 | 中身 |\n|---|---|\n| スティグマ | **バイゼルの権能を最初に Lv20**(Lv20 で、付いている間 50% で全スキルの再使用が減る)。あとは多くの人と同じ4つ |\n| スキルの順 | **必中の矢 → 鋭穿の矢** → 速射 → 狂風の矢 → 狙撃(前の2つが最優先) |\n| パッシブ | 集中の眼(命中・PvE と PvP のダメージ増幅・強打)とハンターの決意 |\n| 種族理解度 | 知性の種族を先に Lv3(威力とクリティカルが付く。威力は攻撃力を上げる) |\n- 11/18 のパッチでルドラに「簡単」(入場 IL 2,800、復活無制限)。アビスポイント3倍は 12/16 まで(アップデート情報)\n\n## 1. スキル\n\n### 1-1. 優先順\n| 優先 | スキル | 目標 | 理由 |\n|---|---|---|---|\n| 1 | **必中の矢**(溜めの大技) | 16 → 20 | Lv16 の特化5「的中時に追加ダメージ」で大きく伸びる。終盤のダメージの40〜50% |\n| 1 | **速射**(右クリックの主力) | 16 | Lv16 でスキル速度+20% |\n| 2 | 狙撃(左クリック。MP 回復) | 16〜20 | 必中の矢の再使用を減らす。Krix は Lv20 にする(11/4 の上位20人は 16。0-1) |\n| 2 | 鋭穿の矢 | 20 | クリティカルのあとに使える。Lv16 で1回追加発動 |\n| 2 | 狂風の矢 | 16〜20 | 戦闘速度・PvE ダメージの強化。Lv16 で再使用 −10秒(稼働100%)。上位20人は 20、마린は最初に Lv16(0-1・0-2) |\n| 3 | 破裂の矢 | 20(最後) | 鈍化・束縛の敵に使える |\n| 4 | 標的の矢 | 低くてよい | 開幕の強化(クリティカル・完璧)。Lv16 未満で十分 |\n| 4 | 捕縛の矢 | 12〜20 | 鈍化+スキル速度。FRESHY は Lv12 でよい、上位20人は 20(0-1) |\n| — | 爆発の罠 | 狩りだけ | 1番「爆発時に敵を引き寄せる」で集める。ボスでは使わない(Moxsy 11/4 は気絶と追加ダメージの特化で、引き寄せはもう使わない。0-3) |\n| — | 制圧の矢 | 手で温存 | ボスの大技の直前に気絶値を入れて止める(Moxsy) |\n| — | 矢乱射 | 使わない(10月) | 10月の動画では「グロッキー中も、ほかの技のほうが強い」。11月は意見が割れる: FRESHY はポイントのむだ/上位20人は Lv16/파트장(韓国版)は Lv20 が要る(0-1・0-2。12章) |\n\n- 上げ方: スキルポイントで10、ディーヴァニオンで+4、リング・武器・ガーダーの刻印、アルカナ\n- Lv45 ですべての地域クエストを終えると、ほぼ全スキル Lv10(FRESHY)\n\n### 1-2. 特化(PvE)\n| スキル | Lv8 | Lv12 | Lv16 | Lv20 |\n|---|---|---|---|---|\n| 狙撃 | 3 多段ヒット+50%(MP が足りなければ 1 MP回復) | 3+4(4=必中の矢の再使用 −1秒) | 4+5(5=連続スキル[疾風の矢]) | 3+4+5 |\n| 速射 | 3 対象が少ないほど+12% | 2+3(2=クリティカル+10%) | 3+5(5=スキル速度+20%) | 2+3+5 |\n| 必中の矢 | 2 スキル速度+30% | 2+3(3=移動可能) | 2+5(5=追加ダメージ) | 2+3+5(命中が足りない所では 4=ガード・回避無視) |\n| 鋭穿の矢 | 3 スキル速度+20% | 3+4(4=必ず多段ヒット) | 3+5(5=1回追加) | 3+4+5(アビス狩りは1=HP吸収) |\n| 狂風の矢 | 1 持続+5秒 | 1+4 | 4+5(5=再使用 −10秒) | 3+4+5 |\n| 破裂の矢 | 2 多段ヒット+50% | 3+4 | | 2+4+5 |\n| 標的の矢 | 3 持続+5秒 | 1+3(1=完璧+5%) | | |\n| 捕縛の矢 | 2 スキル速度(動きたいなら 3 移動可能) | 2+3 | | |\n| 爆発の罠 | 3 3秒後に追加 | 1+3(1=引き寄せ。狩り用。ボスでは気絶+追加ダメージ。Moxsy 11/4) | | |\n| 衝撃解除 | 3 HP20%回復 | | | |\n- 出典: JOHNPAL の資料(10/17)、Krix Domi(10/23)、Moxsy(10/12)\n\n---\n\n## 2. パッシブ\n| 優先 | パッシブ | 補足 |\n|---|---|---|\n| 1 | **集中の眼** | 命中・PvE ダメージ増幅・強打。Krix は「今のグローバル版で本当に役立つのはこれだけ」 |\n| 2 | ハンターの魂 | クリティカル時に追加ダメージ。ダメージの約10%(Moxsy の実測) |\n| 2 | ハンターの決意 | クリティカル ダメージ増幅。クリティカルの上限が80%→50%に下がって価値が落ちた(Krix)。上位20人は決意 32〜33 \u003e 魂 18〜21(0-1)。韓国版の改編では決意が優先になる(0-4) |\n| 3 | 集中砲火、束縛の眼、近接射撃 | 継続ダメージ・鈍化した敵・近くの敵に追加ダメージ |\n| 4 | 警戒の目、風の活力、抵抗の決意、蘇生の契約 | 守り。PvP で大事 |\n- 魂と決意のどちらが上かは人で違う(12章)\n\n---\n\n## 3. スティグマ\n| スティグマ | 目標 | 理由 |\n|---|---|---|\n| **バイゼルの権能** | **20 が最優先** | 20でクリティカル時に50%で全スキルの再使用 −1秒。ほかを1にしてでも先に(Krix・Moxsy・FRESHY) |\n| 支援射撃 | 10 → 15 | 追加の射撃と回復。10・15 で持続と再使用が良くなる |\n| 祝福のボウ | 5 → 20 | 5で多段ヒット+50%。20で強打+7%。15(クリティカル ダメージ)はクリティカル上限の影響で後回し(Krix 10/23)。Moxsy(11/4)は 15 を先に取り、次に支援射撃 20 より祝福のボウ 20(0-3。12章) |\n| グリフォンの矢 / 爆発の矢 | どちらか1つ。**11月はグリフォンの矢 15 が主流** | 少ないポイントでは**爆発の矢 Lv5**(再使用 −15秒)。**グリフォンの矢は Lv15** で受けるダメージが増える効果が付いてから(Moxsy・Krix)。FRESHY は 10/11 に「Lv20 なら爆発の矢が上」と言ったが、11/2 に「試したら遠く及ばなかった。最終形は 20・15・15・15」と言い直した(0-1)。Moxsy(11/4)・Realm(11/11)も バイゼル・祝福のボウ・グリフォン・支援射撃 の4つ。爆発の矢を使うのは Andre(10)など |\n\n- Krix の配り方(10/23): バイゼル 20 → 支援射撃 15 → グリフォン 15 → 祝福のボウ 20 → 支援射撃 20。Moxsy(11/4): バイゼル 20・ボウ 15・グリフォン 15・支援射撃 15 → ボウ 20。마린(11/2): バイゼル 20 → ボウ 5 → 20 → 支援射撃 15\n- スティグマのかけらは アビス(一番多い)、悪夢、シューゴフェスタ。アビスの「タイル」は PvP 専用なので買わない\n- PvP で使う物: 大自然の息吹(守り)、奇襲蹴り、矢嵐(攻め)、幻影の矢・封印の矢(1対1で特定の職業に)\n\n---\n\n## 4. マクロと回し方\n### 4-1. マクロ(右クリック。Moxsy・JOHNPAL)\n| 段 | 中身(上から順に試す) |\n|---|---|\n| 1 | 狂風の矢 → 捕縛の矢 → 爆発の矢(またはグリフォンの矢) |\n| 2 | 鋭穿の矢 |\n| 3 | 破裂の矢 → バイゼルの権能 → 祝福のボウ → 支援射撃 |\n| 4 | 鋭穿の矢(Lv16 で追加発動があるので2回入れる) |\n| 空いたとき | 速射 |\n\n- 強化(バイゼル・ボウ・支援射撃)を入れておくと、雑魚では出ず、体力のある敵で出る。バイゼルが 20 なら勝手に戻るので、マクロに入れても損は小さい(Moxsy)。最大火力を狙うなら手で(FRESHY・Andre は入れない。12章)\n- **必中の矢はマクロに入れない**(溜めの1段目しか出ない)。**制圧の矢と爆発の罠も入れない**\n- 遅延: ping 50 未満は10ミリ秒、80〜100 以上は40〜50ミリ秒\n\n### 4-2. 回し方(ボス)\n1. 強化(バイゼル・ボウ・支援射撃)を手で → 標的の矢\n2. 狂風の矢とグリフォンの矢が出たら、**マクロ・狙撃(左)・必中の矢の3つを押し続ける**(押す順は マクロ → 狙撃 → 必中の矢)\n3. **標的の矢は約15秒ごと**、必中の矢の前に。効果が残り1秒ほどで掛け直す(早すぎると損)\n4. 狙撃を挟むと MP が切れず、必中の矢の再使用も減る\n- **設定: スキル予約 OFF**(「戦闘 → 操作 → スキル予約」。左右クリックで動作を途中で切って速く撃つため(Krix)。予約が詰まって回しが遅れるため(FRESHY))。ターゲットは「カメラ前方優先」、「スキル使用時の自動ターゲット」ON\n\n---\n\n## 5. 装備の刻印(魂刻印)\n\n### 5-0. 上位20人の部位ごとの刻印(NotMeter 11/8 8時47分。スキルの行つき)(11/8)\n数字は20人のうち何%か。「技:」はスキルの行。行の付きやすさは成長とシステムのまとめ 8章「魂刻印で付く行と確率」。\n| 部位 | 全員(95〜100%) | 多い(50〜90%) | 少ない |\n|---|---|---|---|\n| ボウ | 威力・攻撃力・武器ダメージ増幅・戦闘速度・多段ヒット的中・ダメージ増幅 | 前方攻撃力 60% | スキルの行は 0% |\n| ガーダー | 同じ6つ | 前方攻撃力 55% | |\n| ヘルム | **技: ハンターの決意・集中の眼**、攻撃力・強打・攻撃力増加 | クリティカル 80%・受ける治癒量 55% | 命中 20%・技: ハンターの魂 15% |\n| ショルダー | 技: 同じ2つ、**クリティカル**・攻撃力・クリティカル ダメージ増幅 | 命中 70%・技: ハンターの魂 50% | 技: 集中砲火 10% |\n| トップス | 技: 同じ2つ、クリティカル・攻撃力・ダメージ増幅 | 命中 70%・技: ハンターの魂 50% | 防御力増加 25% |\n| ボトムス | 技: 同じ2つ、攻撃力・完璧・攻撃力増加・ダメージ耐性 | クリティカル 70% | |\n| グローブ | 技: 同じ2つ、攻撃力・戦闘速度・完璧・クリティカル | | 命中 40% |\n| シューズ | 技: 同じ2つ、移動速度・攻撃力・完璧・クリティカル | | 命中 40% |\n| マント | 技: 同じ2つ、攻撃力・完璧・強打・攻撃力増加 | クリティカル 60% | |\n| ネックレス | **技: ハンターの決意・ハンターの魂・集中の眼**、クリティカル・攻撃力・命中 90% | 技: 集中砲火 55% | 技: 近接射撃 20% |\n| イヤリング | 技: 同じ3つ、命中・クリティカル・攻撃力 | 技: 集中砲火 85% | 技: 束縛の眼 20% |\n| リング | **技: 鋭穿の矢・必中の矢・捕縛の矢 95%**、攻撃力 90% | 技: 狂風の矢 90%・破裂の矢 80%・速射 60%・狙撃 60% | クリティカル 40% |\n| ブレスレット | 時間・正義・知恵・破壊・幻想 | 空間 55% | 死 30% |\n| ブローチ | 威力・正確・命中・クリティカル | HP 80% | 意志 20% |\n| 印章 | 封魂石の追加ダメージ・PvE 攻撃力・クリティカル攻撃力・最大攻撃力・追加攻撃力・ボス攻撃力 | | |\n- **テンプラーと違い、防具にもクリティカルを付ける**(ショルダー・トップス・グローブ・シューズで 95〜100%)。クリティカルの上限 50% まで積む職業なので\n- **Moxsy(11/4)の理想の行**: ボウ・ガーダー = 戦闘速度・武器ダメージ増幅・ダメージ増幅・威力・多段ヒット的中・正確(スキルはリングとアルカナで取り、武器には付けない)/ヘルム = 攻撃力増加・強打・クリティカル・集中の眼 / ショルダー = 強打・クリティカル ダメージ増幅・攻撃力・集中の眼 / トップス = ダメージ増幅・完璧・攻撃力・集中の眼 / グローブ = 戦闘速度・完璧・攻撃力・クリティカルか集中の眼 / マント = 強打・攻撃力増加・クリティカル・集中の眼 / シューズ = 移動速度・完璧・攻撃力・集中の眼 / リング = 必中の矢・鋭穿の矢・速射が先。クリティカルの目安は下の 5-1 の最後。賢者の石(行を増やす)は、すぐ替える IL86 の武器には使わない(継承で移らない)\n- 「ネックレス・イヤリングに戦闘速度・威力・正確」という話(0-1 では FRESHY の言葉。Moxsy も言ったかは要確認)の戦闘速度は、**魂刻印の表にはない**(副ステータスの話。成長とシステム 8章)\n\n### 5-1. 部位ごとの狙い(10月の動画。Krix・JOHNPAL・FRESHY)\n| 部位 | 狙う物 | 出典 |\n|---|---|---|\n| ボウ・ガーダー | 戦闘速度、武器ダメージ増幅、ダメージ増幅、威力、攻撃力(多段ヒット的中も良い) | Krix・JOHNPAL・FRESHY。**正確(クリティカル)は今は要らない**(クリティカル上限50%にすぐ届く。Krix 10/23)。Moxsy(11/4)・Realm(11/11)は正確を入れる(12章) |\n| ヘルム | 強打・攻撃力増加(PvP は受ける治癒量) | |\n| ショルダー | クリティカル ダメージ増幅 | |\n| トップス | ダメージ増幅 | |\n| グローブ | **戦闘速度** | |\n| ボトムス・マント | 完璧、ダメージ耐性(マントは強打) | |\n| シューズ | 移動速度 | |\n| リング | **威力+スキル: 必中の矢・狙撃・狂風の矢・鋭穿の矢** | Krix(11/8 の上位20人は 鋭穿の矢・必中の矢・捕縛の矢が 95%。5-0) |\n| イヤリング | パッシブ: ハンターの魂・集中の眼・ハンターの決意・集中砲火 | FRESHY |\n| ネックレス | パッシブ: ハンターの決意・ハンターの魂・集中の眼+クリティカル・攻撃力・命中 | 上位20人(5-0)。FRESHY(10/11)の「アクティブ2つ+攻撃力・クリティカル」は上位20人と合わない |\n- **防具のパッシブは集中の眼**(Krix)\n- 前方ダメージ増幅を取れる所では取る。取れなければ攻撃力(Krix)。前方・後方ダメージ増幅を1つずつどこかに持っておく(Moxsy)\n- 魔石: 前方/後方ダメージ ≧ 攻撃力 \u003e 武器ダメージ増幅 \u003e クリティカル・命中。クリティカルより命中(JOHNPAL)\n- 命中の目安 1,000〜1,200(祝福のボウの+300込み。要確認: 本文の +300 は標的の矢のクリティカルの話だけ。Krix 10/23)、**約1,200**(Realm 11/11。0-4)。ルドラは命中が要るので、必中の矢の特化を「ガード・回避無視」に替える(Krix)\n- クリティカルの目安: ルドラでは**素で 1,000** くらいまで(Moxsy 11/4)、標的の矢が付いた状態で 1,200〜1,400(Realm 11/11)\n\n---\n\n## 6. アルカナ(Krix 10/23)\n| カード | 能力値の種類 | 狙うスキル |\n|---|---|---|\n| 聖杯 | **活力**(時間=戦闘速度) | 最初は**必中の矢**を指定して作る。理想は 集中の眼 +4 と アクティブ2つ +2 |\n| 羊皮紙 | どちらでもよい | 鋭穿の矢 +4、速射・狙撃 +2 など |\n| コンパス | 死(クリティカル)→ ルドラ用に自由(命中) | アクティブ +4 と もう1つ +2。標的の矢・制圧の矢・矢乱射は要らない |\n| 鐘 | **魔力**(破壊=攻撃力) | ハンターの決意 +4 |\n| 鏡 | **魔力**(知恵=強打) | **集中の眼 +4** |\n- FRESHY(11/2)は「魔力はレンジャーには要らない」(0-1。12章)\n- 目標: 主力スキルにアルカナで +4(ディーヴァニオン4+リング2+スキル10と合わせて Lv20)\n- 神の能力値: **幻想(待ち時間)と知恵(強打)**を重ねる。像は足りない方(自由=命中、死=クリティカル)\n\n## 7. 種族理解度(Krix)\n| 種族 | 4番 |\n|---|---|\n| 知性 | ダメージ増幅・PvE ダメージ増幅(クリティカル ダメージ増幅は高くても振り直した) |\n| 野性 | 武器ダメージ増幅 |\n| 自然 | PvE ダメージ増幅(多段ヒット・完璧は数値が低い) |\n| 変形 | **前方ダメージ増幅**(PvE ダメージ増幅より上) |\n| 特殊 | **強打** |\n- 1・5番は最大攻撃力と追加攻撃力(今はどちらも同じくらい。ずっと先は最大攻撃力)\n- 同じ Krix のチャンターの動画(チャンター 7章)では、自然の4番は多段ヒット的中、1・5番は「攻撃力」。職業による違いか、言い方の違いかは要確認\n\n## 8. ディーヴァニオン\n- 角(オレンジ)を全部 → 主力スキル(必中の矢・速射・狙撃・鋭穿の矢・狂風の矢)→ パッシブ(集中の眼・ハンターの魂・ハンターの決意)→ 攻撃力・クリティカルの小さいノード。防御とMPは後回し\n- 400 点前後で角は全部取れる(FRESHY)。Fubgun・JOHNPAL・Moxsy が questlog.gg に盤面を載せている\n\n## 9. 狩り\n- **一番強い狩りの職業の1つ**。マクロを押して回るだけで周りが倒れる(JOHNPAL)\n- 遠くの敵を撃って集め → 標的の矢と爆発の罠で引き寄せ → まとめて倒す(Moxsy)\n- ひとりのときは狙撃を「HP 吸収」に替えると、0.5秒ごとに約300回復(Moxsy)\n\n## 10. 翼・称号\n| 種類 | おすすめ |\n|---|---|\n| 翼 | タリスラの翼(シーズンショップ。待ち時間短縮)が一番。闇の帳の翼、森の精霊の翼。FRESHY(11/2)は悪夢の店の翼が一番(0-1。12章) |\n| 称号 | テンプラーと同じ(種族のしがらみから逃れた = Unbound by Genus など。11/20 に NotMeter の日本語表示で確認)。ほかの英語の称号は日本語名は未確認 |\n\n## 11. PvP(FRESHY 9/30、台湾版の情報をもとに)\n| 項目 | 内容 |\n|---|---|\n| 装備 | アビスの店の PvP 装備(3段階)+武器は PvE の製作武器 |\n| 刻印 | 武器・ガーダーは PvE と同じ。ヘルムは受ける治癒量。命中と回避が大事 |\n| スキルを Lv20 に | 必中の矢、鋭穿の矢、破裂の矢、狂風の矢 |\n| 特化 | 速射=クリティカル・少ない対象・ノックバック、標的の矢=完璧・ノックバック・ガード回避無視でクリティカル、必中の矢=移動可能・ガード回避無視・追加ダメージ、衝撃解除=Lv12 で HP 回復と耐性 |\n| スティグマ | バイゼルの権能・祝福のボウは固定。火力ならグリフォン・爆発の矢、守りなら大自然の息吹・奇襲蹴り、1対1なら幻影の矢・封印の矢 |\n| 動き | 「マクロ20%、手80%」。距離を取り、鈍化・束縛で止め、**標的の矢の直後に必中の矢**。守りの技は相手が寄ってきたときのために温存 |\n\n## 12. 意見が割れていること\n| 点 | 意見 |\n|---|---|\n| ハンターの決意・ハンターの魂 | 価値が下がった(Krix)/ハンターの魂はダメージの10%(Moxsy)/決意と集中の眼が最重要(FRESHY・Fubgun)/ハンターの魂が一番(마린) |\n| グリフォンと爆発の矢 | 少ないうちは爆発、Lv15 からグリフォン(Moxsy・Krix・JOHNPAL)/グリフォン 15 で、爆発の矢 Lv20 は遠く及ばない(FRESHY 11/2。10/11 の「Lv20 なら爆発」から言い直し)/爆発の矢 10 を使う(Andre) |\n| 狙撃の Lv20 | Krix は Lv20 にする/上位20人は 16 |\n| 最初に上げるスキル | 必中の矢を最初に Lv20(FRESHY・Eletrico)/狂風の矢 Lv16 が一番先(마린) |\n| 矢乱射 | ポイントのむだ(FRESHY)/上位20人は Lv16/Lv20 が要る(파트장、韓国版) |\n| 祝福のボウ 20 と支援射撃 20 | 支援射撃 15 → … → ボウ 20 → 支援射撃 20(Krix)/ボウ 15 を先に、支援射撃 20 よりボウ 20(Moxsy) |\n| バフをマクロに入れるか | 入れても損は小さい(Moxsy)/入れずに手で(FRESHY・Andre)/1つの列にまとめる(마린) |\n| 武器・ガーダーの正確 | 要らない(Krix 10/23)/入れる(Moxsy 11/4・Realm 11/11) |\n| アルカナの魔力 | 鐘・鏡を魔力に(Krix)/要らない(FRESHY 11/2) |\n| 一番の翼 | タリスラの翼(10章。クレリック・テンプラーのまとめも同じ)/悪夢の店の翼(FRESHY) |\n\n## 13. 名前の対応(英語 → 日本語)\n| 種類 | 対応 |\n|---|---|\n| アクティブ | Snipe=狙撃、Tempest Shot=速射、Deadshot=必中の矢、Drill Dart=鋭穿の矢、Gale Arrow=狂風の矢、Burst Arrow=破裂の矢、Marking Shot=標的の矢、Snare Shot=捕縛の矢、Explosion Trap=爆発の罠、Suppressing Arrow=制圧の矢、Arrow Scattershot=矢乱射、Defiance=衝撃解除 |\n| パッシブ | Focused Eye=集中の眼、Hunter\u0027s Resolve=ハンターの決意、Hunter\u0027s Soul=ハンターの魂、Concentrated Fire=集中砲火、Rooting Eye=束縛の眼、Melee Fire=近接射撃、Vigilant Eye=警戒の目、Wind Vigor=風の活力、Unyielding Resolve=抵抗の決意、Revitalization Contract=蘇生の契約 |\n| 称号 | Unbound by Genus=種族のしがらみから逃れた(11/20 NotMeter の日本語表示で確認) |\n| スティグマ | Vaizel\u0027s Authority=バイゼルの権能、Bow of Blessing=祝福のボウ、Supporting Fire=支援射撃、Griffon Arrow=グリフォンの矢、Explosive Arrow=爆発の矢、Mother Nature\u0027s Breath=大自然の息吹、Ambush Kick=奇襲蹴り、Arrow Storm=矢嵐、Illusory Arrow=幻影の矢、Sealing Arrow=封印の矢、Ensnaring Trap=結縛の罠、Stealth=隠れ身 |\n\n## 14. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| Moxsy「100K+ DPS Ranger Guide (LUDRA READY)!」(sFY_1oGFcZI) | 11/4 | 2.9万回。スティグマの順・回し方・能力値(0-3) |\n| AndreGainzz「Your DPS SUCKS as Ranger, Heres HOW to FIX it」(FJmR8wl4hVs) | 11/6 | 1.5万回。マクロに入れない物・戦闘力の小技(0-3) |\n| Rythmn「The ULTIMATE Ranger Guide for PvE」(gh2RBfHarvc) | 11/3 | 2.9万回。字幕は取ったが読んでいない(長いため) |\n| 마린시티아이파크「글로벌 서버 궁성 PVE 가이드」(R6ZhTWMpUjI) | 11/2 | 3,600回。韓国語。今弱い理由・スキルの順・マクロ(0-2) |\n| 파트장「궁성 날먹 마우스 매크로 세팅」(x-9Msybgju8) | 11/3 | 1万回。韓国版。マウスのマクロ(0-2) |\n| Viles「AION 2 midseason PVE tier list」(eTj6Yy8kfb8) | 11/2 | 1万回。職業の強さの順(0-2) |\n| Krix Domi「Ranger is BROKEN(Rank 1 Build)」(go6P1BBAlMg) | 10/23 | NotMeter で1位多数。特化・パッシブ・スティグマ・刻印・アルカナ・種族理解度 |\n| JOHNPAL TV「レンジャー究極攻略ガイド」(otTvwv5pG1s)と資料 | 10/17 | 特化の番号、マクロ、刻印の優先順 |\n| Moxsy「DPS 5万超え!レンジャー最強ビルド最新版」(dHIm6D2KPMc) | 10/12 | 終盤の実測、マクロ、回し方 |\n| FRESHY「Best Ranger PVE Build」(1Et2C2-c8po)、「PvP Build Guide」(8i-KegEYvdQ) | 10/11、9/30 | 刻印、PvP |\n| Fubgun「レンジャーのエンドゲーム」(GdAakaOGPLo) | 10/10 | パッシブ、ディーヴァニオン |\n| KaidGames「レンジャーが弱い理由と改善策」(Pkb5plpH3zM) | 10/16 | 序盤の特化、マクロの遅延 |\n| Moxsy「最強レンジャー完全ガイド」(VsvTt5JkEzY) | 10/5 | 上げ方 |\n| Chacal「職業ティアリスト」(SGINL3w6yf4、ポルトガル語) | 10/27、1.3万回 | 職業の強さの評判 |\n| KiraSaveTheWorld「レンジャー完全ガイド」(hFV_btEbN6g、ポルトガル語) | 10/27、1.8万回 | 矢嵐への入れ替え、マクロの優先順 |\n| NotMeter「装備・スキル構成」レンジャー上位20人 | 11/4 | 0-1 スキル・特化・スティグマ・パッシブ・アルカナ・刻印 |\n| FRESHY「The Only Endgame PVE Ranger Guide」(CdWbCU9ROv4) | 11/2、3.8万回 | 0-1 特化、スティグマ(グリフォンの矢 15)、刻印、製作武器は要らない、スキル予約オフ |\n"},{"id":"chanter","tab":"チャンター","title":"チャンター まとめ","file":"チャンター_まとめ.md","md":"# チャンター まとめ(2026-11-20 最新)\n\n10/23 の「レンジャー・チャンター・クレリックのビルド」のチャンターの部分を土台に、10/5〜10/23 の動画8本で調べ直した。スキル名・特化の文は questlog.gg の日本語版データの正式名。\n特化は「Lv8で1つ、Lv12で2つ、Lv16で2つ(入れ替え可)、Lv20で3つ」。表の番号は特化の並び順(1〜5)。\n\n## 0. 今の結論(まずここだけ見る)\n| 項目 | 結論 |\n|---|---|\n| 役割 | 分類は支援だが、**今の調整では火力がとても高い**。早い段階から強い(gigawhale、グローバル版1位) |\n| 最優先 | **岩撃砕を Lv16**(再使用時間がなくなり連打できる)→ Lv20。次に撃破砕・回転撃を Lv20 |\n| スティグマ | **不敗のマントラ 20** と **疾風の権能 20** は固定。守護の祝福は **Lv15 にしてから**(風の約束が1.5倍) |\n| パッシブ | **風の約束 \u003e 攻撃準備 \u003e 衝撃的中** だけ上げる |\n| 装備 | **クリティカルは要らない**(岩撃砕・回転撃が確定クリティカル)。攻撃力 \u003e 強打 \u003e 武器ダメージ増幅 \u003e ダメージ増幅系 \u003e 戦闘速度(90.5% まで)(Antochi) |\n| マクロ | 岩撃砕 → 回転撃 → マルクタンの怒り → 打撃砕 を**同じ段**に入れ、空いたら百裂撃。左クリック(撃破砕)と右クリックを押し続ける |\n| ダメージの中心 | 岩撃砕とその連続スキル 貫通砕 で約4割 |\n| **10/31 の流れ** | 職業の強さの評判(Chacal 10/27、ブラジル): **クレリック・テンプラーと並んで一番上**。「今は壊れている」と言われるほど火力が高く、PvP でも同じ火力が出る。Şükrü(10/27、220時間遊んだ人)の形も上の結論と同じ。追加の点: ① 突進撃破は敵を倒すと再使用時間が戻る(1-1・9章) ② マウスの右で連続のマクロ、同時に左も押したままにして基本攻撃で動作の隙を消す ③ **ワンドの神石は範囲の効果の物**(ほとんどの技が4体に当たるので発動が多い) ④ 自分の火力を最優先するなら、疾走のマントラの代わりに守護の祝福 Lv15 |\n| **11/16 の最新** | 韓国の改編で百裂撃・回転撃の「ガード・回避を無視」がなくなり、命中がもっと要る形に。疾走のマントラはなくなる。手直しで岩撃砕 +7%(0-4)。**どれも韓国版の話で、グローバル版は今のまま** |\n---\n\n## 0-1. 11/4 の最新(上位20人の実際と今週の動画)(11/4)\nNotMeter「装備・スキル構成」のチャンター上位20人(11/4 6時47分の集計)と、Maddoshi(10/29、1.9万回)・Krix Domi(11/2、1.8万回)の動画。\n\n| 項目 | 上位20人 | 動画・補足 |\n|---|---|---|\n| スキルのレベル | 撃破砕・岩撃砕・快癒の呪文・回転撃 **20**、突進撃破・百裂撃 16、疾風乱舞・打撃砕・衝撃解除 14〜16、震動砕 13〜15、波動撃 12〜15 | 優先は岩撃砕 → 回転撃 → 撃破砕(Maddoshi)。今のシーズンで全部 Lv20 は難しいので、岩撃砕だけは必ず |\n| 岩撃砕の特化 | 3・4・5 が全員 | Lv16 は 3+5(連続スキルを外して再使用時間削除)、Lv20 で 4 を戻す。**4 を戻して火力が落ちる人は戦闘速度が足りない**。目安は巻物なしで 約30% から(Maddoshi) |\n| 撃破砕 | 3 多段ヒット 90%・4 回転撃の再使用 −1秒・5 暴風砕 が 100% | 1-2 と同じ |\n| 回転撃 | 1 再使用 −5秒・3 対象が少ないほど +20%・5 ガード回避無視のクリティカル が全員 | Lv12 は 1+3、Lv16 は 3+5、Lv20 で 1+3+5(Maddoshi) |\n| 快癒の呪文 | 1 連続+1回 100%・4 HP5% 93%・5 再使用 −3秒 57%・2 デバフ解除 36% | 上位は Lv20 まで上げている |\n| 突進撃破 | 4 撃破で再使用初期化 100%・**5 ガード回避無視の多段ヒット 85%** | Lv12 で 4 を取れば狩りが速い(Krix) |\n| 疾風乱舞 | 5 全スキルの再使用 −1秒 100%・4 必ず多段ヒット 86% | 上位は Lv14〜16 まで上げている(1-1 の「使わない」と違う) |\n| 打撃砕・震動砕・波動撃 | 打撃砕 3・4 が全員、震動砕 2 射程 100%・1 行動力 63%、波動撃 4(対象の PvE ダメージ増幅 15%)67% | |\n| スティグマ | **13個とも Lv20 以上**。不敗のマントラ・疾風の権能は 25 | 4枠は 不敗のマントラ 20・疾風の権能 20・守護の祝福 15・マルクタンの怒り 1(岩撃砕を開くだけなので1でよい)。疾走のマントラの移動速度は「メインには要らない」(Maddoshi)。粉砕撃(防御 −30%)は PvE では差がない(同) |\n| パッシブ | 風の約束 35〜36、攻撃準備 30〜31、衝撃的中 29〜30、大地の約束・鼓舞の呪文 18〜20 | **鼓舞の呪文(クリティカル)と大地の約束(敵の PvE ダメージ耐性を下げる)**も火力になる(Maddoshi)。風の約束・衝撃的中・攻撃準備はボトムス・マントに付ける(Krix) |\n| アルカナ | 聖杯は全員「守護の聖杯」。付いているのは 風の約束(Lv4)100%・攻撃準備(Lv2)100%・衝撃的中 90%・撃破砕 45%・回転撃/岩撃砕 30% | アルカナで狙うのは 衝撃的中・風の約束・攻撃準備・鼓舞の呪文・大地の約束(Maddoshi) |\n| 刻印 | 武器・ガーダーは 威力・攻撃力・武器ダメージ増幅・戦闘速度・多段ヒット的中・ダメージ増幅 が全員(正確 65%)。ヘルム 強打・攻撃力増加(受ける治癒量 45%)、ショルダー クリティカル ダメージ増幅、トップス ダメージ増幅、ボトムス 完璧・攻撃力増加・ダメージ耐性 85%、グローブ 戦闘速度・完璧、シューズ 移動速度・完璧、マント 完璧・強打・攻撃力増加。ネックレス・イヤリングは攻撃力+命中(55〜65%)、**クリティカルは 25% だけ**(確定クリティカルが多いため) | リングは攻撃力・威力+岩撃砕・撃破砕・回転撃(Krix) |\n| 魔石 | 前方ダメージ増幅 95%(20人で合計146)、武器ダメージ増幅 70%。霊石は前方 100%・武器 90% | |\n| 種族理解度 | | 7章を参照(Krix の種族ごとの4番も7章に移した) |\n| ルドラの難しい | | アリエルのボードは青い枠でボスへのダメージ増幅、ルドラの難しいでは下の枠の PvE ダメージ耐性(Krix) |\n\n## 0-2. 11/6 の最新(今週の動画)(11/6)\nnotXeon の PvP 2本(11/2、1.7万回・1.2万回)、Gear Point「装備が弱くてもパーティーの 31%」(11/2、3,000回)、Viles の職業の強さの順(11/2、1万回)。\n\n**職業の強さ(Viles、PvE、アサシン使い)**: チャンターは「**どの段階でも弱い所がない。一番強い職業**」(S+)。火力・回復・補助(PvE ダメージ増幅・移動速度・命中・クリティカル)が全部ある。(11/6)\n\n**装備が弱い人の PvE(Gear Point。サブキャラ、戦闘力 5.1万で5人の中で一番低いのに、超越の最後のボスで与ダメージ 31%・1位)**(11/6)\n| 項目 | 中身 |\n|---|---|\n| 中心 | **岩撃砕**。まず Lv16 → 20。特化の1つで再使用時間がなくなる。Lv16 前は連続スキル(貫通砕)を外して再使用の特化を入れる(要確認: 再使用削除は Lv16 の特化なので「Lv16 では」の意味か)。Lv20 で下の3つ全部 |\n| ほかのスキル | 撃破砕は最大、次に 打撃砕(範囲ダメージに変える特化。Lv12 でスキル速度)・回転撃・百裂撃(ガードの特化とダメージの特化。Lv16 でガード回避無視)。疾風乱舞は HP 5% 吸収の特化を取り、HP が減ったらボスを気絶させてから使って回復。震動砕は射程 10m の特化で、覚醒戦・デイリーダンジョンで敵から敵へ飛べる。突進撃破は Lv1 で特化なし |\n| スティグマ | 不敗のマントラ 20 → 疾風の権能 20 → 疾走のマントラ(移動速度と少しの回復。あとで入れ替える)・マルクタンの怒り。**マントラは死ぬと切れる**ので、起きたら押し直す |\n| パッシブ | 衝撃的中が一番、次に 攻撃準備・風の約束。鼓舞の呪文も。十字防御・保護陣は上げない |\n| マクロ | **岩撃砕 → マルクタンの怒り の2つだけ**。左クリックとマクロのボタンを押し続ける。疾風の権能 → 突進撃破 で始める |\n| スティグマのかけらの集め方 | 悪夢の店(ディーヴァニオンの結晶よりかけらを優先)、アビスの店(かけらだけ買う)、シューゴフェスタの店 |\n| アルカナ | 最初は守護の聖杯で岩撃砕を指定 |\n\n**PvP の能力値とスキル(notXeon。1人でアビス・闘技場・戦場をする人)**(11/6)\n| 項目 | 中身 |\n|---|---|\n| 攻撃の能力値 | PvE と同じ(戦闘速度・武器ダメージ増幅・ダメージ増幅・命中)+ **PvP ダメージ増幅**(PvP の外見・PvP のアミュレット)と**状態異常的中**(武器に早めに) |\n| 守りの1段目(全職業) | 武器ダメージ耐性・ダメージ耐性・クリティカル ダメージ耐性。ヘルムに**受ける治癒量**(薬にも効く) |\n| 守りの2段目(職業で選ぶ) | 防御+攻撃準備、HP(生命の祝福・体力)、ダメージ耐性+再生、回避(レンジャー・アサシン)など。notXeon は**ガードとクリティカル抵抗**。ほかに**状態異常抵抗**はみんな積んでいる(拘束されて衝撃解除がないと倒される) |\n| スキルの Lv20 | 岩撃砕 → **百裂撃**(PvP では Lv20 で ガード回避無視・多段ヒット・ガード上昇・相手の命中を下げる。実質ガード +400)→ 回転撃(治癒量の特化)→ 快癒の呪文(Lv20 でデバフ解除) |\n| スキルの Lv16 | 震動砕・打撃砕(気絶 +20〜25%)、撃破砕(2つ目の特化 = HP 吸収)、突進撃破(ガード回避無視)。Lv12: 衝撃解除(時間)・波動撃(射程と転倒時間)・裂波撃(封印) |\n| パッシブ | 十字防御をできるだけ上げる、生存意志(状態異常抵抗)・攻撃準備・風の約束・衝撃的中。**激怒の呪文と大地の約束は外した**(PvP では効かない) |\n| スティグマ | 不敗のマントラ 20 → 守護の祝福 15(受ける治癒 −70% を相手に。15 未満なら入れない)→ 集中防御(Lv10 から。受け流すと HP 回復、十字防御も確定で発動して1回で最大1万回復)→ マルクタンの怒り(受ける治癒量と薬の回復)。快癒の手・遮断の権能は集団戦向け。強襲衝撃・結界の呪文・滅火は「よくない」。かけらが少なければ粉砕撃 |\n| マクロ | PvE と同じ形で、拘束技だけ別のキーにして手で使う |\n| 翼・称号 | 10章を参照(Brawler の翼・Saint of Altgard) |\n\n**ガードのしくみ(notXeon。検証した人たちの話)**(11/6)\n| 点 | 中身 |\n|---|---|\n| 効果 | **正面からの攻撃だけ**、確率で受けるダメージを約半分にする。後ろからは防げない |\n| 確率 | 相手の命中とガードが**同じなら 0%**。ガードが命中より 100 多いごとに約 10%。**上限はない**(回避は 30% が上限)。クリティカルとクリティカル抵抗も同じ計算 |\n| 効き始め | ガード **1,400** を超えてから意味が出る |\n| 抜ける技 | 「ガード・回避無視」の技はガードを素通りする(だからクリティカル抵抗も重ねる) |\n| チャンターとテンプラー・クレリックの違い | テンプラー・クレリックは盾と体で2回ガードの判定があるが、パッシブの待ち時間が3秒。チャンターは1回だけだが十字防御の待ち時間が1秒 |\n| 敏捷 | ガードとクリティカル抵抗の両方が敏捷で上がる。ペットの所持効果(種族理解度)で敏捷が多く取れる |\n\n## 0-3. 11/8 の最新(今週の人気動画)(11/8)\nScreamheart「ボスが溶けるチャンターの PvE 完全ガイド」(11/6、6.3万回。今週のチャンターで一番人気)。ほかに gigawhale のルドラ「難しい」世界最速(チャンター視点、5.7万回)・Ney Rha の EU 2位(5,000回)は戦闘の映像が中心。\n\n| 項目 | 中身 |\n|---|---|\n| Lv20 の順 | **岩撃砕・回転撃・撃破砕**。できれば百裂撃も(特化の枠が増え、火力も上がる) |\n| 撃破砕 | 「回転撃の再使用 −1秒」の特化が大事(回転撃が一番火力が出る技の1つ) |\n| 岩撃砕 | Lv12 で連続スキル(貫通砕)。Lv16 で再使用削除(クリティカルの特化を外すことになる)。クリティカル率が低い人は、クリティカルを外すか連続スキルを外すかを木人で比べる |\n| 疾風乱舞・快癒の呪文 | 疾風乱舞は HP 吸収(回復用)だけ。Lv16 にできたら再使用削除も。快癒の呪文は連続使用 +1回(2回使える) |\n| マクロ | 回転撃・打撃砕(遠くからの技)で岩撃砕を開き、岩撃砕を連打する形。1つのスティグマの枠を使って 5% 未満しか伸びない物は入れない |\n| パッシブ | 攻撃準備・衝撃的中。鼓舞の呪文・大地の約束・激怒の呪文もよい。守りは**十字防御は上げない**(残りのポイントの捨て場)。生命の祝福が一番、保護陣・生存意志もよい |\n| ディーヴァニオン | 撃破砕・回転撃・百裂撃・岩撃砕の点を全部の盤で、次に戦闘の能力値。難しいを回している人は、**盤の上の PvE ダメージ増幅を先に取り、次に角** |\n| アルカナ | 魔力の物は鐘だけにする(破壊のほうが正義より良い) |\n- 十字防御の評価は PvP の notXeon(0-2、「できるだけ上げる」)と PvE の Screamheart(「上げない」)で逆。**PvE なら上げない、PvP なら上げる**と読むのが自然\n\n**韓国・台湾の大改編(11/13。グローバル版にはまだ来ていない)**: チャンターは**ほとんど変わらない**。**疾走のマントラがなくなり、移動速度は不敗のマントラに入る**。多くの職業の「再使用を消す特化」がなくなるので、岩撃砕の再使用削除の特化も変わる可能性がある(aLuckyRO の例に岩撃砕が出ていた。アップデート情報)\n\n---\n\n## 0-4. 11/16 の最新(韓国の改編とその手直し)(11/16)\n今週のチャンターの人気動画は少ない(英語では戦闘の映像だけ)。南米の Byzontt(スペイン語、11/11、1,600回)と madwolfTV(ポルトガル語、11/13、5,900回)、Anders(11/15、6.2万回)から。\n| 点 | 中身 |\n|---|---|\n| 今のビルド(Byzontt) | 岩撃砕を最初に Lv20(まず16)。パッシブは**風の約束が一番**(クリティカルが大きく上がるので、装備でクリティカルを探さなくてよい。要確認: 2章・0-5 では風の約束は「クリティカル ダメージ」、クリティカル(率)は鼓舞の呪文)、次に衝撃的中。スティグマは**不敗のマントラを最初に Lv20**(命中・クリティカル・クリティカル ダメージ・強打)、次に疾風の権能 |\n| 韓国の改編(madwolfTV) | **疾走のマントラがなくなる**。マントラの特化が4つ → 5つに。**百裂撃の「ガード・回避を無視」がなくなり**多段ヒットだけに → **命中をもっと積む必要**。岩撃砕の「必ずクリティカル」は**クリティカル +200** に(相手のクリティカル抵抗で落ちるので PvP で弱い)。回転撃も「ガード・回避を無視」がなくなる。突進撃破は無視のまま |\n| 韓国の手直し 11/14(Anders) | 岩撃砕・貫通砕 PvE ダメージ +7%。新しいスティグマ Tempest Call(日本語名は未確認)はボスダメージ増幅 → **武器ダメージ増幅 10.5%(Lv ごとに +0.5%)**。特化も上がった(完璧 4→10%、攻撃力 3→7%、強打 2→5%) |\n- グローバル版にいつ来るかは未確認\n\n## 0-5. 11/19 の最新(Rised のチャンターのガイド)(11/19)\nRised「チャンターのガイド: マクロ・スキルなど」(11/15、1,400回。今のグローバル版)。\n| 項目 | 中身 |\n|---|---|\n| 左クリック | 撃破砕 |\n| マクロに入れる | 快癒の呪文(特化2・4。デバフ解除と少しの回復)・打撃砕・**マルクタンの怒り**(気絶とダメージ。岩撃砕が出る回数が増える) |\n| 岩撃砕 | 一番の火力。Lv16 以上は**特化3・5**、Lv16 前は 3・4 |\n| スティグマ | **不敗のマントラを最初に Lv20**(ほかを Lv1 のままでも先に。「募集で Lv20 を求められる」)・マルクタンの怒り・**疾風の権能**(戦闘速度 +20%・再使用短縮 14秒。要確認: 3章は「20で自分の攻撃力+20%」。マクロに入れず、グロッキーのときなどに Q で)・守護の祝福(ガードの場面や、炎の神殿「難しい」では疾走のマントラに替える) |\n| パッシブの順 | 風の約束(クリティカル ダメージ)・攻撃準備(PvE・PvP ダメージ増幅、防御、命中)・鼓舞の呪文(クリティカル・完璧)・大地の約束(相手の PvE ダメージ耐性を下げる)・衝撃的中 |\n| 装備 | リングは2つとも岩撃砕(Lv20 のため)と撃破砕(Lv16 以上)。ネックレスは戦闘速度・威力・正確・クリティカル・攻撃力(ネックレスの戦闘速度は魂刻印ではなく副ステータス。成長とシステム 8章) |\n- 11/18 のパッチでルドラに「簡単」(入場 IL 2,800、復活無制限)。アビスポイント3倍は 12/16 まで(アップデート情報)\n\n## 1. スキル\n\n### 1-1. 優先順\n**Lv16: 岩撃砕 → 撃破砕 → 回転撃・百裂撃。Lv20: 岩撃砕 → 撃破砕 = 回転撃**(gigawhale・notXeon・Grobs 一致。Maddoshi・Screamheart は 岩撃砕 → 回転撃 → 撃破砕。12章)。PvP なら 岩撃砕 → 百裂撃 → 回転撃 → 快癒の呪文(notXeon 11/2。0-2。10/10 の版は 岩撃砕 → 快癒の呪文 → 回転撃)\n\n| スキル | 役割 | 目標 |\n|---|---|---|\n| **岩撃砕** | 主力。回転撃・マルクタンの怒り・打撃砕を使った直後の数秒だけ使える。Lv16 で再使用時間なし | 16 → 20 |\n| 撃破砕 | 左クリック。MP が増える。Lv16 で4段目[暴風砕] | 20 |\n| 回転撃 | 岩撃砕を開く。クリティカル ダメージ +15%(2回で+30%) | 20 |\n| 百裂撃 | 右クリックの基本(MP を使う) | 16 |\n| 打撃砕 | 岩撃砕を開く+気絶 | 12〜16 |\n| 突進撃破 | 移動。Lv12 で敵を倒すと再使用が戻る(狩りが速い) | 12 |\n| 震動砕 | 2つ目の移動(回避のあとに使える) | 8〜12 |\n| 快癒の呪文 | パーティーの回復 | 12〜16(PvP は 20。11/4 の上位20人は PvE でも 20。0-1) |\n| 疾風乱舞 | 10月の動画では「PvE では使わない(Lv16 でないと意味がなく、それでも火力が下がる)」。**11月は回復用に HP 吸収の特化で使う人が多い**(上位20人は Lv14〜16。0-1〜0-3。12章) | 12〜16 |\n| 波動撃・裂波撃 | PvE では使わない | |\n\n### 1-2. 特化(PvE)\n| スキル | Lv8〜12 | Lv16 | Lv20 |\n|---|---|---|---|\n| 岩撃砕 | 3 確定クリティカル、4 連続スキル[貫通砕] | 5 再使用時間削除(**最重要**)。3+5(Maddoshi・Rised)か 4+5(Screamheart)。木人で比べる(12章) | 3+4+5 |\n| 撃破砕 | 2 HP 吸収、3 多段ヒット+50% | 4+5(**4 回転撃の再使用 −1秒は必ず**、5=[暴風砕]) | 3+4+5 |\n| 回転撃 | 1 再使用 −5秒、3 対象が少ないほど+20% | 1+5(5=確定クリティカル)。Maddoshi は 3+5(12章) | 1+3+5 |\n| 百裂撃 | 3 対象が少ないほど+12% | 3+5(5=ガード・回避無視。韓国版の改編ではなくなる。グローバル版は今のまま。0-4) | |\n| 打撃砕 | 3 移動可能 | 3+4(4=スキル速度+30%) | |\n| 突進撃破 | Lv12 で 4 敵を倒すと再使用初期化 | | |\n| 震動砕 | 2 射程+10m(突進撃破と同じ射程) | 2+3 | |\n| 快癒の呪文 | 1 連続+1回と持続回復、Lv12 で +4 HP5% | 1+5(5=再使用 −3秒) | PvP は 2 デバフ解除 |\n\n---\n\n## 2. パッシブ\n| 優先 | パッシブ | 理由 |\n|---|---|---|\n| 1 | **風の約束**(1番は人で違う。12章) | クリティカル ダメージ増幅。主力が確定クリティカルなので一番効く。1レベルで約0.44%(攻撃準備・衝撃的中の2倍以上。Antochi が韓国の計算を紹介) |\n| 2 | 攻撃準備 | PvE ダメージ増幅・防御・命中 |\n| 3 | 衝撃的中 | 強打 |\n| — | 保護陣 | 攻撃10回でパーティーにバリア。上げなくてよいが仕組みは知っておく |\n| — | 十字防御、生存意志 | PvP・守り |\n\n---\n\n## 3. スティグマ\n| スティグマ | 目標 | 理由 |\n|---|---|---|\n| **不敗のマントラ** | **20 が最優先** | パーティー全体の PvE ダメージ増幅・耐性。20で強打+5% |\n| **疾風の権能** | 5 → 20 | 5で再使用 −30秒。6〜15 はほぼ差がない。20で自分の攻撃力+20%、仲間+10%(0-5 の Rised は「戦闘速度 +20%」と言う。要確認) |\n| マルクタンの怒り | 1〜10(Maddoshi は 1。12章) | 岩撃砕を開く(連打用)。PvP は 15 で回復阻害 |\n| 守護の祝福 | **15**(15未満なら入れない) | 15で風の約束が1.5倍。2分持続 |\n| 疾走のマントラ | 序盤・速さ重視・地上の PvP | 移動速度でパーティーが攻撃を避けやすい(韓国版の改編ではなくなる。グローバル版は今のまま。11/14 の手直しのあとも韓国でなくなったままかは要確認。0-4) |\n\n- 入れ替え: グロッキーが要る → 滅火、ガードが効くボス(ルドラなど)→ 集中防御、パーティーを守る → 遮断の権能、回復 → 快癒の手(15でデバフ5個解除)\n- 序盤は粉砕撃(防御 −30%)も強い(Grobs)\n- **クレリックの一部のスキルと重ならない**: 不敗のマントラとクレリックの保護の光は、同じレベルならマントラが優先\n\n---\n\n## 4. マクロと回し方\n### 4-1. マクロ(右クリック)\n| 段 | 中身(上から順に試す) |\n|---|---|\n| 1 | **岩撃砕 → 回転撃 → マルクタンの怒り → 打撃砕**(4つを同じ段に) |\n| 2 | 百裂撃 |\n| 別(任意) | 守護の祝福(持続と再使用が2分なので入れてよい) |\n- マクロの中身は人で違う(Gear Point は岩撃砕 → マルクタンの怒りの2つだけ、Rised は快癒の呪文・打撃砕・マルクタンの怒り。12章)\n- 仕組み: 引き金の技を使う → 岩撃砕が使えるようになる → マクロが岩撃砕に戻る → 次の引き金…と自動で回る\n- notXeon はマルクタンの怒りを外し、岩撃砕が止まったときに手で押す\n- 人形での最大火力の計測では、守護の祝福をマクロに入れると5〜10%下がることがある(ping で崩れる)。普段は入れてよい(gigawhale)\n\n### 4-2. 回し方\n1. 疾風の権能でパーティーを強化(マルクタンの怒りを先にすると、それも強化される)\n2. 突進撃破で飛び込む → 左右クリックを押し続ける\n3. 減った人がいたら快癒の呪文\n- 料理・巻物: 速度・勇気の巻物、パワーシャードは周回でも使う。高い料理(攻撃力+25 など)は大事なときだけ(gigawhale)\n\n---\n\n## 5. 装備の刻印(魂刻印)\n\n### 5-0. 上位20人の部位ごとの刻印(NotMeter 11/8 8時47分。スキルの行つき)(11/8)\n数字は20人のうち何%か。「技:」はスキルの行。行の付きやすさは成長とシステムのまとめ 8章「魂刻印で付く行と確率」。\n| 部位 | 全員(95〜100%) | 多い(50〜90%) | 少ない |\n|---|---|---|---|\n| ワンド(武器) | 威力・攻撃力・武器ダメージ増幅・戦闘速度・多段ヒット的中・ダメージ増幅 | 正確 55% | 技: 回転撃 5% |\n| ガーダー | 同じ6つ | 正確 50% | 技: 撃破砕 5% |\n| ヘルム | **技: 攻撃準備・風の約束・衝撃的中**、強打・攻撃力増加・攻撃力 | | 受ける治癒量 35%・技: 鼓舞の呪文 25%・大地の約束 20% |\n| ショルダー | 技: 同じ3つ、攻撃力・クリティカル ダメージ増幅 | 技: 大地の約束 55%・鼓舞の呪文 50% | |\n| トップス | 技: 同じ3つ、攻撃力・ダメージ増幅 | 技: 鼓舞の呪文 60%・大地の約束 50% | |\n| ボトムス | 技: 同じ3つ、攻撃力・完璧・攻撃力増加 | ダメージ耐性 80% | |\n| グローブ | 技: 同じ3つ、攻撃力・戦闘速度・完璧 | | 技: 鼓舞の呪文 25% |\n| シューズ | 技: 同じ3つ、移動速度・攻撃力・完璧 | | 技: 鼓舞の呪文 20% |\n| マント | 技: 風の約束・衝撃的中、完璧・強打・攻撃力増加・攻撃力 90% | 技: 攻撃準備 85% | |\n| ネックレス | **技: 鼓舞の呪文・攻撃準備・風の約束・衝撃的中・大地の約束 95%**、攻撃力 | 命中 60% | クリティカル 20%・技: 生命の祝福 10% |\n| イヤリング | 技: 同じ5つ、攻撃力 | 命中 75% | 技: 生命の祝福 25%・クリティカル 15% |\n| リング | **技: 撃破砕・岩撃砕・回転撃・快癒の呪文 95%**、攻撃力 | 技: 突進撃破 80% | 技: 百裂撃 45%・疾風乱舞 45%、クリティカル 20% |\n| ブレスレット | 時間・正義・知恵・破壊・幻想 | 空間 60% | 死 25% |\n| ブローチ | 威力・正確 | HP 90%・命中 85%・クリティカル 80% | 意志 25%・知識 20% |\n| 印章 | PvE 攻撃力・ボス攻撃力・最大攻撃力・追加攻撃力・封魂石の追加ダメージ 95% | クリティカル攻撃力 90% | |\n- **防具・アクセサリーにクリティカルをほとんど付けない**(岩撃砕・回転撃が確定クリティカルのため)。防具に付けないのはテンプラーも同じ(テンプラー 5-4 の上位20人)。**アクセサリーにも付けないのがテンプラー(ネックレス 85%)・レンジャーと違う所**。ネックレス・イヤリングはスキルの行が5つ(付ける行の数が多い唯一の部位)\n- 11/4 との違い: スキルの行が見えるようになった以外はほぼ同じ\n\n### 5-1. 能力値の順(Antochi 10/23。韓国の検証とグローバル版の上位を元に)\n**攻撃力 \u003e 強打 \u003e 武器ダメージ増幅 \u003e 前方/後方ダメージ・ダメージ増幅・クリティカル ダメージ増幅(ほぼ同じ)\u003e 戦闘速度(90.5%まで)\u003e 完璧(70〜80%まで)\u003e クリティカル \u003e 待ち時間短縮**\n\n| 能力値 | なぜその順か |\n|---|---|\n| 攻撃力 | ほぼ全部位に付き、ボスの抵抗で削られない。回復量も上がる(生命の祝福) |\n| 強打 | ボスの**強打抵抗**(韓国の難しいボスで30〜40)を超えるまでほぼ効かない。超えると全部効く。自分の強打の合計を見て判断 |\n| 戦闘速度 | 少しずつではなく**区切りで速くなる**。岩撃砕は 82.5%、貫通砕は **90.5%** が目標(韓国の検証。グローバル版では未検証) |\n| クリティカル | 岩撃砕と回転撃は確定クリティカル。上限50%もあり、ほぼ要らない |\n| 命中 | 後ろから殴ればボスのガードを無視できるので、足りていれば要らない |\n\n| 部位 | 狙う物 |\n|---|---|\n| ワンド・ガーダー | 武器ダメージ増幅、戦闘速度、ダメージ増幅、威力(PvP は 戦闘速度 → ダメージ増幅 → 威力 → 正確 → 状態異常的中) |\n| ヘルム・マント | 強打、攻撃力増加 |\n| ショルダー | 強打、クリティカル ダメージ増幅 |\n| トップス | ダメージ増幅(+完璧) |\n| グローブ | 戦闘速度(+完璧) |\n| ボトムス・シューズ | 完璧(シューズは移動速度) |\n| リング | スキル: **岩撃砕・撃破砕**(次に回転撃) |\n| イヤリング・ネックレス | 攻撃力+**風の約束**(ネックレスは戦闘速度も。MFIA。ただし戦闘速度は魂刻印ではなく副ステータス。成長とシステム 8章) |\n- 魔石: ダメージ増幅系は約200回に1回しか出ない。出るまで攻撃力で埋める\n- 武器: 炎の神殿の武器は射程+2m(PvP や一部のボスで便利)、製作武器は刻印5行で最終的に強い(notXeon)\n\n## 6. アルカナ\n| カード | 能力値の種類 | 狙うスキル |\n|---|---|---|\n| 聖杯 | 活力(時間=戦闘速度) | 岩撃砕を指定。風の約束・衝撃的中が付けば良い |\n| 羊皮紙 | 生命(HP と再生) | **岩撃砕・撃破砕・回転撃・突進撃破**(波動撃・裂波撃は外れ) |\n| コンパス | どちらでも | 快癒の呪文・打撃砕・百裂撃・震動砕(衝撃解除・疾風乱舞は外れ) |\n| 鐘 | **魔力**(破壊=攻撃力) | 攻撃準備 → 生命の祝福 → 生存意志(激怒の呪文は外れ) |\n| 鏡 | **魔力**(知恵=強打)。PvP は幻想(Screamheart は「魔力は鐘だけ」。12章) | **風の約束 → 衝撃的中**(十字防御は外れ) |\n- 神の能力値: **知恵 \u003e 破壊・時間 \u003e 幻想 \u003e 正義 \u003e 空間**(Antochi)。**グローバル版は1点=0.1%**(韓国の攻略は0.2%で書かれているので半分に読む)\n- 鏡は知恵(強打)と幻想(待ち時間)のどちらか。韓国の人形の検証では、待ち時間が増えても強打の減少を取り戻せなかった → 強打がボスの抵抗を超えているなら知恵\n- 上位のグローバル版チャンターは 時間 約76・破壊 約75・知恵 約51(Antochi)\n- Lv20 にしたスキルの20を超えた分は無駄。カードとリングで振り分ける(notXeon)\n\n## 7. 種族理解度\n| 枠 | おすすめ |\n|---|---|\n| 4番 | クリティカル ダメージ増幅 か ダメージ増幅。**特殊ペットの4番は強打** |\n| 4番(Krix 11/2、種族ごと) | 知性 = PvE ダメージ増幅かクリティカル ダメージ増幅、野性 = PvE ダメージ増幅か武器ダメージ増幅、自然 = 多段ヒット的中、変形 = PvE ダメージ増幅、特殊 = 強打 |\n| ほか | 攻撃力(Krix も 1・5番は攻撃力)。攻撃力が付かない枠はパワーシャードのダメージ(gigawhale・notXeon) |\n| PvP(MFIA) | 4番はダメージ増幅3%・前方ダメージ増幅3%など、ほかは攻撃力・命中・HP |\n- 韓国のチャンターは、強打用と後方ダメージ用のページを分け、ボスで切り替える(Antochi)\n\n## 8. ディーヴァニオン(Antochi 10/14。グローバル版の盤の数字から)\n| 順 | 取るもの | 点 | 累計 |\n|---|---|---|---|\n| 1 | 岩撃砕・撃破砕・回転撃を Lv12 に | 55 | 55 |\n| 2 | 1枚目の戦闘速度の角 | 16 | 71 |\n| 3 | 2枚目のダメージ増幅の角 | 10 | 81 |\n| 4 | 1枚目の待ち時間短縮の角 | 27 | 108 |\n| 5 | 主要3つを +4 に | 35 | 143 |\n| 6 | 百裂撃・打撃砕・快癒の呪文・突進撃破を Lv12 に | 40 | 183 |\n| 7 | 風の約束・衝撃的中・攻撃準備 | 16 | 199 |\n| 8 | 3枚目のクリティカル ダメージ増幅の角(岩撃砕が確定クリティカルなので得) | 18 | 217 |\n| 9 | 攻撃力・クリティカルのノード | 80 | 約300 |\n| 10〜 | 4枚目の多段ヒットの角 → 衝撃的中・大地の約束 +4 → 百裂撃・快癒の呪文 +4 → 波動撃 Lv12 → 攻撃力・クリティカル → HP | | 約490 で全部 |\n- 取らない(10/14 の時点): 震動砕(2つ目の移動)、疾風乱舞、裂波撃、衝撃解除、十字防御、保護陣、生存意志。11/4 の上位20人は震動砕 13〜15・疾風乱舞 14〜16 まで上げている(0-1)\n- Screamheart(11/8)は角より先に主力スキルの点を全部の盤で取る(0-3。12章)\n- 振り直しは1ノード500ギーナなので、間違えても安い\n\n## 9. 狩り\n- 突進撃破 Lv12(倒すと再使用が戻る)で、飛び込む → マクロ → 次へ、と敵から敵へ速く回れる(Moxsy・Grobs・Şükrü・Krix)\n- サブキャラにも向く(早くから強い・自分で回復できる。Moxsy)\n\n## 10. 翼・称号(notXeon)\n| 種類 | PvE | PvP |\n|---|---|---|\n| 翼 | 闇の帳の翼 → 森の精霊の翼。シーズンショップのタリスラの翼(待ち時間短縮)が一番という人が多い(レンジャー・クレリック・テンプラーのまとめ。notXeon の 10/18 の動画では「将来は」だった) | Brawler の翼(アビスポイント 80万。PvP ダメージ増幅・状態異常的中と抵抗。11/2)、Telesto の翼(待ち時間短縮。タリスラの翼と同じ物かは要確認) |\n| 称号 | 種族のしがらみから逃れた(Unbound by Genus)、Saint of Altgard(ガード。日本語名は未確認)、Executioner of High Command(フィールドボス。日本語名は未確認) | Treading on White Wings(300人倒す。日本語名は未確認) |\n- 「種族のしがらみから逃れた」は 11/20 に NotMeter の日本語表示で確認。森の精霊の翼・タリスラの翼はほかのまとめの表記。闇の帳の翼は仮。そのほかの英語の翼・称号は日本語名は未確認\n\n## 11. PvP(notXeon 10/10。11/2 の版は 0-2: スティグマは 不敗 → 守護の祝福 15 → 集中防御 → マルクタンの怒り、Lv20 は 岩撃砕 → 百裂撃 → 回転撃 → 快癒の呪文)\n| 項目 | 内容 |\n|---|---|\n| 大事なこと | **行動不能(気絶・転倒など)に「だんだん短くなる」仕組みがない**ので、つなげれば何回でも決まる |\n| 流れ | 打撃砕(Lv16 で気絶確率+20%)で相手に**衝撃解除を使わせる** → 衝撃解除が使えない約45秒の間に、ほかの気絶技でつないで倒す。相手のバフ欄で衝撃解除の印を見る |\n| 特化 | 気絶の時間と確率が付く物に替える(打撃砕・震動砕・波動撃)。突進撃破は 1=衝撃系抵抗 −20% かガード・回避無視。回転撃は 封印(4)も強い |\n| 衝撃解除 | Lv8 で HP 回復、Lv12 で連続スキル(気絶もある) |\n| 1対1 | 不敗のマントラ、マルクタンの怒り、粉砕撃(防御 −30%)、守護の祝福(15)。地上や闘技場は粉砕撃 → 疾走のマントラ |\n| 集団 | 不敗のマントラ、快癒の手、遮断の権能、疾風の権能。時空の亀裂など地上なら遮断の権能 → 疾走のマントラ |\n| 使わない | 滅火(射程4mで止まる)、結界の呪文(HP が10%未満にならないだけ)、強襲衝撃(気絶30%) |\n\n## 12. 意見が割れていること\n| 点 | 意見 |\n|---|---|\n| マルクタンの怒り | マクロに入れる(Grobs・gigawhale)/手で押す(notXeon) |\n| 2番目の Lv20 | 撃破砕(gigawhale・notXeon の PvE)/回転撃(Maddoshi・Screamheart。岩撃砕 → 回転撃 → 撃破砕) |\n| 守護の祝福 | 15 で必須(gigawhale・notXeon)/無理なら粉砕撃か疾走のマントラ |\n| 突進撃破 | Lv12 で再使用初期化(Krix・1-1)/Lv1 で特化なし(Gear Point) |\n| マルクタンの怒りの Lv | 5〜10(3章)/1 でよい(Maddoshi。岩撃砕を開くだけ) |\n| マクロの中身 | 岩撃砕・回転撃・マルクタンの怒り・打撃砕を同じ段(4-1)/岩撃砕 → マルクタンの怒りの2つだけ(Gear Point)/快癒の呪文・打撃砕・マルクタンの怒り(Rised) |\n| 岩撃砕の Lv16 の特化 | 3+5 = 連続スキルを外す(Maddoshi・Rised)/4+5 = 確定クリティカルを外す(Screamheart)。クリティカル率で変わるので木人で比べる |\n| 回転撃の Lv16 の特化 | 1+5(1-2)/3+5(Maddoshi) |\n| パッシブの1番 | 風の約束(Antochi・Byzontt・Rised)/衝撃的中(Gear Point)/攻撃準備・衝撃的中(Screamheart) |\n| 疾風乱舞 | PvE では使わない(10月)/回復用に HP 吸収で使う(Gear Point・Screamheart、上位20人は Lv14〜16) |\n| 十字防御 | PvE なら上げない(Screamheart)/PvP なら上げる(notXeon) |\n| アルカナの魔力 | 鐘と鏡の両方(6章、Antochi)/鐘だけ(Screamheart) |\n| ディーヴァニオンの順 | 角を早く取る(Antochi 10/14。8章)/主力スキルの点を全部の盤で先に。難しいなら PvE ダメージ増幅 → 角(Screamheart 11/8) |\n\n## 13. 名前の対応(英語 → 日本語)\n| 種類 | 対応 |\n|---|---|\n| アクティブ | Dark Crush=岩撃砕(連続スキル Piercing Strike=貫通砕)、Onslaught=撃破砕(4段目=暴風砕)、Spinning Strike=回転撃、Incandescent Blow=百裂撃(連続=破裂撃)、Impactful Crush=打撃砕、Rushing Smash=突進撃破、Tremor Crush=震動砕、Recuperation=快癒の呪文、Gust Rampage=疾風乱舞、Wave Blow=波動撃、Heat Wave Blow=裂波撃、Defiance=衝撃解除 |\n| パッシブ | Wind\u0027s Promise=風の約束、Attack Preparation=攻撃準備、Impact Hit=衝撃的中、Protection Circle=保護陣、Crossguard=十字防御、Blessing of Life=生命の祝福、Inspiring Spell=鼓舞の呪文、Raging Spell=激怒の呪文、Earth\u0027s Promise=大地の約束、Survival Willpower=生存意志 |\n| 称号 | Unbound by Genus=種族のしがらみから逃れた(11/20 NotMeter の日本語表示で確認)。Saint of Altgard・Executioner of High Command・Treading on White Wings は日本語名は未確認 |\n| スティグマ | Undefeated Mantra=不敗のマントラ、Power of the Storm=疾風の権能、Marchutan\u0027s Wrath=マルクタンの怒り、Guardian Blessing=守護の祝福、Sprint Mantra=疾走のマントラ、Fracturing Blow=粉砕撃、Focused Defense=集中防御、Healing Touch=快癒の手、Impeding Authority=遮断の権能、Obliterate=滅火、Ensnaring Mark=結縛の烙印、Barrier Spell=結界の呪文、Assault Shock=強襲衝撃 |\n\n## 14. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| Screamheart「This Chanter Build MELTS BOSSES in Aion 2!」(NszPzsh4CIo) | 11/6 | 6.3万回。PvE のスキル・パッシブ・ディーヴァニオン(0-3) |\n| notXeon「The ONLY ENDGAME Chanter PVP STAT Guide」(b0Lt6Nc2phk)・「… PVP SKILL Guide」(0Bbzmm3mh8I) | 11/2 | 1.7万回・1.2万回。PvP の能力値・ガードのしくみ・スキル・スティグマ(0-2) |\n| Gear Point「The Secret to Chanter DPS: 31% Party Damage with Weak Gear」(QcmLgUtx55w) | 11/2 | 3,000回。装備が弱い人の PvE(0-2) |\n| Viles「AION 2 midseason PVE tier list」(eTj6Yy8kfb8) | 11/2 | 1万回。職業の強さの順(0-2) |\n| gigawhale「世界ランク1位のチャンターが教えるビルド構築術」(Y1KYRLH3xIM) | 10/20 | 終盤の DPS ビルド、スティグマ、マクロ、種族理解度 |\n| Antochi「Chanter Stat Priority」(eHyp4sXGOow) | 10/23 | 能力値の順、戦闘速度の区切り、神の能力値 |\n| Antochi「Chanter Daevanion Guide」(XTqRpivnL2Y) | 10/14 | ディーヴァニオンの振り順 |\n| notXeon「2500+ Chanter Guide」(enxMRSkU8Qg)、「PvP Skill Guide」(RTSmajnBzw4) | 10/18、10/10 | Lv20 の選び方、アルカナ、PvP、翼・称号 |\n| Grobs「チャンターの PvE 完全攻略ガイド」(2qTjfkuzdj4) | 10/5 | 序盤〜中盤、マクロの仕組み |\n| MFIA「Global Chanter PvP Guide」(OPx39VzNJHQ) | 10/18 | PvP の部位ごとの刻印、種族理解度 |\n| Chacal「職業ティアリスト」(SGINL3w6yf4、ポルトガル語) | 10/27、1.3万回 | 職業の強さの評判 |\n| Şükrü「チャンターガイド 220時間」(uunaou5Bk-8) | 10/27、5,356回 | 狩り、マクロ、神石 |\n| NotMeter「装備・スキル構成」チャンター上位20人 | 11/4 | 0-1 スキル・特化・スティグマ・パッシブ・アルカナ・刻印 |\n| Maddoshi「Chanter: Complete PvE \u0026 Progression Guide」(dOhJiPgXKs0) | 10/29、1.9万回 | 0-1 特化の段ごとの入れ替え、スティグマ4枠、パッシブ |\n| Krix Domi「How To Play Chanter Like A Pro」(zj8hHBP_1jY) | 11/2、1.8万回 | 0-1 刻印、種族理解度、ルドラの難しい |\n"},{"id":"cleric","tab":"クレリック","title":"クレリック まとめ","file":"クレリック_まとめ.md","md":"# クレリック まとめ(2026-11-20 最新)\n\n10/23 の「レンジャー・チャンター・クレリックのビルド」のクレリックの部分を土台に、10/4〜10/23 の動画9本で調べ直した。スキル名・特化の文は questlog.gg の日本語版データの正式名。\nそのあと新しい動画を少しずつ足した。足した所には足した日を「(10/25)」「(11/17)」のように書いた。**食い違うときは日付の新しいほうが正しい**。\n特化は「Lv8で1つ、Lv12で2つ、Lv16で2つ(入れ替え可)、Lv20で3つ」。表の番号は特化の並び順(1〜5)。\n\n## 0. 今の結論(まずここだけ見る)\n| 項目 | 結論 |\n|---|---|\n| 仕組み | **断罪**がダメージの約5割。断罪は苦痛の連鎖が付いた敵にだけ使え、クリティカルで再使用が戻る。スティグマ**大地の懲罰**(Lv5)で断罪が確定クリティカル → 連打できる |\n| 最優先 | **大地の懲罰を Lv20**(効果時間+10秒)、スキルは**断罪を Lv20** |\n| スティグマ | 上位20人(11/17)は **大地の懲罰・増幅の祈り・高潔の気・保護の光**(4つとも Lv20)。チャンターがいるときは保護の光を替える(保護の光は不敗のマントラと効果がかぶる)。召喚復活は野良で入れる人もいるが、上位20人では1人だけ(11章) |\n| 回し方 | 増幅の祈り → 霹靂(最大まで溜める)→ 大地の懲罰 → 苦痛の連鎖 → 左クリックとマクロを押し続ける(NoBS 10/13。4-1)。大地の懲罰と苦痛の連鎖を**そろえて**使う。霹靂から始めるかは意見が割れている(下の行と11章) |\n| **10/25 の流れ** | **大地の懲罰が Lv20 になったら、ボス戦では審判の雷をマクロから外す**(Th3Ruthless・Rised・Welps・BoredAF がそろった)。外す時期の目安は人によって違う(大地の懲罰 Lv20 / 断罪 Lv20 / クリティカル 1,300〜1,400。11章)。審判の雷と稲妻乱射は雑魚狩り用だけ(4-5)。Th3Ruthless は「霹靂から始めない。断罪が止まったときだけ霹靂」 |\n| アルカナで Lv20 にする順(10/25) | 断罪 → 神聖な気 → 大地の裁き → 苦痛の連鎖 → 霹靂(Th3Ruthless)。Rised は 断罪 → 霹靂(16以上あれば十分) |\n| 回復役として | 死んだ人はすぐ起こす。パーティーの枠を画面の中央寄りに置くと気づきやすい(MR4KTV) |\n| 強い時期 | 早い。大地の懲罰 Lv5+断罪 Lv12 だけで、装備なしでも上位の火力(Moxsy)。サブキャラにも向く |\n| 弱点 | 範囲攻撃が弱い(断罪は1体にしか使えない) |\n| **10/31 の流れ** | 職業の強さの評判(Chacal 10/27、ブラジル): **一番楽な職業**。パーティーに入りやすく、ソロの内容も強く、PvP でも硬く役に立つ(戦闘中に味方を起こせる) |\n| **11/16 の最新** | 断罪を Lv20、大地の懲罰の間は断罪だけ連打(EPIC PLK)。命中は PvE 込みで約1,200、戦闘速度と再使用短縮が大事(Itsmitchyo)。韓国の手直しで断罪 +15%・霹靂 +10%(韓国版だけ。グローバル版にはまだ来ていない。0-4) |\n| **場面ごとの設定(11/17)** | PvE・PvP・狩りのスキルの特化・スティグマ・マクロを1つの表に(0-5)。上位20人はスティグマが 大地の懲罰・増幅の祈り・高潔の気・保護の光、特化は断罪 2・4・5、霹靂 3・5(1-3) |\n\n---\n\n## 0-1. 11/4 の最新(上位20人の実際と今週の動画)(11/4)\nNotMeter「装備・スキル構成」のクレリック上位20人(11/4 6時47分の集計)と、Lucia(上位のクレリック、10/29 時点、3.6万回)の動画。\n\n| 項目 | 上位20人 | 動画・補足 |\n|---|---|---|\n| スキルのレベル | (11/17 の 1-3 では大地の裁き 14〜16・パッシブ 21〜26 と低く出ている。装備・アルカナ込みかどうかの違いの可能性。要確認)断罪・大地の裁き・霹靂・神聖な気 **20**、稲妻乱射・審判の雷・再生の光 16、快癒の光輝 16〜18、治癒の光 15〜16、苦痛の連鎖・弱化の烙印・衝撃解除 14 | Lucia はリングとアルカナで 断罪・快癒の光輝 を Lv20 にしている途中 |\n| 断罪 | 2 対象が少ないほど +12% 100%・4 クリティカルで再使用 100%・5 必ず多段ヒット 95% | |\n| 大地の裁き | 2・3・4 が全員(放電の発動率・多段ヒット・霹靂の再使用 −7秒) | |\n| 霹靂 | 3 スキル速度・4 対象が少ないほど・5 確定クリティカル が全員 | |\n| 神聖な気 | 3 発射速度・4 持続 +3秒 100%・5 再使用 −10秒 95% | |\n| 審判の雷 | 2 対象が少ないほど・5 天罰1回追加 が全員 | |\n| 苦痛の連鎖・弱化の烙印 | 苦痛の連鎖 2 持続ダメージ +3秒・4 ダメージ耐性 が全員。弱化の烙印 2 防御 −15% 100%・4 PvE ダメージ増幅 90% | |\n| 回復の技 | 再生の光 4 移動速度 100%・5 ダメージ耐性 79%。治癒の光 1 連続+2回・4 HP2% が 85%。快癒の光輝 5 HP5% 100%・2 連続+1回 83% | |\n| **マクロ** | | **断罪のマクロに審判の雷を入れたほうが、断罪だけを連打するより火力が出た**(1分の比べを5回、約20万・1秒あたり3,000〜4,000 の差)。断罪だけの形が勝つのは、クリティカルが 1,300〜1,400 あり、苦痛の連鎖をずっと保てる(待ち時間短縮 約30%)ようになってから(Lucia。台湾版はその段階) |\n| スティグマ | **13個とも Lv20 以上**。大地の懲罰・増幅の祈り 25、高潔の気 23、保護の光・救援 20〜25(11/17 の 1-3 は 20 で、数え方が違う可能性あり。要確認) | 1人のとき: 大地の懲罰 20・高潔の気 20・増幅の祈り 20・保護の光 10。チャンターがいるときは保護の光の代わりに ユスティエルの権能(回復の助け)、復活が要るなら 召喚復活(Lucia) |\n| パッシブ | 大地の恩恵 34〜35、神の恩恵 33〜35、治癒力強化・不死の帳 16〜20、暖かな加護 16〜19 | |\n| アルカナ | 聖杯は全員「守護の聖杯」(正式名は要確認)。大地の恩恵(Lv3)・神の恩恵(Lv3)が 100%、大地の裁き・霹靂 65%、断罪 50% | Lucia: 聖杯 = 快癒の光輝・審判の雷・断罪、羊皮紙 = 断罪+3・霹靂+2・大地の裁き+3、コンパス = 審判の雷・神聖な気を狙う、鏡 = 大地の恩恵。セットは活力2+魔力2 |\n| 刻印 | (11/4。部位ごとの新しい表は 5-0)武器・ガーダーは 威力・攻撃力・武器ダメージ増幅・戦闘速度・多段ヒット的中・ダメージ増幅 が全員(前方攻撃力 70〜75%)。ヘルム 強打・攻撃力増加・受ける治癒量 85%。ショルダー クリティカル ダメージ増幅(クリティカル 65%・命中 60%)。ボトムス 完璧・攻撃力増加・ダメージ耐性 が全員。ネックレス・イヤリングは 命中・攻撃力・クリティカル が 90〜100% | Lucia は PvP 寄りで、防具にガードを集めている(ガード 1,086、称号込みで約1,300)。アクセサリーは 大地の恩恵・神の恩恵、イヤリングは移動速度・威力・正確。リングはスキルの行(断罪・快癒の光輝・大地の裁き)と威力 |\n| 魔石 | 前方ダメージ増幅 100%(合計168)、武器ダメージ増幅 50%。霊石は前方 100%・武器 75%・クリティカル ダメージ増幅 55% | |\n| 能力値(Lucia) | | 命中は PvE 命中込みで 1,300〜1,400、クリティカルはバフ込みで 900〜1,000、戦闘速度 40%(巻物で 50%) |\n\n## 0-2. 11/6 の最新(今週の動画)(11/6)\nViles の職業の強さの順(11/2、1万回)と Ynoki「スティグマのかけらの集め方とクレリックの最適なスティグマ」(11/2、1,500回)。今週はクレリックの英語の解説動画が少なく、Krix Domi のルドラ世界最速(11/5、9,400回)は字幕がなかった。(11/6)\n\n**職業の強さ(Viles)**: **S**。終盤(戦闘力 20万)はボスに 10万以上の DPS を出しつつ、補助・ボスの防御を下げる技・蘇生(「一番強い再使用技」)がある。\n\n**場面ごとのスティグマ4つ(Ynoki)**\n| 場面 | 4つ | 補足 |\n|---|---|---|\n| PvE の回復役 | 保護の光・免罪・ユスティエルの権能・生命の権能 | 免罪と ユスティエルの権能は Lv5 まで(再使用短縮・バリアの追加)。**チャンターの不敗のマントラと保護の光は効果がかぶる(同時には効かない)**ので、チャンターがいるときは保護の光を救援か召喚復活に替える |\n| 1人・火力 | 大地の懲罰・増幅の祈り・高潔の気・保護の光(か免罪) | 苦痛の連鎖 → 大地の懲罰(Lv5 で確定クリティカル)→ 断罪。断罪 Lv12 ならクリティカルのたびに再使用が戻り、連打できる |\n| 集団の PvP(補助) | 保護の光・免罪(全員の拘束を解く)・ユスティエルの権能・救援 | 救援は Lv15 で一番 HP の低い味方にも、Lv20 で気絶・転倒中にも使える |\n| 1対1・火力の PvP | 大地の懲罰・高潔の気・増幅の祈り・保護の光(か破滅の声) | 破滅の声は Lv1 から相手の受ける治癒と薬の回復 −60%(20秒)、Lv10 でバリアを消す |\n\n**スティグマのかけらの集め方(Ynoki。全職業共通)**\n| 所 | 中身 |\n|---|---|\n| 必要な数 | 1つを Lv20 にするのに 75個(Lv1〜5 は1個ずつ、Lv16〜20 は8個ずつ)。Lv45 までに約30個もらえる。**まず大事な技を Lv5 に**してから、1つを 16→20 に |\n| アビスポイントの店(成長のタブ) | 1段目 50個 = 1個 1万 AP、2段目 50個 = 1.5万、3段目 2万、4段目 2.5万。**1・2段目を先に**、4段目は急がない。AP は 聖物の攻城戦(参加するだけでも多い)・日課の任務(1回 約1,000)・闘技場・補給の依頼・相手側の封印ダンジョン(1回 約1,000)で |\n| 悪夢の店 | 1キャラ 35個(1個 1,500 枚) |\n| シューゴフェスタの店 | 1キャラ 35個(1個 300 枚) |\n| 今後 | 覚醒戦で「不安定なかけら(仮)」が出て、変換でかけらになる予定 |\n\n## 0-3. 11/8 の最新(今週の人気動画)(11/8)\n23KCO「一番のクレリックのマクロ(上級者の DPS)」(11/2、3.9万回。今週のクレリックで一番人気)、Antochi「回しは回復を先に、大地の懲罰を切らさない(グローバル版)」(11/4、7,700回)。\n\n**グローバル版で一番多い間違い(Antochi)**\n| 点 | 中身 |\n|---|---|\n| 韓国の回しをそのまま使う | 韓国版は大地の懲罰が**切れない**(断罪が全部クリティカル → 再使用が戻る)。そのためには再使用短縮 約33% が要る。**グローバル版で今集められるのは 18〜20%** なので、大地の懲罰に切れ目ができる |\n| スティグマ | 大地の懲罰・増幅の祈り・保護の光・高潔の気(グローバル版の上位のクレリックの PvE)。超越では高潔の気を免罪(全体回復+デバフ解除)に。4つとも 20、大地の懲罰を最初に(Lv20 で +10秒) |\n| 同時に使えるときの順 | 回復が要るなら回復 → … → 断罪(使えるたびに)→ 霹靂(溜めきる。ただし回復が要りそうなら溜め始めない)→ 神聖な気(8秒自分で攻撃するので断罪の時間を食わない)→ 増幅の祈り・高潔の気・弱化の烙印は再使用ごとに手で |\n| 窓 | グロッキーで大地の懲罰が早く戻る。大地の懲罰の「大地の祝福」はパーティー全員に付くので、遅れると全員の損。増幅の祈りの間は回復も増える(治癒力強化) |\n| 稲妻乱射 | 韓国ではグロッキーの間、専用のキーで押し続ける |\n\n**23KCO のマクロ(戦闘速度 42.9%、巻物で 52.9%)**\n| 点 | 中身 |\n|---|---|\n| 特化 | 弱化の烙印 2・4、神聖な気 3・5(Lv16 前は 3・4)、苦痛の連鎖 2・4。再生の光は**防御 +5・移動速度 +5** の特化で、ずっと出してパーティーを強くする。断罪は手で撃つのでクリティカルの特化(マクロに入れるならスキル速度)。Lv20 で +30% スキル速度(断罪の特化 2・4・5 にスキル速度はないので、霹靂の 3 の話かもしれない。要確認) |\n| 回し方 | 自分にバフ → 霹靂を溜める → 左クリックを押しながら大地の懲罰 → **右クリックを押して断罪を連打**。断罪が終わったら左クリックに戻る |\n| 審判の雷 | 「火力が落ちる」と言われるが、このマクロでは大地の懲罰の間は審判の雷を押さないので落ちない |\n| アルカナ | 鏡・鐘の組ではなく**鐘**(破壊 = ダメージ)。聖杯(活力)、ほかも活力 |\n| 刻印 | 5-0 を参照(ガーダーの多段ヒット的中の話) |\n\n**韓国・台湾の大改編(韓国 11/11 開始。11/13 に追記。グローバル版にはまだ来ていない)**: 大地の懲罰+苦痛の連鎖の回しから、**苦痛の連鎖 → 断罪 → 弱化の烙印 → 断罪** の形に。断罪は再使用が戻る代わりに全属性ダメージが上がる(アップデート情報)\n\n---\n\n## 0-4. 11/16 の最新(今週の人気動画と韓国の改編の手直し)(11/16)\nEPIC PLK「クレリック完全ガイド」(11/11、4万回。今週のクレリックで一番人気)、Itsmitchyo「最後のクレリックのガイド」(11/11、1.2万回)。\n\n**EPIC PLK の形(断罪がダメージの約半分)**\n| 項目 | 中身 |\n|---|---|\n| 仕組み | 苦痛の連鎖を付ける(断罪はこれが付いた相手にしか撃てない)→ **大地の懲罰**で断罪が必ずクリティカル → 断罪の特化「クリティカルで再使用が戻る」で、**大地の懲罰の間は断罪を連打**。大地の懲罰 Lv20 で効果 +10秒 |\n| スキル | **断罪を Lv20**(Lv12 で再使用が戻る、Lv16 で多段ヒット)。2つ目の Lv20 は 霹靂(安全)・神聖な気・快癒の光輝。「今のシーズンは Lv20 にできるのは1〜2個。焦らない」。**次の段(8・12・16・20)に届かないスキルは前の段に戻し、余りはパッシブへ** |\n| スティグマ | **大地の懲罰(Lv20 を最初に)**、増幅の祈り。残り2つは、チャンターがいなければ保護の光、いれば高潔の気か召喚復活(Lv10 未満は無敵がないので意味がない) |\n| パッシブ | 火力は神の恩恵と大地の恩恵、3番目に治癒力強化。回復遮断は最後 |\n| 審判の雷 | 上位の多くは使わない(動きが断罪の時間を食う)。**大地の懲罰の間は断罪だけ**、間の時間に使うかはダメージの記録で比べる |\n| 装備・アルカナ | 火力職と同じ(攻撃力・クリティカル・戦闘速度)。鐘は魔力、聖杯は断罪。MP が切れやすいので魔力2枚もよい |\n| チャンターと組むとき | 弱化の烙印は外してよい(チャンターのバフのほうが良い) |\n\n**Itsmitchyo の数字**\n- 命中は PvE 命中込みで**約1,200**、クリティカルは全部込みで約1,250。断罪・霹靂は必ずクリティカルなので、**クリティカルの価値は低め**\n- ダメージの多い順: 霹靂・断罪・審判の雷。増幅の祈りは大きなダメージの上乗せ\n- **戦闘速度と再使用短縮がとても大事**。リングは断罪・審判の雷。翼は 闇の帳の翼、ルドラの翼は約1.5億ギーナ\n\n**韓国の手直し(11/14。Anders 11/15、6.2万回。韓国版だけで、グローバル版にはまだ来ていない)**\n- 断罪 PvE ダメージ +15%、霹靂 +10%、高潔の気の5つ目の特化は状態異常にかからない敵へ +30% → **+50%**。ほぼ PvE の火力が上がっただけ\n- 全職業: 闘技場とアビスで受ける回復が −20% → −50%(回復役の PvP に大きい)\n\n## 0-5. 場面ごとの設定の早見表(PvE・PvP・狩り)(11/17)\n今のグローバル版の形。PvE は NotMeter の上位20人(11/17、1-3)と 23KCO(11/14。0-3 の 11/2 の動画とは別の動画か要確認)、PvP は 10章(BoredAF・Cheris・김다크)、狩りは 강코딩(韓国、11/12)と 3章から。**細かい理由は各章**。\n\n**スキルの特化**(番号はゲームの特化の並び。上位20人で一番多い選び方)\n| スキル | PvE(ボス) | PvP | 狩り |\n|---|---|---|---|\n| **断罪** | **2・4・5**(少数相手 +12%・クリティカルで再使用が戻る・必ず多段ヒット)。全員 Lv20 | 2・4(+多段ヒット)。束縛の3は取らない | PvE と同じでよい |\n| 霹靂 | **3・5**(スキル速度・必ずクリティカル)+ 4(少数相手 +20%)。Lv18〜20 | 3。気絶の1も候補。マクロに入れず手で | PvE と同じ |\n| 審判の雷 | **2・5**(少数相手・天罰 +1回)、Lv20 なら + 1(MP 消費 −20%) | **Lv20**。2・5(PvP の火力の中心。浄化で断罪が止まるため) | 2・5 |\n| 大地の裁き(左クリック) | **2・4**(放電の確率・放電で霹靂 −7秒) | 2・4。持続の特化は浄化で消えるので取らない | 2・4。Lv20 なら 3(多段ヒット) |\n| 神聖な気 | **3**(発射速度)+ 4(持続 +3秒)・5(再使用 −10秒) | 3・4(範囲・再使用は取らない) | **2(広域に変える)** が候補(上位20人は1人だけ。狩り用の数字は動画では未確認) |\n| 苦痛の連鎖 | **2・4**(持続 +3秒・PvE ダメージ耐性 −10%) | 2 と **ガード・回避・状態異常抵抗を無視する特化は必ず**(番号 5 は要確認。10-1 の Cheris は番号なし) | 2・4 |\n| 弱化の烙印 | **2・4**(防御 −15%・PvE ダメージ増幅 −10%)。チャンターがいれば外してよい | 2 と、相手の PvP ダメージ増幅を下げる 4 | 2 |\n| 快癒の光輝 | **2・5**(連続 +1回・HP 5%)+ 3(再使用 −3秒) | **2・3・5** | PvE と同じ |\n| 治癒の光 | **1・4**(連続 +2回・HP 2%) | 1・3・4(Lv20) | 1・4 |\n| 再生の光 | **4・5**(移動速度 +5%・PvE ダメージ耐性 5%)。Lv16 前なら 1(防御 +5%)。マクロに入れてずっと付ける(23KCO) | 4・5 か 1・3(防御・受ける治癒量) | 4(移動速度) |\n| 稲妻乱射 | 上げない(Lv1〜11)。上げるなら 5(全スキルの再使用 −1秒) | — | — |\n| 衝撃解除 | 3(HP 10% 回復) | 状態異常に強くなる 4・5 | 3 |\n\n**スティグマ(4枠)**\n| 場面 | 構成 | 補足 |\n|---|---|---|\n| PvE 上位20人 | **大地の懲罰(20人)・増幅の祈り(19人)・高潔の気(18人)・保護の光(14人)** | ほぼ全員 Lv20。召喚復活は1人だけ(Lv1) |\n| ルドラの1〜2戦目(23KCO、戦闘力 21.4万) | 大地の懲罰・増幅の祈り・高潔の気・**ユスティエルの権能**(パーティーの PvE ダメージ耐性) | **召喚復活は入れない**(「倒れさせないほうが大事」) |\n| ルドラ本体(23KCO) | 高潔の気 → **救援**(Lv10 で十分。避けにくい範囲攻撃を無敵でしのぐ) | ユスティエルの権能は竜巻・中央に集まる場面・最後の乱射で使う |\n| ルドラ(Th3Ruthless 11/18) | 大地の懲罰・増幅の祈り・**ユスティエルの権能・免罪**(高潔の気なし) | 0-6。23KCO とは高潔の気を入れるかが違う(11章) |\n| 野良のダンジョン | 大地の懲罰・増幅の祈り・高潔の気(チャンターがいなければ保護の光)・召喚復活 | 3章 |\n| PvP 1対1 | 保護の光・救援・大地の懲罰・高潔の気 | 回復役が相手なら破滅の声(回復 −60%、Lv10 でバリア除去) |\n| PvP 集団 | 免罪・ユスティエルの権能・生命の権能・救援 | 10章。10-1 の BoredAF は「1対1の4つのうち攻撃の2つを 生命の権能・ユスティエルの権能・免罪 に替える」で、保護の光を残すかが食い違う(要確認) |\n| 狩り(ひとり) | 増幅の祈り・大地の懲罰・**保護の光**・高潔の気 | 23KCO・Th3Ruthless。召喚復活は入れない(4-5) |\n\n**マクロ**\n| 場面 | 形 |\n|---|---|\n| PvE(今のグローバル版) | 左クリック = 大地の裁き、右 = マクロ(断罪 → 高潔の気 → 弱化の烙印 → 神聖な気 → 再生の光)。増幅の祈り・霹靂・大地の懲罰・苦痛の連鎖は手で(4-1)。**断罪 Lv20 前は審判の雷をマクロに入れる形のほうが安定して強い、Lv20 になったら外す**(Lucia 11/3 ごろ、9,700回。10回ずつ試し、断罪型が並んだのは2回だけ)。外す時期はほかに「大地の懲罰 Lv20」(Welps・4-5)の意見もある(11章)。ルドラでは**神聖な気もマクロから外す**意見あり(Th3Ruthless 11/18、0-6) |\n| PvP | 2列を行き来するマクロ。審判の雷は霹靂と同じ列で、断罪の合間を埋める。回復は手で出せる形に(10章) |\n| 狩り | ボス用と違い**審判の雷を入れる**(雑魚はすぐ倒れ、断罪を回す前に終わるため)。1段目 増幅の祈り → 大地の懲罰 → 苦痛の連鎖 → 断罪、2段目 神聖な気 → 審判の雷。**スキル予約 ON・自動で的を取る設定**でボタン1つを押したまま。MP が切れやすい(4-5) |\n- 韓国の改編のあとの形(강코딩・개빡치유、11/12): マクロの段は 断罪 → 弱化の烙印 → 苦痛の連鎖 と、増幅の祈り → 大地の懲罰 → 神聖な気 → 再生の光 の2段。改編で**審判の雷をまた使う**ようになった。木人の DPS は改編前の約700万 → 約450万(全職業の弱体化のため)。グローバル版にはまだ来ていない\n\n## 0-6. 11/19 の最新(Th3Ruthless のルドラのクレリック)(11/19)\nTh3Ruthless「ルドラで引っ張りだこのクレリックに」(11/18、4,400回)。\n| 点 | 中身 |\n|---|---|\n| ボスの前のスティグマ | 火力2つ・回復2つ: **大地の懲罰・増幅の祈り・ユスティエルの権能・免罪** |\n| マクロ | いつもの形。**審判の雷はマクロに入れず手で**。**神聖な気もマクロから外す**: 置くと竜巻がそちらへ寄る(誘導に使える)うえ、置く瞬間に足が止まり、ルドラでは死ぬことがある |\n| ユスティエルの権能 | ボスが HP 75% で中央へ行く所(彗星とレーザー)で使う。失敗した人が倒れずに済み、あとで回復できる |\n| 生命の権能・快癒の光輝 | 回復の場面で HP 50% のとき生命の権能、75% で快癒の光輝 |\n| 動き方 | 竜巻と「ピザ」(扇の攻撃)の場面は、火力より生き残ることを優先して、ボスから大きく離れてよい |\n- 23KCO(0-5)と同じく「倒れさせないことが一番」。11/18 のパッチでルドラに「簡単」(入場 IL 2,800、復活無制限)が入った(アップデート情報)\n\n## 1. スキル\n\n### 1-1. 優先順\n| 優先 | スキル | 目標 | 理由 |\n|---|---|---|---|\n| 1 | **断罪** | 20 | ダメージの約5割(全員一致) |\n| 2 | 霹靂(溜めの大技) | 16 → 20 | Lv16 で確定クリティカル。2番目の火力 |\n| 2 | 快癒の光輝(全体回復) | 16 → 20 | Lv16 で HP5%・再使用短縮。回復の中心 |\n| 3 | 大地の裁き(左クリック) | 16〜20 | [放電]で霹靂の再使用 −7秒 |\n| 3 | 神聖な気(設置型の攻撃) | 16 | Lv16 で再使用 −10秒 |\n| 4 | 審判の雷(右クリック) | 16 | 大地の懲罰が Lv20 になったらボス戦では外す(4-5。外す時期の意見は11章) |\n| 4 | 治癒の光 | 16 | Lv16 で再使用 −2秒(MR4KTV が重視) |\n| — | 稲妻乱射 | 16 で止める(10月。今の上位20人は Lv1〜11 で上げない。1-3・0-5) | グロッキー中だけ。断罪が出ないときに |\n- Lucia の順: 大地の裁き・審判の雷 → 断罪 → 回復。Lv45 で地域クエストを終えると全部 Lv12 を超える\n- Welps: シーズン1は断罪だけ Lv20 にすれば十分。2つ目は聖杯の運しだい\n- (10/25)Th3Ruthless(NotMeter で1位を取った人): Lv20 にする順は **断罪 → 神聖な気(特化で再使用 −10秒・持続 +3秒。待ち時間短縮があればほぼ出しっぱなし)→ 大地の裁き(多段ヒット)→ 苦痛の連鎖 → 霹靂**。Lv21 以上は要らない\n- (10/25)Rised: 断罪だけ 20、霹靂は 16 以上なら十分(20 は後で)。神聖な気 20 は今シーズンはやらない。快癒の光輝・大地の裁き・再生の光はなるべく上げる\n\n### 1-2. 特化(PvE)\n10月の動画の意見。今の上位20人の選び方は 1-3、場面ごとの早見表は 0-5(食い違うときはそちらが新しい)。\n| スキル | Lv8〜12 | Lv16 | Lv20 |\n|---|---|---|---|\n| 断罪 | 2 対象が少ないほど+12%、4 クリティカル時に再使用初期化 | **2+4 のまま**(Lv16 の 5 多段ヒットより2+4のほうが1体への火力が上。NoBS の検証) | 2+4+5 |\n| 大地の裁き | 2 [放電]が出る確率+20%、4 [放電]で霹靂の再使用 −7秒 | 2+4 | 2+3+4(3=多段ヒット) |\n| 審判の雷 | 2 対象が少ないほど+12% | 2+5(5=[天罰]1回追加) | 2+3+5(3 の中身は要確認。上位20人は 2+5+1 MP 消費 −20%。1-3・0-5) |\n| 霹靂 | 3 スキル速度+30%、4 対象が少ないほど+20% | 3+5(5=確定クリティカル) | 3+4+5 |\n| 神聖な気 | 3 発射速度+50%、4 持続+3秒(範囲が欲しければ 2) | 3+5(5=再使用 −10秒) | 3+4+5 |\n| 苦痛の連鎖 | 2 持続+3秒、4 敵の PvE ダメージ耐性 −10% | 2+4 | (3 転倒を足すなら Lv20。Lv16 は2つまで) |\n| 弱化の烙印 | 2 防御 −15%、4 敵の PvE ダメージ増幅 −10% | 2+4 | 2+3+4 |\n| 快癒の光輝 | 2 連続+1回(またはデバフ解除の1)、3 再使用 −3秒 | 3+5(5=HP5%)(上位20人は 2+5。1-3) | 2+3+5 か 1+3+5 |\n| 治癒の光 | 1 連続+2回、4 HP2% | 1+5(5=再使用 −2秒)(上位20人は 1+4。1-3) | 1+4+5 |\n| 再生の光 | 2 HP50%以下で+20%、4 移動速度+5%(または 3 受ける治癒量) | 4+5 か 3+5 | 1+4+5 |\n| 稲妻乱射 | | 4+5(5=全スキルの再使用 −1秒)(4-5 は 3 動きながら撃てる・5。番号は要確認) | |\n| 衝撃解除 | 1 連続スキル、3 HP 回復 | | 1+3+5 |\n- 出典: BoredAF(10/14)、NoBS(10/13)、Krix(10/18)、Lucia(10/4)、Welps(10/20)\n\n### 1-3. 上位20人の今(NotMeter 11/17 5時、グローバル版)(11/17)\n| スキル | 上位のレベル | 特化(選んだ人の割合) |\n|---|---|---|\n| 断罪 | **20〜21** | 2・4・5 が 100% |\n| 霹靂 | 18〜20 | 3 100%・5 95%・4 70% |\n| 神聖な気 | 16〜20 | 3 95%・4 65%・5 65%(2 広域は 5%) |\n| 審判の雷 | 16〜19 | 5 94%・2 89%・1 MP 33% |\n| 快癒の光輝 | 16〜18 | 2 90%・5 75%・3 35%・1 デバフ解除 15% |\n| 再生の光 | 15〜17 | 4 移動速度 70%・5 PvE ダメージ耐性 55%・1 防御 40%・3 受ける治癒量 30% |\n| 大地の裁き・苦痛の連鎖・治癒の光 | 14〜16 | 大地の裁き 2・4 が 100%。苦痛の連鎖 2・4 が 100%。治癒の光 1 100%・4 80% |\n| 弱化の烙印 | 13〜15 | 2 90%・4 85% |\n| 衝撃解除 | 7〜15 | 3 100% |\n| 稲妻乱射 | 1〜11 | 5 83% |\n\n| スティグマ(使っている人) | レベル | パッシブ | レベル |\n|---|---|---|---|\n| 大地の懲罰(20人) | 20 | 神の恩恵・大地の恩恵 | **21〜26** |\n| 増幅の祈り(19人) | 20 | 治癒力強化・暖かな加護 | 15〜18 |\n| 高潔の気(18人) | 20 | 煌めく加護・不死の帳 | 14〜16 |\n| 保護の光(14人) | 20 | 生存意志 | 11〜14 |\n| ユスティエルの権能(4人)・救援(2人)・ほか各1人 | 6〜20 | 神の加護・集中の祈り・回復遮断 | 3〜11 |\n\n**アルカナ(上位20人)**\n| カード | 使っている色 | 付いているスキル(人数) |\n|---|---|---|\n| 聖杯 | 活力 17・魔力 3 | **断罪 19**・霹靂 12 |\n| 羊皮紙 | 活力 18・魔力 2 | **断罪 20**・霹靂 17・快癒の光輝 16・苦痛の連鎖 12 |\n| コンパス | 活力 12・魔力 8 | 神聖な気 18・審判の雷 18・再生の光 15 |\n| 鐘 | **魔力 20** | **神の恩恵 20**・生存意志 17・不死の帳 16 |\n| 鏡 | 活力 18・魔力 2 | **大地の恩恵 20**・治癒力強化 19・煌めく加護 18 |\n- Lv20 にする物は、断罪のあと霹靂・神聖な気(EPIC PLK の「2つ目は霹靂・神聖な気・快癒の光輝」、0-4 と同じ)。パッシブは火力の2つ(神の恩恵・大地の恩恵)だけが飛び抜けて高い\n\n---\n\n## 2. パッシブ\n| 優先 | パッシブ | 理由 |\n|---|---|---|\n| 1 | **神の恩恵** | クリティカルと強打 |\n| 1 | **大地の恩恵** | クリティカル ダメージ増幅(レベルに比例)と命中 |\n| 1 | **治癒力強化** | 回復量が攻撃力に比例して増える。だから攻撃寄りに組む |\n| 2 | 煌めく加護 | 攻撃するとパーティーが回復する(NoBS は一番大事と言う) |\n| 3 | 不死の帳、暖かな加護 | 防御・HP。序盤に役立つ |\n| 後回し | 回復遮断、集中の祈り、神の加護 | BoredAF |\n- (10/25)Th3Ruthless: 火力が上がるのは **神の恩恵と大地の恩恵だけ**。この2つをなるべく高く。Rised: 神の恩恵・大地の恩恵・治癒力強化 → 生存意志・煌めく加護・不死の帳\n\n---\n\n## 3. スティグマ\n| スティグマ | 目標 | 理由 |\n|---|---|---|\n| **大地の懲罰** | **20 が最優先** | 5で断罪が確定クリティカル、10で強打、20で効果時間+10秒(断罪を打てる時間が延びる) |\n| **増幅の祈り** | 20(2番目) | PvE ダメージ増幅+20%。15で大地の恩恵1.5倍、20で攻撃力+15% |\n| 保護の光 | 3番目に20 | **チャンターがいないとき**。チャンターの不敗のマントラと効果がかぶり、同時には効かない(同じレベルならマントラが優先) |\n| 高潔の気 | 5〜10(チャンターがいれば20)(10月。今の上位20人は全員 20。保護の光の次に 20 へ、下の「上げ方」と 1-3) | 火力。10で弱化の烙印の敵に+20% |\n| 召喚復活 | 野良では入れる | MR4KTV と BoredAF は野良で必ず。Lucia は「起こしてもすぐ石で戻る人がいる」と入れない(10/4。10/30 は「復活が要るなら」、0-1)。今の上位20人は1人だけ(11章) |\n| 生命の権能 | デバフが多いボス・PvP | 20で5秒ごとに浄化 |\n| 免罪 | 大回復。15で強い | |\n\n| 場面 | 4枠 |\n|---|---|\n| 野良のダンジョン | 大地の懲罰、増幅の祈り、高潔の気(チャンターがいなければ保護の光)、召喚復活 |\n| 固定パーティー | 召喚復活 → 生命の権能 |\n| ひとりで雑魚狩り | 召喚復活 → 保護の光 |\n| PvP ひとり・集団(BoredAF) | 10-1 を参照。高潔の気 → 破滅の声 で回復阻害とバリア除去(テンプラーの大きなバリアに) |\n| (10/25)最大火力(Th3Ruthless) | パーティーが上手でチャンターがいるとき: 保護の光・召喚復活などを外し、**強襲烙印 Lv5+高潔の気 Lv20**(当てると5秒間 攻撃力+20%)。始める前に再生の光 |\n| (10/25)クラオ洞窟など(Th3Ruthless) | 最初の中ボス(中央に引き寄せる攻撃)と最後のボスの範囲攻撃で人が倒れるので、先にバリアを張る型に。チャンターがいれば免罪、いなければ保護の光 |\n| (10/25)闘技場(Th3Ruthless) | 救援を必ず。相手しだいで替える: クレリック・ヒーラー相手=破滅の声、近接(グラディエーター・アサシン)相手=**束縛 Lv15**(確率100%の拘束)、遠距離相手=救援 |\n- (10/25)スティグマの上げ方: 大地の懲罰 20 → 増幅の祈り 20(攻撃力+15、神の恩恵・大地の恩恵が1.5倍。上の表の「15で大地の恩恵1.5倍、20で攻撃力+15%」と書き方が違う。要確認)→ 保護の光か高潔の気。高潔の気を 20 にできるまでは保護の光に点を入れ、20 にできたら保護の光を 5 に戻して高潔の気へ(Th3Ruthless・Rised)\n- (10/25)Rised: チャンターと組むときは**弱化の烙印を使わない**(チャンターのバフが同じ効果で上書きする)\n\n---\n\n## 4. マクロと回し方\n### 4-1. 基本(NoBS 10/13 の検証。一番火力が出る形)\n| 手順 | 押すもの |\n|---|---|\n| 1 | 増幅の祈り(手で) |\n| 2 | 霹靂を最大まで溜める(手で) |\n| 3 | 大地の懲罰(手で) |\n| 4 | 苦痛の連鎖(手で) |\n| 5 | **左クリック(大地の裁き)とマクロを押し続ける** |\n| マクロの段 | 断罪 → 高潔の気 → 弱化の烙印 → 神聖な気 → 再生の光 |\n\n- **大地の懲罰(再使用20秒)と苦痛の連鎖(30秒)は待ち時間が違う**ので、両方そろうのを待って一緒に使う。だから手で押す\n- 霹靂は戻ったらすぐ使う。次の連鎖まで10秒以上あれば、左クリックの[放電]でまた戻る\n- **審判の雷はマクロに入れない**。入れると、断罪が戻ってもマクロが審判の雷を先に出してしまう(不具合と思われる)。断罪が使えない間に手で挟むのは可\n- 回復(治癒の光・快癒の光輝)は Q・E など押しやすいキーに置き、マクロを押しながら手で\n\n### 4-2. 簡単な形\n| 投稿者 | 形 |\n|---|---|\n| Lucia・Th3Ruthless | マクロ1段目: 増幅の祈り → 大地の懲罰 → 苦痛の連鎖 → 断罪(断罪を何回も入れる)。2段目: 神聖な気 → 審判の雷(10/4・10/10 の形。Th3Ruthless は 10/25 にボス戦では審判の雷を外した(下の行)。今は狩り用、4-5) |\n| BoredAF | 全部を2つのボタンに。大地の懲罰と苦痛の連鎖が付いている間は**左クリックを離して右(マクロ)だけ**押すと、断罪の割合が増えて火力が上がる |\n| MR4KTV | ボタン1つで回復も攻撃もするマクロ(慣れていない人向け) |\n| Welps | 大地の懲罰 Lv20 になったら、ボス戦では審判の雷を外す(断罪の動作を止めるため) |\n| (10/25)Th3Ruthless | マクロは前と同じ(10段を5段に縮めただけ)。**再生の光をマクロに入れる**(PvE・PvP ダメージ耐性がずっと付く。30秒に1回なので火力は落ちない)。ボス戦: 戦う前に再生の光 → 突入 → 断罪が出ている間は**マクロと左クリックだけ** → 断罪が止まったら霹靂 → また断罪。霹靂から始めると最初の2秒を失う。審判の雷は動作が長く、そのぶん断罪が減る |\n| (10/25)Rised | 右クリックで2段(増幅の祈りの段と弱化の烙印の段)を回すだけ。ボス・悪夢・ワールドボスでは審判の雷なし |\n| (10/25)BoredAF(PvP) | 2列に分け、霹靂と同じ列に審判の雷(断罪の合間の埋め)。左右クリックで弱体を付けてから断罪を連打、解除されたら霹靂と審判の雷。PvE では審判の雷を外す(火力が下がる) |\n- 遅延: ping 50 未満は10ミリ秒、それ以上は50ミリ秒(aLuckyRO)\n- MP が足りなくなりやすい。アルカナの魔力2枚、MP ポーション(Krix)\n\n### 4-3. 設定(BoredAF・MR4KTV)\n- 操作は「アクション」モード\n- ターゲット探索は「カメラ前方」。優先順位の1・2番目に「敵のプレイヤー」「自分を攻撃している敵」\n- 「スキル使用時の自動ターゲット」ON(PvP では雑魚を狙わないよう OFF にすることも)\n- パーティーの枠を画面の中央寄りへ。ボスの向きの表示を「前方」に\n\n---\n\n### 4-4. 2つのマクロ(MrRosaPony 10/28)(11/1)\n| マクロ | 中身 | 向く人 |\n|---|---|---|\n| 審判の雷型(基本) | バフ → **断罪を3回並べてから**審判の雷。断罪が火力の約50%、審判の雷が約25%。断罪を何回並べるかは ping で変わる(2〜5回を木人で試す)。間の待ち時間 10ms は変えない | 審判の雷が Lv20 の人 |\n| 霹靂連打型(最終形) | 審判の雷を使わない。大地の裁きを基本攻撃にして、断罪と霹靂を挟む。大地の裁きの特化([放電]が当たると霹靂の待ち時間 −7秒、+20%)で霹靂が回る | 断罪・霹靂(できれば大地の裁きも)が Lv20 の人。大地の裁き Lv20 で「ガード・回避無視」を取ると PvP でも強い |\n- アルカナで Lv20 を狙うのは 審判の雷・霹靂・断罪・大地の裁き(火力)と快癒の光輝(守り)。スキルの行が出るカード3種を先に Lv5 に。新しいカードの育てには、着けていない予備のカードを使う\n- 製作のリングはスキルの行が1つ多い。リングは最後に作り直すので、賢者の石は光る真龍王のリングに使うとよい\n\n### 4-5. 狩り用のマクロ(雑魚の群れ・ペット狩り・アビス)(11/17)\n狩り専用の動画はなかった。PvE のガイドの中で狩りに触れた所(Rised 10/24、3.7万回・Th3Ruthless 10/24、14.7万回・Welps 10/23、11.4万回・23KCO 11/2、6.4万回。Welps は出典の 10/20 の動画と、23KCO は 0-3 の 3.9万回の動画と同じかは要確認)と、韓国の 강코딩(11/12)から。\n\n**ボス用との一番の違い: 審判の雷を入れる**\n| | ボス用 | 狩り用 |\n|---|---|---|\n| 審判の雷 | 大地の懲罰 Lv20 になったら**外す**(断罪の動作を止めるため) | **入れる**。「雑魚を狩るなら審判の雷はまだ要る」(Welps)、「審判の雷と稲妻乱射は、ペット狩り・アビスなど野外の雑魚を片付けるプリセットだけで使う」(Rised) |\n| 理由 | 1体に大地の懲罰+苦痛の連鎖を付けて、断罪を連打するのが一番強い | 雑魚はすぐ倒れるので、苦痛の連鎖を付けて断罪を回す前に終わる。付けなくても撃てる審判の雷・霹靂が効く |\n| 困ること | — | **MP が足りなくなる**(Welps)。審判の雷の特化1(MP 消費 −20%)を取る、アルカナの魔力を2枚にする、MP ポーション |\n\n**マクロの形(Th3Ruthless。覚醒戦・デイリーダンジョン・雑魚の群れで同じマクロ)**\n| 段 | 中身(左から順に出る) |\n|---|---|\n| 1段目 | 増幅の祈り → 大地の懲罰 → 苦痛の連鎖 → **断罪**(断罪を何回も並べる) |\n| 2段目 | 神聖な気 → **審判の雷** |\n| 左クリック | 大地の裁き(放電で霹靂の再使用 −7秒) |\n| 手で | 霹靂(溜めの大技。群れに撃つ)、回復(治癒の光・快癒の光輝) |\n- ダンジョンでは、ボスの前は審判の雷を別のボタンに移して雑魚のときだけ押すか、外す(Th3Ruthless)\n- **ゲームのプリセットを場面ごとに分ける**と切り替えが速い。Rised は「プリセット1 = 野外の狩り(審判の雷・稲妻乱射あり)」「プリセット3 = チャンターと組むボス(弱化の烙印なし)」のように分けている\n\n**ボタン1つにする設定(강코딩、韓国。狩りと PvP で同じマクロ)**\n| 設定 | 中身 |\n|---|---|\n| スキル予約 | **ON** |\n| 的の取り方 | 「スキル使用時の自動ターゲット」ON、ターゲット探索は「カメラ前方」(4-3)。押したままにすると**的が自動で次々に取られて**狩りが続く |\n| マウスのマクロ | スキルマクロのキーを押す → 少し待つ → 左クリックを押して離す → 少し待つ → 右クリックを押して離す、を1つにまとめ、押しやすいボタンに置く。待ち時間は 15・15・30ms から 5ms ずつ変えて試す |\n| ゲームのスキルマクロだけで作る場合 | 右クリックをスキルマクロのキーにし、左右を押したまま。霹靂は手で押すか、マウスの別のボタンに置いて3つ押したまま |\n\n**スティグマ(狩り)**\n| 人 | 4枠 |\n|---|---|\n| 23KCO(ひとり・アビスの近く・雑魚狩り) | 増幅の祈り・大地の懲罰・**保護の光**・高潔の気 |\n| Th3Ruthless(狩りの形) | 火力のスティグマを全部 + **保護の光**(高潔の気を Lv20 にできるまでは保護の光にかけらを回す) |\n- どちらも**召喚復活は入れない**。ひとりのときはチャンターのマントラがないので保護の光を入れる(23KCO)\n\n**特化で替えるとよい所(狩り)**\n| スキル | 特化 | 補足 |\n|---|---|---|\n| 審判の雷 | 2・5 に加えて、Lv20 なら **1(MP 消費 −20%)** | 上位20人も 33% が1を取っている |\n| 神聖な気 | **2(広域に変える)** | 群れに当たる。上位20人(ボス向け)は 5% だけ。狩りで比べた数字は見つからなかった |\n| 稲妻乱射 | 入れるなら **3(動きながら撃てる)**・5(全スキルの再使用 −1秒) | Rised は狩りのプリセットだけで使う。特化の効果はゲームの説明から |\n- 動画で数字を出して比べた人はいない。ここの特化は、ゲームの特化の説明と上の人たちの話から選んだもの\n\n## 5. 装備の刻印\n\n### 5-0. 上位20人の部位ごとの刻印(NotMeter 11/8 8時47分。スキルの行つき)(11/8)\n数字は20人のうち何%か。「技:」はスキルの行。行の付きやすさは成長とシステムのまとめ 8章「魂刻印で付く行と確率」。下の 11/1 の表より新しい。\n| 部位 | 全員(95〜100%) | 多い(50〜90%) | 少ない |\n|---|---|---|---|\n| メイス(武器) | 威力・攻撃力・武器ダメージ増幅・戦闘速度・多段ヒット的中・ダメージ増幅 | 前方攻撃力 75% | スキルの行は 0% |\n| ガーダー | 同じ6つ | 前方攻撃力 65% | |\n| ヘルム | **技: 大地の恩恵・神の恩恵**、攻撃力・強打・攻撃力増加 | 受ける治癒量 85% | 命中・クリティカル 15%、技: 暖かな加護・不死の帳・治癒力強化 10% |\n| ショルダー | 技: 同じ2つ、攻撃力・クリティカル ダメージ増幅 | クリティカル 70%・命中 60% | 防御力増加 40%・技: 治癒力強化 25% |\n| トップス | 技: 同じ2つ、攻撃力・ダメージ増幅 | 命中 50%・防御力増加 50% | クリティカル 45%・技: 不死の帳・治癒力強化 30% |\n| ボトムス | 技: 同じ2つ、攻撃力・ダメージ耐性・完璧・攻撃力増加 | | クリティカル 20% |\n| グローブ | 技: 同じ2つ、攻撃力・戦闘速度・完璧 | | 防御力増加 35%・クリティカル 30%・技: 治癒力強化 25% |\n| シューズ | 技: 同じ2つ、移動速度・攻撃力・完璧 | | 防御力増加 35%・技: 不死の帳 25% |\n| マント | 技: 同じ2つ、攻撃力・完璧・強打・攻撃力増加 | | 武器ダメージ耐性 15% |\n| ネックレス | 技: 大地の恩恵・神の恩恵、命中・クリティカル・攻撃力 | **技: 治癒力強化 70%・不死の帳 55%** | 技: 暖かな加護 25%・ガード 20% |\n| イヤリング | 技: 大地の恩恵・神の恩恵、命中・クリティカル・攻撃力 | **技: 不死の帳 75%・暖かな加護 65%・治癒力強化 65%** | ガード 15% |\n| リング | **技: 断罪・大地の裁き・霹靂・神聖な気・快癒の光輝**、攻撃力 | 技: 稲妻乱射 70% | 技: 治癒の光 45% |\n| ブレスレット | 時間・正義・知恵・破壊・幻想 | 空間 70% | 死 40% |\n| ブローチ | 威力・正確 95%・クリティカル 90% | HP 80%・命中 75% | 敏捷 25%・ガード 15% |\n| 印章 | PvE 攻撃力・最大攻撃力・追加攻撃力・封魂石の追加ダメージ・ボス攻撃力・クリティカル攻撃力 | | |\n- 防具のスキルの行は**大地の恩恵・神の恩恵の2つが全員**。3つ目以降は 治癒力強化・不死の帳・暖かな加護 と人によって分かれる(回復寄りか火力寄りか)\n- **23KCO(11/2。0-3)**: ガーダーに**多段ヒット的中は要らない**(断罪にもともと多段ヒットがあるため)と言うが、上位20人は全員付けている。武器は「攻撃力より**ダメージ増幅**」。アクセサリーは正確・攻撃のパッシブ2つ(魂刻印の表に正確はないので、副ステータスの話と見られる)\n\n**上位20人の実際の刻印(NotMeter「装備・スキル構成」、PvE、11/1)(11/1)**: 5-0(11/8)とほぼ同じ(違いは数%)なので表は 5-0 を参照。\n- テンプラーとの違い: 防具にガード・敏捷がほとんどない(5〜15%)。代わりにショルダー・トップスに命中・クリティカル・防御力増加。ネックレス・イヤリングはガードではなく**命中が全員**\n\n**動画の意見(10/24〜10/25)**\n| 部位 | 狙う物 | 出典 |\n|---|---|---|\n| メイス・ガーダー | 武器ダメージ増幅、威力、戦闘速度、正確 | Lucia |\n| ヘルム | 強打、受ける治癒量、防御力増加 | Lucia |\n| ショルダー | 強打、クリティカル ダメージ増幅 | |\n| トップス | ダメージ増幅、完璧 | |\n| グローブ | 戦闘速度、完璧 | |\n| ボトムス | 完璧、攻撃力増加(Lucia はガード型) | |\n| シューズ | 移動速度、完璧 | |\n| アクセサリー | 戦闘速度、威力、正確+1枠に神の恩恵か大地の恩恵 | Lucia。(11/1)上位20人はネックレス・イヤリングに戦闘速度・威力・正確を付けていない(命中・攻撃力・クリティカル。上の表)。威力・正確はブローチ |\n| リング | 断罪、快癒の光輝、審判の雷、治癒の光か神聖な気 | Lucia。**リングは最後**(武器 → ガーダー → 防具 → ほかのアクセサリーが先。Welps) |\n- 防具のパッシブは 大地の恩恵・神の恩恵(Krix)\n- **待ち時間短縮を積むほど断罪が途切れない**。目安33%だがシーズン1の上限は10〜11%(Welps 10/20。11/4 の Antochi は「グローバル版で今集められるのは 18〜20%」、0-3)\n- 命中・クリティカルはルドラに行くなら各1,000以上(Lucia)\n- (10/25)Rised の順: **リングで断罪を Lv20 にする(19 で止まっているなら最優先)**→ 武器の良い行 → 戦闘速度の付く部位を全部 → 武器ダメージ増幅 → ダメージ増幅 → 移動速度。Lv20 にしたいスキルはアルカナ +5 とリングの両方が要る\n- (10/25)PvP のガード型(BoredAF、アビスで鯖1位): 魔石・魂刻印に**ガードを2行以上**、余ればクリティカル抵抗。種族理解度もガード、敏捷(ガードとクリティカル抵抗の両方が伸びる)。早期鯖の4週目で**ガード約1,500**が目安(正式鯖は1週遅れなので少なくてもよい)。PvE の火力は落ちるので、両立するなら装備を2組\n\n## 6. アルカナ\n| カード | 能力値の種類 | 狙うスキル |\n|---|---|---|\n| 聖杯 | 活力(時間) | **断罪**を指定して作る |\n| 羊皮紙 | どちらでも(魔力なら MP が楽) | **断罪**、霹靂、快癒の光輝。断罪付きは全部とっておく |\n| コンパス | 活力か魔力 | 審判の雷、再生の光、**神聖な気**、治癒の光(神聖な気 +4 が理想) |\n| 鐘 | **魔力**(破壊=攻撃力) | **神の恩恵**、暖かな加護、不死の帳、生存意志 |\n| 鏡 | 活力(幻想=待ち時間)か魔力(知恵=強打) | **大地の恩恵**、神の加護、治癒力強化、煌めく加護 |\n- 魔力2枚のセット(MP 回復)があると MP が楽(Krix・BoredAF)\n- 断罪にアルカナで +4 がまず目標。2つ目の Lv20 は聖杯に付いたスキルしだい(Welps)\n- 神の能力値(万神殿): 幻想と知恵\n- (10/25)Th3Ruthless: 金のカードは最初から4つのスキルが付き、強化のたびにどれか1つが+1(+5 まで。どれに付くかは運)。時間(戦闘速度)と待ち時間短縮が欲しい。最初は「4枚が金の能力値+1枚が青」から。超越のエネルギーは本命キャラに残してカードを掘る\n- (10/25)Rised: 聖杯・羊皮紙・鏡・コンパスは活力、**鐘だけ魔力**(破壊=攻撃力)。弱化の烙印・審判の雷が付いたカードは、霹靂・神聖な気が付いた物に替えたい\n\n## 7. 種族理解度(Krix・Lucia)\n| 枠 | おすすめ |\n|---|---|\n| 1・5番 | 追加攻撃力か最大攻撃力 |\n| 2・8番 | HP 増加(%) |\n| 3・6・9番 | 命中(とクリティカル)。Lucia はガード型でガード |\n| 4番 | 知性=クリティカル ダメージ増幅か PvE ダメージ増幅、野性=武器ダメージ増幅、自然=完璧、変形=前方(PvE なら後方も)ダメージ増幅、**特殊=強打** |\n| 7番 | ダメージ耐性 か 再生 |\n- (10/25)Rised: まず 1・4・5番(攻撃力・最大攻撃力・4番の%)。低い数値は残さず、中くらい以上で止める。4番は 特殊=前方か後方ダメージ増幅か強打、野性=武器ダメージ増幅・ダメージ増幅・PvE ダメージ、自然=多段ヒットか完璧、知性=ダメージ増幅か PvE ダメージ増幅、変形=**前方**ダメージ増幅か PvE(ルドラは前からしか当てられない所が多い)。次に7番の PvE ダメージ耐性、HP は最後\n\n## 8. ディーヴァニオン(BoredAF・Lucia)\n- 角(オレンジ)を先 → アクティブ(断罪・快癒の光輝・審判の雷・霹靂など)→ パッシブ\n- 取らない: 稲妻乱射、回復遮断\n- BoredAF は 416 点(地域クエスト・封印ダンジョン+悪夢の店50+シューゴフェスタの店50)\n\n## 9. 翼・称号(Welps)\n| 種類 | おすすめ |\n|---|---|\n| 翼 | 森の精霊の翼(安くてボスに強い)→ 闇の帳の翼→ タリスラの翼(シーズンショップ。待ち時間短縮。一番) |\n| 称号(攻撃) | Guardian of Altgard(日本語名は未確認)→ 種族のしがらみから逃れた(Unbound by Genus) |\n| 称号(防御) | Saint of Altgard(日本語名は未確認) |\n| 称号(その他) | Through Hell and Back(日本語名は未確認。待ち時間短縮)→ ああ、着る服がない(Empty Closet。外見700個) |\n- (10/25)Rised: 森の精霊の翼は所持でボス攻撃力+30・命中+20・ダメージ耐性1%、装備でボス攻撃力+95。シーズンの翼(タリスラ、20万ポイント)は所持で待ち時間短縮4%・攻撃力+60・防御+400・命中+35。封印された翼の開放には**煌めくオード10個**(1個約60万)が要る。ああ、着る服がない(Empty Closet)は戦闘速度+3.5%(外見は闇市場の商人から毎日買う)\n\n## 10. PvP\n| 項目 | 内容 |\n|---|---|\n| スティグマ | 3章の表。Lucia は 増幅の祈り・保護の光・ユスティエルの権能・破滅の声 |\n| 特化を替える所 | 大地の裁きは Lv20 で多段ヒット+ガード・回避無視、霹靂は気絶、苦痛の連鎖は転倒(10月の意見。10-1 の Cheris は大地の裁き 2・4、苦痛の連鎖は持続+無視の特化。食い違いは要確認) |\n| 型 | ガード型(Lucia)、命中型(MFIA) |\n| 破滅の声 | 回復と回復薬を60%減らす(20秒)。Lv10 でバリア除去。クレリック・チャンター・テンプラー相手に強い |\n| 注意 | マクロは回復をあとで手で出せる形に(KaidGames) |\n\n### 10-1. PvP の細かい設定(10/31)\nグローバル版の Cheris(トルコ語、10/31)・BoredAF(アビスで鯖1位、10/22)と、韓国の김다크(10/16〜10/19)から。\n\n**PvP で一番違う点**: 相手が浄化で苦痛の連鎖・大地の懲罰を消すので、**断罪を撃ち続けられない**。そのため PvP では**審判の雷が火力の中心**になる(김다크)。BoredAF も「PvE では審判の雷を外すが、PvP では断罪の合間に使う」。\n\n**スキルのレベルと特化**\n| スキル | レベル | PvP の特化 | 出典・補足 |\n|---|---|---|---|\n| 審判の雷 | **20**(16 でもよいが、戦っていると MP が足りなくなる) | 2(対象が少ないほど +12%)・5([天罰]1回追加)。김다크は 1・2・5 | Cheris・김다크 |\n| 断罪 | 20(ガード型で大地の懲罰を使わないなら 16 でもよい) | 2・4(クリティカル時に再使用初期化)。Lv20 の3つ目は多段ヒット(束縛の特化は取らない) | Cheris・김다크 |\n| 苦痛の連鎖 | — | 持続 +3秒、**ガード・回避と状態異常抵抗を無視する特化は必ず取る**(付かないと断罪が撃てない) | Cheris |\n| 大地の裁き(左クリック) | 16 | 2([放電] +20%)・4([放電]で霹靂の再使用 −7秒)。PvP では火力の割合が大きい。持続の特化は浄化で消されるので取らない | Cheris・김다크 |\n| 弱化の烙印 | — | 2(防御 −15%)と、相手の PvP ダメージ増幅を下げる特化 | Cheris |\n| 霹靂(溜めの大技) | 16〜20 | 3(スキル速度 +30%)。PvP なら気絶の特化も選べる。マクロに入れず手で撃つ | Cheris |\n| 神聖な気 | 16 | 3(発射速度 +50%)・4(持続 +3秒)。範囲と再使用短縮は取らない(1対1の戦いは短いので) | Cheris |\n| 治癒の光 | **20** | 1・3・4(3 の代わりに 5 も可)。PvP は HP が多いので 4(HP2%)が効く | 김다크 |\n| 快癒の光輝 | 20 | **2・3・5** | 김다크 |\n| 再生の光 | 16 | 4・5(1〜3 は効きが分かりにくい)。Cheris は防御 +5%・受ける治癒量 +5% | 김다크・Cheris |\n| 衝撃解除 | 16 | HP 回復より状態異常に強くなる特化(回復は足りているので) | 김다크 |\n- 韓国の動画の字幕は機械の聞き取りなので、特化の番号は画面で確かめてから使う\n\n**パッシブ**: PvP で効くのは**生存意志・治癒力強化・不死の帳**の3つ。大地の恩恵は PvP では割合が小さい(김다크)\n\n**スティグマ**\n| 場面 | 構成 |\n|---|---|\n| 1対1(BoredAF) | 保護の光(火力と回復)、救援(無敵。一気に削られるのを防ぐ・仕切り直し)、大地の懲罰(断罪を撃つため)、高潔の気(浄化されても出る火力) |\n| 集団戦(BoredAF) | 攻撃の2つを 生命の権能・ユスティエルの権能・免罪 に替える |\n| 韓国の例(김다크) | 増幅の祈り・生命の権能・ユスティエルの権能・救援・高潔の気が固定、免罪と大地の懲罰を入れ替え。Lv20 にするのは **増幅の祈り(特化5)・ユスティエルの権能(回復を減らされてもバリアは減らない)・生命の権能(浄化)**。4つ目は救援(再使用を短くするため)か高潔の気 |\n\n**マクロ**\n| 人 | 作り方と使い方 |\n|---|---|\n| BoredAF(グローバル版) | スキルを**2列**に並べ、マクロが2列を行き来しながら、使えるときは断罪を連打する。審判の雷は霹靂と同じ列(断罪の合間の埋め)。使い方: ① 左右クリックを押し続けて弱体(苦痛の連鎖など)を付ける → ② 弱体が付いている間は断罪を連打 → ③ 浄化されたら、霹靂・審判の雷のボタンと左右クリックを押し続け、次に弱体が付くまでつなぐ。**ボタンは3つ**。PvE では審判の雷を抜く |\n| 김다크(韓国) | PvE の3段のマウスのマクロをそのまま使い、スキルの並びだけ変える。弱体が付いているときは断罪、浄化されたら審判の雷が出る作り。戦闘速度は関係ない。争奪戦・アーティファクト戦のように断罪を撃ちにくい場面では、左右クリックだけのマクロのほうがよい |\n| Cheris(グローバル版) | 左右クリックを押し続けると攻撃が続く形。再生の光をマクロに入れる。霹靂ともう1つの回復は手で |\n\n**能力値**\n| 型 | 中身 |\n|---|---|\n| ガード型(BoredAF) | 魔石・霊石は**全部にガード2行以上**、余ればクリティカル抵抗。種族理解度もガード。装備には敏捷(ガードとクリティカル抵抗の両方が伸びる)。早期鯖の4週目で**ガード約1,500**が目安(正式鯖は1週遅れ)。ルドラのアビスのブレスレットなどに空間も。PvE の火力は落ちるので、両立するなら装備を2組 |\n| 切り替え型(김다크、韓国) | 種族理解度のプリセットで**命中かクリティカル抵抗**を切り替える。仕上がりで 命中 5,500 か クリティカル抵抗 3,500〜3,800(韓国版の数字)。魂刻印・魔石は意志・HP・状態異常抵抗・鉄壁・再生・強打抵抗。種族理解度は 3・9番(韓国版の並び)に前方・武器ダメージ増幅、6番に鉄壁、残りに命中かクリティカル抵抗 |\n\n## 11. 意見が割れていること\n| 点 | 意見 |\n|---|---|\n| 召喚復活を入れるか | 野良では必ず(MR4KTV・BoredAF)/入れない(Lucia 10/4。10/30 は「復活が要るなら」)/ルドラでは入れない(23KCO「倒れさせないほうが大事」)/狩りでは入れない(23KCO・Th3Ruthless)/入れるなら Lv10 以上(EPIC PLK)。上位20人(11/17)では1人だけ |\n| 審判の雷をマクロに入れるか | 入れない(NoBS・Welps、**10/25 に Th3Ruthless・Rised も「ボス戦では外す」に変わった**)/入れる(MrRosaPony の基本形 4-4。BoredAF は PvP だけ)/**断罪 Lv20 までは入れる**(Lucia 11/3。10/30 はクリティカル 1,300〜1,400 になるまで入れる)/大地の懲罰の間だけ押さない(23KCO)・間の時間に使うかは記録で比べる(EPIC PLK)・マクロに入れず手で(Th3Ruthless 11/18)。外す時期は「大地の懲罰 Lv20」(Welps)と「断罪 Lv20」(Lucia)で分かれる |\n| 霹靂から始めるか | 始める(NoBS、4-1)/始めない。断罪が止まったときだけ(Th3Ruthless 10/25) |\n| 断罪の Lv16 の特化 | 2+4 のまま(NoBS)/Lv16 で 5 多段ヒット(EPIC PLK) |\n| ルドラのスティグマ | 高潔の気を入れる(23KCO)/入れずに ユスティエルの権能・免罪(Th3Ruthless 11/18) |\n| 大事なパッシブ | 神の恩恵・大地の恩恵・治癒力強化(Krix・Lucia)/煌めく加護が一番(NoBS) |\n| 鏡の能力値 | 活力(幻想=待ち時間。Welps)/魔力(知恵=強打。BoredAF)。上位20人(11/17)は活力 18・魔力 2(1-3) |\n\n## 12. 名前の対応(英語 → 日本語)\n| 種類 | 対応 |\n|---|---|\n| アクティブ | Condemnation=断罪、Chain of Torment=苦痛の連鎖、Bolt=霹靂、Earth\u0027s Retribution=大地の裁き(連続=放電)、Judgment Thunder=審判の雷(追加=天罰)、Divine Aura=神聖な気、Debilitating Mark=弱化の烙印、Radiant Recovery=快癒の光輝、Healing Light=治癒の光、Light of Regeneration=再生の光、Lightning Strike Scattershot=稲妻乱射、Defiance=衝撃解除 |\n| パッシブ | Empyrean Lord\u0027s Grace=神の恩恵、Earth\u0027s Grace=大地の恩恵、Healing Enhancement=治癒力強化、Radiant Benediction=煌めく加護、Immortal Veil=不死の帳、Warm Benediction=暖かな加護、Empyrean Lords\u0027 Benediction=神の加護、Prayer of Concentration=集中の祈り、Heal Block=回復遮断、Survival Willpower=生存意志 |\n| スティグマ | Earth Punishment=大地の懲罰(付く効果=大地の祝福)、Prayer of Amplification=増幅の祈り、Light of Protection=保護の光、Noble Aura=高潔の気、Summon Resurrection=召喚復活、Benevolence=生命の権能、Absolution=免罪、Salvation=救援、Yustiel\u0027s Power=ユスティエルの権能、Voice of Doom=破滅の声、Power Burst=権能爆発、Root=束縛、Assault Mark=強襲烙印 |\n\n## 13. 出典\n| 投稿者 | 日付 | 中身 |\n|---|---|---|\n| 23KCO「BEST Cleric Macro - Advanced Cleric DPS Build」(plt1jWc-DW0) | 11/2 | 3.9万回。特化・マクロ・アルカナ(0-3) |\n| Antochi「Aion 2 Cleric Rotation: Heal First, Keep Earth Punishment Up」(KipsQR8rt0E) | 11/4 | 7,700回。グローバル版と韓国版の違い・使う順(0-3) |\n| Ynoki「Stigma Shard Farm Guide \u0026 Best Cleric Builds」(Mj8WFNhS8sk) | 11/2 | 1,500回。スティグマのかけらの集め方・場面ごとのスティグマ(0-2) |\n| Viles「AION 2 midseason PVE tier list」(eTj6Yy8kfb8) | 11/2 | 1万回。職業の強さの順(0-2) |\n| Krix Domi「Rank 1 Ultimate Cleric Guide」(zioAbsvcX_8) | 10/18 | NotMeter の DPS 1位。特化・マクロ・アルカナ・種族理解度 |\n| TheWhelps「新版クレリック・エンドゲームガイド」(N3ONhVc0K-U) | 10/20 | 大地の懲罰 Lv20 後、アルカナ、翼・称号 |\n| BoredAF「クレリックの最新ガイド」(iAcPSLfCk38) | 10/14 | ランク1位。特化の番号、スティグマ、アルカナ、設定 |\n| NoBS「極めて高度なクレリックのマクロ」(VfX5GVnk4ac) | 10/13 | 一番火力が出る回し方の検証 |\n| MR4KTV「99% of Clerics Are Playing WRONG」(9oxwXZ-lemI) | 10/23 | 回復役の基本、設定 |\n| Lucia「世界ランク1位が教えるクレリックガイド」(KptUtnv35vk) | 10/4 | 上げ方、刻印、PvP |\n| aLuckyRO「クレリック PvE マクロ設定」(t4bB4AN6mxI)、Th3Ruthless「クレリック・マクロ完全ガイド」(5Dy9OA_NEzs) | 10/17、10/10 | マクロ |\n| KaidGames「なぜあなたのクレリックは弱いのか」(CYXcLmgmSZk) | 10/16 | 回復寄りの組み方 |\n| Th3Ruthless「これさえ見れば完璧!クレリック上級者向け完全ガイド」(kCYoKiK9Nmc) | 10/24 | ボスの回し方、アルカナ、場面ごとのスティグマ、闘技場 |\n| Rised「クレリック PvE ガイド 更新版」(WToI-WhgbDc) | 10/24 | 審判の雷を外した理由、種族理解度、翼、刻印の順 |\n| BoredAF「クレリック PvP ガイド(更新)」(QzxYs4hS9yU) | 10/22 | ガード型の続き、PvP のスティグマとマクロ |\n| Chacal「職業ティアリスト」(SGINL3w6yf4、ポルトガル語) | 10/27、1.3万回 | 職業の強さの評判 |\n| Cheris「CLERIC PVE / PVP GUIDE」(VHTlmkv0BG0、トルコ語) | 10/31、365回 | PvP の特化・マクロ |\n| 김다크「치유성 PVP 스킬특화 및 아르카나」(ZaDFt5JF0-g)・「PVP용 종결마매」(SdAuKo8iglM)・「명중/치저 스왑」(G9XhLZThiuw
