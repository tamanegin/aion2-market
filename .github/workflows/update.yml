name: update-prices

# Every 15 minutes, starting a few minutes after Aion2Market's hourly snapshot (around :09 UTC).
# GitHub delays or drops scheduled runs under load, so the extra runs are retries; they exit in
# under a minute when the snapshot is already on the site.
# The script asks for the home server only and exits without changes when there is no new
# snapshot; the other servers are refreshed every 6 hours. Data is deployed straight to
# GitHub Pages (not committed), so the repository does not grow.
on:
  schedule:
    - cron: '14,29,44,59 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Refresh every server now'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # A run that GitHub never starts keeps the "pages" group and blocks every later run
  # (run #164 sat in "queued" for a day on 2026-11-12). This job is outside the group,
  # so it still runs and force-cancels such runs; the newest waiting run then goes ahead.
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel runs stuck in the queue for over 30 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${{ github.repository }}/actions/workflows/update.yml/runs?status=queued&per_page=50" \
            --jq ".workflow_runs[] | select(.status == \"queued\" and .id != ${{ github.run_id }} and .created_at < \"$cutoff\") | .id" |
          while read -r id; do
            echo "Force-cancelling stuck run $id"
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/force-cancel" || echo "Could not cancel $id"
          done

  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # a full refresh of every server can take 15-20 minutes on GitHub
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Get the data now on the site
        run: |
          mkdir -p data
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          curl -fsS "$base/items.json" -o data/items.json || rm -f data/items.json
          curl -fsS "$base/crafts.json" -o data/crafts.json || rm -f data/crafts.json
          curl -fsS "$base/forecast_log.json" -o data/forecast_log.json || rm -f data/forecast_log.json

      - name: Fetch prices
        id: fetch
        shell: pwsh
        run: |
          # Surface the error as an annotation: annotations are readable without signing in, logs are not.
          try {
            if ('${{ inputs.full }}' -eq 'true') { ./fetch_market.ps1 -Full } else { ./fetch_market.ps1 }
          } catch {
            Write-Output "::error title=Fetch prices::$($_.Exception.Message)"
            exit 1
          }

      - name: Upload site
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy site
        id: deploy
        if: steps.fetch.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
